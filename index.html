<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JAS MEMO</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff6eb;
  }

  header {
    background: #ff8c00;
    color: white;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
  }

  .container {
    padding: 16px;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
  }

  .add {
    background: #ff8c00;
    color: white;
  }

  .delete {
    background: #ddd;
  }

  .memo {
    background: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid #eee;
  }

  .time {
    font-size: 12px;
    color: #999;
    margin-top: 6px;
  }

  textarea {
    width: 100%;
    height: 120px;
    font-size: 16px;
    padding: 10px;
    box-sizing: border-box;
    border-radius: 10px;
    border: 1px solid #ccc;
  }

  .hidden {
    display: none;
  }
</style>
</head>

<body>

<header>JAS MEMO</header>

<div class="container">

  <button class="add" onclick="openEditor()">＋ 추가</button>
  <button class="delete" onclick="deleteMemo()">🗑️ 삭제</button>

  <div id="editor" class="hidden">
    <textarea id="memoText" placeholder="메모 입력"></textarea>
    <button class="add" onclick="saveMemo()">저장</button>
  </div>

  <div id="memoList"></div>

</div>

<script>
  let memos = JSON.parse(localStorage.getItem("jas_memos")) || [];

  function render() {
    const list = document.getElementById("memoList");
    list.innerHTML = "";

    memos.forEach((m, i) => {
      const div = document.createElement("div");
      div.className = "memo";
      div.innerHTML = `
        <input type="radio" name="selectMemo" value="${i}">
        <div>${m.text}</div>
        <div class="time">${m.time}</div>
      `;
      list.appendChild(div);
    });
  }

  function openEditor() {
    document.getElementById("editor").classList.remove("hidden");
    document.getElementById("memoText").value = "";
  }

  function saveMemo() {
    const text = document.getElementById("memoText").value.trim();
    if (!text) return;

    memos.unshift({
      text,
      time: new Date().toLocaleString("ko-KR")
    });

    localStorage.setItem("jas_memos", JSON.stringify(memos));
    document.getElementById("editor").classList.add("hidden");
    render();
  }

  function deleteMemo() {
    const selected = document.querySelector("input[name='selectMemo']:checked");
    if (!selected) {
      alert("삭제할 메모를 선택하세요");
      return;
    }

    memos.splice(selected.value, 1);
    localStorage.setItem("jas_memos", JSON.stringify(memos));
    render();
  }

  render();
</script>

</body>
</html>
