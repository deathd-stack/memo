<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>JAS MEMO VER 1.2.X</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#ff9f1c;
  font-size:1.1rem;
  font-weight:600;
}
header{
  text-align:center;
  padding:12px;
  font-size:1.3rem;
  font-weight:800;
}
.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:8px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#fff;
  font-weight:700;
}
#memoList{
  padding:10px;
}
.memo{
  background:#fff;
  border-radius:12px;
  padding:8px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.memo-title{
  font-weight:800;
  cursor:pointer;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}
.box{
  background:#fff;
  width:95%;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:14px;
}
.row{
  display:flex;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
  flex-wrap:wrap;
}
input{
  width:64px;
  text-align:center;
  font-weight:700;
}
.cmpt{
  display:flex;
  gap:6px;
  margin-bottom:4px;
}
.cmpt label{width:80px;}
.red{
  color:red;
  font-weight:800;
  cursor:pointer;
}
textarea{
  width:100%;
  height:60px;
  font-weight:600;
}
.section-title{
  font-weight:800;
  margin-top:8px;
}

/* photo */
#photoView{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
}
#photoView img{
  width:100%;
  height:100%;
  object-fit:contain;
}
</style>
</head>

<body>

<header ondblclick="togglePhoto()">JAS MEMO VER 1.2.X</header>

<div class="controls">
  <button onclick="openNew()">메모 추가</button>
  <button onclick="deleteSelected()">메모 삭제</button>
  <button onclick="addPhoto()">사진 추가</button>
</div>

<div id="memoList"></div>

<input type="file" id="photoInput" accept="image/*" hidden>

<div id="photoView" onclick="togglePhoto()">
  <img id="photoImg">
</div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="box">

    <div class="row">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      &nbsp;&nbsp;
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div class="red" id="time"
      onclick="setTime()"
      ondblclick="editTime()">--:--</div>

    <div id="sections"></div>

    <textarea id="note" placeholder="특이사항 (2줄)"></textarea>

    <div class="row">
      <button onclick="save()">저장</button>
      <button onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>

<script>
let memos=[];
let photo=null;

function openNew(){
  modal.style.display="flex";
  sections.innerHTML="";
  inChk.checked=false;
  outChk.checked=false;
}

function closeModal(){ modal.style.display="none"; }

inChk.onchange=outChk.onchange=renderSections;

function renderSections(){
  sections.innerHTML="";
  if(inChk.checked) sections.innerHTML+=section("INBOUND");
  if(outChk.checked) sections.innerHTML+=section("OUTBOUND");
}

function section(title){
  return `
  <div class="section-title">${title}</div>
  <div class="row">
    <label>7C</label><input maxlength="4" inputmode="numeric">
    <label>HL</label><input maxlength="4" inputmode="numeric">
  </div>
  ${[1,2,3,4].map(n=>`
    <div class="cmpt">
      <label>CMPT ${n}</label><input>
    </div>`).join("")}
  <div class="row">
    <label>T</label><input maxlength="3">
    <label>D</label><input maxlength="2">
    <label>B</label><input maxlength="2">
  </div>
  <div class="row">
    <label>W</label><input maxlength="2">
    <label>C</label><input maxlength="3">
    <label>COB</label><input maxlength="3">
  </div>
  ${title==="OUTBOUND"?`
  <div class="row">
    <label>T/T</label><input maxlength="4">
    <label>T/B</label><input maxlength="4">
  </div>`:""}
  `;
}

function setTime(){
  const d=new Date();
  time.textContent=d.toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit"});
}
function editTime(){
  const t=prompt("시간 수정",time.textContent);
  if(t) time.textContent=t;
}

function save(){
  memos.push({title:"메모"});
  draw();
  closeModal();
}

function draw(){
  memoList.innerHTML="";
  memos.forEach((m,i)=>{
    memoList.innerHTML+=`
    <div class="memo">
      <input type="checkbox">
      <div class="memo-title">메모 ${i+1}</div>
    </div>`;
  });
}

function deleteSelected(){
  const c=[...document.querySelectorAll(".memo input")];
  memos=memos.filter((_,i)=>!c[i].checked);
  draw();
}

/* photo */
function addPhoto(){
  photoInput.click();
}
photoInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  photo=URL.createObjectURL(f);
}
function togglePhoto(){
  if(!photo)return;
  photoView.style.display =
    photoView.style.display==="block"?"none":"block";
  photoImg.src=photo;
}
</script>

</body>
</html>
