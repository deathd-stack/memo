<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAS MEMO VER.1</title>

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#ff8c00;
  color:white;
}

header {
  text-align:center;
  padding:20px;
  font-size:20px;
  font-weight:bold;
}

.container {
  padding:16px;
}

button {
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

.memoBtn { background:white; color:#ff8c00; }
.photoBtn { background:#ffe0b2; }
.deleteBtn { background:#ffccbc; }

.memoCard {
  background:white;
  color:black;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

.hidden { display:none; }

input[type=text] {
  width:100%;
  padding:6px;
  margin:4px 0;
  font-size:14px;
}

.redTime {
  color:red;
  font-weight:bold;
  margin:8px 0;
}

img {
  max-width:100%;
}
</style>
</head>

<body>

<header>JAS MEMO VER.1</header>

<div class="container">

<button class="memoBtn" onclick="openMemo()">메모 추가</button>
<button class="deleteBtn" onclick="deleteMemo()">메모 삭제</button>
<button class="photoBtn" onclick="addPhoto()">사진 추가</button>

<div id="memoList"></div>

<div id="memoEditor" class="hidden memoCard">
  <div onclick="setTime()" ondblclick="setTime()">
    시간: <span id="time" class="redTime">눌러서 입력</span>
  </div>

  <div>
    7C <input maxlength="4" oninput="num(this,4)">
    HL <input maxlength="4" oninput="num(this,4)">
  </div>

  <hr>

  <div>
    CMPT1 <input>
    CMPT2 <input>
    CMPT3 <input>
    CMPT4 <input>
  </div>

  <hr>

  <div>
    T <input maxlength="3" oninput="num(this,3)">
    D <input maxlength="2" oninput="num(this,2)">
    B <input maxlength="2" oninput="num(this,2)">
    W <input maxlength="2" oninput="num(this,2)">
    C <input maxlength="3" oninput="num(this,3)">
  </div>

  <button class="memoBtn" onclick="saveMemo()">저장</button>
</div>

<div id="photoViewer" class="hidden memoCard" onclick="closePhoto()">
  <img id="photo">
</div>

<input type="file" id="file" accept="image/*" hidden>

</div>

<script>
let memos = JSON.parse(localStorage.getItem("memos")||"[]");
let photo = localStorage.getItem("photo");

function num(el,n){ el.value = el.value.replace(/[^0-9]/g,"").slice(0,n); }

function setTime(){
  document.getElementById("time").innerText =
    new Date().toLocaleTimeString();
}

function openMemo(){
  document.getElementById("memoEditor").classList.remove("hidden");
}

function saveMemo(){
  memos.push(document.getElementById("memoEditor").innerHTML);
  localStorage.setItem("memos",JSON.stringify(memos));
  render();
}

function render(){
  let list=document.getElementById("memoList");
  list.innerHTML="";
  memos.forEach((m,i)=>{
    list.innerHTML+=`<div class="memoCard">
    <input type="checkbox" value="${i}"> 메모 ${i+1}
    </div>`;
  });
}

function deleteMemo(){
  let checks=document.querySelectorAll("input[type=checkbox]:checked");
  let idx=[...checks].map(c=>c.value).sort((a,b)=>b-a);
  idx.forEach(i=>memos.splice(i,1));
  localStorage.setItem("memos",JSON.stringify(memos));
  render();
}

function addPhoto(){
  document.getElementById("file").click();
}

file.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>{ localStorage.setItem("photo",r.result); }
  r.readAsDataURL(e.target.files[0]);
};

document.body.ondblclick=()=>{
  if(localStorage.getItem("photo")){
    document.getElementById("photo").src=localStorage.getItem("photo");
    document.getElementById("photoViewer").classList.remove("hidden");
  }
};

function closePhoto(){
  document.getElementById("photoViewer").classList.add("hidden");
}

render();
</script>

</body>
</html>
