<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JAS MEMO VER 3.2</title>

<style>
/* ====== (1) 전체 UI 크기 다운(약 20%) + (2) 타이틀 한 줄 ====== */
:root{
  --ui-font: 0.82;          /* 전체 폰트 축소 */
  --ui-space: 0.82;         /* 여백/패딩 축소 */
  --ui-radius: 0.88;        /* 라운드 약간 축소 */
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  font-weight:600;
  background: linear-gradient(180deg, #f7b233 0%, #f08b2a 55%, #ef7a21 100%);
  color:#111;
  overflow-x:hidden;
}

/* 헤더(한 줄) */
header{
  text-align:center;
  padding: calc(22px * var(--ui-space));
  cursor:pointer;
  user-select:none;
  line-height:1;
}
.header-line{
  display:inline-flex;
  align-items:baseline;
  gap: calc(14px * var(--ui-space));
}
.header-main{
  font-weight:900;
  font-size: calc(2.6rem * var(--ui-font));
  letter-spacing:-0.5px;
}
.header-ver{
  font-weight:900;
  font-size: calc(1.25rem * var(--ui-font)); /* VER 글씨 작게 */
  opacity:.95;
}

/* 상단 버튼 */
.controls{
  display:flex;
  justify-content:center;
  gap: calc(14px * var(--ui-space));
  margin-bottom: calc(14px * var(--ui-space));
}
button{
  padding: calc(10px * var(--ui-space)) calc(18px * var(--ui-space));
  border:none;
  border-radius: calc(18px * var(--ui-radius));
  background:#fff;
  font-weight:900;
  font-size: calc(15px * var(--ui-font));
  box-shadow:0 10px 24px rgba(0,0,0,.12);
}
button:active{transform:scale(.98);}

.memo{
  background:#f5e9de;
  margin: calc(10px * var(--ui-space)) calc(12px * var(--ui-space));
  padding: calc(12px * var(--ui-space)) calc(12px * var(--ui-space));
  border-radius: calc(18px * var(--ui-radius));
  box-shadow:0 14px 34px rgba(0,0,0,.18);
  transition:.2s;
  font-size: calc(14px * var(--ui-font));
  line-height:1.35;
  overflow:hidden;
}
.memo.flash{animation:flash .5s;}
@keyframes flash{50%{background:#ffe8b5;transform:scale(1.01);}}

/* 리스트 내부(예전 스타일 느낌 유지) */
.list-row{
  display:flex;
  gap: calc(10px * var(--ui-space));
  align-items:flex-start;
}
.list-check{
  width: calc(26px * var(--ui-space));
  height: calc(26px * var(--ui-space));
  margin-top: calc(2px * var(--ui-space));
  accent-color:#111;
}
.pills{
  flex:1;
  display:flex;
  flex-direction:column;
  gap: calc(10px * var(--ui-space));
  min-width:0;
}
.pill-line{
  display:flex;
  align-items:center;
  gap: calc(10px * var(--ui-space));
  min-width:0;
}
.pill-tag{
  background:#111;
  color:#fff;
  border-radius: calc(18px * var(--ui-radius));
  padding: calc(8px * var(--ui-space)) calc(18px * var(--ui-space));
  font-weight:900;
  font-size: calc(13px * var(--ui-font));
  min-width: calc(64px * var(--ui-space));
  text-align:center;
}
.pill-text{
  background:rgba(0,0,0,.07);
  border-radius: calc(18px * var(--ui-radius));
  padding: calc(10px * var(--ui-space)) calc(14px * var(--ui-space));
  font-weight:900;
  font-size: calc(16px * var(--ui-font));
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
  min-width:0;
}

/* 체크(모달 상단) */
.check-line{
  display:flex;
  justify-content:center;
  gap: calc(18px * var(--ui-space));
  align-items:center;
  margin-bottom: calc(12px * var(--ui-space));
  white-space:nowrap;
  font-size: calc(14px * var(--ui-font));
  font-weight:900;
}
.check-line label{display:flex;align-items:center;gap: calc(8px * var(--ui-space));}

/* 모달 */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:40;
}
.box{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius: calc(26px * var(--ui-radius)) calc(26px * var(--ui-radius)) 0 0;
  padding: calc(16px * var(--ui-space));
}

/* 섹션 */
.section{
  background:#f2f2f2;
  padding: calc(12px * var(--ui-space));
  border-radius: calc(14px * var(--ui-radius));
  margin-top: calc(12px * var(--ui-space));
  overflow:hidden;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom: calc(10px * var(--ui-space));
}
.section-title{
  font-size: calc(16px * var(--ui-font));
  font-weight:900;
}
.time-btn{
  font-size: calc(13px * var(--ui-font));
  font-weight:900;
  user-select:none;
  cursor:pointer;
}
.time-red{
  color:#e10600;
  font-weight:900;
  font-size: calc(18px * var(--ui-font));
  white-space:nowrap;
}

/* rows */
.row{
  display:flex;
  gap: calc(10px * var(--ui-space));
  align-items:center;
  margin-bottom: calc(10px * var(--ui-space));
  flex-wrap:wrap;         /* 화면 벗어남 방지 */
}
.lbl{
  font-weight:900;
  font-size: calc(16px * var(--ui-font));
  min-width: calc(46px * var(--ui-space));
}
input{
  padding: calc(10px * var(--ui-space)) calc(12px * var(--ui-space));
  font-weight:900;
  border-radius: calc(16px * var(--ui-radius));
  border:2px solid rgba(0,0,0,.15);
  font-size:16px;         /* iOS 자동 줌 방지 */
  max-width:100%;
}
.input4{width: calc(120px * var(--ui-space)); text-align:center;}
.input3{width: calc(108px * var(--ui-space)); text-align:center;}
.input2{width: calc(98px * var(--ui-space)); text-align:center;}
.long{flex:1; min-width: 180px;}

textarea{
  width:100%;
  height: calc(70px * var(--ui-space));
  border-radius: calc(16px * var(--ui-radius));
  padding: calc(12px * var(--ui-space));
  border:2px solid rgba(0,0,0,.12);
  font-size:16px;
  font-weight:700;
}

/* EXTRA */
.extra-wrap{
  margin-top: calc(10px * var(--ui-space));
  background:#fff;
  border-radius: calc(16px * var(--ui-radius));
  padding: calc(12px * var(--ui-space));
  border:2px solid rgba(0,0,0,.08);
}
.extra-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom: calc(10px * var(--ui-space));
}
.extra-head b{font-size: calc(16px * var(--ui-font));}
.extra-row{
  display:flex;
  gap: calc(10px * var(--ui-space));
  align-items:center;
  margin-top: calc(10px * var(--ui-space));
  flex-wrap:wrap;
}
.extra-row select{
  height: calc(46px * var(--ui-space));
  font-size: calc(16px * var(--ui-font));
  font-weight:900;
  border-radius: calc(16px * var(--ui-radius));
  border:2px solid rgba(0,0,0,.12);
  padding:0 calc(12px * var(--ui-space));
  background:#eee;
}
.extra-row .exval{
  width: calc(120px * var(--ui-space));
  text-align:center;
}
.smallbtn{
  padding: calc(10px * var(--ui-space)) calc(14px * var(--ui-space));
  border-radius: calc(16px * var(--ui-radius));
  font-weight:900;
  font-size: calc(14px * var(--ui-font));
  box-shadow:none;
}

/* 사진 레이어 */
#photoLayer{
  position:fixed;inset:0;background:black;
  display:none;justify-content:center;align-items:center;
  z-index:60;
}
#photoLayer img{max-width:100%;max-height:100%;}

/* EQUIPMENT (바탕화면에서만 보이도록: 모달 열릴 때도 숨김) */
#equipBtn{
  position:fixed;
  left: calc(16px * var(--ui-space));
  bottom: calc(16px * var(--ui-space));
  z-index:50;
  background:#fff;
  border:none;
  border-radius: calc(18px * var(--ui-radius));
  padding: calc(14px * var(--ui-space)) calc(18px * var(--ui-space));
  font-weight:900;
  box-shadow:0 14px 34px rgba(0,0,0,.18);
}
#equipBadge{
  position:fixed;
  right: calc(16px * var(--ui-space));
  bottom: calc(18px * var(--ui-space));
  z-index:55;
  background:rgba(0,0,0,.85);
  color:#fff;
  padding: calc(16px * var(--ui-space)) calc(18px * var(--ui-space));
  border-radius: calc(22px * var(--ui-radius));
  font-size: calc(18px * var(--ui-font));
  font-weight:900;
  line-height:1.2;
  min-width: calc(220px * var(--ui-space));
  text-align:right;
  display:none;
}

/* EQUIPMENT 모달 */
#equipModal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;justify-content:center;align-items:flex-end;
  z-index:80;
}
#equipBox{
  background:#fff;width:100%;max-height:70vh;overflow:auto;
  border-radius: calc(26px * var(--ui-radius)) calc(26px * var(--ui-radius)) 0 0;
  padding: calc(16px * var(--ui-space));
}
.equipRow{
  display:flex;gap: calc(10px * var(--ui-space));
  align-items:center;margin-bottom: calc(12px * var(--ui-space));
  white-space:nowrap;flex-wrap:wrap;
}
.equipRow b{min-width: calc(80px * var(--ui-space)); font-size: calc(16px * var(--ui-font));}

</style>
</head>

<body>

<header ondblclick="openPhoto()">
  <div class="header-line">
    <div class="header-main">JAS MEMO</div>
    <div class="header-ver">VER 3.2</div>
  </div>
</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<!-- 우측 하단 장비 표시 -->
<div id="equipBadge"></div>
<!-- 좌측 하단 버튼 -->
<button id="equipBtn" onclick="openEquip()">EQUIPMENT</button>

<!-- 메모 모달 -->
<div class="modal" id="modal">
  <div class="box">

    <div class="check-line">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div id="sections"></div>

    <div class="row" style="justify-content:flex-start;">
      <button class="smallbtn" onclick="saveMemo()">SAVE</button>
      <button class="smallbtn" onclick="closeModal()">CLOSE</button>
    </div>

  </div>
</div>

<!-- 사진 레이어 -->
<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg" alt="">
</div>

<!-- 장비 모달 -->
<div id="equipModal" ondblclick="closeEquip()">
  <div id="equipBox" onclick="event.stopPropagation()">
    <div style="font-weight:900;font-size:16px;margin-bottom:12px;">EQUIPMENT</div>

    <div class="equipRow">
      <b>TUG</b>
      <input id="tug1" class="input2" inputmode="numeric" placeholder="00" maxlength="2">
      <input id="tug2" class="input2" inputmode="numeric" placeholder="00" maxlength="2">
    </div>

    <div class="equipRow">
      <b>BELT</b>
      <input id="belt" class="input2" inputmode="numeric" placeholder="00" maxlength="2">
    </div>

    <div class="row">
      <button class="smallbtn" onclick="saveEquip()">SAVE</button>
      <button class="smallbtn" onclick="closeEquip()">CLOSE</button>
    </div>
  </div>
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const photoInput=document.getElementById("photoInput");
const photoLayer=document.getElementById("photoLayer");
const photoImg=document.getElementById("photoImg");
const inChk=document.getElementById("inChk");
const outChk=document.getElementById("outChk");

const equipBadge=document.getElementById("equipBadge");
const equipModal=document.getElementById("equipModal");
const tug1=document.getElementById("tug1");
const tug2=document.getElementById("tug2");
const belt=document.getElementById("belt");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let photo=localStorage.getItem("jas_photo");
let editId=null;

function onlyNum(val,len){ return (val||"").replace(/[^0-9]/g,'').slice(0,len); }
function pad(val,len){
  const v=onlyNum(val,len);
  return v ? v.padStart(len,"0") : "";
}
function nowTime(){
  const d=new Date();
  return d.getHours().toString().padStart(2,"0")+":"+
         d.getMinutes().toString().padStart(2,"0");
}

/* 입력 제한 */
document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(!k) return;

  if(k.endsWith("-c7")) e.target.value=onlyNum(e.target.value,4);
  if(k.endsWith("-HL")) e.target.value=onlyNum(e.target.value,4);
  if(k.endsWith("-HASH")) e.target.value=onlyNum(e.target.value,3);

  if(k.endsWith("-t")) e.target.value=onlyNum(e.target.value,3);
  if(k.endsWith("-d")) e.target.value=onlyNum(e.target.value,2);
  if(k.endsWith("-bb")) e.target.value=onlyNum(e.target.value,2);

  if(k.endsWith("-tt")) e.target.value=onlyNum(e.target.value,4);
  if(k.endsWith("-tb")) e.target.value=onlyNum(e.target.value,4);

  if(k.startsWith("extraVal-")) e.target.value=onlyNum(e.target.value,3);
});

/* EXTRA */
const EXTRA_KEYS = ["W","C","COB","STRAP","GB","TS","EMS"];
function makeExtraRow(type, key="", val=""){
  const row=document.createElement("div");
  row.className="extra-row";
  row.innerHTML=`
    <select>
      ${EXTRA_KEYS.map(k=>`<option value="${k}" ${k===key?"selected":""}>${k}</option>`).join("")}
    </select>
    <input class="exval" inputmode="numeric" maxlength="3" placeholder="000" data-k="extraVal-${type}" value="${onlyNum(val,3)}">
    <button type="button" class="smallbtn" onclick="this.parentElement.remove()">-</button>
  `;
  return row;
}
function addExtraRow(type){
  const box=document.getElementById(type+"-EXTRAS");
  if(!box) return;
  box.appendChild(makeExtraRow(type,"W",""));
}

/* 섹션 생성 */
function makeSection(type, memoData){
  const d=document.createElement("div");
  d.className="section";

  const savedTime = memoData ? (memoData[type+"-TIME"]||"") : "";

  d.innerHTML=`
    <div class="section-head">
      <div class="section-title">${type}</div>
      <div style="display:flex;align-items:baseline;gap:12px;">
        <div class="time-btn" id="${type}-TIMEBTN">TIME</div>
        <div class="time-red" id="${type}-TIMESHOWN">${savedTime||""}</div>
      </div>
    </div>

    <div class="row">
      <div class="lbl">7C</div>
      <input class="input4" inputmode="numeric" data-k="${type}-c7" maxlength="4" placeholder="0000">
      <div class="lbl">HL</div>
      <input class="input4" inputmode="numeric" data-k="${type}-HL" maxlength="4" placeholder="0000">
      <div class="lbl">#</div>
      <input class="input3" inputmode="numeric" data-k="${type}-HASH" maxlength="3" placeholder="000">
    </div>

    ${[1,2,3,4].map(i=>`
      <div class="row">
        <div class="lbl">CMPT ${i}</div>
        <input class="long" data-k="${type}-cmpt${i}" placeholder="TEXT">
      </div>`).join("")}

    <div class="row">
      <div class="lbl">T</div>
      <input class="input3" inputmode="numeric" data-k="${type}-t" maxlength="3" placeholder="000">
      <div class="lbl">D</div>
      <input class="input2" inputmode="numeric" data-k="${type}-d" maxlength="2" placeholder="00">
      <div class="lbl">BB</div>
      <input class="input2" inputmode="numeric" data-k="${type}-bb" maxlength="2" placeholder="00">
    </div>

    ${type==="OUTBOUND" ? `
      <div class="row">
        <div class="lbl">T/T</div>
        <input class="input4" inputmode="numeric" data-k="${type}-tt" maxlength="4" placeholder="0000">
        <div class="lbl">T/B</div>
        <input class="input4" inputmode="numeric" data-k="${type}-tb" maxlength="4" placeholder="0000">
      </div>
    ` : ""}

    <div class="extra-wrap">
      <div class="extra-head">
        <b>EXTRA</b>
        <button type="button" class="smallbtn" onclick="addExtraRow('${type}')">+</button>
      </div>
      <div id="${type}-EXTRAS"></div>
    </div>

    <textarea data-k="${type}-note" placeholder="NOTE (${type})"></textarea>
  `;

  // TIME 버튼
  const btn = d.querySelector(`#${type}-TIMEBTN`);
  const shown = d.querySelector(`#${type}-TIMESHOWN`);
  btn.onclick = ()=>{
    shown.textContent = nowTime();
  };

  // 기존 EXTRAS 로드
  const extrasBox = d.querySelector(`#${type}-EXTRAS`);
  const extras = memoData ? (memoData[type+"-EXTRAS"] || []) : [];
  extras.forEach(ex=>{
    extrasBox.appendChild(makeExtraRow(type, ex.key, ex.val));
  });

  return d;
}

/* 체크 변경 -> 섹션 렌더 */
inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND", null));
  if(outChk.checked) sections.append(makeSection("OUTBOUND", null));
};

function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";

  // 메모 화면 들어가면 바탕화면 장비 UI 숨김
  document.getElementById("equipBtn").style.display="none";
  equipBadge.style.display="none";
}

function closeModal(){
  modal.style.display="none";
  editId=null;

  // 바탕화면 돌아오면 장비 UI 복구
  document.getElementById("equipBtn").style.display="block";
  updateEquipBadge();
}

/* 저장 */
function saveMemo(){
  const data={id:editId??Date.now()};
  data.hasIn=inChk.checked;
  data.hasOut=outChk.checked;

  ["INBOUND","OUTBOUND"].forEach(type=>{
    if(!(type==="INBOUND"?data.hasIn:data.hasOut)) return;

    data[type+"-c7"]=pad(document.querySelector(`[data-k="${type}-c7"]`)?.value,4);
    data[type+"-HL"]=pad(document.querySelector(`[data-k="${type}-HL"]`)?.value,4);
    data[type+"-HASH"]=pad(document.querySelector(`[data-k="${type}-HASH"]`)?.value,3);

    data[type+"-t"]=pad(document.querySelector(`[data-k="${type}-t"]`)?.value,3);
    data[type+"-d"]=pad(document.querySelector(`[data-k="${type}-d"]`)?.value,2);
    data[type+"-bb"]=pad(document.querySelector(`[data-k="${type}-bb"]`)?.value,2);

    [1,2,3,4].forEach(i=>{
      data[type+`-cmpt${i}`]=document.querySelector(`[data-k="${type}-cmpt${i}"]`)?.value || "";
    });

    if(type==="OUTBOUND"){
      data[type+"-tt"]=pad(document.querySelector(`[data-k="${type}-tt"]`)?.value,4);
      data[type+"-tb"]=pad(document.querySelector(`[data-k="${type}-tb"]`)?.value,4);
    }

    data[type+"-note"]=document.querySelector(`[data-k="${type}-note"]`)?.value || "";

    const tShown = document.getElementById(type+"-TIMESHOWN");
    data[type+"-TIME"]=tShown ? (tShown.textContent||"") : "";

    // EXTRAS
    const extras=[];
    const box=document.getElementById(type+"-EXTRAS");
    if(box){
      [...box.querySelectorAll(".extra-row")].forEach(r=>{
        const key = r.querySelector("select")?.value || "";
        const val = onlyNum(r.querySelector("input")?.value,3);
        if(key && val) extras.push({key, val:val.padStart(3,"0")});
      });
    }
    data[type+"-EXTRAS"]=extras;
  });

  if(editId){
    memos[memos.findIndex(m=>m.id===editId)] = data;
  }else{
    memos.push(data);
  }

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal();
  renderList(data.id);
}

/* 리스트 출력 */
function renderList(flashId){
  memoList.innerHTML="";
  memos.forEach(m=>{
    const div=document.createElement("div");
    div.className="memo";
    if(m.id===flashId) div.classList.add("flash");

    // 예전처럼 IN/OUT 두 줄(둘 다 체크일 때), 하나만이면 한 줄
    let lines=[];
    if(m.hasIn && m.hasOut){
      lines.push({tag:"IN", text:`7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}]`});
      lines.push({tag:"OUT", text:`7C[${m["OUTBOUND-c7"]||""}] #[${m["OUTBOUND-HASH"]||""}]`});
    }else if(m.hasIn){
      lines.push({tag:"IN", text:`7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}] #[${m["INBOUND-HASH"]||""}]`});
    }else if(m.hasOut){
      lines.push({tag:"OUT", text:`7C[${m["OUTBOUND-c7"]||""}] HL[${m["OUTBOUND-HL"]||""}] #[${m["OUTBOUND-HASH"]||""}]`});
    }else{
      lines.push({tag:"", text:"(EMPTY)"});
    }

    div.innerHTML=`
      <div class="list-row">
        <input class="list-check" type="checkbox" data-id="${m.id}">
        <div class="pills" onclick="editMemo(${m.id})" style="cursor:pointer;">
          ${lines.map(l=>`
            <div class="pill-line">
              ${l.tag?`<div class="pill-tag">${l.tag}</div>`:""}
              <div class="pill-text">${l.text}</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
    memoList.appendChild(div);
  });
}

/* 수정(불러오기) */
function editMemo(id){
  const m=memos.find(x=>x.id===id);
  if(!m) return;
  editId=id;

  modal.style.display="flex";
  inChk.checked=!!m.hasIn;
  outChk.checked=!!m.hasOut;

  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND", m));
  if(outChk.checked) sections.append(makeSection("OUTBOUND", m));

  // 메모 화면 들어가면 바탕화면 장비 UI 숨김
  document.getElementById("equipBtn").style.display="none";
  equipBadge.style.display="none";

  setTimeout(()=>{
    ["INBOUND","OUTBOUND"].forEach(type=>{
      if(!(type==="INBOUND"?m.hasIn:m.hasOut)) return;

      const setV=(k,val)=>{
        const el=document.querySelector(`[data-k="${type}-${k}"]`);
        if(el) el.value=val||"";
      };

      setV("c7", m[type+"-c7"]);
      setV("HL", m[type+"-HL"]);
      setV("HASH", m[type+"-HASH"]);

      setV("t", m[type+"-t"]);
      setV("d", m[type+"-d"]);
      setV("bb", m[type+"-bb"]);

      [1,2,3,4].forEach(i=>{
        const el=document.querySelector(`[data-k="${type}-cmpt${i}"]`);
        if(el) el.value=m[type+`-cmpt${i}`]||"";
      });

      if(type==="OUTBOUND"){
        const tt=document.querySelector(`[data-k="${type}-tt"]`);
        const tb=document.querySelector(`[data-k="${type}-tb"]`);
        if(tt) tt.value=m[type+"-tt"]||"";
        if(tb) tb.value=m[type+"-tb"]||"";
      }

      const note=document.querySelector(`[data-k="${type}-note"]`);
      if(음표) note.value=m[type+"-note"]||"";

      const shown=document.getElementById(type+"-TIMESHOWN");
      if(shown) shown.textContent=m[type+"-TIME"]||"";
    });
  },30);
}

/* 삭제 */
function deleteSelected(){
  const checks=document.querySelectorAll('.memo input[type="checkbox"]:checked');
  const ids=[...checks].map(c=>Number(c.dataset.id));
  memos=memos.filter(m=>!ids.includes(m.id));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

/* 사진 */
function addPhoto(){photoInput.click();}
photoInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    photo=r.result;
    localStorage.setItem("jas_photo",photo);
  };
  r.readAsDataURL(f);
};
function openPhoto(){ if(!photo) return; photoImg.src=photo; photoLayer.style.display="flex"; }
function closePhoto(){ photoLayer.style.display="none"; }

/* EQUIPMENT */
function openEquip(){
  const eq=JSON.parse(localStorage.getItem("jas_equipment")||"{}");
  tug1.value=pad(eq.tug1,2);
  tug2.value=pad(eq.tug2,2);
  belt.value=pad(eq.belt,2);
  equipModal.style.display="flex";
}
function closeEquip(){ equipModal.style.display="none"; }
function saveEquip(){
  const eq={ tug1: pad(tug1.value,2), tug2: pad(tug2.value,2), belt: pad(belt.value,2) };
  localStorage.setItem("jas_equipment",JSON.stringify(eq));
  updateEquipBadge();
  closeEquip();
}
function updateEquipBadge(){
  const eq=JSON.parse(localStorage.getItem("jas_equipment")||"{}");
  if(!eq.tug1 && !eq.tug2 && !eq.belt){
    equipBadge.style.display="none";
    return;
  }
  equipBadge.innerHTML = `TUG ${eq.tug1||"00"}/${eq.tug2||"00"}<br>BELT ${eq.belt||"00"}`;
  equipBadge.style.display="block";
}

/* init */
renderList();
updateEquipBadge();
</script>
