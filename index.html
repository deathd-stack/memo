<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JAS MEMO VER 3.1</title>

<style>
  :root{
    --bg1:#ffb300;
    --bg2:#ff8a00;
    --card:#f7eadf;
    --pill:#e9dfd6;
    --black:#111;
    --blue:#2b7cff;
    --shadow: 0 18px 40px rgba(0,0,0,.25);
    --soft: 0 10px 24px rgba(0,0,0,.18);
    --radius:22px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,system-ui;
    font-weight:700;
    background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* 상단(스크롤 숨김/표시) */
  #topBar{
    position:sticky;
    top:0;
    z-index:30;
    transition:transform .25s ease, opacity .25s ease;
    will-change:transform;
    padding-bottom:10px;
    background:linear-gradient(180deg, rgba(255,179,0,.98) 0%, rgba(255,138,0,.90) 100%);
    backdrop-filter:saturate(1.2) blur(6px);
  }
  #topBar.hide{
    transform:translateY(-120%);
    opacity:.0;
    pointer-events:none;
  }

  header{
    text-align:center;
    padding:18px 10px 6px;
    font-weight:1000;
    letter-spacing:.5px;
    color:#111;
    user-select:none;
  }
  header .big{font-size:52px; line-height:1;}
  header .ver{font-size:26px; font-weight:1000; margin-left:10px; vertical-align:baseline;}
  header .ver small{font-size:13px; font-weight:1000;}

  .controls{
    display:flex;
    justify-content:center;
    gap:14px;
    padding:14px 10px 6px;
  }
  .controls button{
    border:none;
    background:#fff;
    color:var(--blue);
    font-weight:1000;
    font-size:22px;
    padding:14px 26px;
    border-radius:20px;
    box-shadow: 0 14px 26px rgba(0,0,0,.22);
  }

  #memoList{padding:12px 12px 110px;}

  /* 홈 카드(리스트) */
  .memoCard{
    background:rgba(255,255,255,.25);
    border-radius:26px;
    padding:14px;
    margin:14px 0;
    box-shadow: var(--shadow);
  }
  .memoInner{
    background:var(--card);
    border-radius:22px;
    padding:16px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.06);
  }
  .memoRow{
    display:grid;
    grid-template-columns: 40px 76px 1fr;
    gap:12px;
    align-items:center;
  }
  .memoRow + .memoRow{margin-top:10px;}
  .memoRow input[type="checkbox"]{
    width:28px;height:28px;
    border-radius:10px;
  }
  .tag{
    background:var(--black);
    color:#fff;
    font-weight:1000;
    border-radius:18px;
    padding:10px 0;
    text-align:center;
    width:76px;
    letter-spacing:.5px;
  }
  .pill{
    background:var(--pill);
    border-radius:20px;
    padding:10px 14px;
    font-weight:1000;
    font-size:28px;
    color:#111;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .flash{animation:flash .55s;}
  @keyframes flash{50%{transform:scale(1.015); filter:brightness(1.06);}}

  /* 하단 고정(홈 전용) */
  #equipBtn{
    position:fixed;
    left:16px;
    bottom:16px;
    z-index:40;
    border:none;
    background:#fff;
    color:var(--blue);
    border-radius:18px;
    padding:14px 22px;
    font-weight:1000;
    box-shadow: var(--shadow);
  }
  #equipBadge{
    position:fixed;
    right:16px;
    bottom:16px;
    z-index:40;
    background:rgba(0,0,0,.85);
    color:#fff;
    border-radius:18px;
    padding:14px 18px;
    font-weight:1000;
    text-align:right;
    min-width:170px;
    box-shadow: var(--shadow);
    line-height:1.15;
    display:none;
  }
  #equipBadge .big{font-size:26px;}
  #equipBadge .small{font-size:22px; opacity:.95;}

  /* 메모 모달 */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:60;
  }
  .box{
    position:relative;
    width:100%;
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:26px 26px 0 0;
    padding:16px 14px 18px;
    box-shadow: var(--shadow);
  }

  /* 모달 상단 빈공간(여기 탭하면 사진 열기) */
  .photoTapZone{
    position:sticky;
    top:0;
    z-index:5;
    height:10px; /* "위쪽 공백" */
    background:transparent;
  }
  .photoTapZone::after{
    content:"";
    display:block;
    height:10px;
  }

  .check-line{
    display:flex;
    justify-content:center;
    gap:18px;
    align-items:center;
    margin:10px 0 12px;
    white-space:nowrap;
    font-weight:1000;
  }
  .check-line label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:18px;
  }
  .check-line input{width:22px;height:22px;}

  /* 섹션 카드 */
  .section{
    background:#f4f4f4;
    border-radius:18px;
    padding:12px;
    margin:12px 0;
    overflow:hidden; /* ✅ 벗어남 방지 */
  }

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .section-title{
    font-size:28px;
    font-weight:1000;
    letter-spacing:.5px;
  }
  .timeWrap{
    display:flex;
    align-items:center;
    gap:10px;
    white-space:nowrap;
  }
  .timeLabel{font-size:22px; font-weight:1000; color:#111;}
  .timeValue{
    font-size:30px;
    font-weight:1000;
    color:#e01616;
  }

  /* ✅ 한줄로 꽉 차게(7C/HL/#) */
  .gridTop{
    display:grid;
    grid-template-columns: 34px minmax(0,1fr) 34px minmax(0,1fr) 18px minmax(0,1fr);
    gap:10px;
    align-items:center;
    width:100%;
  }
  .gridTD{
    display:grid;
    grid-template-columns: 18px minmax(0,1fr) 18px minmax(0,1fr) 26px minmax(0,1fr);
    gap:10px;
    align-items:center;
    width:100%;
    margin-top:10px;
  }
  .gridTT{
    display:grid;
    grid-template-columns: 34px minmax(0,1fr) 34px minmax(0,1fr);
    gap:10px;
    align-items:center;
    width:100%;
    margin-top:10px;
  }

  .lbl{
    font-size:26px;
    font-weight:1000;
    color:#111;
    text-align:left;
    white-space:nowrap;
  }

  input{
    width:100%;
    padding:10px 12px;
    border-radius:16px;
    border:2px solid rgba(0,0,0,.16);
    font-size:20px;          /* ✅ iOS 자동 줌 방지 */
    font-weight:1000;
    text-align:center;
    background:#fff;
    outline:none;
    min-width:0;             /* ✅ grid에서 넘침 방지 */
  }
  input.long{
    text-align:left;
    padding-left:14px;
  }

  /* CMPT: label+input 한줄 고정 */
  .cmptRow{
    display:grid;
    grid-template-columns: 110px 1fr;
    gap:10px;
    align-items:center;
    margin-top:10px;
    width:100%;
  }
  .cmptRow .cmptLbl{
    font-size:26px;
    font-weight:1000;
    white-space:nowrap;      /* ✅ "CMPT 1" 줄바꿈 방지 */
  }

  /* EXTRA (세로로 추가) */
  .extraWrap{
    background:#fff;
    border-radius:18px;
    padding:12px;
    margin-top:12px;
    border:2px solid rgba(0,0,0,.08);
  }
  .extraHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .extraHead .title{
    font-size:26px;
    font-weight:1000;
  }
  .plusBtn{
    border:none;
    background:transparent;
    color:var(--blue);
    font-size:26px;
    font-weight:1000;
    padding:6px 10px;
    border-radius:12px;
  }
  .extraList{display:flex; flex-direction:column; gap:10px;}
  .extraRow{
    display:grid;
    grid-template-columns: 1fr 110px 70px;
    gap:10px;
    align-items:center;
    width:100%;
  }
  select{
    width:100%;
    height:54px;
    border-radius:16px;
    border:2px solid rgba(0,0,0,.16);
    font-size:20px;
    font-weight:1000;
    padding:0 12px;
    background:#eee;
    min-width:0;
  }
  .minusBtn{
    border:none;
    background:#eef0f6;
    color:var(--blue);
    font-weight:1000;
    height:54px;
    border-radius:16px;
    font-size:22px;
  }

  textarea{
    width:100%;
    margin-top:12px;
    border-radius:18px;
    border:2px solid rgba(0,0,0,.12);
    padding:14px;
    font-size:20px;
    font-weight:900;
    height:84px;
    outline:none;
  }

  .actions{
    display:flex;
    gap:18px;
    justify-content:flex-start;
    padding:14px 2px 0;
  }
  .actionBtn{
    border:none;
    background:transparent;
    color:#1e6bff;
    font-weight:1000;
    font-size:22px;
  }

  /* 사진 */
  #photoLayer{
    position:fixed;
    inset:0;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:90;
  }
  #photoLayer img{max-width:100%;max-height:100%;}

  /* EQUIPMENT 모달 */
  #equipModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:80;
  }
  #equipBox{
    width:100%;
    max-height:70vh;
    overflow:auto;
    background:#fff;
    border-radius:26px 26px 0 0;
    padding:16px;
  }
  .equipRow{
    display:grid;
    grid-template-columns: 90px 1fr 1fr;
    gap:12px;
    align-items:center;
    margin:12px 0;
  }
  .equipRow.single{grid-template-columns: 90px 1fr;}
  .equipRow b{font-size:22px;}
</style>
</head>

<body>

<div id="topBar">
  <header ondblclick="openPhoto()">
    <span class="big">JAS MEMO</span>
    <span class="ver">VER <span>3.1</span></span>
  </header>

  <div class="controls">
    <button onclick="newMemo()">ADD</button>
    <button onclick="deleteSelected()">DELETE</button>
    <button onclick="addPhoto()">PHOTO</button>
  </div>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden />

<!-- 홈 전용 -->
<button id="equipBtn" onclick="openEquip()">EQUIPMENT</button>
<div id="equipBadge"></div>

<!-- 메모 모달 -->
<div class="modal" id="modal">
  <div class="box" id="modalBox">

    <div class="photoTapZone" onclick="openPhoto()"></div>

    <div class="check-line">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div id="sections"></div>

    <div class="actions">
      <button class="actionBtn" onclick="saveMemo()">SAVE</button>
      <button class="actionBtn" onclick="closeModal()">CLOSE</button>
    </div>

  </div>
</div>

<!-- 사진 -->
<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg" />
</div>

<!-- 장비 모달 -->
<div id="equipModal" ondblclick="closeEquip()">
  <div id="equipBox" onclick="event.stopPropagation()">
    <div style="font-weight:1000;font-size:22px;margin-bottom:10px;">EQUIPMENT</div>

    <div class="equipRow">
      <b>TUG</b>
      <input id="tug1" inputmode="numeric" maxlength="2" placeholder="00" />
      <input id="tug2" inputmode="numeric" maxlength="2" placeholder="00" />
    </div>

    <div class="equipRow single">
      <b>BELT</b>
      <input id="belt" inputmode="numeric" maxlength="2" placeholder="00" />
    </div>

    <div class="actions">
      <button class="actionBtn" onclick="saveEquip()">SAVE</button>
      <button class="actionBtn" onclick="closeEquip()">CLOSE</button>
    </div>
  </div>
</div>

<script>
/* ===== DOM ===== */
const modal = document.getElementById("modal");
const modalBox = document.getElementById("modalBox");
const sections = document.getElementById("sections");
const memoList = document.getElementById("memoList");
const photoInput = document.getElementById("photoInput");
const photoLayer = document.getElementById("photoLayer");
const photoImg = document.getElementById("photoImg");
const inChk = document.getElementById("inChk");
const outChk = document.getElementById("outChk");

const equipBtn = document.getElementById("equipBtn");
const equipBadge = document.getElementById("equipBadge");
const equipModal = document.getElementById("equipModal");
const tug1 = document.getElementById("tug1");
const tug2 = document.getElementById("tug2");
const belt = document.getElementById("belt");

const topBar = document.getElementById("topBar");

/* ===== data ===== */
let memos = JSON.parse(localStorage.getItem("jas_memos") || "[]");
let photo = localStorage.getItem("jas_photo");
let editId = null;

/* ===== util ===== */
function onlyNum(val, len){
  return (val || "").replace(/[^0-9]/g, "").slice(0, len);
}
function pad(val, len){
  const v = onlyNum(val, len);
  return v ? v.padStart(len, "0") : "";
}
function nowTime(){
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

/* ===== 입력 제한 ===== */
document.addEventListener("input", (e)=>{
  const k = e.target.dataset.k;
  if(!k) return;

  if(k.endsWith("-c7")) e.target.value = onlyNum(e.target.value, 4);
  if(k.endsWith("-HL")) e.target.value = onlyNum(e.target.value, 4);
  if(k.endsWith("-HASH")) e.target.value = onlyNum(e.target.value, 3);

  if(k.endsWith("-t")) e.target.value = onlyNum(e.target.value, 3);
  if(k.endsWith("-d")) e.target.value = onlyNum(e.target.value, 2);
  if(k.endsWith("-bb")) e.target.value = onlyNum(e.target.value, 2);

  if(k.endsWith("-tt")) e.target.value = onlyNum(e.target.value, 4);
  if(k.endsWith("-tb")) e.target.value = onlyNum(e.target.value, 4);

  if(k.startsWith("extraVal-")) e.target.value = onlyNum(e.target.value, 3);

  // ✅ HL/# "공유" (INBOUND에서 바꾸면 OUTBOUND도 같이)
  if(k.endsWith("-HL") || k.endsWith("-HASH")){
    const isHL = k.endsWith("-HL");
    const type = k.startsWith("INBOUND") ? "INBOUND" : "OUTBOUND";
    const other = (type === "INBOUND") ? "OUTBOUND" : "INBOUND";
    const otherKey = other + (isHL ? "-HL" : "-HASH");
    const otherEl = document.querySelector(`[data-k="${otherKey}"]`);
    if(otherEl) otherEl.value = e.target.value;
  }
});

/* ===== EXTRA ===== */
const EXTRA_KEYS = ["W","C","COB","STRAP","GB","TS","EMS"];
function makeExtraRow(type, key="", val=""){
  const row = document.createElement("div");
  row.className = "extraRow";
  row.innerHTML = `
    <select>
      ${EXTRA_KEYS.map(k=>`<option value="${k}" ${k===key?"selected":""}>${k}</option>`).join("")}
    </select>
    <input data-k="extraVal-${type}" inputmode="numeric" maxlength="3" placeholder="000" value="${onlyNum(val,3)}" />
    <button type="button" class="minusBtn" onclick="this.parentElement.remove()">-</button>
  `;
  return row;
}
function addExtraRow(type){
  const box = document.getElementById(type + "-EXTRAS");
  if(!box) return;
  box.appendChild(makeExtraRow(type, "W", ""));
}

/* ===== Section ===== */
function makeSection(type, memoData){
  const d = document.createElement("div");
  d.className = "section";

  const savedTime = memoData ? (memoData[type+"-TIME"] || "") : "";

  d.innerHTML = `
    <div class="section-head">
      <div class="section-title">${type}</div>
      <div class="timeWrap">
        <div class="timeLabel">TIME</div>
        <div class="timeValue" id="${type}-TIMEVAL">${savedTime}</div>
      </div>
    </div>

    <div class="gridTop">
      <div class="lbl">7C</div>
      <input data-k="${type}-c7" inputmode="numeric" maxlength="4" placeholder="0000" />
      <div class="lbl">HL</div>
      <input data-k="${type}-HL" inputmode="numeric" maxlength="4" placeholder="0000" />
      <div class="lbl">#</div>
      <input data-k="${type}-HASH" inputmode="numeric" maxlength="3" placeholder="000" />
    </div>

    ${[1,2,3,4].map(i=>`
      <div class="cmptRow">
        <div class="cmptLbl">CMPT ${i}</div>
        <input class="long" data-k="${type}-cmpt${i}" placeholder="TEXT" />
      </div>
    `).join("")}

    <!-- ✅ T D BB : CMPT 4 아래 -->
    <div class="gridTD">
      <div class="lbl">T</div>
      <input data-k="${type}-t" inputmode="numeric" maxlength="3" placeholder="000" />
      <div class="lbl">D</div>
      <input data-k="${type}-d" inputmode="numeric" maxlength="2" placeholder="00" />
      <div class="lbl">BB</div>
      <input data-k="${type}-bb" inputmode="numeric" maxlength="2" placeholder="00" />
    </div>

    ${type==="OUTBOUND" ? `
      <div class="gridTT">
        <div class="lbl">T/T</div>
        <input data-k="${type}-tt" inputmode="numeric" maxlength="4" placeholder="0000" />
        <div class="lbl">T/B</div>
        <input data-k="${type}-tb" inputmode="numeric" maxlength="4" placeholder="0000" />
      </div>
    ` : ""}

    <div class="extraWrap">
      <div class="extraHead">
        <div class="title">EXTRA</div>
        <button type="button" class="plusBtn" onclick="addExtraRow('${type}')">+</button>
      </div>
      <div class="extraList" id="${type}-EXTRAS"></div>
    </div>

    <textarea data-k="${type}-note" placeholder="NOTE (${type})"></textarea>
  `;

  // ✅ TIME: 누르면 저장(현시간), 더블클릭 수정
  const timeVal = d.querySelector(`#${type}-TIMEVAL`);
  timeVal.style.cursor = "pointer";
  timeVal.onclick = ()=>{
    timeVal.textContent = nowTime();
  };
  timeVal.ondblclick = ()=>{
    const cur = timeVal.textContent || nowTime();
    const t = prompt("TIME (HH:MM 24H)", cur);
    if(t) timeVal.textContent = t;
  };

  // ✅ CMPT 1,2 기본 "F" (IN/OUT 둘다)
  if(!memoData){
    const c1 = d.querySelector(`[data-k="${type}-cmpt1"]`);
    const c2 = d.querySelector(`[data-k="${type}-cmpt2"]`);
    if(c1) c1.value = "F";
    if(c2) c2.value = "F";
  }

  // extras 복원
  const extrasBox = d.querySelector(`#${type}-EXTRAS`);
  const extras = memoData ? (memoData[type+"-EXTRAS"] || []) : [];
  extras.forEach(ex=>{
    extrasBox.appendChild(makeExtraRow(type, ex.key, ex.val));
  });

  return d;
}

/* ===== 체크 -> 섹션 렌더 ===== */
function renderSectionsForNew(){
  sections.innerHTML = "";
  if(inChk.checked) sections.appendChild(makeSection("INBOUND", null));
  if(outChk.checked) sections.appendChild(makeSection("OUTBOUND", null));

  // ✅ HL/# 공유 초기 동기화(둘 다 켰을 때)
  const inHL = document.querySelector(`[data-k="INBOUND-HL"]`);
  const outHL = document.querySelector(`[data-k="OUTBOUND-HL"]`);
  const inHS = document.querySelector(`[data-k="INBOUND-HASH"]`);
  const outHS = document.querySelector(`[data-k="OUTBOUND-HASH"]`);
  if(inHL && outHL && inHL.value) outHL.value = inHL.value;
  if(inHS && outHS && inHS.value) outHS.value = inHS.value;
}
inChk.onchange = outChk.onchange = renderSectionsForNew;

/* ===== 새 메모 ===== */
function newMemo(){
  editId = null;
  inChk.checked = false;
  outChk.checked = false;
  sections.innerHTML = "";
  modal.style.display = "flex";

  // ✅ 모달에서는 홈 장비 UI 숨김
  equipBtn.style.display = "none";
  equipBadge.style.display = "none";
}

/* ===== 닫기 ===== */
function closeModal(){
  modal.style.display = "none";
  editId = null;

  // ✅ 홈 장비 UI 복원
  equipBtn.style.display = "";
  updateEquipBadge();
}

/* ===== 저장 ===== */
function saveMemo(){
  const data = { id: editId ?? Date.now() };
  data.hasIn = inChk.checked;
  data.hasOut = outChk.checked;

  ["INBOUND","OUTBOUND"].forEach(type=>{
    const enabled = (type==="INBOUND") ? data.hasIn : data.hasOut;
    if(!enabled) return;

    // 기본
    data[type+"-c7"] = pad(document.querySelector(`[data-k="${type}-c7"]`)?.value,4);
    data[type+"-HL"] = pad(document.querySelector(`[data-k="${type}-HL"]`)?.value,4);
    data[type+"-HASH"] = pad(document.querySelector(`[data-k="${type}-HASH"]`)?.value,3);

    data[type+"-t"] = pad(document.querySelector(`[data-k="${type}-t"]`)?.value,3);
    data[type+"-d"] = pad(document.querySelector(`[data-k="${type}-d"]`)?.value,2);
    data[type+"-bb"] = pad(document.querySelector(`[data-k="${type}-bb"]`)?.value,2);

    [1,2,3,4].forEach(i=>{
      data[type+`-cmpt${i}`] = document.querySelector(`[data-k="${type}-cmpt${i}"]`)?.value || "";
    });

    if(type==="OUTBOUND"){
      data[type+"-tt"] = pad(document.querySelector(`[data-k="${type}-tt"]`)?.value,4);
      data[type+"-tb"] = pad(document.querySelector(`[data-k="${type}-tb"]`)?.value,4);
    }

    data[type+"-note"] = document.querySelector(`[data-k="${type}-note"]`)?.value || "";

    // time
    const timeEl = document.getElementById(type+"-TIMEVAL");
    data[type+"-TIME"] = timeEl ? (timeEl.textContent || "") : "";

    // extras
    const extras = [];
    const box = document.getElementById(type+"-EXTRAS");
    if(box){
      [...box.querySelectorAll(".extraRow")].forEach(r=>{
        const key = r.querySelector("select")?.value || "";
        const val = onlyNum(r.querySelector("input")?.value,3);
        if(key && val) extras.push({ key, val: val.padStart(3,"0") });
      });
    }
    data[type+"-EXTRAS"] = extras;
  });

  if(editId){
    const idx = memos.findIndex(m=>m.id===editId);
    if(idx>=0) memos[idx]=data;
  }else{
    memos.push(data);
  }

  localStorage.setItem("jas_memos", JSON.stringify(memos));
  closeModal();
  renderList(data.id);
}

/* ===== 리스트(홈) ===== */
function renderList(flashId){
  memoList.innerHTML = "";
  memos.forEach(m=>{
    const card = document.createElement("div");
    card.className = "memoCard";
    const inner = document.createElement("div");
    inner.className = "memoInner";
    if(m.id===flashId) inner.classList.add("flash");

    // 표시 규칙:
    // 둘 다: IN 줄(7C+HL) / OUT 줄(7C+#)
    // 하나만: IN 또는 OUT + 7C/HL/# 한줄
    let topText="", bottomText="";
    if(m.hasIn && m.hasOut){
      topText = `7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}]`;
      bottomText = `7C[${m["OUTBOUND-c7"]||""}] #[${m["OUTBOUND-HASH"]||""}]`;
    }else if(m.hasIn){
      topText = `7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}] #[${m["INBOUND-HASH"]||""}]`;
    }else if(m.hasOut){
      topText = `7C[${m["OUTBOUND-c7"]||""}] HL[${m["OUTBOUND-HL"]||""}] #[${m["OUTBOUND-HASH"]||""}]`;
    }else{
      topText = `(EMPTY)`;
    }

    inner.innerHTML = `
      <div class="memoRow">
        <input type="checkbox" data-id="${m.id}">
        <div class="tag">${(m.hasIn && !m.hasOut) ? "IN" : (m.hasOut && !m.hasIn) ? "OUT" : "IN"}</div>
        <div class="pill">${topText}</div>
      </div>
      ${m.hasIn && m.hasOut ? `
        <div class="memoRow">
          <div></div>
          <div class="tag">OUT</div>
          <div class="pill">${bottomText}</div>
        </div>
      ` : (m.hasIn && !m.hasOut) ? "" : (m.hasOut && !m.hasIn) ? "" : ""}
    `;

    // 클릭해서 편집
    inner.addEventListener("click",(ev)=>{
      // 체크박스 클릭은 제외
      if(ev.target && ev.target.tagName==="INPUT") return;
      editMemo(m.id);
    });

    card.appendChild(inner);
    memoList.appendChild(card);
  });
}

/* ===== 수정(불러오기) ===== */
function editMemo(id){
  const m = memos.find(x=>x.id===id);
  if(!m) return;
  editId = id;

  modal.style.display = "flex";

  // ✅ 모달에서는 홈 장비 UI 숨김
  equipBtn.style.display = "none";
  equipBadge.style.display = "none";

  inChk.checked = !!m.hasIn;
  outChk.checked = !!m.hasOut;

  sections.innerHTML = "";
  if(inChk.checked) sections.appendChild(makeSection("INBOUND", m));
  if(outChk.checked) sections.appendChild(makeSection("OUTBOUND", m));

  // 값 채우기
  setTimeout(()=>{
    ["INBOUND","OUTBOUND"].forEach(type=>{
      const enabled = (type==="INBOUND") ? m.hasIn : m.hasOut;
      if(!enabled) return;

      const setV=(k,val)=>{
        const el = document.querySelector(`[data-k="${type}-${k}"]`);
        if(el) el.value = val || "";
      };

      setV("c7", m[type+"-c7"]);
      setV("HL", m[type+"-HL"]);
      setV("HASH", m[type+"-HASH"]);

      setV("t", m[type+"-t"]);
      setV("d", m[type+"-d"]);
      setV("bb", m[type+"-bb"]);

      [1,2,3,4].forEach(i=>{
        const el = document.querySelector(`[data-k="${type}-cmpt${i}"]`);
        if(el) el.value = (m[type+`-cmpt${i}`] ?? "");
      });

      if(type==="OUTBOUND"){
        const tt = document.querySelector(`[data-k="${type}-tt"]`);
        const tb = document.querySelector(`[data-k="${type}-tb"]`);
        if(tt) tt.value = m[type+"-tt"] || "";
        if(tb) tb.value = m[type+"-tb"] || "";
      }

      const note = document.querySelector(`[data-k="${type}-note"]`);
      if(음표) note.value = m[type+"-note"] || "";

      const timeEl = document.getElementById(type+"-TIMEVAL");
      if(timeEl) timeEl.textContent = m[type+"-TIME"] || "";

      // ✅ HL/# 공유: 한쪽 값 있으면 다른쪽에도 복원
      if(m.hasIn && m.hasOut){
        const inHL = document.querySelector(`[data-k="INBOUND-HL"]`);
        const outHL = document.querySelector(`[data-k="OUTBOUND-HL"]`);
        const inHS = document.querySelector(`[data-k="INBOUND-HASH"]`);
        const outHS = document.querySelector(`[data-k="OUTBOUND-HASH"]`);
        if(inHL && outHL && inHL.value) outHL.value = inHL.value;
        if(inHS && outHS && inHS.value) outHS.value = inHS.value;
      }
    });
  }, 20);
}

/* ===== 삭제 ===== */
function deleteSelected(){
  const checks = document.querySelectorAll('.memoRow input[type="checkbox"]:checked');
  const ids = [...checks].map(c=>Number(c.dataset.id));
  memos = memos.filter(m=>!ids.includes(m.id));
  localStorage.setItem("jas_memos", JSON.stringify(memos));
  renderList();
}

/* ===== 사진 ===== */
function addPhoto(){ photoInput.click(); }
photoInput.onchange = (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    photo = r.result;
    localStorage.setItem("jas_photo", photo);
  };
  r.readAsDataURL(f);
};
function openPhoto(){
  if(!photo) return;
  photoImg.src = photo;
  photoLayer.style.display = "flex";
}
function closePhoto(){ photoLayer.style.display = "none"; }

/* ===== EQUIPMENT ===== */
function openEquip(){
  const eq = JSON.parse(localStorage.getItem("jas_equipment") || "{}");
  tug1.value = pad(eq.tug1,2);
  tug2.value = pad(eq.tug2,2);
  belt.value = pad(eq.belt,2);
  equipModal.style.display = "flex";
}
function closeEquip(){ equipModal.style.display = "none"; }
function saveEquip(){
  const eq = {
    tug1: pad(tug1.value,2),
    tug2: pad(tug2.value,2),
    belt: pad(belt.value,2),
  };
  localStorage.setItem("jas_equipment", JSON.stringify(eq));
  updateEquipBadge();
  closeEquip();
}
function updateEquipBadge(){
  const eq = JSON.parse(localStorage.getItem("jas_equipment") || "{}");
  const has = (eq.tug1 || eq.tug2 || eq.belt);
  if(!has){
    equipBadge.style.display = "none";
    return;
  }
  equipBadge.style.display = "block";
  equipBadge.innerHTML = `
    <div class="big">TUG ${eq.tug1 || "00"}/${eq.tug2 || "00"}</div>
    <div class="small">BELT ${eq.belt || "00"}</div>
  `;
}

/* ===== 홈 상단바 스크롤 숨김/표시 ===== */
let lastY = window.scrollY;
let ticking = false;
window.addEventListener("scroll", ()=>{
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(()=>{
    const y = window.scrollY;
    const down = y > lastY + 6;
    const up = y < lastY - 6;

    if(down && y > 40) topBar.classList.add("hide");
    if(up) topBar.classList.remove("hide");

    lastY = y;
    ticking = false;
  });
}, {passive:true});

/* init */
renderList();
updateEquipBadge();
</script>
