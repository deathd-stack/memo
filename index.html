<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>팀 메모</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<header>
  <h1>팀 메모</h1>
</header>

<main id="list"></main>

<footer>
  <button id="addBtn">＋ 메모 추가</button>
  <button id="deleteBtn">삭제</button>
</footer>

<!-- 메모 작성 -->
<div id="modal" class="hidden">
  <div class="modal-box">
    <h2>메모 추가</h2>

    <input id="flight" placeholder="편명 (예: 7C1234)" />

    <textarea id="memo" placeholder="메모"></textarea>

    <div class="cmpt">
      <input placeholder="CMPT 1">
      <input placeholder="CMPT 2">
      <input placeholder="CMPT 3">
      <input placeholder="CMPT 4">
    </div>

    <button id="saveBtn">저장</button>
    <button id="closeBtn">닫기</button>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>

<script src="app.js"></script>
</body>
</html>
