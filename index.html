<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAS MEMO VER 2!</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#ff8c00;
}
header{
  text-align:center;
  padding:18px;
  font-size:20px;
  font-weight:bold;
  color:white;
}
.container{ padding:16px; }

button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
}

.mainBtn{
  background:white;
  color:#ff8c00;
}

.memoCard{
  background:white;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  border-left:6px solid #ddd;
  position:relative;
}

.memoTitle{
  font-weight:700;
  font-size:16px;
}

.timeRow{
  margin-top:6px;
  font-size:13px;
  display:flex;
  gap:8px;
  align-items:center;
}

.timeRow.in{ color:#2563eb; }
.timeRow.out{ color:#16a34a; }

.timeRow span{
  font-weight:700;
  text-decoration:underline;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:white;
  z-index:100;
  padding:16px;
  overflow:auto;
}

.hidden{ display:none; }

.row{ display:flex; gap:8px; }
.row input{ flex:1; }

input{
  padding:6px;
  width:100%;
  font-size:14px;
}

label{
  font-size:13px;
  font-weight:600;
  margin-top:8px;
  display:block;
}

.selectRow{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.selectRow button{
  flex:1;
  background:#eee;
}

.selectRow button.active{
  background:#ff8c00;
  color:white;
}

.photoView{
  width:100%;
  margin-top:10px;
  touch-action:pan-x pan-y pinch-zoom;
}
</style>
</head>

<body>

<header>JAS MEMO VER 2!</header>

<div class="container">
  <button class="mainBtn" onclick="newMemo()">메모 추가</button>
  <button class="mainBtn" onclick="addPhoto()">사진 추가</button>
  <button class="mainBtn" onclick="deleteMode()">메모 삭제</button>

  <input type="file" id="photoInput" accept="image/*" hidden>

  <div id="memoList"></div>
</div>

<div id="editor" class="modal hidden"></div>

<script>
let memos = JSON.parse(localStorage.getItem("jas_memos")||"[]");
let photo = localStorage.getItem("jas_photo");
let editIndex=null;
let deleteModeOn=false;
let deleteTargets=new Set();
let mode={in:false,out:false};

function nowTime(){
  const d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function num(el,n){ el.value=el.value.replace(/[^0-9]/g,"").slice(0,n); }

function render(){
  memoList.innerHTML="";

  if(photo){
    memoList.innerHTML+=`
      <img src="${photo}" class="photoView"
        ondblclick="openPhoto()">`;
  }

  memos.forEach((m,i)=>{
    let title="";
    if(m.in) title+=`7C[${m.c7}] HL[${m.hl}]`;
    if(m.out) title+=(title?" ":"")+`7C[${m.c7o}]`;

    memoList.innerHTML+=`
    <div class="memoCard"
      onclick="${deleteModeOn?`toggleDelete(${i})`:`openMemo(${i})`}">

      ${deleteModeOn?`
        <input type="checkbox"
          style="position:absolute;left:10px;top:10px"
          ${deleteTargets.has(i)?"checked":""}
          onclick="event.stopPropagation();toggleDelete(${i})">
      `:""}

      <div class="memoTitle">${title}</div>

      ${m.in?`
        <div class="timeRow in">
          IN <span onclick="editTime(event,${i},'in')">${m.timeIn}</span>
        </div>`:""}

      ${m.out?`
        <div class="timeRow out">
          OUT <span onclick="editTime(event,${i},'out')">${m.timeOut}</span>
        </div>`:""}
    </div>`;
  });

  if(deleteModeOn){
    memoList.innerHTML+=`
      <button class="mainBtn" onclick="confirmDelete()">선택 삭제</button>
      <button class="mainBtn" onclick="cancelDelete()">취소</button>`;
  }
}

function addPhoto(){
  photoInput.click();
}
photoInput.onchange=e=>{
  const file=e.target.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ photo=r.result; localStorage.setItem("jas_photo",photo); render(); };
  r.readAsDataURL(file);
};

function openPhoto(){
  const w=window.open();
  w.document.write(`<img src="${photo}" style="width:100%">`);
}

function newMemo(){
  editIndex=null;
  mode={in:false,out:false};
  openEditor({
    in:false,out:false,
    c7:"",hl:"",c7o:"",
    timeIn:nowTime(),timeOut:nowTime()
  });
}

function openMemo(i){
  editIndex=i;
  mode.in=memos[i].in;
  mode.out=memos[i].out;
  openEditor(memos[i]);
}

let currentMemo;
function openEditor(m){
  currentMemo=m;
  buildEditor();
  editor.classList.remove("hidden");
}

function toggleMode(t){
  mode[t]=!mode[t];
  buildEditor();
}

function buildEditor(){
  editor.innerHTML=`
    <button onclick="closeEditor()">← 뒤로</button>

    <div class="selectRow">
      <button class="${mode.in?"active":""}" onclick="toggleMode('in')">INBOUND</button>
      <button class="${mode.out?"active":""}" onclick="toggleMode('out')">OUTBOUND</button>
    </div>

    <label>7C</label>
    <input value="${currentMemo.c7||""}" oninput="num(this,4)">
    <label>HL</label>
    <input value="${currentMemo.hl||""}" oninput="num(this,4)">

    ${mode.out?`
      <label>7C (OUT)</label>
      <input value="${currentMemo.c7o||""}" oninput="num(this,4)">`:""}

    <button class="mainBtn" onclick="save()">저장</button>
  `;
}

function save(){
  const i=editor.querySelectorAll("input");
  const m={
    in:mode.in,out:mode.out,
    c7:i[0]?.value||"",
    hl:i[1]?.value||"",
    c7o:i[2]?.value||"",
    timeIn:currentMemo.timeIn,
    timeOut:currentMemo.timeOut
  };
  if(editIndex===null) memos.push(m);
  else memos[editIndex]=m;
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeEditor(); render();
}

function editTime(e,i,t){
  e.stopPropagation();
  memos[i][t==="in"?"timeIn":"timeOut"]=nowTime();
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  render();
}

function closeEditor(){ editor.classList.add("hidden"); }

function deleteMode(){
  deleteModeOn=true;
  deleteTargets.clear();
  render();
}
function toggleDelete(i){
  deleteTargets.has(i)?deleteTargets.delete(i):deleteTargets.add(i);
  render();
}
function cancelDelete(){
  deleteModeOn=false;
  deleteTargets.clear();
  render();
}
function confirmDelete(){
  if(!confirm("선택한 메모를 삭제할까요?")) return;
  memos=memos.filter((_,i)=>!deleteTargets.has(i));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  cancelDelete();
}

render();
</script>

</body>
</html>
