<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAS MEMO VER 2!</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#ff8c00;
}
header{
  text-align:center;
  padding:18px;
  font-size:20px;
  font-weight:bold;
  color:white;
}
.container{ padding:16px; }

button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
}

.mainBtn{
  background:white;
  color:#ff8c00;
}

.memoCard{
  background:white;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  position:relative;
}

.memoTitle{
  font-weight:700;
  font-size:16px;
}

.modal{
  position:fixed;
  inset:0;
  background:white;
  z-index:100;
  padding:16px;
  overflow:auto;
}

.hidden{ display:none; }

.row{ display:flex; gap:8px; }
.row input{ flex:1; }

input{
  padding:6px;
  width:100%;
  font-size:14px;
  margin-bottom:6px;
}

label{
  font-size:13px;
  font-weight:600;
  margin-top:8px;
  display:block;
}

.compRow input{
  margin-bottom:6px;
}
</style>
</head>

<body>

<header>JAS MEMO VER 2!</header>

<div class="container">
  <button class="mainBtn" onclick="newMemo()">메모 추가</button>
  <button class="mainBtn" onclick="deleteMode()">메모 삭제</button>
  <div id="memoList"></div>
</div>

<div id="editor" class="modal hidden"></div>

<script>
let memos = JSON.parse(localStorage.getItem("jas_memos")||"[]");
let editIndex = null;
let deleteModeOn = false;
let deleteTargets = new Set();

function num(el,n){
  el.value = el.value.replace(/[^0-9]/g,"").slice(0,n);
}

function render(){
  memoList.innerHTML="";
  memos.forEach((m,i)=>{
    memoList.innerHTML+=`
      <div class="memoCard"
        onclick="${deleteModeOn?`toggleDelete(${i})`:`openMemo(${i})`}">

        ${deleteModeOn?`
          <input type="checkbox"
            style="position:absolute;left:10px;top:10px"
            ${deleteTargets.has(i)?"checked":""}
            onclick="event.stopPropagation();toggleDelete(${i})">
        `:""}

        <div class="memoTitle">7C[${m.c7}]</div>
      </div>
    `;
  });

  if(deleteModeOn){
    memoList.innerHTML+=`
      <button class="mainBtn" onclick="confirmDelete()">선택 삭제</button>
      <button class="mainBtn" onclick="cancelDelete()">취소</button>
    `;
  }
}

function newMemo(){
  editIndex=null;
  openEditor({
    c7:"",
    cmpt1:"",cmpt2:"",cmpt3:"",cmpt4:"",
    t:"",d:"",b:"",w:"",c:""
  });
}

function openMemo(i){
  editIndex=i;
  openEditor(memos[i]);
}

function openEditor(m){
  editor.innerHTML=`
    <button onclick="closeEditor()">← 뒤로</button>

    <label>7C</label>
    <input value="${m.c7}" oninput="num(this,4)">

    <label>CMPT</label>
    <div class="compRow">
      <input placeholder="CMPT 1" value="${m.cmpt1}">
      <input placeholder="CMPT 2" value="${m.cmpt2}">
      <input placeholder="CMPT 3" value="${m.cmpt3}">
      <input placeholder="CMPT 4" value="${m.cmpt4}">
    </div>

    <label>T · D · B · W · C</label>
    <div class="row">
      <input placeholder="T" value="${m.t}" oninput="num(this,3)">
      <input placeholder="D" value="${m.d}" oninput="num(this,2)">
      <input placeholder="B" value="${m.b}" oninput="num(this,2)">
      <input placeholder="W" value="${m.w}" oninput="num(this,2)">
      <input placeholder="C" value="${m.c}" oninput="num(this,2)">
    </div>

    <button class="mainBtn" onclick="save()">저장</button>
  `;
  editor.classList.remove("hidden");
}

function save(){
  const i = editor.querySelectorAll("input");
  const m = {
    c7:i[0].value,
    cmpt1:i[1].value,
    cmpt2:i[2].value,
    cmpt3:i[3].value,
    cmpt4:i[4].value,
    t:i[5].value,
    d:i[6].value,
    b:i[7].value,
    w:i[8].value,
    c:i[9].value
  };
  if(editIndex===null) memos.push(m);
  else memos[editIndex]=m;

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeEditor(); render();
}

function closeEditor(){
  editor.classList.add("hidden");
}

function deleteMode(){
  deleteModeOn=true;
  deleteTargets.clear();
  render();
}
function toggleDelete(i){
  deleteTargets.has(i)?deleteTargets.delete(i):deleteTargets.add(i);
  render();
}
function cancelDelete(){
  deleteModeOn=false;
  deleteTargets.clear();
  render();
}
function confirmDelete(){
  if(!confirm("선택한 메모를 삭제할까요?")) return;
  memos = memos.filter((_,i)=>!deleteTargets.has(i));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  cancelDelete();
}

render();
</script>

</body>
</html>
