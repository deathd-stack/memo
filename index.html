<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAS MEMO VER.1</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: orange;
}

header {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  padding: 15px;
}

.top-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

button {
  padding: 10px;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

#photoViewer {
  text-align: center;
  margin: 10px;
}

#photoViewer img {
  max-width: 100%;
  touch-action: pinch-zoom;
}

.container {
  padding: 10px;
}

.memo {
  background: #fff;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 6px;
}

.memo-title {
  font-weight: bold;
  cursor: pointer;
}

.hidden {
  display: none;
}

.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

input {
  width: 70px;
}

.cmpt-row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

.cmpt-row input {
  flex: 1;
  margin-left: 10px;
}

.time {
  color: red;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>JAS MEMO VER.1</header>

<div class="top-buttons">
  <button onclick="openAdd()">메모 추가</button>
  <button onclick="toggleDelete()">메모 삭제</button>
  <button onclick="addPhoto()">사진 추가</button>
</div>

<div id="photoViewer"></div>

<div class="container" id="memoList"></div>

<!-- 메모 추가 -->
<div id="addMemo" class="container hidden">
  <div class="input-row" onclick="setTime()">
    7C <input id="c7" maxlength="4">
    HL <input id="hl" maxlength="4">
  </div>

  <div id="time" class="time">시간 입력</div>

  <div class="cmpt-row">CMPT 1 <input></div>
  <div class="cmpt-row">CMPT 2 <input></div>
  <div class="cmpt-row">CMPT 3 <input></div>
  <div class="cmpt-row">CMPT 4 <input></div>

  <div class="input-row">
    T <input maxlength="3">
    D <input maxlength="2">
    B <input maxlength="2">
    W <input maxlength="2">
    C <input maxlength="2">
  </div>

  <div class="input-row">
    T/T <input maxlength="4">
    T/B <input maxlength="4">
    <input maxlength="4">
  </div>

  <button onclick="saveMemo()">저장</button>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>

<script>
let deleteMode = false;

function openAdd() {
  document.getElementById('addMemo').classList.toggle('hidden');
}

function setTime() {
  const now = new Date();
  document.getElementById('time').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');
}

function saveMemo() {
  const c7 = document.getElementById('c7').value;
  const hl = document.getElementById('hl').value;

  const box = document.createElement('div');
  box.className = 'memo';

  const title = document.createElement('div');
  title.className = 'memo-title';
  title.textContent = `7C[${c7}]  HL[${hl}]`;

  box.appendChild(title);
  document.getElementById('memoList').appendChild(box);
  document.getElementById('addMemo').classList.add('hidden');
}

function toggleDelete() {
  deleteMode = !deleteMode;
  document.querySelectorAll('.memo').forEach(m => {
    if (deleteMode) {
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      m.prepend(chk);
    } else {
      m.querySelector('input')?.remove();
    }
  });
}

function addPhoto() {
  document.getElementById('photoInput').click();
}

document.getElementById('photoInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  const viewer = document.getElementById('photoViewer');
  viewer.innerHTML = '';
  viewer.appendChild(img);
});
</script>

</body>
</html>
