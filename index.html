<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

<title>JAS MEMO VER 1.2.X</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ff9f1c;
    color: #000;
  }

  h1 {
    text-align: center;
    font-size: 36px;
    font-weight: 800;
    margin: 20px 0 10px;
  }

  .top-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
  }

  button {
    padding: 10px 14px;
    border-radius: 12px;
    border: none;
    background: #f2f2f2;
    font-size: 15px;
    font-weight: 700;
  }

  .memo-list {
    padding: 0 12px;
  }

  .memo-item {
    background: #fff;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
    font-weight: 700;
    cursor: pointer;
  }

  .editor {
    background: #fff;
    border-radius: 18px;
    padding: 16px;
    margin: 12px;
    display: none;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  label {
    font-weight: 800;
    min-width: 40px;
  }

  input, textarea {
    border-radius: 10px;
    border: 1px solid #ccc;
    padding: 8px;
    font-size: 16px;
    width: 100%;
  }

  input.numeric {
    text-align: center;
    font-weight: 700;
  }

  .w2 { width: 60px; }
  .w3 { width: 75px; }
  .w4 { width: 95px; }

  .time {
    color: red;
    font-weight: 800;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .checkbox-row {
    display: flex;
    gap: 20px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .photo-area {
    margin: 12px;
    border-radius: 16px;
    background: #fff;
    height: 200px;
    display: none;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .photo-area img {
    max-width: 100%;
    max-height: 100%;
    touch-action: pan-x pan-y;
  }

  .save-btn {
    background: #007aff;
    color: #fff;
    font-weight: 800;
    margin-top: 10px;
    width: 100%;
  }
</style>
</head>

<body>

<h1>JAS MEMO VER 1.2.X</h1>

<div class="top-buttons">
  <button onclick="newMemo()">메모 추가</button>
  <button onclick="deleteMode()">메모 삭제</button>
  <button onclick="addPhoto()">사진 추가</button>
</div>

<div class="memo-list" id="memoList"></div>

<div class="photo-area" id="photoArea" ondblclick="hidePhoto()">
  <img id="photoImg">
</div>

<div class="editor" id="editor">

  <div class="checkbox-row">
    <label><input type="checkbox" id="inChk" checked> INBOUND</label>
    <label><input type="checkbox" id="outChk"> OUTBOUND</label>
  </div>

  <!-- INBOUND -->
  <div class="row">
    <label>7C</label>
    <input class="numeric w4" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="in7c">
    <label>HL</label>
    <input class="numeric w4" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="inhl" oninput="syncHL()">
  </div>

  <!-- OUTBOUND -->
  <div class="row" id="outRow">
    <label>7C</label>
    <input class="numeric w4" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="out7c">
    <label>HL</label>
    <input class="numeric w4" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="outhl">
  </div>

  <div class="time" onclick="setTime()" ondblclick="editTime()" id="timeText">
    시간 입력
  </div>

  <div class="row"><label>CMPT1</label><input></div>
  <div class="row"><label>CMPT2</label><input></div>
  <div class="row"><label>CMPT3</label><input></div>
  <div class="row"><label>CMPT4</label><input></div>

  <div class="row">
    <label>T</label><input class="numeric w3" maxlength="3" inputmode="numeric">
    <label>D</label><input class="numeric w2" maxlength="2" inputmode="numeric">
    <label>B</label><input class="numeric w2" maxlength="2" inputmode="numeric">
  </div>

  <div class="row">
    <label>W</label><input class="numeric w2" maxlength="2" inputmode="numeric">
    <label>C</label><input class="numeric w2" maxlength="2" inputmode="numeric">
    <label>COB</label><input class="numeric w3" maxlength="3" inputmode="numeric">
  </div>

  <div class="row">
    <label>T/T</label><input class="numeric w4" maxlength="4" inputmode="numeric">
    <label>T/B</label><input class="numeric w4" maxlength="4" inputmode="numeric">
  </div>

  <textarea rows="3" placeholder="특이사항"></textarea>

  <button class="save-btn" onclick="saveMemo()">저장</button>
</div>

<script>
let memos = [];
let editingIndex = null;
let deleteOn = false;

function newMemo() {
  editingIndex = null;
  document.getElementById("editor").style.display = "block";
}

function saveMemo() {
  const title =
    `7C[${in7c.value}] HL[${inhl.value}]` +
    (outChk.checked ? ` 7C[${out7c.value}]` : "");

  const memo = { title };
  if (editingIndex === null) memos.push(memo);
  else memos[editingIndex] = memo;

  renderList();
  document.getElementById("editor").style.display = "none";
}

function renderList() {
  memoList.innerHTML = "";
  memos.forEach((m, i) => {
    const d = document.createElement("div");
    d.className = "memo-item";
    d.textContent = m.title;
    d.onclick = () => {
      if (deleteOn) {
        memos.splice(i,1);
        renderList();
      } else {
        editingIndex = i;
        document.getElementById("editor").style.display = "block";
      }
    };
    memoList.appendChild(d);
  });
}

function deleteMode() {
  deleteOn = !deleteOn;
  alert(deleteOn ? "삭제 모드 ON" : "삭제 모드 OFF");
}

function setTime() {
  const d = new Date();
  timeText.textContent =
    d.getHours().toString().padStart(2,"0") + ":" +
    d.getMinutes().toString().padStart(2,"0");
}

function editTime() {
  const t = prompt("시간 수정 (HH:MM)");
  if (t) timeText.textContent = t;
}

function syncHL() {
  if (outChk.checked && !outhl.value) {
    outhl.value = inhl.value;
  }
}

function addPhoto() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    photoImg.src = URL.createObjectURL(file);
    photoArea.style.display = "flex";
  };
  input.click();
}

function hidePhoto() {
  photoArea.style.display = "none";
}
</script>

</body>
</html>
