<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JAS MEMO VER 3</title>

<style>
body{margin:0;font-family:-apple-system;background:#ff9f1c;font-weight:600;}
header{text-align:center;padding:22px;font-size:2.4rem;font-weight:900;cursor:pointer;}

.controls{display:flex;justify-content:center;gap:14px;margin-bottom:12px;}
button{padding:8px 14px;border:none;border-radius:14px;background:#fff;font-weight:900;}

.memo{
  background:#fff;
  margin:8px 10px;
  padding:10px 12px;
  border-radius:14px;
  box-shadow:0 3px 8px rgba(0,0,0,.12);
  font-size:14px;
  line-height:1.4;
}

.time-btn{
  color:red;
  font-weight:900;
  font-size:13px;
  cursor:pointer;
}

.check-line{
  display:flex;
  justify-content:center;
  gap:18px;
  align-items:center;
  margin-bottom:12px;
}

.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:flex-end;
}
.box{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:24px 24px 0 0;
  padding:16px;
}

.row{
  display:flex;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
  white-space:nowrap;
}

input{
  padding:6px;
  font-weight:800;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

input[data-4]{width:64px;}
input[data-3]{width:52px;}
input[data-long]{flex:1;}

.section{
  background:#f7f7f7;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

.section-title{
  font-size:14px;
  font-weight:900;
  margin-bottom:4px;
}

textarea{
  width:100%;
  height:60px;
  border-radius:10px;
  padding:6px;
  border:1px solid #ccc;
  font-size:16px;
}
</style>
</head>

<body>

<header>JAS MEMO VER 3</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
</div>

<div id="memoList"></div>

<div class="modal" id="modal">
<div class="box">

<div class="check-line">
  <label><input type="checkbox" id="inChk"> INBOUND</label>
  <label><input type="checkbox" id="outChk"> OUTBOUND</label>
</div>

<div id="sections"></div>

<div class="row">
  <button onclick="saveMemo()">SAVE</button>
  <button onclick="closeModal()">CLOSE</button>
</div>

</div>
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const inChk=document.getElementById("inChk");
const outChk=document.getElementById("outChk");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let editId=null;

function onlyNum(val,len){
  return (val||"").replace(/[^0-9]/g,'').slice(0,len);
}

document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(!k) return;
  if(k.includes("c7")||k.includes("HL")) e.target.value=onlyNum(e.target.value,4);
  if(k.includes("HASH")) e.target.value=onlyNum(e.target.value,3);
});

function makeSection(type){
  const d=document.createElement("div");
  d.className="section";

  d.innerHTML=`
    <div class="section-title">${type}</div>
    <div class="row">
      7C <input data-4 data-k="${type}-c7">
      HL <input data-4 data-k="${type}-HL">
      # <input data-3 data-k="${type}-HASH">
    </div>
    <textarea data-k="${type}-note"></textarea>
  `;
  return d;
}

inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND"));
  if(outChk.checked) sections.append(makeSection("OUTBOUND"));
};

function nowTime(){
  const d=new Date();
  return d.getHours().toString().padStart(2,"0")+":"+
         d.getMinutes().toString().padStart(2,"0");
}

function saveMemo(){
  const data={id:editId??Date.now()};
  document.querySelectorAll("[data-k]").forEach(i=>{
    data[i.dataset.k]=i.value;
  });

  data.hasIn=inChk.checked;
  data.hasOut=outChk.checked;
  data.savedTime = data.savedTime || "";

  if(editId)
    memos[memos.findIndex(m=>m.id===editId)]=data;
  else
    memos.push(data);

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal();
  renderList();
}

function renderList(){
  memoList.innerHTML="";
  memos.forEach(m=>{
    const div=document.createElement("div");
    div.className="memo";

    let titleTop="";
    let content="";

    if(m.hasIn && m.hasOut){
      titleTop="INBOUND / OUTBOUND";
      content=`
        <div>IN 7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}] #[${m["INBOUND-HASH"]||""}]</div>
        <div>OUT 7C[${m["OUTBOUND-c7"]||""}] HL[${m["OUTBOUND-HL"]||""}] #[${m["OUTBOUND-HASH"]||""}]</div>
      `;
    }
    else if(m.hasIn){
      titleTop="INBOUND";
      content=`
        <div>7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}] #[${m["INBOUND-HASH"]||""}]</div>
      `;
    }
    else if(m.hasOut){
      titleTop="OUTBOUND";
      content=`
        <div>7C[${m["OUTBOUND-c7"]||""}] HL[${m["OUTBOUND-HL"]||""}] #[${m["OUTBOUND-HASH"]||""}]</div>
      `;
    }

    div.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>${titleTop}</div>
        <div class="time-btn" onclick="handleTime(${m.id},this)">
          ${m.savedTime ? m.savedTime : "TIME"}
        </div>
      </div>

      <div onclick="editMemo(${m.id})">
        ${content}
      </div>
    `;

    memoList.appendChild(div);
  });
}

function handleTime(id,el){
  const memo=memos.find(m=>m.id===id);

  if(!memo.savedTime){
    memo.savedTime=nowTime();
    el.innerText=memo.savedTime;
  }else{
    const newTime=prompt("시간 수정 (HH:MM)",memo.savedTime);
    if(newTime) {
      memo.savedTime=newTime;
      el.innerText=newTime;
    }
  }

  localStorage.setItem("jas_memos",JSON.stringify(memos));
}

function editMemo(id){
  const m=memos.find(x=>x.id===id);
  editId=id;
  modal.style.display="flex";
  inChk.checked=m.hasIn;
  outChk.checked=m.hasOut;
  inChk.onchange();

  setTimeout(()=>{
    document.querySelectorAll("[data-k]").forEach(i=>{
      i.value=m[i.dataset.k]||"";
    });
  },50);
}

function closeModal(){
  modal.style.display="none";
  editId=null;
}

function deleteSelected(){
  const checks=document.querySelectorAll('.memo input[type="checkbox"]:checked');
  const ids=[...checks].map(c=>Number(c.dataset.id));
  memos=memos.filter(m=>!ids.includes(m.id));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

function newMemo(){
  editId=null;
  modal.style.display="flex";
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
}

renderList();
</script>

</body>
</html>
