<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAS MEMO VER.1</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ff8c00;
}

header {
  text-align: center;
  font-weight: bold;
  font-size: 22px;
  padding: 15px;
  background: #ff8c00;
  color: #000;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.top-buttons {
  display: flex;
  justify-content: center;
}

.container {
  padding: 10px;
}

.memo {
  background: #fff;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 6px;
}

.memo-title {
  font-weight: bold;
}

.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

.input-row label {
  white-space: nowrap;
}

input {
  width: 80px;
}

.cmpt-row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

.cmpt-row input {
  flex: 1;
  margin-left: 10px;
}

.time {
  color: red;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>JAS MEMO VER.1</header>

<div class="top-buttons">
  <button onclick="openAdd()">메모 추가</button>
  <button onclick="toggleDelete()">메모 삭제</button>
  <button onclick="addPhoto()">사진 추가</button>
</div>

<div class="container" id="memoList"></div>

<!-- 메모 추가 -->
<div id="addMemo" class="container hidden">
  <div class="input-row">
    <label>7C</label><input maxlength="4">
    <label>HL</label><input maxlength="4">
  </div>

  <div class="time" onclick="setTime(this)">시간 입력</div>

  <div class="cmpt-row">CMPT 1 <input></div>
  <div class="cmpt-row">CMPT 2 <input></div>
  <div class="cmpt-row">CMPT 3 <input></div>
  <div class="cmpt-row">CMPT 4 <input></div>

  <div class="input-row">
    T <input maxlength="3">
    D <input maxlength="2">
    B <input maxlength="2">
    W <input maxlength="2">
    C <input maxlength="2">
  </div>

  <div class="input-row">
    T/T <input maxlength="4">
    T/B <input maxlength="4">
    <input maxlength="4">
  </div>

  <button onclick="saveMemo()">저장</button>
</div>

<script>
let deleteMode = false;

function openAdd() {
  document.getElementById('addMemo').classList.toggle('hidden');
}

function setTime(el) {
  const now = new Date();
  el.textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');
}

function saveMemo() {
  const box = document.createElement('div');
  box.className = 'memo';

  const title = document.createElement('div');
  title.className = 'memo-title';
  const inputs = document.querySelectorAll('#addMemo input');
  title.textContent = `7C[${inputs[0].value}] HL[${inputs[1].value}]`;

  box.appendChild(title);
  document.getElementById('memoList').appendChild(box);
  document.getElementById('addMemo').classList.add('hidden');
}

function toggleDelete() {
  deleteMode = !deleteMode;
  document.querySelectorAll('.memo').forEach(m => {
    if (deleteMode) {
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      m.prepend(chk);
    } else {
      m.querySelector('input')?.remove();
    }
  });
}

function addPhoto() {
  alert('사진 기능은 다음 단계에서 연결됩니다.');
}
</script>

</body>
</html>
