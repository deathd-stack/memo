<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAS MEMO VER.1.2.1</title>

<style>
body{
  margin:0;
  font-family: system-ui, -apple-system, sans-serif;
  background:#ff9800;
}

header{
  text-align:center;
  padding:16px;
  font-size:22px;
  font-weight:900;
}

.topBtns{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.container{ padding:12px; }

.memo{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}

.memoTitle{
  font-weight:800;
  flex:1;
}

.editor{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin:12px;
}

.hidden{display:none}

.editorHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.closeBtn{
  font-size:18px;
  background:#eee;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

label{ font-weight:700; width:60px; }

input{
  padding:6px;
  border-radius:6px;
  border:1px solid #ccc;
  text-align:center;
}

.w2{ width:54px; }
.w3{ width:64px; }
.w4{ width:90px; }
.wShort{ width:70px; }
.wMid{ width:120px; }

.time{
  color:red;
  font-weight:900;
  cursor:pointer;
  margin-bottom:12px;
}

/* CMPT */
.cmptRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
.cmptRow input{ width:55%; }

/* 사진 */
#photoOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}
#photoWrap{ touch-action:none; }
#photoWrap img{
  max-width:100%;
  max-height:100%;
  border-radius:12px;
}
</style>
</head>

<body ondblclick="togglePhoto()">

<header>JAS MEMO VER.1.2.1</header>

<div class="topBtns">
  <button onclick="openEditor()">메모 추가</button>
  <button onclick="toggleDelete()">메모 삭제</button>
  <button onclick="addPhoto()">사진 추가</button>
</div>

<div id="memoList" class="container"></div>

<!-- ===== 에디터 ===== -->
<div id="editor" class="editor hidden">
  <div class="editorHeader">
    <strong>메모 편집</strong>
    <button class="closeBtn" onclick="closeEditor()">✕</button>
  </div>

  <div class="row">
    <label>7C</label><input id="c7" class="wShort" maxlength="4">
    <label>HL</label><input id="hl" class="wShort" maxlength="4">
  </div>

  <div id="time" class="time" onclick="setTime()">시간 입력</div>

  <div class="cmptRow"><label>CMPT 1</label><input></div>
  <div class="cmptRow"><label>CMPT 2</label><input></div>
  <div class="cmptRow"><label>CMPT 3</label><input></div>
  <div class="cmptRow"><label>CMPT 4</label><input></div>

  <div class="row">
    T <input class="w3" maxlength="3">
    D <input class="w2" maxlength="2">
    B <input class="w2" maxlength="2">
    W <input class="w2" maxlength="2">
    C <input class="w2" maxlength="2">
  </div>

  <div class="row">
    T/T <input class="w4" maxlength="4">
    T/B <input class="w4" maxlength="4">
    <input class="w4" maxlength="4">
  </div>

  <button onclick="saveMemo()">저장</button>
</div>

<!-- ===== 사진 ===== -->
<div id="photoOverlay" onclick="hidePhoto()">
  <div id="photoWrap">
    <img id="photoImg">
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script>
let memos = JSON.parse(localStorage.getItem("memos")||"[]");
let editIndex=null;
let deleteMode=false;
let deleteTargets=new Set();

/* ===== 렌더 ===== */
function render(){
  memoList.innerHTML="";
  memos.forEach((m,i)=>{
    const div=document.createElement("div");
    div.className="memo";

    if(deleteMode){
      const chk=document.createElement("input");
      chk.type="checkbox";
      chk.onchange=()=>chk.checked ? deleteTargets.add(i) : deleteTargets.delete(i);
      div.appendChild(chk);
    }

    const title=document.createElement("div");
    title.className="memoTitle";
    title.textContent=`7C[${m.c7}] HL[${m.hl}]`;
    title.onclick=()=>{ if(!deleteMode) openEditor(i); };

    div.appendChild(title);
    memoList.appendChild(div);
  });
}
render();

/* ===== 메모 ===== */
function openEditor(i=null){
  editor.classList.remove("hidden");
  editIndex=i;
  if(i!==null){
    const m=memos[i];
    c7.value=m.c7; hl.value=m.hl; time.textContent=m.time;
  }else{
    editor.querySelectorAll("input").forEach(i=>i.value="");
    time.textContent="시간 입력";
  }
}

function closeEditor(){
  editor.classList.add("hidden");
}

function setTime(){
  const d=new Date();
  time.textContent=
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0");
}

function saveMemo(){
  if(!c7.value||!hl.value) return alert("7C / HL 입력");
  const data={ c7:c7.value, hl:hl.value, time:time.textContent };
  if(editIndex===null) memos.push(data);
  else memos[editIndex]=data;
  localStorage.setItem("memos",JSON.stringify(memos));
  closeEditor();
  render();
}

/* ===== 삭제 ===== */
function toggleDelete(){
  if(deleteMode){
    memos=memos.filter((_,i)=>!deleteTargets.has(i));
    localStorage.setItem("memos",JSON.stringify(memos));
    deleteTargets.clear();
  }
  deleteMode=!deleteMode;
  render();
}

/* ===== 사진 ===== */
let photoData=null, scale=1, dx=0, dy=0;
let dragging=false, sx=0, sy=0;

function addPhoto(){ photoInput.click(); }
photoInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  photoData=URL.createObjectURL(f);
};

function togglePhoto(){
  if(!photoData) return;
  photoImg.src=photoData;
  photoOverlay.style.display="flex";
}

function hidePhoto(){
  photoOverlay.style.display="none";
  scale=1; dx=dy=0;
  updateTransform();
}

function updateTransform(){
  photoImg.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;
}

photoWrap.onwheel=e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(0.5,scale),4);
  updateTransform();
};

photoWrap.onpointerdown=e=>{
  dragging=true;
  sx=e.clientX-dx; sy=e.clientY-dy;
};
photoWrap.onpointermove=e=>{
  if(!dragging) return;
  dx=e.clientX-sx; dy=e.clientY-sy;
  updateTransform();
};
photoWrap.onpointerup=()=>dragging=false;
photoWrap.onpointercancel=()=>dragging=false;
</script>

</body>
</html>
