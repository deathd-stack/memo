<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>JAS MEMO VER 3.5</title>

<style>
  :root{
    --bg1:#ffb43a;
    --bg2:#f08b2a;
    --bg3:#ef7a21;
    --card:#f6eadc;
    --ink:#111;
    --line:#cfcfcf;
    --shadow:0 10px 26px rgba(0,0,0,.18);
    --shadow2:0 14px 40px rgba(0,0,0,.22);
    --radius:22px;
    --radius2:18px;
    --blue:#2f80ed;
    --red:#e21b1b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    font-weight:800;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    overflow-x:hidden;
  }

  /* ===== Header ===== */
  header{
    padding:18px 12px 10px;
    text-align:center;
    user-select:none;
    cursor:pointer;
  }
  .titleLine{display:inline-flex;align-items:flex-end;gap:10px;}
  .titleMain{
    font-weight:950;letter-spacing:.5px;
    font-size:clamp(34px, 8.5vw, 54px);
    line-height:1;
  }
  .titleVer{
    font-weight:900;
    font-size:clamp(16px, 4vw, 26px);
    opacity:.95;
    line-height:1;
    transform:translateY(-2px);
  }

  /* ===== Top buttons ===== */
  .controls{
    display:flex;
    justify-content:center;
    gap:14px;
    padding:6px 12px 14px;
  }
  .btnTop{
    border:0;
    border-radius:18px;
    background:#fff;
    padding:12px 18px;
    font-weight:950;
    letter-spacing:.3px;
    color:var(--blue);
    box-shadow:var(--shadow);
    font-size:18px;
  }
  .btnTop:active{transform:scale(.98);}

  /* ===== Memo list ===== */
  #memoList{padding:4px 10px 120px;}
  .memoCard{
    background:rgba(246,234,220,.92);
    border-radius:22px;
    padding:12px;
    box-shadow:var(--shadow2);
    border:2px solid rgba(255,255,255,.35);
    margin:10px auto;
    max-width:860px;
  }
  .memoInner{
    background:rgba(255,255,255,.20);
    border-radius:18px;
    padding:10px;
    border:2px solid rgba(255,255,255,.35);
  }
  .memoRow{display:flex;align-items:flex-start;gap:10px;}
  .memoChk{
    width:26px;height:26px;border-radius:8px;
    accent-color:#111;flex:0 0 auto;
    margin-top:2px;
  }
  .pillCol{display:flex;flex-direction:column;gap:8px;width:74px;flex:0 0 auto;}
  .pill{
    background:#111;color:#fff;border-radius:999px;
    padding:8px 0;text-align:center;
    font-weight:950;letter-spacing:.6px;font-size:14px;
  }
  .linesCol{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-width:0;}
  .chip{
    background:rgba(0,0,0,.08);
    border-radius:999px;
    padding:9px 12px;
    font-weight:950;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .memoClick{cursor:pointer;}
  .flash{animation:flash .55s;}
  @keyframes flash{50%{transform:scale(1.01); filter:brightness(1.06);} }

  /* ===== Equipment (HOME only) ===== */
  #equipBtn{
    position:fixed;left:14px;bottom:14px;z-index:50;
    border:0;border-radius:18px;background:#fff;
    padding:12px 14px;
    font-weight:950;color:var(--blue);
    box-shadow:var(--shadow);
    font-size:16px;
  }
  #equipBtn:active{transform:scale(.98);}

  #equipBadge{
    position:fixed;right:14px;bottom:14px;z-index:50;
    background:rgba(0,0,0,.86);
    color:#fff;border-radius:18px;
    padding:12px 14px;
    font-weight:950;
    box-shadow:0 16px 40px rgba(0,0,0,.26);
    text-align:right;line-height:1.1;
    min-width:170px;
    display:none;
  }
  #equipBadge .b1{font-size:22px;}
  #equipBadge .b2{font-size:20px;}

  /* ===== Modal / Sheet ===== */
  .modal{
    position:fixed; inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:80;
  }
  .sheet{
    width:100%;
    max-width:980px;
    background:#fff;
    border-radius:22px 22px 0 0;
    max-height:92vh;
    overflow:auto;
    box-shadow:0 -16px 48px rgba(0,0,0,.35);
    padding:10px 12px 18px;
    transform:translateY(0);
    touch-action:pan-y;
  }
  .handleWrap{
    display:flex;justify-content:center;
    padding:6px 0 8px;
    cursor:grab;
  }
  .handle{width:64px;height:7px;border-radius:999px;background:#d9d9d9;}

  /* top blank tap area (open photo) */
  .sheetTopTap{
    padding:2px 0 8px;
  }
  .sheetTopTapHint{
    text-align:center;
    font-weight:900;
    font-size:12px;
    color:#666;
    opacity:.7;
  }

  .checkLine{
    display:flex;justify-content:center;gap:18px;align-items:center;
    padding:6px 0 8px;font-weight:950;font-size:16px;
    white-space:nowrap;
  }
  .checkLine label{
    display:flex;gap:8px;align-items:center;white-space:nowrap;
  }
  .checkLine input{width:20px;height:20px;accent-color:var(--blue);}

  .section{
    background:#f2f2f2;border-radius:16px;padding:12px;
    margin:10px 0;border:1px solid #e5e5e5;
  }
  .secHead{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:8px;
  }
  .secTitle{font-size:18px;font-weight:950;letter-spacing:.2px;}
  .timeArea{display:flex;align-items:baseline;gap:10px;font-weight:950;}
  .timeBtn{
    border:0;background:transparent;
    color:var(--red);
    font-weight:950;
    font-size:16px;
    padding:4px 8px;
    border-radius:10px;
  }
  .timeBtn:active{background:rgba(226,27,27,.08);}
  .timeValue{
    font-size:24px;color:var(--red);letter-spacing:.6px;
    min-width:62px;text-align:right;
  }

  /* one-line 7C HL # */
  .fieldRow3{
    display:grid;
    grid-template-columns: 34px 1fr 34px 1fr 14px .8fr;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
  }
  .fieldRow3 .lbl{font-weight:950;font-size:14px;white-space:nowrap;}
  .fieldRow3 .hashLbl{justify-self:end;}

  /* one-line T D BB */
  .fieldRowTDBB{
    display:grid;
    grid-template-columns: 18px 1fr 18px .8fr 26px .8fr;
    gap:8px;
    align-items:center;
    margin:8px 0 6px;
  }
  .fieldRowTTTB{
    display:grid;
    grid-template-columns: 32px 1fr 32px 1fr;
    gap:8px;
    align-items:center;
    margin:10px 0 6px;
  }

  input, textarea, select, button{font-family:inherit;}

  input[type="text"], textarea{
    width:100%;
    border-radius:14px;
    border:2px solid var(--line);
    padding:10px 10px;
    font-weight:950;
    font-size:16px;  /* iOS zoom 방지 */
    outline:none;
    background:#fff;
    min-width:0;
  }
  input::placeholder{color:#bdbdbd;font-weight:900;}
  textarea{
    height:64px;
    resize:none;
    font-weight:900;
  }

  /* CMPT */
  .cmptRow{
    display:grid;
    grid-template-columns: 86px 1fr;
    gap:10px;
    align-items:center;
    margin:8px 0;
  }
  .cmptLbl{
    font-size:14px;
    font-weight:950;
    white-space:nowrap; /* 줄바꿈 방지 */
  }

  /* EXTRA vertical */
  .extraBox{
    background:#fff;border:2px solid #e7e7e7;
    border-radius:16px;padding:12px;margin-top:10px;
  }
  .extraHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .extraTitle{font-weight:950;font-size:16px;}
  .extraPlus{
    border:0;background:transparent;color:var(--blue);
    font-weight:950;font-size:26px;line-height:1;
    padding:2px 8px;
  }
  .extraList{display:flex;flex-direction:column;gap:8px;}
  .extraRow{
    display:grid;
    grid-template-columns: 1fr .9fr 44px;
    gap:8px;
    align-items:center;
  }
  select{
    width:100%;
    border-radius:14px;border:2px solid var(--line);
    padding:9px 10px;
    font-weight:950;font-size:14px;
    background:#f3f3f7;
  }
  .minusBtn{
    border:0;border-radius:14px;background:#eef0f6;
    color:var(--blue);font-weight:950;font-size:18px;
    padding:9px 0;
  }

  .sheetBtns{
    display:flex;gap:16px;justify-content:flex-start;
    padding:12px 2px 0;
  }
  .sheetBtn{
    border:0;background:transparent;color:var(--blue);
    font-weight:950;font-size:18px;letter-spacing:.3px;
    padding:8px 4px;
  }

  /* ===== Photo layer ===== */
  #photoLayer{
    position:fixed; inset:0;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:120;
  }
  #photoLayer img{max-width:100%;max-height:100%;}

  /* ===== Equipment modal ===== */
  #equipModal{
    position:fixed; inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:110;
  }
  #equipSheet{
    width:100%;
    max-width:640px;
    background:#fff;
    border-radius:22px 22px 0 0;
    padding:12px 12px 16px;
    max-height:70vh;
    overflow:auto;
  }
  .equipTitle{
    font-weight:950;font-size:18px;
    padding:8px 4px 10px;
  }
  .equipRow{
    display:grid;
    grid-template-columns: 70px 1fr 1fr;
    gap:10px;
    align-items:center;
    margin:10px 0;
    white-space:nowrap;
  }
  .equipRow.single{
    grid-template-columns: 70px 1fr;
  }
  .equipLbl{font-weight:950;font-size:16px;}
</style>
</head>

<body>

<header ondblclick="openPhoto()">
  <span class="titleLine">
    <span class="titleMain">JAS MEMO</span>
    <span class="titleVer">VER 3.5</span>
  </span>
</header>

<div class="controls">
  <button class="btnTop" onclick="newMemo()">ADD</button>
  <button class="btnTop" onclick="deleteSelected()">DELETE</button>
  <button class="btnTop" onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<!-- HOME ONLY -->
<button id="equipBtn" onclick="openEquip()">EQUIPMENT</button>
<div id="equipBadge"></div>

<!-- MEMO MODAL -->
<div class="modal" id="modal">
  <div class="sheet" id="sheet">

    <!-- drag handle + tap to open photo -->
    <div class="handleWrap" id="handleWrap">
      <div class="handle"></div>
    </div>
    <div class="sheetTopTap" onclick="openPhoto()">
      <div class="sheetTopTapHint">TAP HERE TO OPEN PHOTO</div>
    </div>

    <div class="checkLine">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div id="sections"></div>

    <div class="sheetBtns">
      <button class="sheetBtn" onclick="saveMemo()">SAVE</button>
      <button class="sheetBtn" onclick="closeModal()">CLOSE</button>
    </div>

  </div>
</div>

<!-- PHOTO -->
<div id="photoLayer" ondblclick="closePhoto()" onclick="closePhoto()">
  <img id="photoImg" />
</div>

<!-- EQUIPMENT MODAL -->
<div id="equipModal" ondblclick="closeEquip()" onclick="closeEquip()">
  <div id="equipSheet" onclick="event.stopPropagation()">
    <div class="handleWrap"><div class="handle"></div></div>
    <div class="equipTitle">EQUIPMENT</div>

    <div class="equipRow">
      <div class="equipLbl">TUG</div>
      <input id="tug1" type="text" inputmode="numeric" maxlength="2" placeholder="00">
      <input id="tug2" type="text" inputmode="numeric" maxlength="2" placeholder="00">
    </div>

    <div class="equipRow single">
      <div class="equipLbl">BELT</div>
      <input id="belt" type="text" inputmode="numeric" maxlength="2" placeholder="00">
    </div>

    <div class="sheetBtns">
      <button class="sheetBtn" onclick="saveEquip()">SAVE</button>
      <button class="sheetBtn" onclick="closeEquip()">CLOSE</button>
    </div>
  </div>
</div>

<script>
/* ===============================
   STORAGE KEYS
================================ */
const KEY_MEMOS = "jas_memos";
const KEY_PHOTO = "jas_photo";
const KEY_EQUIP = "jas_equipment";

/* ===============================
   DOM
================================ */
const memoList = document.getElementById("memoList");
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
const sections = document.getElementById("sections");
const inChk = document.getElementById("inChk");
const outChk = document.getElementById("outChk");

const photoInput = document.getElementById("photoInput");
const photoLayer = document.getElementById("photoLayer");
const photoImg = document.getElementById("photoImg");

const equipBtn = document.getElementById("equipBtn");
const equipBadge = document.getElementById("equipBadge");
const equipModal = document.getElementById("equipModal");
const tug1 = document.getElementById("tug1");
const tug2 = document.getElementById("tug2");
const belt = document.getElementById("belt");

let photo = localStorage.getItem(KEY_PHOTO) || null;

/* ===============================
   DATA
================================ */
let memos = loadMemosWithMigration();
let editId = null;

/* ===============================
   UTIL
================================ */
function onlyNum(v, len){
  return (v || "").replace(/[^0-9]/g, "").slice(0, len);
}
function pad(v, len){
  const s = onlyNum(v, len);
  return s ? s.padStart(len, "0") : "";
}
function nowTime(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${hh}:${mm}`;
}
function deepClone(obj){
  return JSON.parse(JSON.stringify(obj));
}

/* ===============================
   MIGRATION (old -> new)
   - 기존에 저장된 다양한 키(INBOUND-c7 등) 최대한 복구
================================ */
function loadMemosWithMigration(){
  let raw = [];
  try{
    raw = JSON.parse(localStorage.getItem(KEY_MEMOS) || "[]");
    if(!Array.isArray(raw)) raw = [];
  }catch(e){
    raw = [];
  }

  // already new format?
  const looksNew = raw.every(m => !m || typeof m !== "object" || ("dataVersion" in m) || ("in" in m) || ("out" in m));
  if(looksNew) return raw.map(normalizeNewMemo);

  // old format -> new
  const converted = raw.map(old => migrateOldMemo(old)).map(normalizeNewMemo);

  // write back once to stabilize
  localStorage.setItem(KEY_MEMOS, JSON.stringify(converted));
  return converted;
}

function normalizeNewMemo(m){
  if(!m || typeof m !== "object") m = {};
  // ensure shape
  const base = {
    id: m.id ?? Date.now(),
    dataVersion: 2,
    hasIn: !!m.hasIn,
    hasOut: !!m.hasOut,
    sharedHL: m.sharedHL ?? (m.HL ?? ""),
    sharedHASH: m.sharedHASH ?? (m.HASH ?? ""),
    in: m.in || {},
    out: m.out || {}
  };

  // keep shared as padded
  base.sharedHL = pad(base.sharedHL, 4);
  base.sharedHASH = pad(base.sharedHASH, 3);

  // normalize in/out
  base.in = {
    c7: pad(base.in.c7 ?? "", 4),
    t: pad(base.in.t ?? "", 3),
    d: pad(base.in.d ?? "", 2),
    bb: pad(base.in.bb ?? "", 2),
    cmpt1: base.in.cmpt1 ?? "F",
    cmpt2: base.in.cmpt2 ?? "F",
    cmpt3: base.in.cmpt3 ?? "",
    cmpt4: base.in.cmpt4 ?? "",
    note: base.in.note ?? "",
    time: base.in.time ?? "",
    extras: Array.isArray(base.in.extras) ? base.in.extras : []
  };

  base.out = {
    c7: pad(base.out.c7 ?? "", 4),
    t: pad(base.out.t ?? "", 3),
    d: pad(base.out.d ?? "", 2),
    bb: pad(base.out.bb ?? "", 2),
    tt: pad(base.out.tt ?? "", 4),
    tb: pad(base.out.tb ?? "", 4),
    cmpt1: base.out.cmpt1 ?? "F",
    cmpt2: base.out.cmpt2 ?? "F",
    cmpt3: base.out.cmpt3 ?? "",
    cmpt4: base.out.cmpt4 ?? "",
    note: base.out.note ?? "",
    time: base.out.time ?? "",
    extras: Array.isArray(base.out.extras) ? base.out.extras : []
  };

  // sanitize extras
  base.in.extras = base.in.extras
    .filter(x => x && typeof x === "object")
    .map(x => ({ key:String(x.key||"").toUpperCase(), val: pad(x.val||"", 3) }))
    .filter(x => x.key && x.val);

  base.out.extras = base.out.extras
    .filter(x => x && typeof x === "object")
    .map(x => ({ key:String(x.key||"").toUpperCase(), val: pad(x.val||"", 3) }))
    .filter(x => x.key && x.val);

  return base;
}

function migrateOldMemo(old){
  // old can be flat keys: INBOUND-c7, INBOUND-HL, INBOUND-HASH, etc.
  const m = { id: old.id ?? Date.now(), dataVersion: 2 };

  const hasIn = !!old.hasIn || !!old["INBOUND-c7"] || !!old["INBOUND-c7".toLowerCase()];
  const hasOut = !!old.hasOut || !!old["OUTBOUND-c7"] || !!old["OUTBOUND-c7".toLowerCase()];

  m.hasIn = hasIn;
  m.hasOut = hasOut;

  // shared hl/hash could be old.HL old.HASH or IN/OUT specific
  const hl = old.sharedHL ?? old.HL ?? old["INBOUND-HL"] ?? old["OUTBOUND-HL"] ?? "";
  const hash = old.sharedHASH ?? old.HASH ?? old["INBOUND-HASH"] ?? old["OUTBOUND-HASH"] ?? "";

  m.sharedHL = hl;
  m.sharedHASH = hash;

  m.in = {
    c7: old["INBOUND-c7"] ?? "",
    t: old["INBOUND-t"] ?? "",
    d: old["INBOUND-d"] ?? "",
    bb: old["INBOUND-bb"] ?? "",
    cmpt1: old["INBOUND-cmpt1"] ?? "F",
    cmpt2: old["INBOUND-cmpt2"] ?? "F",
    cmpt3: old["INBOUND-cmpt3"] ?? "",
    cmpt4: old["INBOUND-cmpt4"] ?? "",
    note: old["INBOUND-note"] ?? "",
    time: old["INBOUND-TIME"] ?? old["INBOUND-time"] ?? "",
    extras: old["INBOUND-EXTRAS"] ?? old["INBOUND-extras"] ?? []
  };

  m.out = {
    c7: old["OUTBOUND-c7"] ?? "",
    t: old["OUTBOUND-t"] ?? "",
    d: old["OUTBOUND-d"] ?? "",
    bb: old["OUTBOUND-bb"] ?? "",
    tt: old["OUTBOUND-tt"] ?? "",
    tb: old["OUTBOUND-tb"] ?? "",
    cmpt1: old["OUTBOUND-cmpt1"] ?? "F",
    cmpt2: old["OUTBOUND-cmpt2"] ?? "F",
    cmpt3: old["OUTBOUND-cmpt3"] ?? "",
    cmpt4: old["OUTBOUND-cmpt4"] ?? "",
    note: old["OUTBOUND-note"] ?? "",
    time: old["OUTBOUND-TIME"] ?? old["OUTBOUND-time"] ?? "",
    extras: old["OUTBOUND-EXTRAS"] ?? old["OUTBOUND-extras"] ?? []
  };

  return m;
}

/* ===============================
   INPUT FILTER (numbers only)
================================ */
document.addEventListener("input", (e) => {
  const el = e.target;
  if(!(el instanceof HTMLInputElement)) return;

  const k = el.dataset.k || "";

  // shared
  if(k === "HL") el.value = onlyNum(el.value, 4);
  if(k === "HASH") el.value = onlyNum(el.value, 3);

  // section fields
  if(k.endsWith(".c7")) el.value = onlyNum(el.value, 4);
  if(k.endsWith(".t")) el.value = onlyNum(el.value, 3);
  if(k.endsWith(".d")) el.value = onlyNum(el.value, 2);
  if(k.endsWith(".bb")) el.value = onlyNum(el.value, 2);
  if(k.endsWith(".tt")) el.value = onlyNum(el.value, 4);
  if(k.endsWith(".tb")) el.value = onlyNum(el.value, 4);

  // extra value
  if(k.startsWith("extra.val.")) el.value = onlyNum(el.value, 3);

  // sync shared HL/HASH across inputs in modal instantly
  if(k === "HL"){
    syncSharedInputs("HL", el.value);
  }
  if(k === "HASH"){
    syncSharedInputs("HASH", el.value);
  }
});

function syncSharedInputs(key, val){
  document.querySelectorAll(`input[data-k="${key}"]`).forEach(inp => {
    if(inp !== document.activeElement) inp.value = val;
  });
}

/* ===============================
   SECTIONS UI
================================ */
const EXTRA_KEYS = ["W","C","COB","STRAP","GB","TS","EMS"];

function makeSection(type, memo){
  const isOut = (type === "OUTBOUND");
  const sec = document.createElement("div");
  sec.className = "section";

  const title = type;
  const timeVal = memo ? ((isOut ? memo.out.time : memo.in.time) || "") : "";
  const sharedHL = memo ? memo.sharedHL : "";
  const sharedHASH = memo ? memo.sharedHASH : "";

  const c7 = memo ? (isOut ? memo.out.c7 : memo.in.c7) : "";
  const t = memo ? (isOut ? memo.out.t : memo.in.t) : "";
  const d = memo ? (isOut ? memo.out.d : memo.in.d) : "";
  const bb = memo ? (isOut ? memo.out.bb : memo.in.bb) : "";

  const cmpt1 = memo ? (isOut ? memo.out.cmpt1 : memo.in.cmpt1) : "F";
  const cmpt2 = memo ? (isOut ? memo.out.cmpt2 : memo.in.cmpt2) : "F";
  const cmpt3 = memo ? (isOut ? memo.out.cmpt3 : memo.in.cmpt3) : "";
  const cmpt4 = memo ? (isOut ? memo.out.cmpt4 : memo.in.cmpt4) : "";

  const tt = memo ? memo.out.tt : "";
  const tb = memo ? memo.out.tb : "";

  const note = memo ? (isOut ? memo.out.note : memo.in.note) : "";
  const extras = memo ? (isOut ? memo.out.extras : memo.in.extras) : [];

  sec.innerHTML = `
    <div class="secHead">
      <div class="secTitle">${title}</div>
      <div class="timeArea">
        <button class="timeBtn" type="button" data-timebtn="${type}">TIME</button>
        <div class="timeValue" id="${type}-timeValue">${timeVal}</div>
      </div>
    </div>

    <div class="fieldRow3">
      <div class="lbl">7C</div>
      <input type="text" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type.toLowerCase()}.c7" value="${c7}">
      <div class="lbl">HL</div>
      <input type="text" inputmode="numeric" maxlength="4" placeholder="0000" data-k="HL" value="${sharedHL}">
      <div class="lbl hashLbl">#</div>
      <input type="text" inputmode="numeric" maxlength="3" placeholder="000" data-k="HASH" value="${sharedHASH}">
    </div>

    <div class="fieldRowTDBB">
      <div class="lbl">T</div>
      <input type="text" inputmode="numeric" maxlength="3" placeholder="000" data-k="${type.toLowerCase()}.t" value="${t}">
      <div class="lbl">D</div>
      <input type="text" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type.toLowerCase()}.d" value="${d}">
      <div class="lbl">BB</div>
      <input type="text" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type.toLowerCase()}.bb" value="${bb}">
    </div>

    <div class="cmptRow">
      <div class="cmptLbl">CMPT 1</div>
      <input type="text" placeholder="TEXT" data-k="${type.toLowerCase()}.cmpt1" value="${escapeHtml(cmpt1)}">
    </div>
    <div class="cmptRow">
      <div class="cmptLbl">CMPT 2</div>
      <input type="text" placeholder="TEXT" data-k="${type.toLowerCase()}.cmpt2" value="${escapeHtml(cmpt2)}">
    </div>
    <div class="cmptRow">
      <div class="cmptLbl">CMPT 3</div>
      <input type="text" placeholder="TEXT" data-k="${type.toLowerCase()}.cmpt3" value="${escapeHtml(cmpt3)}">
    </div>
    <div class="cmptRow">
      <div class="cmptLbl">CMPT 4</div>
      <input type="text" placeholder="TEXT" data-k="${type.toLowerCase()}.cmpt4" value="${escapeHtml(cmpt4)}">
    </div>

    ${isOut ? `
      <div class="fieldRowTTTB">
        <div class="lbl">T/T</div>
        <input type="text" inputmode="numeric" maxlength="4" placeholder="0000" data-k="outbound.tt" value="${tt}">
        <div class="lbl">T/B</div>
        <input type="text" inputmode="numeric" maxlength="4" placeholder="0000" data-k="outbound.tb" value="${tb}">
      </div>
    ` : ""}

    <div class="extraBox">
      <div class="extraHead">
        <div class="extraTitle">EXTRA</div>
        <button class="extraPlus" type="button" data-extra-plus="${type}">+</button>
      </div>
      <div class="extraList" id="${type}-extraList"></div>
    </div>

    <textarea placeholder="NOTE (${type})" data-k="${type.toLowerCase()}.note">${escapeHtml(음표)}</textarea>
  `;

  // TIME button behavior
  const btn = sec.querySelector(`[data-timebtn="${type}"]`);
  const timeValue = sec.querySelector(`#${type}-timeValue`);
  btn.addEventListener("click", () => {
    timeValue.textContent = nowTime();
  });
  btn.addEventListener("dblclick", () => {
    const cur = timeValue.textContent || nowTime();
    const t = prompt("TIME (HH:MM 24H)", cur);
    if(t) timeValue.textContent = t;
  });

  // extras render
  const list = sec.querySelector(`#${type}-extraList`);
  extras.forEach(x => list.appendChild(makeExtraRow(type, x.key, x.val)));

  // add extra
  const plus = sec.querySelector(`[data-extra-plus="${type}"]`);
  plus.addEventListener("click", () => {
    list.appendChild(makeExtraRow(type, "W", ""));
  });

  return sec;
}

function makeExtraRow(type, key, val){
  const row = document.createElement("div");
  row.className = "extraRow";
  row.innerHTML = `
    <select data-k="extra.key.${type}">
      ${EXTRA_KEYS.map(k => `<option value="${k}" ${k===key ? "selected":""}>${k}</option>`).join("")}
    </select>
    <input type="text" inputmode="numeric" maxlength="3" placeholder="000" data-k="extra.val.${type}" value="${onlyNum(val,3)}">
    <button class="minusBtn" type="button">-</button>
  `;
  row.querySelector("button").addEventListener("click", () => row.remove());
  return row;
}

function escapeHtml(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

/* ===============================
   CHECKBOX CHANGE -> render sections
================================ */
inChk.onchange = outChk.onchange = () => {
  renderSectionsForEdit(null);
};

function renderSectionsForEdit(memo){
  sections.innerHTML = "";
  if(inChk.checked) sections.appendChild(makeSection("INBOUND", memo));
  if(outChk.checked) sections.appendChild(makeSection("OUTBOUND", memo));

  // After adding sections: keep shared sync
  const hl = memo ? memo.sharedHL : "";
  const hash = memo ? memo.sharedHASH : "";
  if(hl) syncSharedInputs("HL", hl);
  if(hash) syncSharedInputs("HASH", hash);
}

/* ===============================
   NEW / CLOSE
================================ */
function newMemo(){
  editId = null;
  inChk.checked = false;
  outChk.checked = false;
  sections.innerHTML = "";
  openModal();
}

function openModal(){
  modal.style.display = "flex";
  // HOME ONLY 숨김
  setHomeUiVisible(false);
}

function closeModal(){
  modal.style.display = "none";
  editId = null;
  // HOME ONLY 표시
  setHomeUiVisible(true);
}

function setHomeUiVisible(on){
  equipBtn.style.display = on ? "block" : "none";
  // badge는 데이터 있으면만 표시
  if(on) updateEquipBadge();
  else equipBadge.style.display = "none";
}

/* ===============================
   SAVE / EDIT
================================ */
function saveMemo(){
  const data = editId ? deepClone(memos.find(x => x.id === editId)) : null;

  const memo = normalizeNewMemo({
    id: editId ?? Date.now(),
    dataVersion: 2,
    hasIn: inChk.checked,
    hasOut: outChk.checked,
    sharedHL: pad(getInput("HL"), 4),
    sharedHASH: pad(getInput("HASH"), 3),
    in: {},
    out: {}
  });

  // INBOUND
  if(memo.hasIn){
    memo.in.c7 = pad(getInput("inbound.c7"), 4);
    memo.in.t  = pad(getInput("inbound.t"), 3);
    memo.in.d  = pad(getInput("inbound.d"), 2);
    memo.in.bb = pad(getInput("inbound.bb"), 2);

    memo.in.cmpt1 = getText("inbound.cmpt1", "F");
    memo.in.cmpt2 = getText("inbound.cmpt2", "F");
    memo.in.cmpt3 = getText("inbound.cmpt3", "");
    memo.in.cmpt4 = getText("inbound.cmpt4", "");

    memo.in.note = getTextarea("inbound.note", "");
    memo.in.time = (document.getElementById("INBOUND-timeValue")?.textContent || "").trim();

    memo.in.extras = collectExtras("INBOUND");
  }

  // OUTBOUND
  if(memo.hasOut){
    memo.out.c7 = pad(getInput("outbound.c7"), 4);
    memo.out.t  = pad(getInput("outbound.t"), 3);
    memo.out.d  = pad(getInput("outbound.d"), 2);
    memo.out.bb = pad(getInput("outbound.bb"), 2);

    memo.out.tt = pad(getInput("outbound.tt"), 4);
    memo.out.tb = pad(getInput("outbound.tb"), 4);

    memo.out.cmpt1 = getText("outbound.cmpt1", "F");
    memo.out.cmpt2 = getText("outbound.cmpt2", "F");
    memo.out.cmpt3 = getText("outbound.cmpt3", "");
    memo.out.cmpt4 = getText("outbound.cmpt4", "");

    memo.out.note = getTextarea("outbound.note", "");
    memo.out.time = (document.getElementById("OUTBOUND-timeValue")?.textContent || "").trim();

    memo.out.extras = collectExtras("OUTBOUND");
  }

  // preserve missing parts from previous object if edit and section unchecked now?
  // (요청상 체크에 따라 저장되게, 기존값은 유지)
  if(data){
    // if user unchecked, keep old but mark hasIn/hasOut accordingly (값은 남겨둠)
    if(!memo.hasIn && data.in) memo.in = data.in;
    if(!memo.hasOut && data.out) memo.out = data.out;

    // keep shared if empty
    if(!memo.sharedHL && data.sharedHL) memo.sharedHL = data.sharedHL;
    if(!memo.sharedHASH && data.sharedHASH) memo.sharedHASH = data.sharedHASH;
  }

  // write
  if(editId){
    const idx = memos.findIndex(x => x.id === editId);
    if(idx >= 0) memos[idx] = memo;
  }else{
    memos.push(memo);
  }
  localStorage.setItem(KEY_MEMOS, JSON.stringify(memos));

  closeModal();
  renderList(memo.id);
}

function getInput(k){
  const el = document.querySelector(`input[data-k="${k}"]`);
  return el ? el.value : "";
}
function getText(k, def){
  const el = document.querySelector(`input[data-k="${k}"]`);
  if(!el) return def;
  const v = el.value ?? "";
  return v === "" ? def : v;
}
function getTextarea(k, def){
  const el = document.querySelector(`textarea[data-k="${k}"]`);
  if(!el) return def;
  return el.value ?? def;
}

function collectExtras(type){
  const list = document.getElementById(`${type}-extraList`);
  if(!list) return [];
  const rows = [...list.querySelectorAll(".extraRow")];
  const out = [];
  rows.forEach(r => {
    const key = (r.querySelector("select")?.value || "").toUpperCase();
    const val = pad(r.querySelector('input[data-k^="extra.val."]')?.value || "", 3);
    if(key && val) out.push({key, val});
  });
  return out;
}

function editMemo(id){
  const memo = memos.find(x => x.id === id);
  if(!memo) return;

  editId = id;
  inChk.checked = !!memo.hasIn;
  outChk.checked = !!memo.hasOut;

  openModal();
  renderSectionsForEdit(memo);

  // fill shared
  syncSharedInputs("HL", memo.sharedHL || "");
  syncSharedInputs("HASH", memo.sharedHASH || "");

  // fill IN
  if(memo.hasIn){
    setInput("inbound.c7", memo.in.c7);
    setInput("inbound.t", memo.in.t);
    setInput("inbound.d", memo.in.d);
    setInput("inbound.bb", memo.in.bb);

    setInput("inbound.cmpt1", memo.in.cmpt1);
    setInput("inbound.cmpt2", memo.in.cmpt2);
    setInput("inbound.cmpt3", memo.in.cmpt3);
    setInput("inbound.cmpt4", memo.in.cmpt4);

    setTextarea("inbound.note", memo.in.note);

    const tv = document.getElementById("INBOUND-timeValue");
    if(tv) tv.textContent = memo.in.time || "";
  }

  // fill OUT
  if(memo.hasOut){
    setInput("outbound.c7", memo.out.c7);
    setInput("outbound.t", memo.out.t);
    setInput("outbound.d", memo.out.d);
    setInput("outbound.bb", memo.out.bb);

    setInput("outbound.tt", memo.out.tt);
    setInput("outbound.tb", memo.out.tb);

    setInput("outbound.cmpt1", memo.out.cmpt1);
    setInput("outbound.cmpt2", memo.out.cmpt2);
    setInput("outbound.cmpt3", memo.out.cmpt3);
    setInput("outbound.cmpt4", memo.out.cmpt4);

    setTextarea("outbound.note", memo.out.note);

    const tv = document.getElementById("OUTBOUND-timeValue");
    if(tv) tv.textContent = memo.out.time || "";
  }

  // extras are rendered inside makeSection() already from memo
}

function setInput(k, v){
  const el = document.querySelector(`input[data-k="${k}"]`);
  if(el) el.value = v ?? "";
}
function setTextarea(k, v){
  const el = document.querySelector(`textarea[data-k="${k}"]`);
  if(el) el.value = v ?? "";
}

/* ===============================
   LIST RENDER
   규칙:
   - 둘 다: IN 7C[] HL[]  / 줄바꿈 / OUT 7C[] #[]
   - IN만: IN 7C[] HL[] #[]
   - OUT만: OUT 7C[] HL[] #[]
================================ */
function renderList(flashId){
  memoList.innerHTML = "";

  memos.forEach(m => {
    const card = document.createElement("div");
    card.className = "memoCard" + (m.id === flashId ? " flash" : "");
    const inner = document.createElement("div");
    inner.className = "memoInner";

    const inLineBoth = `7C[${m.in.c7 || ""}] HL[${m.sharedHL || ""}]`;
    const outLineBoth = `7C[${m.out.c7 || ""}] #[${m.sharedHASH || ""}]`;

    let inChip = "";
    let outChip = "";

    if(m.hasIn && m.hasOut){
      inChip = `IN ${inLineBoth}`;
      outChip = `OUT ${outLineBoth}`;
    }else if(m.hasIn){
      inChip = `IN 7C[${m.in.c7 || ""}] HL[${m.sharedHL || ""}] #[${m.sharedHASH || ""}]`;
      outChip = ""; // blank
    }else if(m.hasOut){
      inChip = ""; // blank
      outChip = `OUT 7C[${m.out.c7 || ""}] HL[${m.sharedHL || ""}] #[${m.sharedHASH || ""}]`;
    }else{
      inChip = "IN";
      outChip = "OUT";
    }

    inner.innerHTML = `
      <div class="memoRow">
        <input class="memoChk" type="checkbox" data-id="${m.id}">
        <div class="pillCol">
          <div class="pill">IN</div>
          <div class="pill">OUT</div>
        </div>
        <div class="linesCol memoClick" data-open="${m.id}">
          <div class="chip">${inChip}</div>
          <div class="chip">${outChip}</div>
        </div>
      </div>
    `;

    card.appendChild(inner);
    memoList.appendChild(card);
  });

  // click binding
  memoList.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => {
      const id = Number(el.getAttribute("data-open"));
      editMemo(id);
    });
  });
}

/* ===============================
   DELETE
================================ */
function deleteSelected(){
  const ids = [...document.querySelectorAll('.memoChk:checked')]
    .map(c => Number(c.dataset.id))
    .filter(Boolean);

  if(ids.length === 0) return;

  memos = memos.filter(m => !ids.includes(m.id));
  localStorage.setItem(KEY_MEMOS, JSON.stringify(memos));
  renderList();
}

/* ===============================
   PHOTO
================================ */
function addPhoto(){
  photoInput.value = "";
  photoInput.click();
}
photoInput.onchange = (e) => {
  const f = e.target.files?.[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    photo = r.result;
    localStorage.setItem(KEY_PHOTO, photo);
  };
  r.readAsDataURL(f);
};
function openPhoto(){
  if(!photo) return;
  photoImg.src = photo;
  photoLayer.style.display = "flex";
}
function closePhoto(){
  photoLayer.style.display = "none";
}

/* ===============================
   EQUIPMENT
================================ */
function openEquip(){
  const eq = JSON.parse(localStorage.getItem(KEY_EQUIP) || "{}");
  tug1.value = pad(eq.tug1, 2) || "";
  tug2.value = pad(eq.tug2, 2) || "";
  belt.value = pad(eq.belt, 2) || "";
  equipModal.style.display = "flex";
}
function closeEquip(){
  equipModal.style.display = "none";
}
function saveEquip(){
  const eq = {
    tug1: pad(tug1.value, 2),
    tug2: pad(tug2.value, 2),
    belt: pad(belt.value, 2)
  };
  localStorage.setItem(KEY_EQUIP, JSON.stringify(eq));
  updateEquipBadge();
  closeEquip();
}
function updateEquipBadge(){
  const eq = JSON.parse(localStorage.getItem(KEY_EQUIP) || "{}");
  const has = (eq.tug1 || eq.tug2 || eq.belt);
  if(!has){
    equipBadge.style.display = "none";
    return;
  }
  const t1 = eq.tug1 || "00";
  const t2 = eq.tug2 || "00";
  const b  = eq.belt || "00";
  // 공백 없이 깔끔하게
  equipBadge.innerHTML = `
    <div class="b1">TUG ${t1}/${t2}</div>
    <div class="b2">BELT ${b}</div>
  `;
  equipBadge.style.display = "block";
}

/* ===============================
   BOTTOM SHEET DRAG TO CLOSE
================================ */
(function initSheetDrag(){
  const handleWrap = document.getElementById("handleWrap");
  let startY = 0;
  let currentY = 0;
  let dragging = false;

  function onStart(y){
    if(modal.style.display !== "flex") return;
    dragging = true;
    startY = y;
    currentY = y;
    sheet.style.transition = "none";
  }
  function onMove(y){
    if(!dragging) return;
    currentY = y;
    const dy = Math.max(0, currentY - startY);
    sheet.style.transform = `translateY(${dy}px)`;
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    const dy = Math.max(0, currentY - startY);
    sheet.style.transition = "transform .18s ease";
    sheet.style.transform = "translateY(0)";
    if(dy > 90){
      closeModal();
    }
  }

  handleWrap.addEventListener("touchstart", (e) => onStart(e.touches[0].clientY), {passive:true});
  handleWrap.addEventListener("touchmove",  (e) => onMove(e.touches[0].clientY),  {passive:true});
  handleWrap.addEventListener("touchend",   () => onEnd());

  handleWrap.addEventListener("mousedown", (e) => { e.preventDefault(); onStart(e.clientY); });
  window.addEventListener("mousemove", (e) => onMove(e.clientY));
  window.addEventListener("mouseup", () => onEnd());
})();

/* ===============================
   INIT
================================ */
renderList();
updateEquipBadge();
setHomeUiVisible(true);
</script>
