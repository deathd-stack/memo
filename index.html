<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JAS MEMO VER.1.2.X!</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #ff9f0a;
}

header {
  text-align: center;
  padding: 15px;
  font-weight: bold;
  font-size: 22px;
}

button {
  font-size: 16px;
  padding: 8px 14px;
  border-radius: 10px;
  border: none;
}

.top-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

.memo-list {
  padding: 10px;
}

.memo-item {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  font-weight: bold;
}

input, textarea {
  font-size: 16px;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

label {
  font-weight: bold;
}

.row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  width: 90%;
  max-height: 90%;
  overflow-y: auto;
  border-radius: 16px;
  padding: 15px;
}

.time {
  color: red;
  font-weight: bold;
}

textarea {
  width: 100%;
  resize: none;
}
</style>
</head>

<body>

<header>JAS MEMO VER.1.2</header>

<div class="top-buttons">
  <button onclick="openMemo()">메모 추가</button>
  <button onclick="deleteMemo()">메모 삭제</button>
  <button>사진 추가</button>
</div>

<div class="memo-list" id="memoList"></div>

<!-- 메모 모달 -->
<div class="modal" id="memoModal">
  <div class="modal-content">

    <div class="row">
      7C <input maxlength="4" inputmode="numeric" pattern="[0-9]*" oninput="autoNext(this)">
      HL <input maxlength="4" inputmode="numeric" pattern="[0-9]*">
    </div>

    <div class="row">
      <span class="time" ondblclick="resetTime()" id="time"></span>
    </div>

    <label>CMPT</label>
    <div class="row"><input placeholder="CMPT 1"></div>
    <div class="row"><input placeholder="CMPT 2"></div>
    <div class="row"><input placeholder="CMPT 3"></div>
    <div class="row"><input placeholder="CMPT 4"></div>

    <div class="row">
      T <input maxlength="3" inputmode="numeric">
      D <input maxlength="2" inputmode="numeric">
      B <input maxlength="2" inputmode="numeric">
      W <input maxlength="2" inputmode="numeric">
      C <input maxlength="3" inputmode="numeric">
    </div>

    <div class="row">
      T/T <input maxlength="4" inputmode="numeric">
      T/B <input maxlength="4" inputmode="numeric">
    </div>

    <label>특이사항</label>
    <textarea rows="2"></textarea>

    <br><br>
    <button onclick="saveMemo()">저장</button>
    <button onclick="closeMemo()">닫기</button>

  </div>
</div>

<script>
let memos = [];

function openMemo() {
  document.getElementById("memoModal").style.display = "flex";
  setTime();
}

function closeMemo() {
  document.getElementById("memoModal").style.display = "none";
}

function setTime() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.getHours().toString().padStart(2,"0") +
    now.getMinutes().toString().padStart(2,"0");
}

function resetTime() {
  setTime();
}

function saveMemo() {
  const inputs = document.querySelectorAll(".modal-content input");
  const title = `7C[${inputs[0].value}] HL[${inputs[1].value}]`;
  memos.push(title);
  renderMemos();
  closeMemo();
}

function renderMemos() {
  const list = document.getElementById("memoList");
  list.innerHTML = "";
  memos.forEach(m => {
    const div = document.createElement("div");
    div.className = "memo-item";
    div.textContent = m;
    div.onclick = openMemo;
    list.appendChild(div);
  });
}

function deleteMemo() {
  memos.pop();
  renderMemos();
}

function autoNext(el) {
  if (el.value.length === el.maxLength) {
    const inputs = Array.from(document.querySelectorAll("input"));
    const idx = inputs.indexOf(el);
    if (inputs[idx + 1]) inputs[idx + 1].focus();
  }
}
</script>

</body>
</html>
