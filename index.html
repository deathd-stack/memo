<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>JAS MEMO VER 1.2.X</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#ff9f1c;
  color:#000;
}

/* ===== HEADER ===== */
header{
  text-align:center;
  padding:20px;
  font-size:34px;
  font-weight:900;
  color:white;
  user-select:none;
}

/* ===== TOP BUTTONS ===== */
.container{ padding:16px; }

.topBtns{
  display:flex;
  gap:10px;
}
button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
}
.btnWhite{
  background:white;
  color:#ff9f1c;
}

/* ===== MEMO LIST ===== */
.memoCard{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-top:10px;
  font-weight:700;
}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  z-index:5000;
}
.modal.show{
  display:block;
}
.modalBox{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-radius:20px 20px 0 0;
  padding:16px;
  max-height:90%;
  overflow:auto;
}

/* ===== INPUT ===== */
.row{ display:flex; gap:8px; margin-bottom:8px; }
.col{ flex:1; }
input, textarea{
  width:100%;
  padding:6px;
  font-size:14px;
  box-sizing:border-box;
}
.num2{ width:48px; }
.num3{ width:64px; }
.num4{ width:78px; }

label{ font-size:13px; font-weight:700; }

/* ===== TIME ===== */
.time{
  color:red;
  font-weight:800;
  margin:6px 0;
}

/* ===== PHOTO ===== */
#photoOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  z-index:9000;
  justify-content:center;
  align-items:center;
}
#photoOverlay.show{ display:flex; }
#photoViewer{
  max-width:95%;
  max-height:95%;
  transform:scale(1);
  transition:.25s;
  touch-action:pinch-zoom;
}
#photoInput{ display:none; }
</style>
</head>

<body>

<header id="appTitle">JAS MEMO VER 1.2.X</header>

<div class="container">
  <div class="topBtns">
    <button class="btnWhite" onclick="openNewMemo()">메모 추가</button>
    <button class="btnWhite" onclick="toggleDelete()">메모 삭제</button>
    <button class="btnWhite" onclick="pickPhoto()">사진 추가</button>
  </div>

  <div id="memoList"></div>
</div>

<!-- ===== MEMO MODAL ===== -->
<div id="modal" class="modal">
  <div class="modalBox">
    <button onclick="closeModal()">닫기</button>

    <div class="row">
      <div class="col">
        <label>7C</label>
        <input id="c7" class="num4" inputmode="numeric" maxlength="4">
      </div>
      <div class="col">
        <label>HL</label>
        <input id="hl" class="num4" inputmode="numeric" maxlength="4">
      </div>
    </div>

    <div class="time" id="time"
      onclick="setTime()"
      ondblclick="manualTime()">--:--</div>

    <hr>

    <!-- CMPT -->
    <div>
      <label>CMPT 1</label><textarea id="cmpt1"></textarea>
      <label>CMPT 2</label><textarea id="cmpt2"></textarea>
      <label>CMPT 3</label><textarea id="cmpt3"></textarea>
      <label>CMPT 4</label><textarea id="cmpt4"></textarea>
    </div>

    <hr>

    <!-- T D B W C COB -->
    <div class="row">
      <input class="num3" id="t" placeholder="T">
      <input class="num2" id="d" placeholder="D">
      <input class="num2" id="b" placeholder="B">
      <input class="num2" id="w" placeholder="W">
      <input class="num3" id="c" placeholder="C">
      <input class="num3" id="cob" placeholder="COB">
    </div>

    <hr>

    <div class="row">
      <input class="num4" id="tt" placeholder="T/T">
      <input class="num4" id="tb" placeholder="T/B">
    </div>

    <textarea id="note" placeholder="특이사항 (2줄)"></textarea>

    <button class="btnWhite" onclick="saveMemo()">저장</button>
  </div>
</div>

<!-- ===== PHOTO ===== -->
<div id="photoOverlay">
  <img id="photoViewer">
</div>
<input type="file" id="photoInput" accept="image/*">

<script>
/* ===== DATA ===== */
let memos = JSON.parse(localStorage.getItem("jas_memos")||"[]");
let editIndex = null;
let deleteMode = false;

/* ===== MEMO ===== */
function render(){
  memoList.innerHTML="";
  memos.forEach((m,i)=>{
    memoList.innerHTML+=`
    <div class="memoCard" onclick="${deleteMode?`del(${i})`:`edit(${i})`}">
      7C[${m.c7}] HL[${m.hl}]
    </div>`;
  });
}

function openNewMemo(){
  editIndex=null;
  modal.classList.add("show");
}

function closeModal(){
  modal.classList.remove("show");
}

function saveMemo(){
  const m={
    c7:c7.value, hl:hl.value, time:time.textContent,
    cmpt1:cmpt1.value, cmpt2:cmpt2.value,
    cmpt3:cmpt3.value, cmpt4:cmpt4.value,
    t:t.value,d:d.value,b:b.value,w:w.value,c:c.value,cob:cob.value,
    tt:tt.value,tb:tb.value,note:note.value
  };
  if(editIndex===null) memos.push(m);
  else memos[editIndex]=m;
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal(); render();
}

function edit(i){
  editIndex=i;
  const m=memos[i];
  Object.keys(m).forEach(k=>{
    if(document.getElementById(k)) document.getElementById(k).value=m[k];
  });
  time.textContent=m.time;
  modal.classList.add("show");
}

function toggleDelete(){
  deleteMode=!deleteMode;
}

function del(i){
  memos.splice(i,1);
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  render();
}

/* ===== TIME ===== */
function setTime(){
  const d=new Date();
  time.textContent=
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0");
}
function manualTime(){
  const v=prompt("시간 입력 (HH:MM)");
  if(v) time.textContent=v;
}

/* ===== PHOTO ===== */
let scale=1, photoAdded=false;

photoInput.onchange=e=>{
  const r=new FileReader();
  r.onload=ev=>{
    photoViewer.src=ev.target.result;
    photoAdded=true;
    showPhoto();
    localStorage.setItem("jas_photo",ev.target.result);
  };
  r.readAsDataURL(e.target.files[0]);
};

function pickPhoto(){ photoInput.click(); }
function showPhoto(){
  if(!photoAdded) return;
  scale=1; photoViewer.style.transform="scale(1)";
  photoOverlay.classList.add("show");
}
photoViewer.ondblclick=()=>{
  photoOverlay.classList.remove("show");
  scale=1; photoViewer.style.transform="scale(1)";
};
photoViewer.onwheel=e=>{
  e.preventDefault();
  scale+=e.deltaY<0?0.1:-0.1;
  scale=Math.max(1,Math.min(3,scale));
  photoViewer.style.transform=`scale(${scale})`;
};
document.body.ondblclick=()=>showPhoto();
appTitle.onclick=()=>showPhoto();

/* ===== INIT ===== */
const savedPhoto=localStorage.getItem("jas_photo");
if(savedPhoto){ photoViewer.src=savedPhoto; photoAdded=true; }
render();
</script>

</body>
</html>
