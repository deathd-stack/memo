<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAS MEMO VER 2</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#ff9f1c;
  font-weight:600;
}

header{
  text-align:center;
  padding:22px;
  font-size:2.6rem;
  font-weight:900;
  cursor:pointer;
}

.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:14px;
}

button{
  padding:10px 16px;
  border:none;
  border-radius:16px;
  background:#fff;
  font-weight:900;
}

.memo{
  background:#fff;
  margin:12px;
  padding:14px;
  border-radius:18px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  transition:.3s;
}

.memo.flash{
  animation:flash .6s;
}

@keyframes flash{
  50%{background:#ffe8b5;transform:scale(1.04);}
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:flex-end;
}

.box{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:28px 28px 0 0;
  padding:18px;
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:10px;
  align-items:center;
}

input{
  width:70px;
  padding:6px;
  font-weight:800;
  border-radius:10px;
  border:1px solid #ccc;
}

input[data-long]{width:100%;}

.section{
  background:#f7f7f7;
  padding:12px;
  border-radius:14px;
  margin-top:14px;
}

textarea{
  width:100%;
  height:80px;
  border-radius:12px;
  padding:8px;
  border:1px solid #ccc;
}

#photoLayer{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
}

#photoLayer img{
  max-width:100%;
  max-height:100%;
}
</style>
</head>

<body>

<header ondblclick="openPhoto()">JAS MEMO VER 2</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<div class="modal" id="modal">
<div class="box" id="box">

<div class="row" style="justify-content:center">
  <input type="checkbox" id="inChk"> INBOUND
  <span style="width:30px"></span>
  <input type="checkbox" id="outChk"> OUTBOUND
</div>

<div id="sections"></div>

<div class="row">
  <button onclick="saveMemo()">SAVE</button>
  <button onclick="closeModal()">CLOSE</button>
</div>

</div>
</div>

<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg">
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const photoInput=document.getElementById("photoInput");
const photoLayer=document.getElementById("photoLayer");
const photoImg=document.getElementById("photoImg");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let photo=localStorage.getItem("jas_photo");
let editId=null;

/* 숫자 + 자리수 고정 */
function formatNumber(val,len){
  val=val.replace(/[^0-9]/g,'');
  if(!val) return "";
  return val.slice(0,len).padStart(len,"0");
}

/* 공유 */
document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(k==="HL"||k==="HASH"){
    const len=k==="HL"?4:3;
    e.target.value=formatNumber(e.target.value,len);
    document.querySelectorAll(`[data-k="${k}"]`)
      .forEach(i=>{if(i!==e.target)i.value=e.target.value;});
  }
  if(k?.includes("-c7")){
    e.target.value=formatNumber(e.target.value,4);
  }
});

/* 섹션 */
function makeSection(type){
  const d=document.createElement("div");
  d.className="section";

  d.innerHTML=`
  <div class="row">
    7C <input data-k="${type}-c7" inputmode="numeric">
    HL <input data-k="HL" inputmode="numeric">
    # <input data-k="HASH" inputmode="numeric">
  </div>
  `;
  return d;
}

inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("IN"));
  if(outChk.checked) sections.append(makeSection("OUT"));
};

function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";
}

function closeModal(){modal.style.display="none";}

function saveMemo(){
  const data={id:editId??Date.now()};
  document.querySelectorAll("[data-k]").forEach(i=>{
    data[i.dataset.k]=i.value;
  });
  editId
    ? memos[memos.findIndex(m=>m.id===editId)]=data
    : memos.push(data);

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal();
  renderList(data.id);
}

function renderList(flashId){
  memoList.innerHTML="";
  memos.forEach(m=>{
    const div=document.createElement("div");
    div.className="memo";
    if(m.id===flashId) div.classList.add("flash");

    const hasIn=m["IN-c7"];
    const hasOut=m["OUT-c7"];

    if(hasIn && hasOut){
      div.innerHTML=`
        <div>IN  7C ${m["IN-c7"]||""} HL ${m.HL||""}</div>
        <div>OUT 7C ${m["OUT-c7"]||""} # ${m.HASH||""}</div>
      `;
    }else{
      const type=hasIn?"IN":"OUT";
      div.innerHTML=`
        <div>
        7C ${m[`${type}-c7`]||""}
        HL ${m.HL||""}
        # ${m.HASH||""}
        </div>
      `;
    }

    memoList.appendChild(div);
  });
}

/* 사진 */
function addPhoto(){photoInput.click();}
photoInput.onchange=e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=()=>{
    photo=r.result;
    localStorage.setItem("jas_photo",photo);
  };
  r.readAsDataURL(f);
};

function openPhoto(){
  if(!photo) return;
  photoImg.src=photo;
  photoLayer.style.display="flex";
}
function closePhoto(){photoLayer.style.display="none";}

function deleteSelected(){
  memos=[];
  localStorage.removeItem("jas_memos");
  renderList();
}

renderList();
</script>

</body>
</html>
