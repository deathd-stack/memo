<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JAS MEMO VER 2</title>

<style>
  body{
    margin:0;
    font-family:-apple-system, system-ui;
    background:#ff9f1c;
    font-weight:600;
  }

  header{
    text-align:center;
    padding:22px;
    font-size:2.4rem;
    font-weight:900;
    cursor:pointer;
  }

  .controls{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:12px;
  }
  button{
    padding:8px 14px;
    border:none;
    border-radius:18px;
    background:#fff;
    font-weight:900;
    cursor:pointer;
  }

  /* ===== 리스트 카드 (두번째 사진 느낌) ===== */
  .memo{
    background:rgba(255,255,255,.78);
    margin:10px 12px;
    padding:14px 14px;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    font-size:15px;
    line-height:1.35;
    backdrop-filter: blur(6px);
  }
  .memo.flash{animation:flash .5s;}
  @keyframes flash{50%{background:#ffe8b5;transform:scale(1.02);}}

  .memoRow{
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .memoRow input[type="checkbox"]{
    width:22px;height:22px;margin-top:4px;
  }
  .memoBody{flex:1;cursor:pointer;}
  .pillLine{
    display:flex;
    align-items:center;
    gap:10px;
    margin:6px 0;
  }
  .pill{
    background:#111;
    color:#fff;
    font-weight:900;
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    min-width:44px;
    text-align:center;
  }
  .pillText{
    background:rgba(0,0,0,.07);
    border-radius:999px;
    padding:8px 12px;
    font-weight:900;
    letter-spacing:.2px;
    white-space:nowrap;
  }

  /* ===== 모달 ===== */
  .modal{
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:100;
  }
  .box{
    background:#fff;
    width:100%;
    max-height:92vh;
    overflow:auto;
    border-radius:24px 24px 0 0;
    padding:16px;
  }

  .check-line{
    display:flex;
    justify-content:center;
    gap:14px;
    align-items:center;
    margin-bottom:12px;
    white-space:nowrap;
  }
  .check-line label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:900;
  }

  .section{
    background:#f7f7f7;
    padding:12px;
    border-radius:14px;
    margin-top:10px;
  }

  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .section-title{
    font-size:15px;
    font-weight:900;
  }

  .row{
    display:flex;
    gap:10px;
    flex-wrap:nowrap;
    align-items:center;
    white-space:nowrap;
    margin-bottom:10px;
  }

  input{
    padding:8px 10px;
    font-weight:900;
    border-radius:10px;
    border:1px solid #cfcfcf;
    font-size:16px; /* iOS 자동줌 방지 */
    box-sizing:border-box;
  }
  input[data-4]{width:78px;text-align:center;}
  input[data-3]{width:66px;text-align:center;}
  input[data-2]{width:58px;text-align:center;}
  input[data-long]{flex:1;text-align:left;padding-left:12px;}

  textarea{
    width:100%;
    height:64px;
    border-radius:12px;
    padding:10px;
    border:1px solid #cfcfcf;
    font-size:16px;
    font-weight:700;
    box-sizing:border-box;
    resize:none;
  }

  /* EXTRA: 가로로 추가되게 */
  .extra-wrap{
    margin-top:10px;
    background:#fff;
    border-radius:12px;
    padding:10px;
    border:1px solid #e6e6e6;
  }
  .extra-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .extra-top .title{
    font-weight:900;
  }
  .extraBox{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .extra-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fafafa;
    border:1px solid #e6e6e6;
    padding:8px;
    border-radius:12px;
  }
  .extra-row select{
    height:36px;
    font-size:14px;
    font-weight:900;
    border-radius:10px;
    border:1px solid #cfcfcf;
    padding:0 10px;
    background:#fff;
  }
  .extra-row input{
    height:36px;
    padding:6px 10px;
  }
  .smallbtn{
    padding:8px 12px;
    border-radius:14px;
    font-weight:900;
  }

  /* 사진 */
  #photoLayer{
    position:fixed;
    inset:0;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:200;
  }
  #photoLayer img{
    max-width:100%;
    max-height:100%;
  }

  /* EQUIPMENT (바탕화면 전용) */
  #equipBtn{
    position:fixed;
    left:12px;
    bottom:12px;
    z-index:50;
    background:#fff;
    border:none;
    border-radius:16px;
    padding:10px 14px;
    font-weight:900;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  #equipBadge{
    position:fixed;
    top:10px;
    right:10px;
    z-index:60;
    background:rgba(0,0,0,.85);
    color:#fff;
    padding:8px 10px;
    border-radius:12px;
    font-size:12px;
    font-weight:900;
    line-height:1.3;
    min-width:110px;
    text-align:right;
    display:none;
  }

  #equipModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:250;
  }
  #equipBox{
    background:#fff;
    width:100%;
    max-height:70vh;
    overflow:auto;
    border-radius:24px 24px 0 0;
    padding:16px;
  }
  .equipRow{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:12px;
    white-space:nowrap;
  }
  .equipRow b{min-width:70px;}
</style>
</head>

<body>

<header ondblclick="openPhoto()">JAS MEMO VER 2</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<!-- 우측 상단 장비 표시 -->
<div id="equipBadge"></div>
<!-- 왼쪽 아래 장비 버튼 -->
<button id="equipBtn" onclick="openEquip()">EQUIPMENT</button>

<!-- 메모 모달 -->
<div class="modal" id="modal">
  <div class="box">

    <div class="check-line">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div id="sections"></div>

    <div class="row">
      <button class="smallbtn" onclick="saveMemo()">SAVE</button>
      <button class="smallbtn" onclick="closeModal()">CLOSE</button>
    </div>

  </div>
</div>

<!-- 사진 레이어 -->
<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg">
</div>

<!-- 장비 모달 -->
<div id="equipModal" ondblclick="closeEquip()">
  <div id="equipBox" onclick="event.stopPropagation()">
    <div style="font-weight:900;font-size:16px;margin-bottom:12px;">EQUIPMENT</div>

    <div class="equipRow">
      <b>TUG</b>
      <input id="tug1" data-2 inputmode="numeric" placeholder="00" maxlength="2">
      <input id="tug2" data-2 inputmode="numeric" placeholder="00" maxlength="2">
    </div>

    <div class="equipRow">
      <b>BELT</b>
      <input id="belt" data-2 inputmode="numeric" placeholder="00" maxlength="2">
    </div>

    <div class="row">
      <button class="smallbtn" onclick="saveEquip()">SAVE</button>
      <button class="smallbtn" onclick="closeEquip()">CLOSE</button>
    </div>
  </div>
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const photoInput=document.getElementById("photoInput");
const photoLayer=document.getElementById("photoLayer");
const photoImg=document.getElementById("photoImg");
const inChk=document.getElementById("inChk");
const outChk=document.getElementById("outChk");

const equipBadge=document.getElementById("equipBadge");
const equipModal=document.getElementById("equipModal");
const equipBtn=document.getElementById("equipBtn");
const tug1=document.getElementById("tug1");
const tug2=document.getElementById("tug2");
const belt=document.getElementById("belt");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let photo=localStorage.getItem("jas_photo");
let editId=null;

/* ===== util ===== */
function onlyNum(val,len){ return (val||"").replace(/[^0-9]/g,'').slice(0,len); }
function pad(val,len){
  const v=onlyNum(val,len);
  return v ? v.padStart(len,"0") : "";
}
function nowTime(){
  const d=new Date();
  return d.getHours().toString().padStart(2,"0")+":"+
         d.getMinutes().toString().padStart(2,"0");
}

/* ===== 입력 제한 + HL/# 공유 동기화 ===== */
document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(!k) return;

  // 7C/HL/# 자리수
  if(k.endsWith("-c7")) e.target.value = onlyNum(e.target.value,4);
  if(k === "HL") e.target.value = onlyNum(e.target.value,4);
  if(k === "HASH") e.target.value = onlyNum(e.target.value,3);

  // T/D/BB
  if(k.endsWith("-t")) e.target.value = onlyNum(e.target.value,3);
  if(k.endsWith("-d")) e.target.value = onlyNum(e.target.value,2);
  if(k.endsWith("-bb")) e.target.value = onlyNum(e.target.value,2);

  // T/T, T/B
  if(k.endsWith("-tt")) e.target.value = onlyNum(e.target.value,4);
  if(k.endsWith("-tb")) e.target.value = onlyNum(e.target.value,4);

  // EXTRA value(3자리)
  if(k.startsWith("extraVal-")) e.target.value = onlyNum(e.target.value,3);

  // HL 공유
  if(k==="HL"){
    document.querySelectorAll('[data-k="HL"]').forEach(el=>{
      if(el!==e.target) el.value=e.target.value;
    });
  }
  // HASH 공유
  if(k==="HASH"){
    document.querySelectorAll('[data-k="HASH"]').forEach(el=>{
      if(el!==e.target) el.value=e.target.value;
    });
  }
});

/* ===== EXTRA ===== */
const EXTRA_KEYS = ["W","C","COB","STRAP","GB","TS","EMS"];
function makeExtraRow(type, key="", val=""){
  const row=document.createElement("div");
  row.className="extra-row";
  row.innerHTML=`
    <select data-extra-type="${type}">
      ${EXTRA_KEYS.map(k=>`<option value="${k}" ${k===key?"selected":""}>${k}</option>`).join("")}
    </select>
    <input data-3 inputmode="numeric" maxlength="3" placeholder="000" data-k="extraVal-${type}" value="${onlyNum(val,3)}">
    <button type="button" class="smallbtn" onclick="this.closest('.extra-row').remove()">-</button>
  `;
  return row;
}
function addExtraRow(type){
  const box=document.getElementById(type+"-EXTRAS");
  if(!box) return;
  box.appendChild(makeExtraRow(type,"W",""));
}

/* ===== 섹션 생성 ===== */
function makeSection(type, memoData){
  const d=document.createElement("div");
  d.className="section";

  // 저장된 TIME
  const savedTime = memoData ? (memoData[type+"-TIME"]||"") : "";

  d.innerHTML=`
    <div class="section-head">
      <div class="section-title">${type}</div>
      <div class="time-btn" id="${type}-TIMEBTN">TIME</div>
    </div>

    <div class="row">
      7C <input data-4 inputmode="numeric" data-k="${type}-c7" maxlength="4" placeholder="0000">
      HL <input data-4 inputmode="numeric" data-k="HL" maxlength="4" placeholder="0000">
      # <input data-3 inputmode="numeric" data-k="HASH" maxlength="3" placeholder="000">
      <span class="time-red" id="${type}-TIMESHOWN"></span>
    </div>

    ${[1,2,3,4].map(i=>`
      <div class="row">
        CMPT ${i}
        <input data-long data-k="${type}-cmpt${i}" placeholder="TEXT">
      </div>`).join("")}

    <!-- ✅ T/D/BB 를 CMPT4 아래로 이동 -->
    <div class="row">
      T <input data-3 inputmode="numeric" data-k="${type}-t" maxlength="3" placeholder="000">
      D <input data-2 inputmode="numeric" data-k="${type}-d" maxlength="2" placeholder="00">
      BB <input data-2 inputmode="numeric" data-k="${type}-bb" maxlength="2" placeholder="00">
    </div>

    ${type==="OUTBOUND" ? `
      <div class="row">
        T/T <input data-4 inputmode="numeric" data-k="${type}-tt" maxlength="4" placeholder="0000">
        T/B <input data-4 inputmode="numeric" data-k="${type}-tb" maxlength="4" placeholder="0000">
      </div>
    ` : ""}

    <div class="extra-wrap">
      <div class="extra-top">
        <div class="title">EXTRA</div>
        <button type="button" class="smallbtn" onclick="addExtraRow('${type}')">+</button>
      </div>
      <div class="extraBox" id="${type}-EXTRAS"></div>
    </div>

    <textarea data-k="${type}-note" placeholder="NOTE (${type})"></textarea>
  `;

  // TIME 버튼 동작
  const btn = d.querySelector(`#${type}-TIMEBTN`);
  const shown = d.querySelector(`#${type}-TIMESHOWN`);
  shown.textContent = savedTime || "";

  btn.onclick = ()=>{
    shown.textContent = nowTime();
  };
  btn.ondblclick = ()=>{
    const cur = shown.textContent || nowTime();
    const t = prompt("TIME (HH:MM 24H)", cur);
    if(t) shown.textContent = t;
  };

  // CMPT1,2 기본값 F 복구(새 메모일 때만)
  if(!memoData){
    const c1 = d.querySelector(`[data-k="${type}-cmpt1"]`);
    const c2 = d.querySelector(`[data-k="${type}-cmpt2"]`);
    if(c1) c1.value = "F";
    if(c2) c2.value = "F";
  }

  // 기존 extras 불러오기
  const extrasBox = d.querySelector(`#${type}-EXTRAS`);
  const extras = memoData ? (memoData[type+"-EXTRAS"] || []) : [];
  extras.forEach(ex=>{
    extrasBox.appendChild(makeExtraRow(type, ex.key, ex.val));
  });

  return d;
}

/* 체크 변경 -> 섹션 렌더 */
inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND", null));
  if(outChk.checked) sections.append(makeSection("OUTBOUND", null));
};

/* ===== 메모 추가/닫기 ===== */
function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";

  // 바탕화면 전용 숨김
  equipBtn.style.display="none";
  equipBadge.style.display="none";
}
function closeModal(){
  modal.style.display="none";
  editId=null;

  // 바탕화면 전용 다시 표시
  equipBtn.style.display="block";
  updateEquipBadge();
}

/* ===== 저장 ===== */
function saveMemo(){
  const data={id:editId??Date.now()};
  data.hasIn=inChk.checked;
  data.hasOut=outChk.checked;

  // HL/# 공유 저장(전역)
  const hlGlobal = document.querySelector('[data-k="HL"]')?.value || "";
  const hashGlobal = document.querySelector('[data-k="HASH"]')?.value || "";
  data.HL = pad(hlGlobal,4);
  data.HASH = pad(hashGlobal,3);

  ["INBOUND","OUTBOUND"].forEach(type=>{
    if(!(type==="INBOUND"?data.hasIn:data.hasOut)) return;

    // 7C
    data[type+"-c7"] = pad(document.querySelector(`[data-k="${type}-c7"]`)?.value,4);

    // CMPT
    [1,2,3,4].forEach(i=>{
      data[type+`-cmpt${i}`] = document.querySelector(`[data-k="${type}-cmpt${i}"]`)?.value || "";
    });

    // T/D/BB
    data[type+"-t"]  = pad(document.querySelector(`[data-k="${type}-t"]`)?.value,3);
    data[type+"-d"]  = pad(document.querySelector(`[data-k="${type}-d"]`)?.value,2);
    data[type+"-bb"] = pad(document.querySelector(`[data-k="${type}-bb"]`)?.value,2);

    // OUTBOUND만 T/T T/B
    if(type==="OUTBOUND"){
      data[type+"-tt"] = pad(document.querySelector(`[data-k="${type}-tt"]`)?.value,4);
      data[type+"-tb"] = pad(document.querySelector(`[data-k="${type}-tb"]`)?.value,4);
    }

    // NOTE
    data[type+"-note"] = document.querySelector(`[data-k="${type}-note"]`)?.value || "";

    // TIME
    const shown = document.getElementById(type+"-TIMESHOWN");
    data[type+"-TIME"] = shown ? (shown.textContent||"") : "";

    // EXTRAS
    const extras=[];
    const box=document.getElementById(type+"-EXTRAS");
    if(box){
      [...box.querySelectorAll(".extra-row")].forEach(r=>{
        const key = r.querySelector("select")?.value || "";
        const val = onlyNum(r.querySelector("input")?.value,3);
        if(key && val) extras.push({key, val:val.padStart(3,"0")});
      });
    }
    data[type+"-EXTRAS"]=extras;
  });

  if(editId){
    memos[memos.findIndex(m=>m.id===editId)] = data;
  }else{
    memos.push(data);
  }

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal();
  renderList(data.id);
}

/* ===== 리스트 출력(두번째 사진 스타일) ===== */
function renderList(flashId){
  memoList.innerHTML="";
  memos.forEach(m=>{
    const div=document.createElement("div");
    div.className="memo";
    if(m.id===flashId) div.classList.add("flash");

    const HL = m.HL || "";
    const HASH = m.HASH || "";

    let content="";

    if(m.hasIn && m.hasOut){
      content += `
        <div class="pillLine">
          <span class="pill">IN</span>
          <span class="pillText">7C[${m["INBOUND-c7"]||""}] HL[${HL}]</span>
        </div>
        <div class="pillLine">
          <span class="pill">OUT</span>
          <span class="pillText">7C[${m["OUTBOUND-c7"]||""}] #[${HASH}]</span>
        </div>
      `;
    }else if(m.hasIn){
      content += `
        <div class="pillLine">
          <span class="pill">IN</span>
          <span class="pillText">7C[${m["INBOUND-c7"]||""}] HL[${HL}] #[${HASH}]</span>
        </div>
      `;
    }else if(m.hasOut){
      content += `
        <div class="pillLine">
          <span class="pill">OUT</span>
          <span class="pillText">7C[${m["OUTBOUND-c7"]||""}] HL[${HL}] #[${HASH}]</span>
        </div>
      `;
    }else{
      content += `<div class="pillLine"><span class="pill">-</span><span class="pillText">(EMPTY)</span></div>`;
    }

    div.innerHTML=`
      <div class="memoRow">
        <input type="checkbox" data-id="${m.id}">
        <div class="memoBody" onclick="editMemo(${m.id})">
          ${content}
        </div>
      </div>
    `;
    memoList.appendChild(div);
  });
}

/* ===== 수정(불러오기) ===== */
function editMemo(id){
  const m=memos.find(x=>x.id===id);
  if(!m) return;
  editId=id;

  modal.style.display="flex";
  // 바탕화면 전용 숨김
  equipBtn.style.display="none";
  equipBadge.style.display="none";

  inChk.checked=!!m.hasIn;
  outChk.checked=!!m.hasOut;

  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND", m));
  if(outChk.checked) sections.append(makeSection("OUTBOUND", m));

  setTimeout(()=>{
    // HL/# 공유 값 채우기
    document.querySelectorAll('[data-k="HL"]').forEach(el=>el.value = m.HL || "");
    document.querySelectorAll('[data-k="HASH"]').forEach(el=>el.value = m.HASH || "");

    ["INBOUND","OUTBOUND"].forEach(type=>{
      if(!(type==="INBOUND"?m.hasIn:m.hasOut)) return;

      const setV=(k,val)=>{
        const el=document.querySelector(`[data-k="${type}-${k}"]`);
        if(el) el.value=val||"";
      };

      setV("c7", m[type+"-c7"]);

      [1,2,3,4].forEach(i=>{
        const el=document.querySelector(`[data-k="${type}-cmpt${i}"]`);
        if(el) el.value=m[type+`-cmpt${i}`]||"";
      });

      setV("t", m[type+"-t"]);
      setV("d", m[type+"-d"]);
      setV("bb", m[type+"-bb"]);

      if(type==="OUTBOUND"){
        const tt=document.querySelector(`[data-k="${type}-tt"]`);
        const tb=document.querySelector(`[data-k="${type}-tb"]`);
        if(tt) tt.value=m[type+"-tt"]||"";
        if(tb) tb.value=m[type+"-tb"]||"";
      }

      const note=document.querySelector(`[data-k="${type}-note"]`);
      if(음표) note.value=m[type+"-note"]||"";

      const shown=document.getElementById(type+"-TIMESHOWN");
      if(shown) shown.textContent=m[type+"-TIME"]||"";

      // extras는 makeSection에서 이미 로드됨
    });
  },30);
}

/* ===== 삭제 ===== */
function deleteSelected(){
  const checks=document.querySelectorAll('.memo input[type="checkbox"]:checked');
  const ids=[...checks].map(c=>Number(c.dataset.id));
  memos=memos.filter(m=>!ids.includes(m.id));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

/* ===== 사진 ===== */
function addPhoto(){photoInput.click();}
photoInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    photo=r.result;
    localStorage.setItem("jas_photo",photo);
  };
  r.readAsDataURL(f);
};
function openPhoto(){if(!photo)return;photoImg.src=photo;photoLayer.style.display="flex";}
function closePhoto(){photoLayer.style.display="none";}

/* ===== EQUIPMENT (바탕화면 전용) ===== */
function openEquip(){
  const eq=JSON.parse(localStorage.getItem("jas_equipment")||"{}");
  tug1.value=pad(eq.tug1,2);
  tug2.value=pad(eq.tug2,2);
  belt.value=pad(eq.belt,2);
  equipModal.style.display="flex";
}
function closeEquip(){equipModal.style.display="none";}
function saveEquip(){
  const eq={
    tug1: pad(tug1.value,2),
    tug2: pad(tug2.value,2),
    belt: pad(belt.value,2)
  };
  localStorage.setItem("jas_equipment",JSON.stringify(eq));
  updateEquipBadge();
  closeEquip();
}
function updateEquipBadge(){
  const eq=JSON.parse(localStorage.getItem("jas_equipment")||"{}");
  if(!eq.tug1 && !eq.tug2 && !eq.belt){
    equipBadge.style.display="none";
    return;
  }
  equipBadge.innerHTML = `TUG ${eq.tug1||"00"}/${eq.tug2||"00"}<br>BELT ${eq.belt||"00"}`;
  equipBadge.style.display="block";
}

/* init */
renderList();
updateEquipBadge();
</script>

</body>
</html>
