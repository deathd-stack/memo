<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>JAS MEMO VER 1.2.X</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#ff9f1c;
}
header{
  text-align:center;
  font-weight:700;
  padding:12px;
}
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#fff;
  font-weight:600;
}
#memoList{
  padding:10px;
}
.memo{
  background:#fff;
  border-radius:10px;
  padding:8px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.memo-title{
  font-weight:700;
  cursor:pointer;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}
.box{
  background:#fff;
  width:95%;
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:12px;
}
.row{
  display:flex;
  gap:6px;
  margin-bottom:6px;
  flex-wrap:wrap;
}
.row label{font-size:12px;}
input{
  width:60px;
  text-align:center;
}
.cmpt{
  display:flex;
  gap:6px;
  margin-bottom:4px;
}
.cmpt label{width:70px;}
.red{
  color:red;
  font-weight:700;
  cursor:pointer;
}
textarea{
  width:100%;
  height:60px;
}
h3{margin:6px 0 2px;}
</style>
</head>

<body>

<header>JAS MEMO VER 1.2.X</header>

<div class="controls">
  <button onclick="openNew()">메모 추가</button>
  <button onclick="deleteSelected()">메모 삭제</button>
</div>

<div id="memoList"></div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="box">
    <div class="row">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div class="row">
      <label>7C</label><input id="in7c" maxlength="4" inputmode="numeric">
      <label>HL</label><input id="hl" maxlength="4" inputmode="numeric">
      <span class="red" id="time" onclick="setTime()" ondblclick="editTime()">--:--</span>
    </div>

    <div id="out7cRow" class="row" style="display:none">
      <label>7C</label><input id="out7c" maxlength="4" inputmode="numeric">
      <label>HL</label><input disabled>
    </div>

    <div id="sections"></div>

    <textarea id="note" placeholder="특이사항 (2줄)"></textarea>

    <div class="row">
      <button onclick="save()">저장</button>
      <button onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>

<script>
let memos=[];
let editIndex=null;

function openNew(){
  editIndex=null;
  modal.style.display="flex";
  sections.innerHTML="";
  out7cRow.style.display="none";
}

function closeModal(){
  modal.style.display="none";
}

inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  out7cRow.style.display = inChk.checked && outChk.checked ? "flex":"none";
  renderSection();
};

function renderSection(){
  sections.innerHTML="";
  if(inChk.checked) sections.innerHTML+=block("INBOUND",false);
  if(outChk.checked) sections.innerHTML+=block("OUTBOUND",true);
}

function block(title,withTT){
  return `
  <h3>${title}</h3>
  ${[1,2,3,4].map(n=>`
    <div class="cmpt">
      <label>CMPT ${n}</label><input>
    </div>`).join("")}
  <div class="row">
    <label>T</label><input maxlength="3">
    <label>D</label><input maxlength="2">
    <label>B</label><input maxlength="2">
  </div>
  <div class="row">
    <label>W</label><input maxlength="2">
    <label>C</label><input maxlength="3">
    <label>COB</label><input maxlength="3">
  </div>
  ${withTT?`
  <div class="row">
    <label>T/T</label><input maxlength="4">
    <label>T/B</label><input maxlength="4">
  </div>`:""}
  `;
}

function setTime(){
  const d=new Date();
  time.textContent=d.toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit"});
}
function editTime(){
  const t=prompt("시간 수정 (HH:MM)",time.textContent);
  if(t) time.textContent=t;
}

function save(){
  const title = inChk.checked && outChk.checked
    ? `7C(IN)${in7c.value} HL${hl.value} | 7C(OUT)${out7c.value}`
    : `7C${(inChk.checked?in7c.value:out7c.value)} HL${hl.value}`;

  memos.push({title});
  draw();
  closeModal();
}

function draw(){
  memoList.innerHTML="";
  memos.forEach((m,i)=>{
    const d=document.createElement("div");
    d.className="memo";
    d.innerHTML=`
      <input type="checkbox">
      <div class="memo-title" onclick="openEdit(${i})">${m.title}</div>`;
    memoList.appendChild(d);
  });
}

function openEdit(i){
  editIndex=i;
  modal.style.display="flex";
}

function deleteSelected(){
  const c=[...document.querySelectorAll(".memo input")];
  memos=memos.filter((_,i)=>!c[i].checked);
  draw();
}
</script>

</body>
</html>
