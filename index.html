<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAS MEMO VER.1.1</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #ff9800;
}

header {
  text-align: center;
  padding: 16px;
  font-size: 22px;
  font-weight: bold;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.container {
  padding: 12px;
}

.memo {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 10px;
}

.memo-title {
  font-weight: bold;
  cursor: pointer;
}

.hidden {
  display: none;
}

.row {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
  align-items: center;
}

input {
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.cmpt {
  display: flex;
  margin-bottom: 6px;
}

.cmpt input {
  flex: 1;
  margin-left: 8px;
}

.time {
  color: red;
  font-weight: bold;
  margin-bottom: 10px;
  cursor: pointer;
}

#photoView img {
  max-width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>JAS MEMO VER.1.1</header>

<div class="buttons">
  <button onclick="openEditor()">메모 추가</button>
  <button onclick="toggleDelete()">메모 삭제</button>
  <button onclick="addPhoto()">사진 추가</button>
</div>

<div id="photoView" class="container"></div>

<div class="container" id="memoList"></div>

<!-- 메모 에디터 -->
<div class="container hidden" id="editor">
  <div class="row" onclick="setTime()">
    7C <input id="c7" maxlength="4">
    HL <input id="hl" maxlength="4">
  </div>

  <div class="time" id="time">시간 입력</div>

  <div class="cmpt">CMPT 1 <input id="c1"></div>
  <div class="cmpt">CMPT 2 <input id="c2"></div>
  <div class="cmpt">CMPT 3 <input id="c3"></div>
  <div class="cmpt">CMPT 4 <input id="c4"></div>

  <div class="row">
    T <input maxlength="3">
    D <input maxlength="2">
    B <input maxlength="2">
    W <input maxlength="2">
    C <input maxlength="2">
  </div>

  <div class="row">
    T/T <input maxlength="4">
    T/B <input maxlength="4">
    <input maxlength="4">
  </div>

  <button onclick="saveMemo()">저장</button>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>

<script>
let editingMemo = null;
let deleteMode = false;

function openEditor(memo = null) {
  editingMemo = memo;
  document.getElementById('editor').classList.remove('hidden');
}

function setTime() {
  const d = new Date();
  document.getElementById('time').textContent =
    String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0');
}

function saveMemo() {
  const c7 = c7Input.value;
  const hl = hlInput.value;

  let memo = editingMemo || document.createElement('div');
  memo.className = 'memo';

  memo.innerHTML = `
    <div class="memo-title" onclick="openEditor(this.parentElement)">
      7C[${c7}]  HL[${hl}]
    </div>
  `;

  if (!editingMemo) memoList.appendChild(memo);

  editingMemo = null;
  editor.classList.add('hidden');
}

function toggleDelete() {
  deleteMode = !deleteMode;
  document.querySelectorAll('.memo').forEach(m => {
    if (deleteMode && !m.querySelector('input')) {
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.onchange = () => chk.checked && m.remove();
      m.prepend(chk);
    }
  });
}

function addPhoto() {
  photoInput.click();
}

photoInput.onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  photoView.innerHTML = '';
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  photoView.appendChild(img);
};
</script>

</body>
</html>
