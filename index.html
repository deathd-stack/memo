<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>JAS MEMO VER X.7</title>

<style>
  :root{
    --bgSolid:#ff6a00;
    --orange1:#ffb347;
    --orange2:#ff7a00;
    --orange3:#ff5a00;
    --blue:#4c8dff;
    --red:#ff4d4f;
    --line:#2e2e32;
    --text:#f5f5f7;
    --muted:#b4b4bc;
    --shadow:0 20px 44px rgba(0,0,0,.34);
    --shadow-soft:0 10px 24px rgba(0,0,0,.26);
    --ui:0.715;
    --dayUi:0.65;
  }

  *{box-sizing:border-box}

  html, body{
    margin:0;
    padding:0;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    font-weight:800;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    background:var(--bgSolid);
  }

  header{
    text-align:center;
    padding:calc(24px * var(--ui)) calc(14px * var(--ui)) calc(10px * var(--ui));
    user-select:none;
    cursor:pointer;
  }

  .titleWrap{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:calc(10px * var(--ui));
    flex-wrap:wrap;
  }

  .titleMain{
    font-size:calc(46.2px * var(--ui));
    font-weight:1000;
    letter-spacing:-1.2px;
    text-transform:uppercase;
    line-height:1;
    color:#fff;
    text-shadow:0 0 18px rgba(0,0,0,.14);
  }

  .titleVer{
    font-size:calc(18.7px * var(--ui));
    font-weight:1000;
    opacity:.92;
    text-transform:uppercase;
    color:#fff2d8;
    letter-spacing:.4px;
  }

  .controls{
    display:flex;
    justify-content:center;
    gap:calc(10px * var(--ui));
    padding:calc(8px * var(--ui)) calc(14px * var(--ui)) calc(8px * var(--ui));
    flex-wrap:wrap;
  }

  button{
    border:none;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(40,40,44,.96), rgba(27,27,30,.96));
    padding:calc(14px * var(--ui)) calc(22px * var(--ui));
    font-weight:1000;
    color:var(--orange1);
    font-size:calc(16px * var(--ui));
    box-shadow:var(--shadow-soft);
    text-transform:uppercase;
    cursor:pointer;
    transition:transform .14s ease, box-shadow .14s ease, filter .14s ease, opacity .14s ease;
    border:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }

  button:hover{
    transform:translateY(-1px);
    box-shadow:0 16px 30px rgba(0,0,0,.30);
    filter:brightness(1.04);
  }

  button:active{
    transform:scale(.985);
  }

  .dayBar{
    width:min(calc(780px * var(--dayUi) / .65), calc(100% - 24px));
    margin:calc(2px * var(--dayUi)) auto calc(10px * var(--dayUi));
    display:flex;
    align-items:center;
    justify-content:center;
    gap:calc(8px * var(--dayUi));
    flex-wrap:wrap;
  }

  .dayBtn{
    padding:calc(10px * var(--dayUi)) calc(14px * var(--dayUi));
    font-size:calc(13px * var(--dayUi));
    border-radius:999px;
    box-shadow:none;
    background:rgba(34,34,38,.92);
    color:var(--orange1);
    border:1px solid rgba(255,255,255,.05);
  }

  .dayLabel{
    background:rgba(34,34,38,.96);
    border:1px solid rgba(255,255,255,.06);
    border-radius:999px;
    padding:calc(10px * var(--dayUi)) calc(16px * var(--dayUi));
    font-size:calc(13px * var(--dayUi));
    font-weight:1000;
    color:#fff;
    box-shadow:0 8px 18px rgba(0,0,0,.20);
    text-transform:uppercase;
    letter-spacing:.3px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  #memoList{
    padding:calc(10px * var(--ui)) calc(14px * var(--ui)) calc(220px * var(--ui));
    max-width:calc(780px * var(--ui) / .65);
    margin:0 auto;
  }

  .emptyDay{
    background:rgba(28,28,31,.70);
    border:1px solid rgba(255,255,255,.06);
    border-radius:calc(30px * var(--ui));
    padding:calc(22px * var(--ui));
    color:#fff;
    text-align:center;
    font-size:calc(16px * var(--ui));
    font-weight:1000;
    margin-bottom:calc(42px * var(--ui));
    box-shadow:0 14px 28px rgba(0,0,0,.22);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  .memoCard{
    background:linear-gradient(180deg, rgba(34,34,38,.96), rgba(24,24,27,.96));
    border-radius:calc(32px * var(--ui));
    padding:calc(16px * var(--ui)) calc(14px * var(--ui));
    margin:calc(12px * var(--ui)) 0;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.06);
    overflow:hidden;
    position:relative;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .memoCard::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:calc(6px * var(--ui));
    background:linear-gradient(180deg,var(--orange1),var(--orange2),var(--orange3));
    box-shadow:0 0 20px rgba(255,122,0,.25);
  }

  .memoRow{
    display:flex;
    gap:calc(10px * var(--ui));
    align-items:flex-start;
    padding-left:calc(4px * var(--ui));
  }

  .selBox{
    width:calc(30px * var(--ui));
    height:calc(30px * var(--ui));
    border-radius:calc(12px * var(--ui));
    border:2px solid rgba(255,255,255,.18);
    background:#131316;
    appearance:none;
    margin-top:calc(8px * var(--ui));
    flex:0 0 auto;
    position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }

  .selBox:checked{
    background:#1a1a1d;
    border-color:var(--orange2);
    box-shadow:0 0 0 calc(4px * var(--ui)) rgba(255,122,0,.12);
  }

  .selBox:checked::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:calc(10px * var(--ui));
    height:calc(16px * var(--ui));
    border-right:calc(3px * var(--ui)) solid var(--orange2);
    border-bottom:calc(3px * var(--ui)) solid var(--orange2);
    transform:translate(-50%,-60%) rotate(45deg);
  }

  .lines{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:calc(10px * var(--ui));
    cursor:pointer;
    min-width:0;
  }

  .line{
    display:flex;
    align-items:flex-start;
    gap:calc(10px * var(--ui));
    min-width:0;
  }

  .tagPill{
    background:linear-gradient(180deg,#ff9a2f,#ff6a00);
    color:#fff;
    border-radius:999px;
    padding:calc(10px * var(--ui)) calc(14px * var(--ui));
    font-weight:1000;
    font-size:calc(15px * var(--ui));
    min-width:calc(70px * var(--ui));
    text-align:center;
    flex:0 0 auto;
    text-transform:uppercase;
    box-shadow:0 8px 16px rgba(255,122,0,.20);
  }

  .textPill{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.05);
    border-radius:999px;
    padding:calc(11px * var(--ui)) calc(16px * var(--ui));
    font-weight:1000;
    font-size:calc(18px * var(--ui));
    color:#fff;
    flex:1;
    min-width:0;
    white-space:normal;
    overflow:visible;
    word-break:break-word;
    text-transform:uppercase;
  }

  .datePill{
    margin-top:calc(8px * var(--ui));
    margin-left:calc(42px * var(--ui));
    font-size:calc(12px * var(--ui));
    color:var(--muted);
    font-weight:1000;
    text-transform:uppercase;
    letter-spacing:.2px;
  }

  .flash{animation:flash .55s;}
  @keyframes flash{
    50%{transform:scale(1.01); filter:brightness(1.06)}
  }

  .bottomLeftButtons{
    position:fixed;
    left:calc(14px * var(--ui));
    bottom:calc(18px * var(--ui));
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:calc(12px * var(--ui));
  }

  .bottomRightButtons{
    position:fixed;
    right:calc(14px * var(--ui));
    bottom:calc(18px * var(--ui));
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:calc(12px * var(--ui));
    align-items:flex-end;
  }

  .itMemoBtn,
  .akMemoBtn,
  .equipBtn{
    width:calc(148px * var(--ui));
    height:calc(50px * var(--ui));
    border-radius:999px;
    font-size:calc(16px * var(--ui));
    font-weight:1000;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
      0 12px 24px rgba(0,0,0,.22),
      inset 0 1px 0 rgba(255,255,255,.06);
    letter-spacing:.2px;
  }

  .itMemoBtn{
    background:linear-gradient(180deg,#ffe063,#ffc61a);
    color:#111;
  }

  .akMemoBtn{
    background:linear-gradient(180deg,#ff3953,#d80024);
    color:#fff;
  }

  .equipBtn{
    background:linear-gradient(180deg,#2d2d33,#1c1c20);
    color:var(--orange1);
  }

  #equipBadge{
    position:relative;
    min-width:calc(148px * var(--ui));
    background:rgba(18,18,20,.92);
    color:#fff;
    border-radius:calc(24px * var(--ui));
    padding:calc(12px * var(--ui)) calc(14px * var(--ui));
    font-weight:1000;
    line-height:1.15;
    text-align:right;
    box-shadow:
      0 14px 28px rgba(0,0,0,.24),
      inset 0 1px 0 rgba(255,255,255,.05);
    display:none;
    text-transform:uppercase;
    border:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  #equipBadge .b1{font-size:calc(18px * var(--ui));}
  #equipBadge .b2{font-size:calc(18px * var(--ui)); opacity:.95;}

  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:50;
    overscroll-behavior:contain;
    pointer-events:none;
  }

  .box{
    width:100%;
    max-width:calc(820px * var(--ui) / .65);
    background:#17171a;
    border-radius:calc(34px * var(--ui)) calc(34px * var(--ui)) 0 0;
    padding:0 calc(14px * var(--ui)) calc(18px * var(--ui));
    max-height:92vh;
    overflow:auto;
    transform:translateY(0);
    will-change:transform;
    -webkit-overflow-scrolling:touch;
    pointer-events:auto;
    box-shadow:0 -10px 30px rgba(0,0,0,.28);
    border-top:1px solid rgba(255,255,255,.05);
  }

  .dragArea{
    padding:calc(7px * var(--ui)) 0 calc(8px * var(--ui));
    position:sticky;
    top:0;
    background:#17171a;
    z-index:40;
  }

  .drag-handle{
    width:calc(62px * var(--ui));
    height:calc(8px * var(--ui));
    background:#494952;
    border-radius:999px;
    margin:0 auto calc(8px * var(--ui));
  }

  .topActionBar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:calc(10px * var(--ui));
  }

  .topMiniBtn{
    padding:calc(10px * var(--ui)) calc(16px * var(--ui));
    font-size:calc(14px * var(--ui));
    border-radius:999px;
    box-shadow:none;
    background:#242429;
    color:var(--orange1);
  }

  /* 네가 원하는 고정 영역 */
  .modalTitleTap{
    position:sticky;
    top:calc(72px * var(--ui));
    z-index:34;
    text-align:center;
    font-weight:1000;
    color:#fff;
    padding:calc(10px * var(--ui)) 0 calc(12px * var(--ui));
    cursor:pointer;
    user-select:none;
    text-transform:uppercase;
    background:linear-gradient(180deg, rgba(23,23,26,1) 0%, rgba(23,23,26,.98) 78%, rgba(23,23,26,.90) 100%);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    margin:0 calc(-14px * var(--ui));
  }

  .modalTitleTap .m1{font-size:calc(18px * var(--ui));}
  .modalTitleTap .m2{font-size:calc(12px * var(--ui)); opacity:.58; margin-top:2px;}

  .dateLine{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:calc(8px * var(--ui));
    margin-bottom:calc(8px * var(--ui));
    margin-top:calc(6px * var(--ui));
  }

  .dateLine .dateLab{
    font-size:calc(15px * var(--ui));
    font-weight:1000;
    color:#fff;
    text-transform:uppercase;
  }

  .dateInput{
    width:auto !important;
    min-width:calc(180px * var(--ui));
    text-align:center;
    padding:0 calc(12px * var(--ui));
  }

  .pickRow{
    display:flex;
    justify-content:center;
    gap:calc(10px * var(--ui));
    flex-wrap:wrap;
    margin:calc(6px * var(--ui)) 0 calc(12px * var(--ui));
  }

  .pickPill{
    display:flex;
    align-items:center;
    gap:calc(8px * var(--ui));
    background:#222226;
    border:2px solid #2d2d32;
    border-radius:999px;
    padding:calc(11px * var(--ui)) calc(16px * var(--ui));
    font-size:calc(15px * var(--ui));
    font-weight:1000;
    text-transform:uppercase;
    user-select:none;
    color:#fff;
  }

  .pickPill input{
    width:calc(20px * var(--ui));
    height:calc(20px * var(--ui));
    margin:0;
    accent-color:var(--orange2);
  }

  .section{
    background:#1f1f23;
    border-radius:calc(28px * var(--ui));
    padding:calc(14px * var(--ui));
    margin:calc(12px * var(--ui)) 0;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.05);
  }

  .sectionHead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:calc(10px * var(--ui));
    gap:calc(10px * var(--ui));
  }

  .sectionTitle{
    font-size:calc(24px * var(--ui));
    font-weight:1000;
    letter-spacing:.3px;
    text-transform:uppercase;
    color:#fff;
  }

  .headRight{
    display:flex;
    align-items:flex-start;
    gap:calc(10px * var(--ui));
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .staStdWrap{
    display:flex;
    align-items:center;
    gap:calc(8px * var(--ui));
    white-space:nowrap;
  }

  .staStdLab{
    font-size:calc(16px * var(--ui));
    font-weight:1000;
    color:#fff;
    text-transform:uppercase;
  }

  .staStdInput{
    width:calc(92px * var(--ui)) !important;
    min-width:calc(92px * var(--ui));
    text-align:center;
  }

  .timeWrap{
    display:flex;
    align-items:baseline;
    gap:calc(10px * var(--ui));
    white-space:nowrap;
    text-transform:uppercase;
  }

  .timeBtn{
    border:none;
    background:transparent;
    box-shadow:none;
    padding:calc(4px * var(--ui)) calc(8px * var(--ui));
    margin:0;
    font-weight:1000;
    font-size:calc(16px * var(--ui));
    color:#fff;
    border-radius:999px;
    text-transform:uppercase;
  }

  .timeBtn:active{background:rgba(255,122,0,.08);}

  .timeVal{
    font-weight:1000;
    font-size:calc(22px * var(--ui));
    color:var(--orange1);
    min-width:calc(64px * var(--ui));
    text-align:right;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }

  .row{
    display:flex;
    align-items:center;
    gap:calc(10px * var(--ui));
    margin:calc(10px * var(--ui)) 0;
    flex-wrap:nowrap;
    min-width:0;
  }

  .lab{
    font-size:calc(20px * var(--ui));
    font-weight:1000;
    min-width:calc(46px * var(--ui));
    color:#fff;
    white-space:nowrap;
    text-transform:uppercase;
  }

  input, textarea, select{
    font-family:inherit;
    font-size:calc(16px * var(--ui));
    font-weight:1000;
    border:2px solid var(--line);
    border-radius:calc(22px * var(--ui));
    outline:none;
    background:#121214;
    color:#fff;
    -webkit-text-size-adjust:100%;
    font-variant-numeric:tabular-nums;
    text-transform:uppercase;
    transition:border-color .14s ease, box-shadow .14s ease;
  }

  input::placeholder, textarea::placeholder{
    color:#8e8e96;
  }

  input:focus, textarea:focus, select:focus{
    border-color:rgba(255,122,0,.7);
    box-shadow:0 0 0 calc(4px * var(--ui)) rgba(255,122,0,.12);
  }

  input{
    width:100%;
    height:calc(54px * var(--ui));
    line-height:calc(54px * var(--ui));
    padding:0 calc(12px * var(--ui));
    text-align:center;
  }

  textarea{
    width:100%;
    height:calc(82px * var(--ui));
    resize:none;
    font-weight:800;
    padding:calc(12px * var(--ui));
    text-transform:none;
    border-radius:calc(24px * var(--ui));
  }

  select{
    height:calc(54px * var(--ui));
    padding:0 calc(12px * var(--ui));
  }

  .numBox{
    font-size:calc(18px * var(--ui));
    letter-spacing:.6px;
  }

  .long{
    flex:1;
    min-width:0;
    font-size:calc(16px * var(--ui));
    font-weight:1000;
    padding-left:calc(16px * var(--ui));
    text-align:left;
  }

  .extraBox{
    background:#18181b;
    border:2px solid #27272c;
    border-radius:calc(26px * var(--ui));
    padding:calc(14px * var(--ui));
    margin-top:calc(10px * var(--ui));
  }

  .extraHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:calc(10px * var(--ui));
    text-transform:uppercase;
  }

  .extraTitle{
    font-size:calc(20px * var(--ui));
    font-weight:1000;
    letter-spacing:.4px;
    color:#fff;
  }

  .iconBtn{
    width:calc(48px * var(--ui));
    height:calc(48px * var(--ui));
    border-radius:calc(18px * var(--ui));
    border:none;
    background:#242429;
    box-shadow:0 8px 18px rgba(0,0,0,.16);
    color:var(--orange1);
    font-size:calc(28px * var(--ui));
    font-weight:1000;
    text-transform:uppercase;
  }

  .extraRow{
    display:flex;
    gap:calc(10px * var(--ui));
    align-items:center;
    margin-top:calc(10px * var(--ui));
  }

  .extraRow select{
    width:calc(130px * var(--ui));
    font-size:calc(16px * var(--ui));
    font-weight:1000;
  }

  .extraRow input{
    width:calc(130px * var(--ui));
    font-size:calc(18px * var(--ui));
  }

  .minusBtn{
    width:calc(60px * var(--ui));
    height:calc(54px * var(--ui));
    border-radius:calc(20px * var(--ui));
    border:none;
    background:#242429;
    color:var(--orange1);
    font-weight:1000;
    font-size:calc(22px * var(--ui));
    box-shadow:none;
    text-transform:uppercase;
  }

  .lirBtn{
    padding:calc(10px * var(--ui)) calc(16px * var(--ui));
    font-size:calc(14px * var(--ui));
    border-radius:999px;
    box-shadow:none;
    background:#242429;
    color:var(--orange1);
  }

  .lirCalcRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:calc(10px * var(--ui));
    margin:calc(12px * var(--ui)) 0 calc(4px * var(--ui));
    flex-wrap:nowrap;
  }

  .lirBtns{
    display:flex;
    align-items:center;
    gap:calc(10px * var(--ui));
    flex-wrap:wrap;
  }

  .calcCircleBtn{
    width:calc(48px * var(--ui));
    height:calc(48px * var(--ui));
    min-width:calc(48px * var(--ui));
    border-radius:999px;
    border:none;
    background:#242429;
    box-shadow:0 8px 18px rgba(0,0,0,.16);
    color:var(--orange1);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }

  .calcIconBtn{
    position:relative;
  }

  .calcIcon{
    position:relative;
    display:block;
    width:calc(22px * var(--ui));
    height:calc(26px * var(--ui));
    border:2px solid var(--orange2);
    border-radius:calc(8px * var(--ui));
  }

  .calcIcon::before{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:calc(3px * var(--ui));
    width:calc(12px * var(--ui));
    height:calc(4px * var(--ui));
    background:var(--orange2);
    border-radius:calc(3px * var(--ui));
  }

  .calcIcon::after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:calc(4px * var(--ui));
    width:calc(12px * var(--ui));
    height:calc(10px * var(--ui));
    background:
      radial-gradient(circle, var(--orange2) 58%, transparent 60%) 0 0 / calc(4px * var(--ui)) calc(4px * var(--ui)) repeat;
    opacity:.95;
  }

  .calcFloatingWrap{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:120;
    padding:calc(16px * var(--ui));
  }

  .calcFloatingWrap.show{
    display:flex;
  }

  .calcFloating{
    width:min(calc(430px * var(--ui) / .65), 100%);
    background:#18181b;
    border-radius:calc(30px * var(--ui));
    box-shadow:0 22px 46px rgba(0,0,0,.34);
    padding:calc(14px * var(--ui));
    animation:calcUp .16s ease;
    border:1px solid rgba(255,255,255,.05);
  }

  @keyframes calcUp{
    from{transform:translateY(18px); opacity:.75}
    to{transform:translateY(0); opacity:1}
  }

  .calcTopBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:calc(10px * var(--ui));
    margin-bottom:calc(10px * var(--ui));
  }

  .calcTitle{
    font-size:calc(15px * var(--ui));
    font-weight:1000;
    color:#fff;
    text-transform:uppercase;
    letter-spacing:.4px;
  }

  .calcCloseBtn{
    border:none;
    background:#242429;
    color:var(--orange1);
    width:calc(42px * var(--ui));
    height:calc(42px * var(--ui));
    border-radius:calc(16px * var(--ui));
    box-shadow:none;
    padding:0;
    font-size:calc(18px * var(--ui));
    font-weight:1000;
  }

  .calcDisplay{
    width:100%;
    height:calc(60px * var(--ui));
    border:2px solid #2b2b31;
    border-radius:calc(24px * var(--ui));
    background:#101012;
    padding:0 calc(14px * var(--ui));
    display:flex;
    align-items:center;
    justify-content:flex-end;
    font-size:calc(24px * var(--ui));
    font-weight:1000;
    color:#fff;
    overflow:hidden;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  .calcGrid{
    margin-top:calc(10px * var(--ui));
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:calc(8px * var(--ui));
  }

  .calcKey{
    height:calc(54px * var(--ui));
    border:none;
    border-radius:calc(20px * var(--ui));
    background:#242429;
    color:#fff;
    font-size:calc(18px * var(--ui));
    font-weight:1000;
    box-shadow:none;
    padding:0;
  }

  .calcKey.op{
    background:#2b2b31;
    color:var(--orange1);
  }

  .calcKey.eq{
    background:linear-gradient(180deg,var(--orange2),var(--orange3));
    color:#fff;
  }

  .calcKey.wide{
    grid-column:span 2;
  }

  .focusedCalcTarget{
    border-color:rgba(255,122,0,.7) !important;
    box-shadow:0 0 0 calc(4px * var(--ui)) rgba(255,122,0,.12) !important;
  }

  #photoLayer{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:90;
  }

  #photoLayer img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }

  .rowGrid3{
    display:grid;
    grid-template-columns:
      calc(26px * var(--ui)) .9fr
      calc(26px * var(--ui)) .9fr
      calc(14px * var(--ui)) .9fr;
    gap:calc(10px * var(--ui));
    align-items:center;
    margin:calc(10px * var(--ui)) 0;
    min-width:0;
  }

  .rowGridTDBB{
    display:grid;
    grid-template-columns:
      calc(18px * var(--ui)) 1fr
      calc(18px * var(--ui)) .9fr
      calc(26px * var(--ui)) .9fr;
    gap:calc(10px * var(--ui));
    align-items:center;
    margin:calc(10px * var(--ui)) 0;
    min-width:0;
  }

  .rowGridTTTB{
    display:grid;
    grid-template-columns:
      calc(26px * var(--ui)) 1fr
      calc(26px * var(--ui)) 1fr;
    gap:calc(10px * var(--ui));
    align-items:center;
    margin:calc(10px * var(--ui)) 0;
    min-width:0;
  }

  @media (max-width:520px){
    .bottomLeftButtons{
      left:12px;
      bottom:14px;
      gap:10px;
    }

    .bottomRightButtons{
      right:12px;
      bottom:14px;
      gap:10px;
    }

    .itMemoBtn,
    .akMemoBtn,
    .equipBtn{
      width:122px;
      height:42px;
      font-size:14px;
    }

    #equipBadge{
      min-width:122px;
      padding:10px 12px;
    }

    #equipBadge .b1,
    #equipBadge .b2{
      font-size:14px;
    }

    .topMiniBtn{
      padding:8px 12px;
      font-size:14px;
    }
  }
</style>
</head>

<body>

      <input id="tug1" class="numBox" inputmode="numeric" maxlength="2" placeholder="00">

      <input id="belt" class="numBox" inputmode="numeric" maxlength="2" placeholder="00">

<div id="calcWrap" class="calcFloatingWrap" aria-hidden="true">
  <div class="calcFloating" onclick="event.stopPropagation()">
    <div class="calcTopBar">
      <div class="calcTitle">CALCULATOR</div>
      <button type="button" class="calcCloseBtn" onclick="closeCalc()">✕</button>
    </div>
    <div class="calcDisplay" id="globalCalcDisplay">0</div>
    <div class="calcGrid">
      <button type="button" class="calcKey op" data-global-calc="C">C</button>
      <button type="button" class="calcKey op" data-global-calc="⌫">⌫</button>
      <button type="button" class="calcKey op" data-global-calc="%">%</button>
      <button type="button" class="calcKey op" data-global-calc="/">÷</button>

      <button type="button" class="calcKey" data-global-calc="7">7</button>
      <button type="button" class="calcKey" data-global-calc="8">8</button>
      <button type="button" class="calcKey" data-global-calc="9">9</button>
      <button type="button" class="calcKey op" data-global-calc="*">×</button>

      <button type="button" class="calcKey" data-global-calc="4">4</button>
      <button type="button" class="calcKey" data-global-calc="5">5</button>
      <button type="button" class="calcKey" data-global-calc="6">6</button>
      <button type="button" class="calcKey op" data-global-calc="-">−</button>

      <button type="button" class="calcKey" data-global-calc="1">1</button>
      <button type="button" class="calcKey" data-global-calc="2">2</button>
      <button type="button" class="calcKey" data-global-calc="3">3</button>
      <button type="button" class="calcKey op" data-global-calc="+">+</button>

      <button type="button" class="calcKey wide" data-global-calc="0">0</button>
      <button type="button" class="calcKey" data-global-calc=".">.</button>
      <button type="button" class="calcKey eq" data-global-calc="=">=</button>
    </div>
  </div>
</div>

<script>
  const MEMO_KEY = "jas_memos_v64";
  const PHOTO_KEY = "jas_photo_v64";
  const EQUIP_KEY = "jas_equipment_v64";

  const modal = document.getElementById("modal");
  const sheet = document.getElementById("sheet");
  const dragArea = document.getElementById("dragArea");
  const sections = document.getElementById("sections");
  const memoList = document.getElementById("memoList");
  const photoInput = document.getElementById("photoInput");
  const lirPhotoInput = document.getElementById("lirPhotoInput");
  const photoLayer = document.getElementById("photoLayer");
  const photoImg = document.getElementById("photoImg");
  const memoDate = document.getElementById("memoDate");
  const dayLabel = document.getElementById("dayLabel");
  const pickInbound = document.getElementById("pickInbound");
  const pickOutbound = document.getElementById("pickOutbound");
  const topControls = document.getElementById("topControls");

  const equipBadge = document.getElementById("equipBadge");
  const equipModal = document.getElementById("equipModal");
  const tug1 = document.getElementById("tug1");
  const tug2 = document.getElementById("tug2");
  const belt = document.getElementById("belt");

  const calcWrap = document.getElementById("calcWrap");
  const globalCalcDisplay = document.getElementById("globalCalcDisplay");

  let memos = JSON.parse(localStorage.getItem(MEMO_KEY) || "[]");
  let photo = localStorage.getItem(PHOTO_KEY) || "";
  let editId = null;
  let dayOffset = 0;
  let activeLirType = null;
  let currentLirPhotos = { INBOUND:"", OUTBOUND:"" };
  let globalCalcExpr = "";
  let activeCalcInput = null;
  let activeTeamFilter = "";

  const EXTRA_KEYS = ["W","C","COB","GB","TS","EMS","RUSH","CARSEAT","COMAT","STRAP","LONGFIN","CYCLE","CREW"];

  function onlyNum(val, len){
    return (val || "").replace(/[^0-9]/g, "").slice(0, len);
  }

  function pad(val, len){
    const v = onlyNum(val, len);
    return v ? v.padStart(len, "0") : "";
  }

  function cleanTextUpper(val){
    return (val || "").toUpperCase().trim();
  }

  function defaultF(val){
    const v = cleanTextUpper(val);
    return v ? v : "F";
  }

  function nowTime(){
    const d = new Date();
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  function normalizeTimeText(val){
    const raw = (val || "").trim();
    if(!raw) return "";
    const digits = raw.replace(/[^0-9]/g, "");
    if(digits.length === 3) return digits.slice(0,1) + ":" + digits.slice(1,3);
    if(digits.length >= 4) return digits.slice(0,2) + ":" + digits.slice(2,4);
    return raw.slice(0,5);
  }

  function askTime(currentValue=""){
    const t = prompt("TIME (HH:MM 24H)", currentValue || nowTime());
    if(t === null) return null;
    return normalizeTimeText(t);
  }

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function dateToStr(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function getViewingDate(){
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + dayOffset);
    return d;
  }

  function getViewingDayKey(){
    return dateToStr(getViewingDate());
  }

  function updateDayLabel(){
    dayLabel.textContent = getViewingDayKey();
  }

  function calcDayOffsetFromDate(dateStr){
    const base = new Date(todayStr());
    const target = new Date(dateStr);
    base.setHours(0,0,0,0);
    target.setHours(0,0,0,0);
    return Math.round((target - base) / 86400000);
  }

  function moveDay(n){
    dayOffset += n;
    updateDayLabel();
    renderList();
  }

  function goToday(){
    dayOffset = 0;
    updateDayLabel();
    renderList();
  }

  function deleteCurrentDay(){
    const dk = getViewingDayKey();
    const target = memos.filter(m => (m.dayKey || m.memoDate) === dk);
    if(!target.length){
      alert("NO MEMO IN THIS DAY");
      return;
    }
    if(!confirm("DELETE ALL MEMOS IN THIS DAY?")) return;
    memos = memos.filter(m => (m.dayKey || m.memoDate) !== dk);
    localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
    renderList();
  }

  function isCalcEligibleInput(el){
    if(!(el instanceof HTMLInputElement)) return false;
    const k = el.dataset.k || "";
    if(!k) return false;
    return (
      k.endsWith("-7C") ||
      k.endsWith("-STA") ||
      k.endsWith("-STD") ||
      k.endsWith("-t") ||
      k.endsWith("-d") ||
      k.endsWith("-bb") ||
      k.endsWith("-tt") ||
      k.endsWith("-tb") ||
      k === "SHARED-HL" ||
      k === "SHARED-HASH" ||
      k.startsWith("extraVal-")
    );
  }

  document.addEventListener("focusin", (e)=>{
    const t = e.target;
    if(isCalcEligibleInput(t)){
      if(activeCalcInput && activeCalcInput !== t){
        activeCalcInput.classList.remove("focusedCalcTarget");
      }
      activeCalcInput = t;
      activeCalcInput.classList.add("focusedCalcTarget");
    }
  });

  document.addEventListener("click", (e)=>{
    const t = e.target;
    if(!(t instanceof HTMLElement)) return;
    if(!t.closest(".section") && !t.closest(".calcFloating")){
      if(activeCalcInput){
        activeCalcInput.classList.remove("focusedCalcTarget");
      }
    }
  });

  document.addEventListener("input", (e)=>{
    const t = e.target;
    if(!(t instanceof HTMLInputElement)) return;
    const k = t.dataset.k || "";
    if(!k) return;

    if(k === "SHARED-HL"){
      t.value = onlyNum(t.value, 4);
      document.querySelectorAll('input[data-k="SHARED-HL"]').forEach(el=>{
        if(el !== t) el.value = t.value;
      });
      return;
    }

    if(k === "SHARED-HASH"){
      t.value = onlyNum(t.value, 3);
      document.querySelectorAll('input[data-k="SHARED-HASH"]').forEach(el=>{
        if(el !== t) el.value = t.value;
      });
      return;
    }

    if(k.endsWith("-7C")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-STA")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-STD")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-t")) t.value = onlyNum(t.value, 3);
    if(k.endsWith("-d")) t.value = onlyNum(t.value, 2);
    if(k.endsWith("-bb")) t.value = onlyNum(t.value, 2);
    if(k.endsWith("-tt")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-tb")) t.value = onlyNum(t.value, 4);
    if(k.startsWith("extraVal-")) t.value = onlyNum(t.value, 3);
  });

  function makeExtraRow(type, key="CREW", val=""){
    const row = document.createElement("div");
    row.className = "extraRow";
    row.innerHTML = `
      <select>
        ${EXTRA_KEYS.map(k => `<option value="${k}" ${k===key ? "selected" : ""}>${k}</option>`).join("")}
      </select>
      <input class="numBox" inputmode="numeric" maxlength="3" placeholder="000" data-k="extraVal-${type}" value="${onlyNum(val,3)}">
      <button type="button" class="minusBtn" onclick="this.parentElement.remove()">-</button>
    `;
    return row;
  }

  function addExtraRow(type){
    const root = sections.querySelector(`.section[data-type="${type}"]`);
    const box = root ? root.querySelector(`#${type}-EXTRAS`) : null;
    if(!box) return;
    box.appendChild(makeExtraRow(type, "CREW", ""));
  }

  function bindEditableTime(el, initialValue){
    el.textContent = initialValue || "";
    el.addEventListener("click", ()=>{
      const t = askTime(el.textContent || "");
      if(t !== null) el.textContent = t;
    });
  }

  function openLirPicker(type){
    activeLirType = type;
    lirPhotoInput.value = "";
    lirPhotoInput.click();
  }

  function viewLirPhoto(type){
    const src = currentLirPhotos[type] || "";
    if(!src){
      alert("NO LIR PHOTO");
      return;
    }
    photoImg.src = src;
    photoLayer.style.display = "flex";
  }

  function openCalc(){
    calcWrap.classList.add("show");
    calcWrap.setAttribute("aria-hidden","false");
  }

  function closeCalc(){
    calcWrap.classList.remove("show");
    calcWrap.setAttribute("aria-hidden","true");
  }

  function updateGlobalCalcDisplay(val){
    globalCalcDisplay.textContent = val || "0";
  }

  function safeEval(expr){
    if(!expr) return "0";
    const cleaned = expr.replace(/[^0-9+\-*/%.()]/g, "");
    if(!cleaned) return "0";
    try{
      const result = Function("return (" + cleaned + ")")();
      if(result === undefined || result === null || Number.isNaN(result) || !Number.isFinite(result)){
        return "ERROR";
      }
      return String(result);
    }catch(e){
      return "ERROR";
    }
  }

  function applyCalcToInput(result){
    if(!activeCalcInput) return;
    const k = activeCalcInput.dataset.k || "";
    const digits = String(result || "").replace(/[^0-9]/g, "");

    if(k === "SHARED-HL"){
      activeCalcInput.value = digits.slice(0,4);
    }else if(k === "SHARED-HASH"){
      activeCalcInput.value = digits.slice(0,3);
    }else if(k.endsWith("-7C") || k.endsWith("-STA") || k.endsWith("-STD") || k.endsWith("-tt") || k.endsWith("-tb")){
      activeCalcInput.value = digits.slice(0,4);
    }else if(k.endsWith("-t") || k.startsWith("extraVal-")){
      activeCalcInput.value = digits.slice(0,3);
    }else if(k.endsWith("-d") || k.endsWith("-bb")){
      activeCalcInput.value = digits.slice(0,2);
    }else{
      activeCalcInput.value = digits;
    }

    activeCalcInput.dispatchEvent(new Event("input", { bubbles:true }));
  }

  function makeSection(type, memoData){
    const d = document.createElement("div");
    d.className = "section";
    d.dataset.type = type;

    const savedTime = memoData ? (memoData[type+"-TIME"] || "") : "";
    const local7C = memoData ? (memoData[type+"-7C"] || "") : "";
    const sharedHL = memoData ? (memoData.sharedHL || "") : "";
    const sharedHASH = memoData ? (memoData.sharedHASH || "") : "";
    const v = (k)=> memoData ? (memoData[type+"-"+k] || "") : "";
    const noteV = memoData ? (memoData[type+"-note"] || "") : "";

    const cmpt1Val = memoData ? defaultF(memoData[type+"-cmpt1"]) : "F";
    const cmpt2Val = memoData ? defaultF(memoData[type+"-cmpt2"]) : "F";

    const staStdLabel = type === "INBOUND" ? "STA" : "STD";
    const staStdKey = type === "INBOUND" ? "STA" : "STD";

    d.innerHTML = `
      <div class="sectionHead">
        <div class="sectionTitle">${type}</div>
        <div class="headRight">
          <div class="staStdWrap">
            <div class="staStdLab">${staStdLabel}</div>
            <input class="numBox staStdInput" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-${staStdKey}" value="${v(staStdKey)}">
          </div>
          <div class="timeWrap">
            <button type="button" class="timeBtn" data-timebtn="${type}">TIME</button>
            <div class="timeVal" id="${type}-TIMESHOWN"></div>
          </div>
        </div>
      </div>

      <div class="rowGrid3">
        <div class="lab">7C</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-7C" value="${local7C}">
        <div class="lab">HL</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="SHARED-HL" value="${sharedHL}">
        <div class="lab">#</div>
        <input class="numBox" inputmode="numeric" maxlength="3" placeholder="000" data-k="SHARED-HASH" value="${sharedHASH}">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 1</div>
        <input class="long" data-k="${type}-cmpt1" value="${cmpt1Val}" placeholder="TEXT">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 2</div>
        <input class="long" data-k="${type}-cmpt2" value="${cmpt2Val}" placeholder="TEXT">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 3</div>
        <input class="long" data-k="${type}-cmpt3" placeholder="TEXT" value="${memoData ? (memoData[type+'-cmpt3'] || '') : ''}">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 4</div>
        <input class="long" data-k="${type}-cmpt4" placeholder="TEXT" value="${memoData ? (memoData[type+'-cmpt4'] || '') : ''}">
      </div>

      <div class="rowGridTDBB">
        <div class="lab">T</div>
        <input class="numBox" inputmode="numeric" maxlength="3" placeholder="000" data-k="${type}-t" value="${v("t")}">
        <div class="lab">D</div>
        <input class="numBox" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type}-d" value="${v("d")}">
        <div class="lab">BB</div>
        <input class="numBox" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type}-bb" value="${v("bb")}">
      </div>

      ${type === "OUTBOUND" ? `
      <div class="rowGridTTTB">
        <div class="lab">T/T</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-tt" value="${v("tt")}">
        <div class="lab">T/B</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-tb" value="${v("tb")}">
      </div>

      <div class="lirCalcRow">
        <div class="lirBtns">
          <button type="button" class="lirBtn" data-lir-add="${type}">LIR</button>
          <button type="button" class="lirBtn" data-lir-view="${type}">VIEW</button>
        </div>
        <button type="button" class="calcCircleBtn calcIconBtn" data-calc-toggle="${type}">
          <span class="calcIcon"></span>
        </button>
      </div>
      ` : ""}

      <div class="extraBox">
        <div class="extraHead">
          <div class="extraTitle">EXTRA</div>
          <button type="button" class="iconBtn" onclick="addExtraRow('${type}')">+</button>
        </div>
        <div id="${type}-EXTRAS"></div>
      </div>

      <textarea data-k="${type}-note" placeholder="NOTE (${type})">${noteV}</textarea>
    `;

    const timeBtn = d.querySelector(`[data-timebtn="${type}"]`);
    const timeShown = d.querySelector(`#${type}-TIMESHOWN`);
    bindEditableTime(timeShown, savedTime);

    timeBtn.addEventListener("click", ()=>{
      timeShown.textContent = nowTime();
    });

    timeBtn.addEventListener("dblclick", ()=>{
      const t = askTime(timeShown.textContent || "");
      if(t !== null) timeShown.textContent = t;
    });

    const lirAddBtn = d.querySelector(`[data-lir-add="${type}"]`);
    const lirViewBtn = d.querySelector(`[data-lir-view="${type}"]`);
    const calcToggleBtn = d.querySelector(`[data-calc-toggle="${type}"]`);

    if(lirAddBtn){
      lirAddBtn.addEventListener("click", ()=>{
        openLirPicker(type);
      });
    }

    if(lirViewBtn){
      lirViewBtn.addEventListener("click", ()=>{
        viewLirPhoto(type);
      });
    }

    if(calcToggleBtn){
      calcToggleBtn.addEventListener("click", ()=>{
        openCalc();
      });
    }

    const extrasBox = d.querySelector(`#${type}-EXTRAS`);
    const extras = memoData ? (memoData[type+"-EXTRAS"] || []) : [];
    extras.forEach(ex => extrasBox.appendChild(makeExtraRow(type, ex.key, ex.val)));

    return d;
  }

  function buildSectionsBlank(){
    sections.innerHTML = "";
    if(pickInbound.checked) sections.appendChild(makeSection("INBOUND", null));
    if(pickOutbound.checked) sections.appendChild(makeSection("OUTBOUND", null));
  }

  function rebuildSectionsFromMemo(memoData){
    sections.innerHTML = "";
    if(pickInbound.checked) sections.appendChild(makeSection("INBOUND", memoData));
    if(pickOutbound.checked) sections.appendChild(makeSection("OUTBOUND", memoData));
  }

  function newMemo(){
    editId = null;
    memoDate.value = getViewingDayKey();
    pickInbound.checked = true;
    pickOutbound.checked = true;
    currentLirPhotos = { INBOUND:"", OUTBOUND:"" };
    buildSectionsBlank();
    openModal();
  }

  function openModal(){
    modal.style.display = "flex";
    modal.setAttribute("aria-hidden","false");
    sheet.style.transform = "translateY(0)";
    currentTranslate = 0;
    topControls.style.display = "none";
  }

  function closeModal(){
    modal.style.display = "none";
    modal.setAttribute("aria-hidden","true");
    editId = null;
    activeLirType = null;
    closeCalc();
    if(activeCalcInput) activeCalcInput.classList.remove("focusedCalcTarget");
    topControls.style.display = "flex";
    updateEquipBadge();
  }

  function ensureAtLeastOnePick(changed){
    if(!pickInbound.checked && !pickOutbound.checked){
      changed.checked = true;
      alert("INBOUND OR OUTBOUND SELECT");
      return false;
    }
    return true;
  }

  pickInbound.addEventListener("change", ()=>{
    if(!ensureAtLeastOnePick(pickInbound)) return;
    if(editId){
      const m = memos.find(x=>x.id===editId);
      rebuildSectionsFromMemo(m || null);
    }else{
      buildSectionsBlank();
    }
  });

  pickOutbound.addEventListener("change", ()=>{
    if(!ensureAtLeastOnePick(pickOutbound)) return;
    if(editId){
      const m = memos.find(x=>x.id===editId);
      rebuildSectionsFromMemo(m || null);
    }else{
      buildSectionsBlank();
    }
  });

  function saveMemo(){
    if(!pickInbound.checked && !pickOutbound.checked){
      alert("INBOUND OR OUTBOUND SELECT");
      return;
    }

    const data = { id: editId ?? Date.now(), hasIn:pickInbound.checked, hasOut:pickOutbound.checked };
    data.memoDate = memoDate.value || getViewingDayKey();
    data.dayKey = data.memoDate;

    data.sharedHL = pad(document.querySelector('input[data-k="SHARED-HL"]')?.value || "", 4);
    data.sharedHASH = pad(document.querySelector('input[data-k="SHARED-HASH"]')?.value || "", 3);

    ["INBOUND","OUTBOUND"].forEach(type=>{
      const root = sections.querySelector(`.section[data-type="${type}"]`);

      if(!root){
        data[type+"-7C"] = "";
        data[type+"-STA"] = "";
        data[type+"-STD"] = "";
        data[type+"-t"] = "";
        data[type+"-d"] = "";
        data[type+"-bb"] = "";
        data[type+"-tt"] = "";
        data[type+"-tb"] = "";
        data[type+"-cmpt1"] = "F";
        data[type+"-cmpt2"] = "F";
        data[type+"-cmpt3"] = "";
        data[type+"-cmpt4"] = "";
        data[type+"-note"] = "";
        data[type+"-TIME"] = "";
        data[type+"-EXTRAS"] = [];
        data[type+"-LIRPHOTO"] = currentLirPhotos[type] || "";
        return;
      }

      const gi = (k)=> root.querySelector(`input[data-k="${type}-${k}"]`);
      const cm = (n)=> root.querySelector(`input[data-k="${type}-cmpt${n}"]`);
      const note = root.querySelector(`textarea[data-k="${type}-note"]`);

      data[type+"-7C"] = pad(gi("7C")?.value || "", 4);
      data[type+"-STA"] = type==="INBOUND" ? pad(gi("STA")?.value, 4) : "";
      data[type+"-STD"] = type==="OUTBOUND" ? pad(gi("STD")?.value, 4) : "";
      data[type+"-t"] = pad(gi("t")?.value, 3);
      data[type+"-d"] = pad(gi("d")?.value, 2);
      data[type+"-bb"] = pad(gi("bb")?.value, 2);
      data[type+"-tt"] = type==="OUTBOUND" ? pad(gi("tt")?.value, 4) : "";
      data[type+"-tb"] = type==="OUTBOUND" ? pad(gi("tb")?.value, 4) : "";

      data[type+"-cmpt1"] = defaultF(cm(1)?.value || "");
      data[type+"-cmpt2"] = defaultF(cm(2)?.value || "");
      data[type+"-cmpt3"] = cleanTextUpper(cm(3)?.value || "");
      data[type+"-cmpt4"] = cleanTextUpper(cm(4)?.value || "");
      data[type+"-note"] = note ? (note.value || "") : "";

      const shown = document.getElementById(type+"-TIMESHOWN");
      data[type+"-TIME"] = shown ? normalizeTimeText(shown.textContent || "") : "";

      const extras = [];
      const box = root.querySelector(`#${type}-EXTRAS`);
      if(box){
        [...box.querySelectorAll(".extraRow")].forEach(r=>{
          const key = (r.querySelector("select")?.value || "").toUpperCase();
          const val = pad(r.querySelector("input")?.value || "", 3);
          if(key && val) extras.push({key, val});
        });
      }
      data[type+"-EXTRAS"] = extras;
      data[type+"-LIRPHOTO"] = currentLirPhotos[type] || "";
    });

    if(editId){
      const idx = memos.findIndex(m=>m.id===editId);
      if(idx >= 0) memos[idx] = data;
    }else{
      memos.push(data);
    }

    localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
    dayOffset = calcDayOffsetFromDate(data.memoDate);
    updateDayLabel();
    closeModal();
    renderList(data.id);
  }

  function formatCombinedLine(m){
    const v7cIn = (m["INBOUND-7C"] || "").trim();
    const v7cOut = (m["OUTBOUND-7C"] || "").trim();
    const v7c = v7cIn || v7cOut || "";
    const vhl = (m.sharedHL || "").trim();
    const hash = (m.sharedHASH || "").trim();
    return `7C[${v7c}] HL[${vhl}] #[${hash}]`;
  }

  function formatSplitLine(m, type){
    const v7c = (m[type+"-7C"] || "").trim();
    const vhl = (m.sharedHL || "").trim();
    const hash = (m.sharedHASH || "").trim();

    if(type === "INBOUND"){
      return `7C[${v7c}] HL[${vhl}]`;
    }
    return `7C[${v7c}] #[${hash}]`;
  }

  function renderList(flashId){
    memoList.innerHTML = "";

    const viewingDay = getViewingDayKey();
    const dayMemos = memos
      .filter(m => (m.dayKey || m.memoDate || todayStr()) === viewingDay)
      .sort((a,b)=> Number(a.id) - Number(b.id));

    if(!dayMemos.length){
      memoList.innerHTML = `<div class="emptyDay">NO MEMO IN THIS DAY</div>`;
      return;
    }

    dayMemos.forEach(m=>{
      const hasIn = m.hasIn !== false;
      const hasOut = m.hasOut !== false;

      let linesHtml = "";

      if(hasIn && hasOut){
        linesHtml = `
          <div class="line"><div class="tagPill">IN</div><div class="textPill">${formatSplitLine(m, "INBOUND")}</div></div>
          <div class="line"><div class="tagPill">OUT</div><div class="textPill">${formatSplitLine(m, "OUTBOUND")}</div></div>
        `;
      }else{
        const singleTag = hasIn ? "IN" : "OUT";
        linesHtml = `
          <div class="line"><div class="tagPill">${singleTag}</div><div class="textPill">${formatCombinedLine(m)}</div></div>
        `;
      }

      const card = document.createElement("div");
      card.className = "memoCard" + (m.id===flashId ? " flash" : "");
      card.innerHTML = `
        <div class="memoRow">
          <input class="selBox" type="checkbox" data-id="${m.id}">
          <div class="lines" data-open="${m.id}">
            ${linesHtml}
          </div>
        </div>
        <div class="datePill">${m.memoDate || ""}</div>
      `;
      memoList.appendChild(card);
    });

    memoList.querySelectorAll("[data-open]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const id = Number(el.getAttribute("data-open"));
        editMemo(id);
      });
    });
  }

  function editMemo(id){
    const m = memos.find(x=>x.id===id);
    if(!m) return;

    editId = id;
    memoDate.value = m.memoDate || getViewingDayKey();
    pickInbound.checked = m.hasIn !== false;
    pickOutbound.checked = m.hasOut !== false;
    currentLirPhotos = {
      INBOUND: m["INBOUND-LIRPHOTO"] || "",
      OUTBOUND: m["OUTBOUND-LIRPHOTO"] || ""
    };
    rebuildSectionsFromMemo(m);

    document.querySelectorAll('input[data-k="SHARED-HL"]').forEach(el => el.value = m.sharedHL || "");
    document.querySelectorAll('input[data-k="SHARED-HASH"]').forEach(el => el.value = m.sharedHASH || "");

    openModal();
  }

  function deleteSelected(){
    const checks = document.querySelectorAll('.selBox:checked');
    const ids = [...checks].map(c=>Number(c.dataset.id));
    if(!ids.length){
      alert("SELECT MEMO");
      return;
    }
    memos = memos.filter(m=>!ids.includes(m.id));
    localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
    renderList();
  }

  function addPhoto(){
    photoInput.value = "";
    photoInput.click();
  }

  function loadImageFromFile(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=> resolve(img);
        img.onerror = ()=> reject(new Error("IMAGE LOAD FAIL"));
        img.src = String(reader.result || "");
      };
      reader.onerror = ()=> reject(new Error("FILE READ FAIL"));
      reader.readAsDataURL(file);
    });
  }

  function compressImageToDataUrl(img, maxW = 1600, maxH = 1600, quality = 0.82){
    const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
    const w = Math.max(1, Math.round(img.width * ratio));
    const h = Math.max(1, Math.round(img.height * ratio));

    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext("2d");
    if(!ctx) throw new Error("CANVAS FAIL");
    ctx.drawImage(img, 0, 0, w, h);

    return canvas.toDataURL("image/jpeg", quality);
  }

  async function makeStablePhotoData(file){
    const img = await loadImageFromFile(file);

    const tries = [
      { maxW:1600, maxH:1600, quality:0.82 },
      { maxW:1600, maxH:1600, quality:0.70 },
      { maxW:1440, maxH:1440, quality:0.60 },
      { maxW:1280, maxH:1280, quality:0.52 },
      { maxW:1080, maxH:1080, quality:0.48 }
    ];

    for(const t of tries){
      const dataUrl = compressImageToDataUrl(img, t.maxW, t.maxH, t.quality);
      if(dataUrl.length < 3500000) return dataUrl;
    }

    return compressImageToDataUrl(img, 960, 960, 0.42);
  }

  function syncPhotoFromStorage(forceDraw = false){
    const savedPhoto = localStorage.getItem(PHOTO_KEY) || "";
    photo = savedPhoto;

    if(forceDraw || photoLayer.style.display === "flex"){
      if(photo){
        photoImg.src = photo;
      }else{
        photoImg.removeAttribute("src");
      }
    }
  }

  async function savePhotoFile(file){
    try{
      const stableDataUrl = await makeStablePhotoData(file);
      localStorage.setItem(PHOTO_KEY, stableDataUrl);
      photo = stableDataUrl;
      photoImg.src = stableDataUrl;
      alert("PHOTO SAVED");
    }catch(err){
      console.error(err);
      alert("PHOTO SAVE FAIL");
    }
  }

  async function saveLirPhotoFile(file, type){
    try{
      const stableDataUrl = await makeStablePhotoData(file);
      currentLirPhotos[type] = stableDataUrl;
      alert("LIR PHOTO SAVED");
    }catch(err){
      console.error(err);
      alert("LIR PHOTO SAVE FAIL");
    }
  }

  photoInput.onchange = async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    await savePhotoFile(f);
  };

  lirPhotoInput.onchange = async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f || !activeLirType) return;
    await saveLirPhotoFile(f, activeLirType);
  };

  function openPhoto(){
    syncPhotoFromStorage(true);
    if(!photo) return;
    photoLayer.style.display = "flex";
  }

  function closePhoto(){
    photoLayer.style.display = "none";
  }

  window.addEventListener("pageshow", ()=>{
    syncPhotoFromStorage(true);
  });

  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible"){
      syncPhotoFromStorage(true);
    }
  });

  function openEquip(){
    const eq = JSON.parse(localStorage.getItem(EQUIP_KEY) || "{}");
    tug1.value = pad(eq.tug1,2);
    tug2.value = pad(eq.tug2,2);
    belt.value = pad(eq.belt,2);
    equipModal.style.display = "flex";
    equipModal.setAttribute("aria-hidden","false");
  }

  function closeEquip(){
    equipModal.style.display = "none";
    equipModal.setAttribute("aria-hidden","true");
  }

  function saveEquip(){
    const eq = {
      tug1: pad(tug1.value,2),
      tug2: pad(tug2.value,2),
      belt: pad(belt.value,2)
    };
    localStorage.setItem(EQUIP_KEY, JSON.stringify(eq));
    updateEquipBadge();
    closeEquip();
  }

  function updateEquipBadge(){
    const eq = JSON.parse(localStorage.getItem(EQUIP_KEY) || "{}");
    if(!eq.tug1 && !eq.tug2 && !eq.belt){
      equipBadge.style.display = "none";
      return;
    }
    const t1 = eq.tug1 || "00";
    const t2 = eq.tug2 || "00";
    const b = eq.belt || "00";
    equipBadge.innerHTML = `
      <div class="b1">TUG ${t1}/${t2}</div>
      <div class="b2">BELT ${b}</div>
    `;
    equipBadge.style.display = "block";
  }

  equipModal.addEventListener("click",(e)=>{
    if(e.target === equipModal) closeEquip();
  });

  calcWrap.addEventListener("click", (e)=>{
    if(e.target === calcWrap) closeCalc();
  });

  document.querySelectorAll("[data-global-calc]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const val = btn.dataset.globalCalc || "";

      if(val === "C"){
        globalCalcExpr = "";
        updateGlobalCalcDisplay("0");
        return;
      }

      if(val === "⌫"){
        globalCalcExpr = globalCalcExpr.slice(0, -1);
        updateGlobalCalcDisplay(globalCalcExpr || "0");
        return;
      }

      if(val === "="){
        globalCalcExpr = safeEval(globalCalcExpr);
        updateGlobalCalcDisplay(globalCalcExpr);
        if(globalCalcExpr !== "ERROR"){
          applyCalcToInput(globalCalcExpr);
        }else{
          globalCalcExpr = "";
        }
        return;
      }

      if(globalCalcExpr === "ERROR") globalCalcExpr = "";
      globalCalcExpr += val;
      updateGlobalCalcDisplay(globalCalcExpr);
    });
  });

  let startY = 0;
  let currentTranslate = 0;
  let dragging = false;

  function onStart(y){
    dragging = true;
    startY = y;
    sheet.style.transition = "none";
  }

  function onMove(y){
    if(!dragging) return;
    const dy = Math.max(0, y - startY);
    currentTranslate = dy;
    sheet.style.transform = `translateY(${dy}px)`;
  }

  function onEnd(){
    if(!dragging) return;
    dragging = false;
    sheet.style.transition = "transform .18s ease";
    if(currentTranslate > 140){
      closeModal();
    }else{
      sheet.style.transform = "translateY(0)";
      currentTranslate = 0;
    }
  }

  dragArea.addEventListener("touchstart", (e)=> onStart(e.touches[0].clientY), {passive:true});
  dragArea.addEventListener("touchmove",  (e)=> onMove(e.touches[0].clientY),  {passive:true});
  dragArea.addEventListener("touchend",   ()=> onEnd());

  dragArea.addEventListener("mousedown", (e)=> onStart(e.clientY));
  window.addEventListener("mousemove", (e)=> onMove(e.clientY));
  window.addEventListener("mouseup", ()=> onEnd());

  memoDate.value = getViewingDayKey();
  updateDayLabel();
  renderList();
  updateEquipBadge();
  syncPhotoFromStorage(false);
  updateGlobalCalcDisplay("0");
</script>

  function parseTeamRaw(raw){

    const nums = cleaned.split(/[\/|]/).map(v=>v.trim()).filter(Boolean).map(v=>String(Math.max(1, Math.min(24, parseInt(v,10)||0)))).filter(Boolean);
    if(!nums.length) return {inTeam:'', outTeam:''};
    if(nums.length===1) return {inTeam:nums[0], outTeam:nums[0]};

  }

  async function ensureTesseract(){
    if(window.Tesseract) return;
    await new Promise((resolve,reject)=>{

      document.head.appendChild(s);
    });
  }

  async function getWorker(){
    await ensureTesseract();
    if(!ocrWorker){
      ocrWorker = await Tesseract.createWorker('eng');
      await ocrWorker.setParameters({
        tessedit_pageseg_mode: '6',
        tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz:/|#[]- .'
      });
    }
    return ocrWorker;
  }

  function fileToImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=> resolve(img);
        img.onerror = ()=> reject(new Error('IMAGE LOAD FAIL'));
        img.src = String(reader.result || '');
      };
      reader.onerror = ()=> reject(new Error('FILE READ FAIL'));
      reader.readAsDataURL(file);
    });
  }

  function makeProcessedVariant(img, region){
    const sx = Math.round(img.width * region.x);
    const sy = Math.round(img.height * region.y);
    const sw = Math.max(1, Math.round(img.width * region.w));
    const sh = Math.max(1, Math.round(img.height * region.h));
    const scale = region.scale || 2.4;
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(sw * scale));
    canvas.height = Math.max(1, Math.round(sh * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const d = imgData.data;
    for(let i=0;i<d.length;i+=4){
      let gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      gray = gray < 172 ? 0 : 255;
      d[i]=d[i+1]=d[i+2]=gray;
    }
    ctx.putImageData(imgData,0,0);
    return { url: canvas.toDataURL('image/png'), scale, crop: region };
  }

  function normalizeWordText(v){
    return String(v||'')
      .replace(/[‘’'`]/g,'')
      .replace(/TC(?=\d{4})/gi,'7C')
      .replace(/7G(?=\d{4})/gi,'7C')
      .replace(/HC(?=\d{4})/gi,'HL')
      .replace(/H1(?=\d{4})/gi,'HL')
      .replace(/\|/g,'|')
      .trim();
  }

  function groupWords(words){
    const clean = (words||[])
      .filter(w=>w && w.text && String(w.text).trim())
      .map(w=>{
        const bbox = w.bbox || {};
        return {
          text: normalizeWordText(w.text),
          x0: bbox.x0 || 0,
          x1: bbox.x1 || 0,
          y0: bbox.y0 || 0,
          y1: bbox.y1 || 0,
          cy: ((bbox.y0 || 0) + (bbox.y1 || 0)) / 2,
          h: Math.max(1, (bbox.y1 || 0) - (bbox.y0 || 0))
        };
      })
      .filter(w=>w.text);
    clean.sort((a,b)=> a.cy - b.cy || a.x0 - b.x0);
    const avgH = clean.length ? clean.reduce((s,w)=>s+w.h,0)/clean.length : 18;
    const tol = Math.max(10, avgH * 0.7);
    const lines = [];
    clean.forEach(w=>{
      let line = lines.find(l=> Math.abs(l.cy - w.cy) <= tol);
      if(!line){ line = {cy:w.cy, words:[]}; lines.push(line); }
      line.words.push(w);
      line.cy = (line.cy * (line.words.length-1) + w.cy) / line.words.length;
    });
    lines.forEach(l=> l.words.sort((a,b)=> a.x0 - b.x0));
    lines.sort((a,b)=> a.cy - b.cy);
    return lines.map(l=>({
      y: l.cy,
      text: l.words.map(w=>w.text).join(' ').replace(/\s+/g,' ').trim()
    }));
  }

  function textLinesFallback(text){
    return String(text||'').split(/\n+/).map(v=>v.trim()).filter(Boolean).map((text,idx)=>({y:idx*40,text}));
  }

  function findHash(text){
    const m = text.match(/(?:\d{1,2}[: ]\d{2})\s*[|/]?\s*(\d{1,3})\b/);
    if(m) return onlyNum(m[1],3);
    const nums = text.match(/\b\d{1,3}\b/g) || [];
    return nums.find(v=>v.length<=3) || '';
  }

  function extractTeamRaw(text){
    const m = text.match(/(\d{1,2}\s*[\/|]\s*\d{1,2}|\b\d{1,2}\b)\s*$/);
    if(m) return m[1].replace(/\s+/g,'');
    const m2 = text.match(/\b(\d{1,2}\s*[\/|]\s*\d{1,2})\b/);
    if(m2) return m2[1].replace(/\s+/g,'');
    return '';
  }

  function parseLeftLine(line){
    const text = normalizeWordText(line.text).replace(/\s+/g,' ').trim();
    const flightMatch = text.match(/(?:7C|TC)\s*(\d{4})/i);
    const hash = findHash(text);
    if(!flightMatch && !hash) return null;
    return { y: line.y, inbound7c: flightMatch ? onlyNum(flightMatch[1],4) : '', hash, raw:text };
  }

  function parseRightLine(line){
    const text = normalizeWordText(line.text).replace(/\s+/g,' ').trim();
    const out = text.match(/(?:7C|TC)\s*(\d{4})/i);
    const hl = text.match(/HL\s*(\d{4})/i);
    const teamRaw = extractTeamRaw(text);
    if(!out && !hl && !teamRaw) return null;
    return { y: line.y, outbound7c: out ? onlyNum(out[1],4) : '', hl: hl ? onlyNum(hl[1],4) : '', teamRaw, raw:text };
  }

  function mergeByY(leftRows, rightRows){
    const usedL = new Set();
    const usedR = new Set();
    const merged = [];
    const tol = 28;
    rightRows.forEach((r,ri)=>{
      let best = -1; let bestDiff = 1e9;
      leftRows.forEach((l,li)=>{
        if(usedL.has(li)) return;
        const diff = Math.abs((l.y||0) - (r.y||0));
        if(diff < bestDiff){ bestDiff = diff; best = li; }
      });
      if(best !== -1 && bestDiff <= tol){
        usedL.add(best); usedR.add(ri);
        merged.push({ y:(leftRows[best].y + r.y)/2, ...leftRows[best], ...r });
      }else{
        usedR.add(ri);
        merged.push({ y:r.y, inbound7c:'', hash:'', ...r });
      }
    });
    leftRows.forEach((l,li)=>{
      if(usedL.has(li)) return;
      merged.push({ y:l.y, ...l, outbound7c:'', hl:'', teamRaw:'' });
    });
    merged.sort((a,b)=> (a.y||0) - (b.y||0));
    return merged;
  }

  function sanitizeMergedRows(rows){
    return rows.map(r=>{
      const teams = parseTeamRaw(r.teamRaw || '');
      return {
        line: [r.raw||'', r.rawR||''].filter(Boolean).join(' || '),
        inbound7c: onlyNum(r.inbound7c||'',4),
        outbound7c: onlyNum(r.outbound7c||'',4),
        hl: onlyNum(r.hl||'',4),
        hash: onlyNum(r.hash||'',3),
        teamRaw: r.teamRaw || '',
        inTeam: teams.inTeam,
        outTeam: teams.outTeam,
        y: Math.round(r.y||0)
      };
    }).filter(r=> r.inbound7c || r.outbound7c || r.hl || r.hash || r.teamRaw);
  }

  function createAutoMemo(baseDate, opts){
    const id = Date.now() + Math.floor(Math.random()*100000);
    const m = {
      id,
      memoDate: baseDate,
      dayKey: baseDate,
      hasIn: !!opts.hasIn,
      hasOut: !!opts.hasOut,
      sharedHL: pad(opts.hl || '',4),
      sharedHASH: pad(opts.hash || '',3),
      team: opts.team || '',
      teamLabel: teamLabel(opts.team || ''),
      'INBOUND-7C': pad(opts.inbound7c || '',4),
      'OUTBOUND-7C': pad(opts.outbound7c || '',4),
      'INBOUND-STA':'','OUTBOUND-STD':'',
      'INBOUND-t':'','INBOUND-d':'','INBOUND-bb':'','INBOUND-tt':'','INBOUND-tb':'',
      'OUTBOUND-t':'','OUTBOUND-d':'','OUTBOUND-bb':'','OUTBOUND-tt':'','OUTBOUND-tb':'',
      'INBOUND-cmpt1':'F','INBOUND-cmpt2':'F','INBOUND-cmpt3':'','INBOUND-cmpt4':'','INBOUND-note':'','INBOUND-TIME':'','INBOUND-EXTRAS':[],'INBOUND-LIRPHOTO':'',
      'OUTBOUND-cmpt1':'F','OUTBOUND-cmpt2':'F','OUTBOUND-cmpt3':'','OUTBOUND-cmpt4':'','OUTBOUND-note':'','OUTBOUND-TIME':'','OUTBOUND-EXTRAS':[],'OUTBOUND-LIRPHOTO':''
    };
    return m;
  }

  function dedupeAndAppend(newMemos){
    let added = 0;
    newMemos.forEach(n=>{
      const sig = `${n.dayKey}|${n.team}|${n.hasIn?'1':'0'}|${n.hasOut?'1':'0'}|${n['INBOUND-7C']}|${n['OUTBOUND-7C']}|${n.sharedHL}|${n.sharedHASH}`;
      const exists = memos.some(m=> `${m.dayKey || m.memoDate}|${m.team || ''}|${m.hasIn!==false?'1':'0'}|${m.hasOut!==false?'1':'0'}|${m['INBOUND-7C']||''}|${m['OUTBOUND-7C']||''}|${m.sharedHL||''}|${m.sharedHASH||''}` === sig);
      if(!exists){ memos.push(n); added += 1; }
    });
    if(added) persistAll();
    return added;
  }

  async function recognizeVariant(variant){
    const worker = await getWorker();
    const ret = await worker.recognize(variant.url);
    return ret.data || {};
  }

  async function autoScanFileFlexible(file){
    if(ocrBusy) return;
    ensureTeamUI();
    ocrBusy = true;
    topControls.classList.add('scanBusy');
    setDebug('SCANNING...', '', '', '', true);
    try{
      const img = await fileToImage(file);
      const leftV = makeProcessedVariant(img, {x:0.00, y:0.00, w:0.47, h:1.00, scale:2.8});
      const rightV = makeProcessedVariant(img, {x:0.47, y:0.00, w:0.37, h:1.00, scale:2.8});
      const wholeV = makeProcessedVariant(img, {x:0.00, y:0.00, w:0.84, h:1.00, scale:2.4});

      const [leftData, rightData, wholeData] = await Promise.all([recognizeVariant(leftV), recognizeVariant(rightV), recognizeVariant(wholeV)]);
      const leftLines = groupWords(leftData.words || []);
      const rightLines = groupWords(rightData.words || []);
      const wholeText = [leftData.text||'', rightData.text||'', wholeData.text||''].filter(Boolean).join('\n---\n');

      const parsedLeft = leftLines.map(parseLeftLine).filter(Boolean);
      const parsedRight = rightLines.map(parseRightLine).filter(Boolean);
      let merged = sanitizeMergedRows(mergeByY(parsedLeft, parsedRight));

      // fallback by splitting whole text into lines if not enough
      if(merged.length <= 1){
        const fallbackLines = textLinesFallback(wholeData.text || '');
        const combo = [];
        fallbackLines.forEach(fl=>{
          const text = normalizeWordText(fl.text);
          if(!/(7C|TC|HL|\d{1,2}[\/|]\d{1,2}|\b\d{1,2}\b)/i.test(text)) return;
          combo.push({
            y: fl.y,
            inbound7c: '',
            outbound7c: (text.match(/(?:7C|TC)\s*(\d{4})/i)||[])[1] || '',
            hl: (text.match(/HL\s*(\d{4})/i)||[])[1] || '',
            hash: findHash(text),
            teamRaw: extractTeamRaw(text),
            line:text
          });
        });
        if(combo.length > merged.length) merged = sanitizeMergedRows(combo);
      }

      const baseDate = getViewingDayKey();
      const newMemos = [];
      merged.forEach(r=>{
        if(r.inTeam && r.outTeam && r.inTeam === r.outTeam){
          newMemos.push(createAutoMemo(baseDate, {team:r.inTeam, hasIn:!!r.inbound7c || !!r.hl, hasOut:!!r.outbound7c || !!r.hash, inbound7c:r.inbound7c, outbound7c:r.outbound7c, hl:r.hl, hash:r.hash}));
        }else{
          if(r.inTeam && (r.inbound7c || r.hl || r.hash)) newMemos.push(createAutoMemo(baseDate, {team:r.inTeam, hasIn:true, hasOut:false, inbound7c:r.inbound7c, hl:r.hl, hash:r.hash}));
          if(r.outTeam && (r.outbound7c || r.hl || r.hash)) newMemos.push(createAutoMemo(baseDate, {team:r.outTeam, hasIn:false, hasOut:true, outbound7c:r.outbound7c, hl:r.hl, hash:r.hash}));
          if(!r.inTeam && !r.outTeam && (r.outbound7c || r.hl || r.hash)) newMemos.push(createAutoMemo(baseDate, {team:(getQuickTeamSelect()?.value || ''), hasIn:false, hasOut:true, outbound7c:r.outbound7c, hl:r.hl, hash:r.hash}));
        }
      });
      const added = dedupeAndAppend(newMemos);
      renderList();
      setDebug(`ADDED ${added} MEMOS`, wholeText, merged.map((r,i)=> `${i+1}. ${r.line || [r.inbound7c,r.outbound7c,r.hl,r.hash,r.teamRaw].filter(Boolean).join(' / ')}`).join('\n'), merged.map((r,i)=> `${i+1}. ${JSON.stringify(r)}`).join('\n'), true);
    }catch(err){
      console.error(err);
      setDebug(`AUTO SCAN FAIL: ${err && err.message ? err.message : 'UNKNOWN'}`, '', '', '', true);
    }finally{
      ocrBusy = false;
      topControls.classList.remove('scanBusy');
    }
  }

  const _oldPhotoOnChange = photoInput.onchange;
  photoInput.onchange = async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    await savePhotoFile(f);
    await autoScanFileFlexible(f);
  };

  ensureTeamUI();
  renderList();
})();
</script>

</body>
