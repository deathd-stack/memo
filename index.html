<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JAS MEMO VER 2</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system;
  background:#ff9f1c;
  font-weight:600;
}
header{
  text-align:center;
  padding:18px;
  font-size:2.2rem;
  font-weight:900;
  cursor:pointer;
}
.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:10px;
}
button{
  padding:10px 16px;
  border:none;
  border-radius:12px;
  background:#fff;
  font-weight:900;
  font-size:1.1rem;
}
#memoList{padding:12px;}
.memo{
  background:#fff;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  gap:10px;
}
.memo-title{
  font-weight:900;
  cursor:pointer;
  line-height:1.5;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}
.box{
  background:#fff;
  width:95%;
  max-height:90vh;
  overflow:auto;
  border-radius:16px;
  padding:16px;
}
.row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:6px;
  flex-wrap:wrap;
}
input{
  width:70px;
  font-weight:800;
}
input[data-long]{width:260px}
.section{margin-top:16px}
.section-title{
  display:flex;
  justify-content:space-between;
  font-weight:900;
}
.time{
  color:red;
  cursor:pointer;
}
textarea{
  width:100%;
  height:70px;
  font-weight:700;
}
</style>
</head>

<body>

<header>JAS MEMO VER 2</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
</div>

<div id="memoList"></div>

<div class="modal" id="modal">
<div class="box">

<div class="row" style="justify-content:center">
  <input type="checkbox" id="inChk"> INBOUND
  <span style="width:30px"></span>
  <input type="checkbox" id="outChk"> OUTBOUND
</div>

<div id="sections"></div>

<div class="row">
  <button onclick="saveMemo()">SAVE</button>
  <button onclick="closeModal()">CLOSE</button>
</div>

</div>
</div>

<script>
const modal = document.getElementById("modal");
const sections = document.getElementById("sections");
const memoList = document.getElementById("memoList");
let memos = JSON.parse(localStorage.getItem("jas_memos")||"[]");
let editId=null;

function now(){
  const d=new Date();
  return d.toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit"});
}

function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";
}
function closeModal(){ modal.style.display="none"; }

inChk.onchange = outChk.onchange = renderSections;

function renderSections(){
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND"));
  if(outChk.checked) sections.append(makeSection("OUTBOUND"));
}

function makeSection(type){
  const d=document.createElement("div");
  d.className="section";
  d.innerHTML=`
  <div class="section-title">
    ${type}
    <span class="time" data-k="${type}-time"
      onclick="this.textContent=now()">--:--</span>
  </div>

  <div class="row">
    7C <input data-k="${type}-c7">
    HL <input data-k="HL">
    T <input data-k="${type}-T">
    D <input data-k="${type}-D">
    BB <input data-k="${type}-BB">
    C <input data-k="${type}-C">
    W <input data-k="${type}-W">
    COB <input data-k="${type}-COB">
  </div>

  ${[1,2,3,4].map(i=>`
    <div class="row">
      CMPT ${i}
      <input data-long data-k="${type}-cmpt${i}" value="${i<=2?'F':''}">
    </div>`).join("")}

  <textarea data-k="${type}-note" placeholder="특이사항"></textarea>
  `;
  return d;
}

document.addEventListener("input",e=>{
  if(e.target.dataset.k==="HL"){
    document.querySelectorAll('[data-k="HL"]').forEach(i=>{
      if(i!==e.target) i.value=e.target.value;
    });
  }
});

function saveMemo(){
  const data={id:editId??Date.now()};
  document.querySelectorAll("[data-k]").forEach(i=>{
    data[i.dataset.k]=i.value || i.textContent;
  });
  editId
    ? memos[memos.findIndex(m=>m.id===editId)]=data
    : memos.push(data);
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal(); renderList();
}

function renderList(){
  memoList.innerHTML="";
  memos.forEach((m,i)=>{
    memoList.innerHTML+=`
    <div class="memo">
      <input type="checkbox">
      <div class="memo-title" onclick="editMemo(${m.id})">
        ${m["INBOUND-c7"]?`IN 7C[${m["INBOUND-c7"]}] HL[${m.HL||""}]`:""}<br>
        ${m["OUTBOUND-c7"]?`OUT 7C[${m["OUTBOUND-c7"]}]`:""}
      </div>
    </div>`;
  });
}

function editMemo(id){
  editId=id;
  const m=memos.find(x=>x.id===id);
  modal.style.display="flex";
  inChk.checked=!!m["INBOUND-c7"];
  outChk.checked=!!m["OUTBOUND-c7"];
  renderSections();
  document.querySelectorAll("[data-k]").forEach(i=>{
    if(i.tagName==="SPAN") i.textContent=m[i.dataset.k]||"--:--";
    else i.value=m[i.dataset.k]||i.value||"";
  });
}

function deleteSelected(){
  const c=[...document.querySelectorAll(".memo input")];
  memos=memos.filter((_,i)=>!c[i].checked);
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

renderList();
</script>

</body>
</html>
