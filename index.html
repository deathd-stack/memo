 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JAS MEMO VER 2</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#ff9f1c url("jas-bg.png") center/cover no-repeat fixed;
  font-weight:600;
  -webkit-tap-highlight-color:transparent;
}

header{
  text-align:center;
  padding:22px;
  font-size:2.6rem;
  font-weight:900;
  cursor:pointer;
}

.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:16px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:18px;
  background:#fff;
  font-weight:900;
  font-size:1.1rem;
  transition:.2s;
}
button:active{transform:scale(.92);}

#memoList{padding:14px;}

.memo{
  background:#fff;
  border-radius:20px;
  padding:14px;
  margin-bottom:14px;
  display:flex;
  gap:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:flex-end;
}

.box{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:28px 28px 0 0;
  padding:18px;
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
  flex-wrap:wrap;
}

input{
  width:60px;
  font-weight:800;
  font-size:1.05rem;
  border-radius:10px;
  border:1px solid #ccc;
  padding:6px;
}

input[data-long]{width:100%;}

.section{
  margin-top:18px;
  padding:12px;
  border-radius:16px;
  background:#f7f7f7;
}

.section-title{
  display:flex;
  justify-content:space-between;
  font-weight:900;
  margin-bottom:8px;
}

.time{
  color:red;
  font-weight:900;
  cursor:pointer;
}

textarea{
  width:100%;
  height:80px;
  border-radius:14px;
  border:1px solid #ccc;
  padding:8px;
  font-weight:700;
}

#photoLayer{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}
#photoLayer img{
  max-width:100%;
  max-height:100%;
}
</style>
</head>

<body>

<header onclick="openPhoto()">JAS MEMO VER 2</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<div class="modal" id="modal">
<div class="box">

  <div class="row" style="justify-content:center">
    <input type="checkbox" id="inChk"> INBOUND
    <span style="width:30px"></span>
    <input type="checkbox" id="outChk"> OUTBOUND
  </div>

  <div id="sections"></div>

  <div class="row">
    <button onclick="saveMemo()">SAVE</button>
    <button onclick="closeModal()">CLOSE</button>
  </div>

</div>
</div>

<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg">
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const photoInput=document.getElementById("photoInput");
const photoLayer=document.getElementById("photoLayer");
const photoImg=document.getElementById("photoImg");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let editId=null;
let photo=localStorage.getItem("jas_photo");

function now(){
  return new Date().toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit"});
}

function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";
}

function closeModal(){ modal.style.display="none"; }

inChk.onchange=outChk.onchange=renderSections;

function renderSections(){
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND"));
  if(outChk.checked) sections.append(makeSection("OUTBOUND"));
}

function makeSection(type){
  const d=document.createElement("div");
  d.className="section";
  d.innerHTML=`
    <div class="section-title">
      ${type}
      <span class="time"
        onclick="this.textContent=now()"
        ondblclick="this.textContent=prompt('TIME',this.textContent)||this.textContent"
        data-k="${type}-time">--:--</span>
    </div>

    <div class="row">
      7C <input data-k="${type}-c7">
      HL <input data-k="HL" inputmode="numeric">
      # <input data-k="HASH" inputmode="numeric">
    </div>

    ${[1,2,3,4].map(i=>`
      <div class="row">
        CMPT ${i}
        <input data-long data-k="${type}-cmpt${i}" value="${i<=2?'F':''}">
      </div>`).join("")}

    <textarea data-k="${type}-note" placeholder="특이사항 (${type})"></textarea>
  `;
  return d;
}

/* 숫자만 허용 + HL/# 공유 */
document.addEventListener("input",e=>{
  const key=e.target.dataset.k;

  if(key==="HL" || key==="HASH"){
    // 숫자만 남기기
    e.target.value=e.target.value.replace(/[^0-9]/g,'');

    // 공유
    document.querySelectorAll(`[data-k="${key}"]`)
      .forEach(i=>{ if(i!==e.target) i.value=e.target.value; });
  }
});

function saveMemo(){
  const data={id:editId??Date.now()};
  document.querySelectorAll("[data-k]").forEach(i=>{
    data[i.dataset.k]=i.value||i.textContent;
  });
  editId
    ? memos[memos.findIndex(m=>m.id===editId)]=data
    : memos.push(data);
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal(); renderList();
}

function renderList(){
  memoList.innerHTML="";
  memos.forEach(m=>{
    memoList.innerHTML+=`
      <div class="memo">
        <input type="checkbox">
        <div class="memo-title" onclick="editMemo(${m.id})">
          IN 7C[${m["INBOUND-c7"]||""}] HL[${m.HL||""}] #[${m.HASH||""}]
        </div>
      </div>`;
  });
}

function editMemo(id){
  editId=id;
  const m=memos.find(x=>x.id===id);
  modal.style.display="flex";
  inChk.checked=!!m["INBOUND-c7"];
  outChk.checked=!!m["OUTBOUND-c7"];
  renderSections();
  document.querySelectorAll("[data-k]").forEach(i=>{
    if(i.tagName==="SPAN") i.textContent=m[i.dataset.k]||"--:--";
    else i.value=m[i.dataset.k]||"";
  });
}

function deleteSelected(){
  const c=[...document.querySelectorAll(".memo input")];
  memos=memos.filter((_,i)=>!c[i].checked);
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

function addPhoto(){ photoInput.click(); }
photoInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    photo=r.result;
    localStorage.setItem("jas_photo",photo);
  };
  r.readAsDataURL(f);
};

function openPhoto(){
  if(!photo) return;
  photoImg.src=photo;
  photoLayer.style.display="flex";
}
function closePhoto(){ photoLayer.style.display="none"; }

renderList();
</script>

</body>
</html>
