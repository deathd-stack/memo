I<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JAS MEMO VER 2</title>

<style>
body{margin:0;font-family:-apple-system;background:#ff9f1c;font-weight:600;}
header{text-align:center;padding:22px;font-size:2.4rem;font-weight:900;cursor:pointer;}

.controls{display:flex;justify-content:center;gap:14px;margin-bottom:12px;}
button{padding:8px 14px;border:none;border-radius:14px;background:#fff;font-weight:900;}

/* 컴팩트 카드 */
.memo{
  background:#fff;
  margin:8px 10px;
  padding:10px 12px;
  border-radius:14px;
  box-shadow:0 3px 8px rgba(0,0,0,.12);
  font-size:14px;
  line-height:1.35;
}
.memo.flash{animation:flash .5s;}
@keyframes flash{50%{background:#ffe8b5;transform:scale(1.02);}}

.check-line{
  display:flex;
  justify-content:center;
  gap:14px;
  align-items:center;
  margin-bottom:12px;
  white-space:nowrap;
}
.check-line label{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  font-weight:900;
}

.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:flex-end;
}
.box{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:24px 24px 0 0;
  padding:16px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:nowrap;
  margin-bottom:8px;
  align-items:center;
  white-space:nowrap;
}

input{
  padding:6px 8px;
  font-weight:900;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px; /* iOS 자동 줌 방지 */
  box-sizing:border-box;
}

input[data-4]{width:72px;text-align:center;}
input[data-3]{width:62px;text-align:center;}
input[data-2]{width:54px;text-align:center;}
input[data-long]{flex:1;text-align:left;padding-left:10px;}

.section{
  background:#f7f7f7;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

/* 섹션 헤더 + TIME */
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}
.section-title{
  font-size:14px;
  font-weight:900;
}
.time-pack{
  display:flex;
  align-items:center;
  gap:10px;
}
.time-btn{
  font-weight:900;
  font-size:13px;
  cursor:pointer;
  user-select:none;
}
.time-red{
  color:red;
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
}

textarea{
  width:100%;
  height:60px;
  border-radius:10px;
  padding:8px;
  border:1px solid #ccc;
  font-size:16px;
  font-weight:700;
  box-sizing:border-box;
}

.smallbtn{
  padding:8px 12px;
  border-radius:12px;
  font-weight:900;
}

/* EXTRA */
.extra-wrap{
  margin-top:8px;
  background:#fff;
  border-radius:10px;
  padding:8px;
  border:1px solid #e6e6e6;
}
.extra-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.extra-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;   /* ✅ 한 줄에 두 칸 */
  gap:10px;
}
.extra-row{
  display:flex;
  gap:8px;
  align-items:center;
  background:#fafafa;
  border:1px solid #eee;
  border-radius:10px;
  padding:8px;
}
.extra-row select{
  height:34px;
  font-size:14px;
  font-weight:900;
  border-radius:8px;
  border:1px solid #ccc;
  padding:0 8px;
  width:92px;
  flex:0 0 auto;
}
.extra-row input{
  height:34px;
  flex:1;
  min-width:0;
}

/* 사진 */
#photoLayer{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
}
#photoLayer img{
  max-width:100%;
  max-height:100%;
}

/* EQUIPMENT 버튼(왼쪽 아래) */
#equipBtn{
  position:fixed;
  left:10px;
  bottom:12px;
  z-index:50;
  background:#fff;
  border:none;
  border-radius:14px;
  padding:10px 14px;
  font-weight:900;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

/* ✅ 장비 배지: 오른쪽 아래 + 메인에서만 */
#equipBadge{
  position:fixed;
  right:10px;
  bottom:12px;
  z-index:60;
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
  line-height:1.3;
  min-width:110px;
  text-align:right;
  display:none;
}

/* EQUIPMENT 모달 */
#equipModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:80;
}
#equipBox{
  background:#fff;
  width:100%;
  max-height:70vh;
  overflow:auto;
  border-radius:24px 24px 0 0;
  padding:16px;
}
.equipRow{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
  white-space:nowrap;
}
.equipRow b{min-width:70px;}
</style>
</head>

<body>

<header ondblclick="openPhoto()">JAS MEMO VER 2</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<!-- ✅ 메인에서만 보이는 장비 표시 -->
<div id="equipBadge"></div>
<button id="equipBtn" onclick="openEquip()">EQUIPMENT</button>

<!-- 메모 모달 -->
<div class="modal" id="modal">
  <div class="box">

    <div class="check-line">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div id="sections"></div>

    <div class="row">
      <button class="smallbtn" onclick="saveMemo()">SAVE</button>
      <button class="smallbtn" onclick="closeModal()">CLOSE</button>
    </div>

  </div>
</div>

<!-- 사진 레이어 -->
<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg">
</div>

<!-- 장비 모달 -->
<div id="equipModal" ondblclick="closeEquip()">
  <div id="equipBox" onclick="event.stopPropagation()">
    <div style="font-weight:900;font-size:16px;margin-bottom:12px;">EQUIPMENT</div>

    <div class="equipRow">
      <b>TUG</b>
      <input id="tug1" data-2 inputmode="numeric" placeholder="00" maxlength="2">
      <input id="tug2" data-2 inputmode="numeric" placeholder="00" maxlength="2">
    </div>

    <div class="equipRow">
      <b>BELT</b>
      <input id="belt" data-2 inputmode="numeric" placeholder="00" maxlength="2">
    </div>

    <div class="row">
      <button class="smallbtn" onclick="saveEquip()">SAVE</button>
      <button class="smallbtn" onclick="closeEquip()">CLOSE</button>
    </div>
  </div>
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const photoInput=document.getElementById("photoInput");
const photoLayer=document.getElementById("photoLayer");
const photoImg=document.getElementById("photoImg");
const inChk=document.getElementById("inChk");
const outChk=document.getElementById("outChk");

const equipBadge=document.getElementById("equipBadge");
const equipModal=document.getElementById("equipModal");
const tug1=document.getElementById("tug1");
const tug2=document.getElementById("tug2");
const belt=document.getElementById("belt");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let photo=localStorage.getItem("jas_photo");
let editId=null;

/* ===== util ===== */
function onlyNum(val,len){
  return (val||"").replace(/[^0-9]/g,'').slice(0,len);
}
function pad(val,len){
  const v=onlyNum(val,len);
  return v ? v.padStart(len,"0") : "";
}
function nowTime(){
  const d=new Date();
  return d.getHours().toString().padStart(2,"0")+":"+
         d.getMinutes().toString().padStart(2,"0");
}

/* ===== 입력 제한 ===== */
document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(!k) return;

  if(k.endsWith("-c7")) e.target.value=onlyNum(e.target.value,4);
  if(k.endsWith("-HL")) e.target.value=onlyNum(e.target.value,4);
  if(k.endsWith("-HASH")) e.target.value=onlyNum(e.target.value,3);

  if(k.endsWith("-t")) e.target.value=onlyNum(e.target.value,3);
  if(k.endsWith("-d")) e.target.value=onlyNum(e.target.value,2);
  if(k.endsWith("-bb")) e.target.value=onlyNum(e.target.value,2);

  if(k.endsWith("-tt")) e.target.value=onlyNum(e.target.value,4);
  if(k.endsWith("-tb")) e.target.value=onlyNum(e.target.value,4);

  if(k.startsWith("extraVal-")) e.target.value=onlyNum(e.target.value,3);

  /* ✅ HL/# 공유(동기화) 복구 */
  if(k.endsWith("-HL")){
    const other = k.startsWith("INBOUND") ? "OUTBOUND-HL" : "INBOUND-HL";
    const el = document.querySelector(`[data-k="${other}"]`);
    if(el) el.value = e.target.value;
  }
  if(k.endsWith("-HASH")){
    const other = k.startsWith("INBOUND") ? "OUTBOUND-HASH" : "INBOUND-HASH";
    const el = document.querySelector(`[data-k="${other}"]`);
    if(el) el.value = e.target.value;
  }
});

/* ===== EXTRA ===== */
const EXTRA_KEYS = ["W","C","COB","STRAP","GB","TS","EMS"];

function makeExtraRow(type, key="", val=""){
  const row=document.createElement("div");
  row.className="extra-row";
  row.innerHTML=`
    <select data-extra-type="${type}">
      ${EXTRA_KEYS.map(k=>`<option value="${k}" ${k===key?"selected":""}>${k}</option>`).join("")}
    </select>
    <input data-3 inputmode="numeric" maxlength="3" placeholder="000" data-k="extraVal-${type}" value="${onlyNum(val,3)}">
    <button type="button" class="smallbtn" onclick="this.closest('.extra-row').remove()">-</button>
  `;
  return row;
}
function addExtraRow(type){
  const box=document.getElementById(type+"-EXTRAS");
  if(!box) return;
  box.appendChild(makeExtraRow(type,"W",""));
}

/* ===== 섹션 생성 ===== */
function makeSection(type, memoData){
  const d=document.createElement("div");
  d.className="section";

  const savedTime = memoData ? (memoData[type+"-TIME"]||"") : "";

  // ✅ 새 메모 기본값: CMPT1/2 = F (IN/OUT 둘 다)
  const def1 = memoData ? (memoData[type+"-cmpt1"]||"") : "F";
  const def2 = memoData ? (memoData[type+"-cmpt2"]||"") : "F";
  const def3 = memoData ? (memoData[type+"-cmpt3"]||"") : "";
  const def4 = memoData ? (memoData[type+"-cmpt4"]||"") : "";

  d.innerHTML=`
    <div class="section-head">
      <div class="section-title">${type}</div>
      <div class="time-pack">
        <div class="time-btn" id="${type}-TIMEBTN">TIME</div>
        <div class="time-red" id="${type}-TIMESHOWN"></div>
      </div>
    </div>

    <div class="row">
      7C <input data-4 inputmode="numeric" data-k="${type}-c7" maxlength="4" placeholder="0000">
      HL <input data-4 inputmode="numeric" data-k="${type}-HL" maxlength="4" placeholder="0000">
      # <input data-3 inputmode="numeric" data-k="${type}-HASH" maxlength="3" placeholder="000">
    </div>

    ${[1,2,3,4].map(i=>{
      const v = i===1?def1 : i===2?def2 : i===3?def3 : def4;
      return `
      <div class="row">
        CMPT ${i}
        <input data-long data-k="${type}-cmpt${i}" placeholder="TEXT" value="${(v||"").replace(/"/g,'&quot;')}">
      </div>`;
    }).join("")}

    <!-- ✅ T/D/BB : CMPT 4 아래로 이동 -->
    <div class="row">
      T <input data-3 inputmode="numeric" data-k="${type}-t" maxlength="3" placeholder="000">
      D <input data-2 inputmode="numeric" data-k="${type}-d" maxlength="2" placeholder="00">
      BB <input data-2 inputmode="numeric" data-k="${type}-bb" maxlength="2" placeholder="00">
    </div>

    ${type==="OUTBOUND" ? `
      <div class="row">
        T/T <input data-4 inputmode="numeric" data-k="${type}-tt" maxlength="4" placeholder="0000">
        T/B <input data-4 inputmode="numeric" data-k="${type}-tb" maxlength="4" placeholder="0000">
      </div>
    ` : ""}

    <div class="extra-wrap">
      <div class="extra-head">
        <div style="font-weight:900;">EXTRA</div>
        <button type="button" class="smallbtn" onclick="addExtraRow('${type}')">+</button>
      </div>
      <div class="extra-grid" id="${type}-EXTRAS"></div>
    </div>

    <textarea data-k="${type}-note" placeholder="NOTE (${type})"></textarea>
  `;

  // TIME 표시/버튼
  const btn = d.querySelector(`#${type}-TIMEBTN`);
  const shown = d.querySelector(`#${type}-TIMESHOWN`);
  shown.textContent = savedTime || "";

  btn.onclick = ()=>{
    shown.textContent = nowTime();
  };
  btn.ondblclick = ()=>{
    const cur = shown.textContent || nowTime();
    const t = prompt("TIME (HH:MM 24H)", cur);
    if(t) shown.textContent = t;
  };

  // 기존 데이터 채우기(기본 필드)
  if(memoData){
    const set=(key,val)=>{
      const el=d.querySelector(`[data-k="${type}-${key}"]`);
      if(el) el.value = val || "";
    };
    set("c7", memoData[type+"-c7"]);
    set("HL", memoData[type+"-HL"]);
    set("HASH", memoData[type+"-HASH"]);
    set("t", memoData[type+"-t"]);
    set("d", memoData[type+"-d"]);
    set("bb", memoData[type+"-bb"]);
    if(type==="OUTBOUND"){
      set("tt", memoData[type+"-tt"]);
      set("tb", memoData[type+"-tb"]);
    }
    const note=d.querySelector(`[data-k="${type}-note"]`);
    if(음표) note.value = memoData[type+"-note"] || "";

    // EXTRAS 복원
    const extrasBox = d.querySelector(`#${type}-EXTRAS`);
    const extras = memoData[type+"-EXTRAS"] || [];
    extras.forEach(ex=>{
      extrasBox.appendChild(makeExtraRow(type, ex.key, ex.val));
    });
  }

  return d;
}

/* 체크 변경 -> 섹션 렌더 */
inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND", null));
  if(outChk.checked) sections.append(makeSection("OUTBOUND", null));
};

/* ===== 메모 추가/닫기 ===== */
function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";
}
function closeModal(){
  modal.style.display="none";
  editId=null;
}

/* ===== 저장 ===== */
function saveMemo(){
  const data={id:editId??Date.now()};

  data.hasIn=inChk.checked;
  data.hasOut=outChk.checked;

  ["INBOUND","OUTBOUND"].forEach(type=>{
    if(!(type==="INBOUND"?data.hasIn:data.hasOut)) return;

    const q=(k)=>document.querySelector(`[data-k="${type}-${k}"]`);

    data[type+"-c7"]=pad(q("c7")?.value,4);
    data[type+"-HL"]=pad(q("HL")?.value,4);
    data[type+"-HASH"]=pad(q("HASH")?.value,3);

    data[type+"-t"]=pad(q("t")?.value,3);
    data[type+"-d"]=pad(q("d")?.value,2);
    data[type+"-bb"]=pad(q("bb")?.value,2);

    [1,2,3,4].forEach(i=>{
      data[type+`-cmpt${i}`]=q(`cmpt${i}`)?.value || "";
    });

    if(type==="OUTBOUND"){
      data[type+"-tt"]=pad(q("tt")?.value,4);
      data[type+"-tb"]=pad(q("tb")?.value,4);
    }

    data[type+"-note"]=q("note")?.value || "";

    const tShown = document.getElementById(type+"-TIMESHOWN");
    data[type+"-TIME"]=tShown ? (tShown.textContent||"") : "";

    // EXTRAS
    const extras=[];
    const box=document.getElementById(type+"-EXTRAS");
    if(box){
      [...box.querySelectorAll(".extra-row")].forEach(r=>{
        const key = r.querySelector("select")?.value || "";
        const val = onlyNum(r.querySelector("input")?.value,3);
        if(key && val) extras.push({key, val:val.padStart(3,"0")});
      });
    }
    data[type+"-EXTRAS"]=extras;
  });

  // ✅ HL/# 공유 저장: 한쪽만 체크해도 값이 있으면 반대쪽에도 같이 복사(데이터 일관성)
  if(data.hasIn && !data.hasOut){
    data["OUTBOUND-HL"] = data["INBOUND-HL"] || "";
    data["OUTBOUND-HASH"] = data["INBOUND-HASH"] || "";
  }
  if(data.hasOut && !data.hasIn){
    data["INBOUND-HL"] = data["OUTBOUND-HL"] || "";
    data["INBOUND-HASH"] = data["OUTBOUND-HASH"] || "";
  }

  if(editId){
    memos[memos.findIndex(m=>m.id===editId)] = data;
  }else{
    memos.push(data);
  }

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal();
  renderList(data.id);
}

/* ===== 리스트 출력 ===== */
function renderList(flashId){
  memoList.innerHTML="";
  memos.forEach(m=>{
    const div=document.createElement("div");
    div.className="memo";
    if(m.id===flashId) div.classList.add("flash");

    let content="";

    if(m.hasIn && m.hasOut){
      content += `<div><b>IN</b> 7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}]</div>`;
      content += `<div><b>OUT</b> 7C[${m["OUTBOUND-c7"]||""}] #[${m["OUTBOUND-HASH"]||""}]</div>`;
    }else if(m.hasIn){
      content += `<div><b>IN</b> 7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}] #[${m["INBOUND-HASH"]||""}]</div>`;
    }else if(m.hasOut){
      content += `<div><b>OUT</b> 7C[${m["OUTBOUND-c7"]||""}] HL[${m["OUTBOUND-HL"]||""}] #[${m["OUTBOUND-HASH"]||""}]</div>`;
    }else{
      content += `<div>(EMPTY)</div>`;
    }

    div.innerHTML=`
      <div style="display:flex;gap:8px;align-items:flex-start;">
        <input type="checkbox" data-id="${m.id}" style="margin-top:3px;">
        <div style="flex:1;cursor:pointer;" onclick="editMemo(${m.id})">
          ${content}
        </div>
      </div>
    `;
    memoList.appendChild(div);
  });
}

/* ===== 수정(불러오기) ===== */
function editMemo(id){
  const m=memos.find(x=>x.id===id);
  if(!m) return;
  editId=id;

  modal.style.display="flex";
  inChk.checked=!!m.hasIn;
  outChk.checked=!!m.hasOut;

  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND", m));
  if(outChk.checked) sections.append(makeSection("OUTBOUND", m));

  // TIME 값 표시 보정
  setTimeout(()=>{
    ["INBOUND","OUTBOUND"].forEach(type=>{
      const shown=document.getElementById(type+"-TIMESHOWN");
      if(shown) shown.textContent = m[type+"-TIME"] || "";
    });
  },20);
}

/* ===== 삭제 ===== */
function deleteSelected(){
  const checks=document.querySelectorAll('.memo input[type="checkbox"]:checked');
  const ids=[...checks].map(c=>Number(c.dataset.id));
  memos=memos.filter(m=>!ids.includes(m.id));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

/* ===== 사진 ===== */
function addPhoto(){photoInput.click();}
photoInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    photo=r.result;
    localStorage.setItem("jas_photo",photo);
  };
  r.readAsDataURL(f);
};
function openPhoto(){if(!photo)return;photoImg.src=photo;photoLayer.style.display="flex";}
function closePhoto(){photoLayer.style.display="none";}

/* ===== EQUIPMENT ===== */
function openEquip(){
  const eq=JSON.parse(localStorage.getItem("jas_equipment")||"{}");
  tug1.value=pad(eq.tug1,2);
  tug2.value=pad(eq.tug2,2);
  belt.value=pad(eq.belt,2);
  equipModal.style.display="flex";
}
function closeEquip(){equipModal.style.display="none";}
function saveEquip(){
  const eq={
    tug1: pad(tug1.value,2),
    tug2: pad(tug2.value,2),
    belt: pad(belt.value,2)
  };
  localStorage.setItem("jas_equipment",JSON.stringify(eq));
  updateEquipBadge();
  closeEquip();
}
function updateEquipBadge(){
  const eq=JSON.parse(localStorage.getItem("jas_equipment")||"{}");
  if(!eq.tug1 && !eq.tug2 && !eq.belt){
    equipBadge.style.display="none";
    return;
  }
  equipBadge.innerHTML = `TUG ${eq.tug1||"00"}/${eq.tug2||"00"}<br>BELT ${eq.belt||"00"}`;
  equipBadge.style.display="block";
}

/* init */
renderList();
updateEquipBadge();
</script>

</body>
</html>
