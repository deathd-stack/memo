<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 메모</title>

<style>
body{
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding:15px;
  background:#f2f2f2;
}

.section{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

input[type="number"]{
  width:100%;
  padding:12px;
  font-size:18px;
  margin-top:5px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

label{
  font-weight:600;
  display:block;
  margin-top:10px;
}

button{
  width:100%;
  padding:14px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:white;
  margin-top:10px;
}

button.save-animate{
  background:#34c759;
  transform:scale(1.05);
  transition:0.3s;
}

textarea{
  width:100%;
  height:90px;
  font-size:16px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.row{
  display:flex;
  gap:10px;
}

.row input{
  flex:1;
}

.hidden{
  display:none;
}

img{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="section">
<label><input type="checkbox" id="inbound"> INBOUND</label>
<label><input type="checkbox" id="outbound" onchange="toggleOutbound()"> OUTBOUND</label>

<label>7C (4자리)</label>
<input type="number" id="sevenC" maxlength="4">

<label>HL (4자리)</label>
<input type="number" id="hl" maxlength="4">

<label># (3자리)</label>
<input type="number" id="hashNum" maxlength="3">
</div>

<div class="section" id="cmpt4">
<h3>CMPT 4</h3>

<div class="row">
<label><input type="checkbox"> T</label>
<label><input type="checkbox"> D</label>
<label><input type="checkbox"> BB</label>
</div>

<div class="row">
<label><input type="checkbox"> W</label>
<label><input type="checkbox"> C</label>
<label><input type="checkbox"> COB</label>
</div>

<div id="tttb" class="hidden">
<div class="row">
<label><input type="checkbox"> T/T</label>
<label><input type="checkbox"> T/B</label>
</div>
</div>
</div>

<div class="section">
<label>메모</label>
<textarea id="memo"></textarea>
<div id="saveTime" style="margin-top:5px;color:#666;font-size:14px;"></div>
<button id="saveBtn" onclick="saveData()">저장</button>
</div>

<div class="section">
<label>사진</label>
<input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event)">
<img id="preview">
</div>

<script>
function toggleOutbound(){
  const outbound=document.getElementById("outbound").checked;
  document.getElementById("tttb").classList.toggle("hidden",!outbound);
}

function padInput(id,length){
  const el=document.getElementById(id);
  el.value=el.value.replace(/\D/g,'').slice(0,length);
}

document.getElementById("sevenC").addEventListener("input",()=>padInput("sevenC",4));
document.getElementById("hl").addEventListener("input",()=>padInput("hl",4));
document.getElementById("hashNum").addEventListener("input",()=>padInput("hashNum",3));

function generateMemo(){
  const inbound=document.getElementById("inbound").checked;
  const outbound=document.getElementById("outbound").checked;

  const sevenC=document.getElementById("sevenC").value.padStart(4,"0");
  const hl=document.getElementById("hl").value.padStart(4,"0");
  const hash=document.getElementById("hashNum").value.padStart(3,"0");

  let memoText="";

  if(inbound && outbound){
    memoText=`IN 7C ${sevenC} HL ${hl}\nOUT 7C ${sevenC} # ${hash}`;
  }
  else if(inbound){
    memoText=`IN 7C ${sevenC} HL ${hl} # ${hash}`;
  }
  else if(outbound){
    memoText=`OUT 7C ${sevenC} HL ${hl} # ${hash}`;
  }

  document.getElementById("memo").value=memoText;
}

function saveData(){
  generateMemo();

  const now=new Date();
  const timeString=
  now.getFullYear()+"-"+
  String(now.getMonth()+1).padStart(2,"0")+"-"+
  String(now.getDate()).padStart(2,"0")+" "+
  String(now.getHours()).padStart(2,"0")+":"+
  String(now.getMinutes()).padStart(2,"0");

  document.getElementById("saveTime").innerText=
  `저장시간: ${timeString}`;

  localStorage.setItem("memoData",document.getElementById("memo").value);
  localStorage.setItem("saveTime",timeString);

  const btn=document.getElementById("saveBtn");
  btn.classList.add("save-animate");
  setTimeout(()=>btn.classList.remove("save-animate"),800);
}

function loadPhoto(event){
  const reader=new FileReader();
  reader.onload=function(){
    const img=document.getElementById("preview");
    img.src=reader.result;
    localStorage.setItem("photoData",reader.result);
  }
  reader.readAsDataURL(event.target.files[0]);
}

window.onload=function(){
  const savedMemo=localStorage.getItem("memoData");
  const savedTime=localStorage.getItem("saveTime");
  const savedPhoto=localStorage.getItem("photoData");

  if(savedMemo){
    document.getElementById("memo").value=savedMemo;
  }
  if(savedTime){
    document.getElementById("saveTime").innerText=`저장시간: ${savedTime}`;
  }
  if(savedPhoto){
    document.getElementById("preview").src=savedPhoto;
  }
}
</script>

</body>
</html>
