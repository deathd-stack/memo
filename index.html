<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>JAS MEMO VER 4.7</title>

<style>
  :root{
    --bg1:#ff9800;
    --bg2:#ff7a1a;
    --card:#f6e7d7;
    --pill:#111;
    --shadow:0 14px 26px rgba(0,0,0,.18);
    --blue:#2f7df6;
    --red:#e20000;
    --line:#cfcfcf;

    /* ✅ UI 전체 20% 더 작게(타이틀 제외) */
    --s: .528;     /* 기존 .66 * 0.8 */
    --ts: .66;     /* 타이틀은 기존 크기 유지 */
  }

  *{box-sizing:border-box}
  html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    overscroll-behavior-x:none;
  }

  body{
    margin:0;
    font-family:-apple-system, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-weight:700;
    background:
      radial-gradient(1200px 700px at 50% -10%, #ffd18a 0%, transparent 55%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    min-height:100vh;
  }

  /* ====== HOME HEADER ====== (타이틀은 --ts 사용) */
  header{
    text-align:center;
    padding:calc(22px * var(--ts)) calc(14px * var(--ts)) calc(10px * var(--ts));
    user-select:none;
    cursor:pointer;
  }
  .titleWrap{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:calc(10px * var(--ts));
    flex-wrap:wrap;
  }
  .titleMain{
    font-size:calc(42px * var(--ts));
    font-weight:1000;
    letter-spacing:-1px;
    color:#111;
  }
  .titleVer{
    font-size:calc(18px * var(--ts));
    font-weight:1000;
    color:#111;
    opacity:.9;
  }

  /* ====== TOP BUTTONS ====== */
  .controls{
    display:flex;
    justify-content:center;
    gap:calc(14px * var(--s));
    padding:calc(8px * var(--s)) calc(14px * var(--s));
  }
  button{
    border:none;
    border-radius:calc(22px * var(--s));
    background:#fff;
    padding:calc(14px * var(--s)) calc(22px * var(--s));
    font-weight:1000;
    color:var(--blue);
    font-size:calc(18px * var(--s));
    box-shadow:0 10px 20px rgba(0,0,0,.18);
    cursor:pointer;
  }
  button:active{transform:scale(.99)}

  /* ====== LIST ====== */
  #memoList{
    padding:calc(10px * var(--s)) calc(14px * var(--s)) calc(110px * var(--s));
    max-width:780px;
    margin:0 auto;
  }
  .memoCard{
    background:rgba(246,231,215,.92);
    border-radius:calc(24px * var(--s));
    padding:calc(14px * var(--s)) calc(12px * var(--s));
    margin:calc(12px * var(--s)) 0;
    box-shadow:0 16px 26px rgba(0,0,0,.18);
    border:2px solid rgba(255,255,255,.45);
    overflow:hidden;
    max-width:100%;
  }
  .memoRow{
    display:flex;
    gap:calc(10px * var(--s));
    align-items:flex-start;
    max-width:100%;
  }

  .selBox{
    width:calc(30px * var(--s));
    height:calc(30px * var(--s));
    border-radius:calc(10px * var(--s));
    border:2px solid rgba(0,0,0,.25);
    background:#fff;
    appearance:none;
    margin-top:calc(8px * var(--s));
    flex:0 0 auto;

    position: relative;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .selBox:active{ transform: scale(0.96); }
  .selBox:checked{
    border-color: rgba(0,0,0,.35);
    box-shadow: 0 0 0 calc(6px * var(--s)) rgba(47,125,246,.18);
    animation: checkPop .18s ease-out;
    background:
      linear-gradient(#fff,#fff),
      radial-gradient(circle at 50% 50%, #222 0 40%, transparent 41%);
  }
  .selBox:checked::after{
    content:"";
    position:absolute;
    inset:calc(-10px * var(--s));
    border-radius:calc(16px * var(--s));
    border:calc(3px * var(--s)) solid rgba(47,125,246,.35);
    opacity:0;
    transform:scale(.7);
    animation: ringPulse .35s ease-out;
    pointer-events:none;
  }
  @keyframes checkPop{
    0%{ transform:scale(.92); }
    60%{ transform:scale(1.08); }
    100%{ transform:scale(1.00); }
  }
  @keyframes ringPulse{
    0%{ opacity:.9; transform:scale(.75); }
    100%{ opacity:0; transform:scale(1.15); }
  }

  .lines{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:calc(10px * var(--s));
    cursor:pointer;
    min-width:0;
    max-width:100%;
  }
  .line{
    display:flex;
    align-items:flex-start;
    gap:calc(10px * var(--s));
    min-width:0;
    max-width:100%;
  }
  .tagPill{
    background:#111;
    color:#fff;
    border-radius:999px;
    padding:calc(9px * var(--s)) calc(12px * var(--s));
    font-weight:1000;
    font-size:calc(16px * var(--s));
    min-width:calc(70px * var(--s));
    text-align:center;
    flex:0 0 auto;
    letter-spacing:.5px;
  }
  /* ✅ 메모 제목(리스트) 줄바꿈으로 “다 보이게” */
  .textPill{
    background:rgba(210,199,188,.45);
    border-radius:calc(18px * var(--s));
    padding:calc(10px * var(--s)) calc(14px * var(--s));
    font-weight:1000;
    font-size:calc(18px * var(--s));
    color:#111;
    flex:1;
    min-width:0;
    max-width:100%;
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    word-break:break-word;
    line-height:1.25;
  }

  .flash{animation:flash .55s;}
  @keyframes flash{50%{transform:scale(1.01); filter:brightness(1.05)}}

  /* ====== EQUIP HOME ====== */
  #equipBtn{
    position:fixed;
    left:calc(14px * var(--s));
    bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:20;
    border:none;
    border-radius:calc(18px * var(--s));
    background:#fff;
    padding:calc(12px * var(--s)) calc(18px * var(--s));
    font-weight:1000;
    color:var(--blue);
    font-size:calc(16px * var(--s));
    box-shadow:0 12px 22px rgba(0,0,0,.18);
  }

  #equipBadge{
    position:fixed;
    right:calc(14px * var(--s));
    bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:20;
    background:rgba(0,0,0,.86);
    color:#fff;
    border-radius:calc(20px * var(--s));
    padding:calc(12px * var(--s)) calc(14px * var(--s));
    font-weight:1000;
    line-height:1.12;
    text-align:right;
    box-shadow:0 14px 26px rgba(0,0,0,.22);
    display:none;
    max-width:calc(240px * var(--s));
  }
  #equipBadge .b1{font-size:calc(18px * var(--s));}
  #equipBadge .b2{font-size:calc(18px * var(--s)); opacity:.95;}

  /* ====== MODAL ====== */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:50;
    overscroll-behavior:contain;
    pointer-events:none;
  }
  .box{
    width:100%;
    max-width:820px;
    background:#fff;
    border-radius:calc(26px * var(--s)) calc(26px * var(--s)) 0 0;
    padding:calc(10px * var(--s)) calc(14px * var(--s)) calc(16px * var(--s));
    max-height:92vh;
    overflow:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    pointer-events:auto;
    transform:translateY(0);
    will-change:transform;
  }

  .dragArea{
    padding:calc(6px * var(--s)) 0 calc(8px * var(--s));
    position:sticky;
    top:0;
    background:#fff;
    z-index:2;
  }
  .drag-handle{
    width:calc(60px * var(--s));
    height:calc(7px * var(--s));
    background:#cfcfcf;
    border-radius:999px;
    margin:0 auto;
  }

  .modalTitleTap{
    text-align:center;
    font-weight:1000;
    color:#111;
    padding:calc(6px * var(--s)) 0 calc(10px * var(--s));
    cursor:pointer;
    user-select:none;
  }
  .modalTitleTap .m1{font-size:calc(18px * var(--s));}
  .modalTitleTap .m2{font-size:calc(12px * var(--s)); opacity:.55; margin-top:2px;}

  .check-line{
    display:flex;
    justify-content:center;
    gap:calc(18px * var(--s));
    align-items:center;
    padding:calc(6px * var(--s)) 0 calc(10px * var(--s));
    white-space:nowrap;
  }
  .check-line label{
    display:flex;
    align-items:center;
    gap:calc(8px * var(--s));
    font-size:calc(16px * var(--s));
    font-weight:1000;
  }
  .check-line input[type="checkbox"]{
    width:calc(22px * var(--s));
    height:calc(22px * var(--s));
    accent-color:var(--blue);
  }

  .section{
    background:#f2f2f2;
    border-radius:calc(16px * var(--s));
    padding:calc(12px * var(--s));
    margin:calc(10px * var(--s)) 0;
    overflow:hidden;
    border:1px solid #e6e6e6;
    max-width:100%;
  }
  .sectionHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:calc(10px * var(--s));
    gap:calc(10px * var(--s));
  }
  .sectionTitle{
    font-size:calc(24px * var(--s));
    font-weight:1000;
    letter-spacing:.3px;
  }

  .timeWrap{
    display:flex;
    align-items:baseline;
    gap:calc(10px * var(--s));
    white-space:nowrap;
  }
  .timeBtn{
    border:none;
    background:transparent;
    box-shadow:none;
    padding:calc(4px * var(--s)) calc(8px * var(--s));
    margin:0;
    font-weight:1000;
    font-size:calc(16px * var(--s));
    color:#111;
    border-radius:calc(10px * var(--s));
  }
  .timeBtn:active{background:rgba(226,27,27,.08);}
  .timeVal{
    font-weight:1000;
    font-size:calc(22px * var(--s));
    color:var(--red);
    min-width:calc(64px * var(--s));
    text-align:right;
  }

  .row{
    display:flex;
    align-items:center;
    gap:calc(10px * var(--s));
    margin:calc(10px * var(--s)) 0;
    flex-wrap:nowrap;
    min-width:0;
    max-width:100%;
  }
  .lab{
    font-size:calc(20px * var(--s));
    font-weight:1000;
    min-width:calc(40px * var(--s));
    color:#111;
    white-space:nowrap;
  }

  input, textarea, select{
    font-size:calc(16px * var(--s));
    font-weight:1000;
    border:2px solid var(--line);
    border-radius:calc(16px * var(--s));
    padding:calc(10px * var(--s));
    outline:none;
    background:#fff;
    max-width:100%;
  }
  input{ height:calc(48px * var(--s)); }
  textarea{
    width:100%;
    height:calc(76px * var(--s));
    resize:none;
    font-weight:800;
  }

  .w4,.w3,.w2,.wT{ text-align:center; width:100%; }
  .w4{font-size:calc(20px * var(--s));}
  .w3{font-size:calc(20px * var(--s));}
  .w2{font-size:calc(20px * var(--s));}
  .wT{font-size:calc(20px * var(--s));}

  .long{
    flex:1;
    min-width:0;
    font-size:calc(16px * var(--s));
    font-weight:1000;
    padding-left:calc(14px * var(--s));
  }

  .extraBox{
    background:#fff;
    border:2px solid #e2e2e2;
    border-radius:calc(16px * var(--s));
    padding:calc(12px * var(--s));
    margin-top:calc(10px * var(--s));
  }
  .extraHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:calc(10px * var(--s));
  }
  .extraTitle{
    font-size:calc(20px * var(--s));
    font-weight:1000;
    letter-spacing:.4px;
  }
  .iconBtn{
    width:calc(48px * var(--s));
    height:calc(48px * var(--s));
    border-radius:calc(16px * var(--s));
    border:none;
    background:#fff;
    box-shadow:0 8px 18px rgba(0,0,0,.10);
    color:var(--blue);
    font-size:calc(28px * var(--s));
    font-weight:1000;
  }
  .extraRow{
    display:flex;
    gap:calc(10px * var(--s));
    align-items:center;
    margin-top:calc(10px * var(--s));
    max-width:100%;
  }
  .extraRow select{
    width:calc(130px * var(--s));
    height:calc(48px * var(--s));
    font-size:calc(16px * var(--s));
    font-weight:1000;
    text-transform:uppercase;
  }
  .extraRow input{
    width:calc(130px * var(--s));
    height:calc(48px * var(--s));
    font-size:calc(20px * var(--s));
    text-align:center;
  }
  .minusBtn{
    width:calc(60px * var(--s));
    height:calc(48px * var(--s));
    border-radius:calc(16px * var(--s));
    border:none;
    background:#eef1f7;
    color:var(--blue);
    font-weight:1000;
    font-size:calc(22px * var(--s));
    box-shadow:none;
  }

  .bottomBtns{
    display:flex;
    gap:calc(18px * var(--s));
    padding:calc(12px * var(--s)) calc(6px * var(--s)) 0;
    justify-content:flex-start;
    align-items:center;
    flex-wrap:wrap;
  }
  .bottomBtns button{
    padding:calc(10px * var(--s)) calc(14px * var(--s));
    font-size:calc(16px * var(--s));
    box-shadow:none;
    border-radius:calc(14px * var(--s));
  }

  /* PHOTO LAYER */
  #photoLayer{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:90;
  }
  #photoLayer img{max-width:100%;max-height:100%;}

  /* ✅ 7C HL # 한줄 grid */
  .rowGrid3{
    display:grid;
    grid-template-columns:
      calc(34px * var(--s)) 1fr
      calc(34px * var(--s)) 1fr
      calc(14px * var(--s)) .95fr;
    gap:calc(10px * var(--s));
    align-items:center;
    margin:calc(10px * var(--s)) 0;
    min-width:0;
    max-width:100%;
  }

  /* ✅ T D BB 한줄 grid */
  .rowGridTDBB{
    display:grid;
    grid-template-columns:
      calc(18px * var(--s)) 1fr
      calc(18px * var(--s)) .9fr
      calc(26px * var(--s)) .9fr;
    gap:calc(10px * var(--s));
    align-items:center;
    margin:calc(10px * var(--s)) 0;
    min-width:0;
    max-width:100%;
  }

  .rowGrid3 input,
  .rowGridTDBB input{
    width:100%;
    min-width:0;
  }

  /* ✅ OUTBOUND T/T T/B 한줄 */
  .rowGridTTTB{
    display:grid;
    grid-template-columns:
      calc(46px * var(--s)) 1fr
      calc(46px * var(--s)) 1fr;
    gap:calc(10px * var(--s));
    align-items:center;
    margin:calc(10px * var(--s)) 0;
    min-width:0;
    max-width:100%;
  }

  /* ✅ iOS 확대 방지 + 영문 대문자 */
  input, textarea, select, button{
    -webkit-text-size-adjust:100%;
    text-transform:uppercase;
  }
</style>
</head>

<body>

<header id="homeHeader" onclick="openPhoto()" ondblclick="openPhoto()">
  <div class="titleWrap">
    <div class="titleMain">JAS MEMO</div>
    <div class="titleVer">VER 4.7</div>
  </div>
</header>

<div class="controls">
  <button type="button" onclick="newMemo()">ADD</button>
  <button type="button" onclick="deleteSelected()">DELETE</button>
  <button type="button" onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>

<button id="equipBtn" type="button" onclick="openEquip()">EQUIPMENT</button>
<div id="equipBadge"></div>

<input type="file" id="photoInput" accept="image/*" hidden />

<div class="modal" id="modal" aria-hidden="true">
  <div class="box" id="sheet" role="dialog" aria-modal="true">
    <div class="dragArea" id="dragArea">
      <div class="drag-handle"></div>
    </div>

    <div class="modalTitleTap" onclick="openPhoto()">
      <div class="m1">JAS MEMO</div>
      <div class="m2">TAP TO OPEN PHOTO</div>
    </div>

    <div class="check-line">
      <label><input type="checkbox" id="inChk"> INBOUND</label>
      <label><input type="checkbox" id="outChk"> OUTBOUND</label>
    </div>

    <div id="sections"></div>

    <div class="bottomBtns">
      <button type="button" onclick="saveMemo()">SAVE</button>
      <button type="button" onclick="closeModal()">CLOSE</button>
      <button type="button" onclick="clearPhoto()" style="color:#111">CLEAR PHOTO</button>
    </div>
  </div>
</div>

<div id="photoLayer" ondblclick="closePhoto()" onclick="closePhoto()">
  <img id="photoImg" alt="PHOTO" />
</div>

<div class="modal" id="equipModal" aria-hidden="true">
  <div class="box" style="max-height:70vh" onclick="event.stopPropagation()">
    <div class="dragArea">
      <div class="drag-handle"></div>
    </div>

    <div style="font-weight:1000;font-size:calc(20px * var(--s));margin:calc(6px * var(--s)) 0 calc(12px * var(--s));">EQUIPMENT</div>

    <div class="row">
      <div class="lab" style="min-width:calc(72px * var(--s));">TUG</div>
      <input id="tug1" class="w2" inputmode="numeric" maxlength="2" placeholder="00">
      <input id="tug2" class="w2" inputmode="numeric" maxlength="2" placeholder="00">
    </div>

    <div class="row">
      <div class="lab" style="min-width:calc(72px * var(--s));">BELT</div>
      <input id="belt" class="w2" inputmode="numeric" maxlength="2" placeholder="00">
    </div>

    <div class="bottomBtns">
      <button type="button" onclick="saveEquip()">SAVE</button>
      <button type="button" onclick="closeEquip()">CLOSE</button>
    </div>
  </div>
</div>

<script>
  const modal = document.getElementById("modal");
  const sheet = document.getElementById("sheet");
  const dragArea = document.getElementById("dragArea");
  const sections = document.getElementById("sections");
  const memoList = document.getElementById("memoList");
  const photoInput = document.getElementById("photoInput");
  const photoLayer = document.getElementById("photoLayer");
  const photoImg = document.getElementById("photoImg");
  const inChk = document.getElementById("inChk");
  const outChk = document.getElementById("outChk");

  const equipBtn = document.getElementById("equipBtn");
  const equipBadge = document.getElementById("equipBadge");
  const equipModal = document.getElementById("equipModal");
  const tug1 = document.getElementById("tug1");
  const tug2 = document.getElementById("tug2");
  const belt = document.getElementById("belt");

  let memos = JSON.parse(localStorage.getItem("jas_memos") || "[]");
  let editId = null;

  const EXTRA_KEYS = ["W","C","COB","STRAP","GB","TS","EMS"];

  // ✅ INBOUND -> OUTBOUND HL/# 연동
  let outSyncHL = true;
  let outSyncHASH = true;

  function onlyNum(val, len){
    return (val || "").replace(/[^0-9]/g, "").slice(0, len);
  }
  function pad(val, len){
    const v = onlyNum(val, len);
    return v ? v.padStart(len, "0") : "";
  }
  function nowTime(){
    const d = new Date();
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  /* =========================
     ✅ PHOTO: IndexedDB 저장
  ========================== */
  const DB_NAME = "JAS_MEMO_DB";
  const DB_STORE = "KV";
  const PHOTO_KEY = "PHOTO_BLOB";

  function idbOpen(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await idbOpen();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(value, key);
      tx.oncomplete = ()=> { db.close(); resolve(true); };
      tx.onerror = ()=> { db.close(); reject(tx.error); };
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = ()=> { db.close(); resolve(req.result); };
      req.onerror = ()=> { db.close(); reject(req.error); };
    });
  }
  async function idbDel(key){
    const db = await idbOpen();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).delete(key);
      tx.oncomplete = ()=> { db.close(); resolve(true); };
      tx.onerror = ()=> { db.close(); reject(tx.error); };
    });
  }

  let photoURL = null;

  async function loadPhotoFromDB(){
    try{
      const blob = await idbGet(PHOTO_KEY);
      if(blob instanceof Blob){
        if(photoURL) URL.revokeObjectURL(photoURL);
        photoURL = URL.createObjectURL(blob);
      }else{
        photoURL = null;
      }
    }catch(e){
      photoURL = null;
    }
  }

  function blobFromCanvas(canvas, quality=0.78){
    return new Promise((resolve)=> canvas.toBlob((b)=> resolve(b), "image/jpeg", quality));
  }

  async function fileToCompressedBlob(file){
    const img = new Image();
    const url = URL.createObjectURL(file);
    await new Promise((res, rej)=>{
      img.onload = ()=> res();
      img.onerror = (e)=> rej(e);
      img.src = url;
    });
    URL.revokeObjectURL(url);

    const maxW = 1600;
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    const scale = Math.min(1, maxW / Math.max(w,h));
    const nw = Math.max(1, Math.round(w*scale));
    const nh = Math.max(1, Math.round(h*scale));

    const canvas = document.createElement("canvas");
    canvas.width = nw;
    canvas.height = nh;
    canvas.getContext("2d").drawImage(img, 0, 0, nw, nh);

    return await blobFromCanvas(canvas, 0.78);
  }

  async function addPhoto(){
    photoInput.value="";
    photoInput.click();
  }

  photoInput.onchange = async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    try{
      const blob = await fileToCompressedBlob(f);
      await idbSet(PHOTO_KEY, blob);
      await loadPhotoFromDB();
      alert("PHOTO SAVED");
    }catch(err){
      alert("PHOTO SAVE FAILED\n" + err);
    }
  };

  async function clearPhoto(){
    try{
      await idbDel(PHOTO_KEY);
      if(photoURL) URL.revokeObjectURL(photoURL);
      photoURL = null;
      alert("PHOTO CLEARED");
    }catch(err){
      alert("CLEAR FAILED\n" + err);
    }
  }

  async function openPhoto(){
    if(!photoURL) await loadPhotoFromDB();
    if(!photoURL) return;
    photoImg.src = photoURL;
    photoLayer.style.display = "flex";
  }
  function closePhoto(){ photoLayer.style.display = "none"; }

  /* =========================
     ✅ INPUT 제한 + HL/# 공유
  ========================== */
  document.addEventListener("input", (e)=>{
    const t = e.target;
    if(!(t instanceof HTMLInputElement)) return;
    const k = t.dataset.k || "";
    if(!k) return;

    if(k.endsWith("-c7")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-HL")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-HASH")) t.value = onlyNum(t.value, 3);

    if(k.endsWith("-t")) t.value = onlyNum(t.value, 3);
    if(k.endsWith("-d")) t.value = onlyNum(t.value, 2);
    if(k.endsWith("-bb")) t.value = onlyNum(t.value, 2);

    if(k.endsWith("-tt")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-tb")) t.value = onlyNum(t.value, 4);

    if(k.startsWith("extraVal-")) t.value = onlyNum(t.value, 3);

    if(outChk.checked){
      if(k === "INBOUND-HL" && outSyncHL){
        const outHL = sections.querySelector('.section[data-type="OUTBOUND"] input[data-k="OUTBOUND-HL"]');
        if(outHL) outHL.value = t.value;
      }
      if(k === "INBOUND-HASH" && outSyncHASH){
        const outHash = sections.querySelector('.section[data-type="OUTBOUND"] input[data-k="OUTBOUND-HASH"]');
        if(outHash) outHash.value = t.value;
      }
    }

    if(k === "OUTBOUND-HL") outSyncHL = false;
    if(k === "OUTBOUND-HASH") outSyncHASH = false;
  });

  function makeExtraRow(type, key="W", val=""){
    const row = document.createElement("div");
    row.className = "extraRow";
    row.innerHTML = `
      <select>
        ${EXTRA_KEYS.map(k=>`<option value="${k}" ${k===key?"selected":""}>${k}</option>`).join("")}
      </select>
      <input inputmode="numeric" maxlength="3" placeholder="000" data-k="extraVal-${type}" value="${onlyNum(val,3)}">
      <button type="button" class="minusBtn" onclick="this.parentElement.remove()">-</button>
    `;
    return row;
  }

  function addExtraRow(type){
    const root = sections.querySelector(\`.section[data-type="\${type}"]\`);
    const box = root ? root.querySelector(\`#\${type}-EXTRAS\`) : null;
    if(!box) return;
    box.appendChild(makeExtraRow(type, "W", ""));
  }

  function makeSection(type, memoData){
    const d = document.createElement("div");
    d.className = "section";
    d.dataset.type = type;

    const savedTime = memoData ? (memoData[type+"-TIME"] || "") : "";
    const cmpt1Default = memoData ? (memoData[type+"-cmpt1"] || "F") : "F";
    const cmpt2Default = memoData ? (memoData[type+"-cmpt2"] || "F") : "F";

    d.innerHTML = `
      <div class="sectionHead">
        <div class="sectionTitle">${type}</div>
        <div class="timeWrap">
          <button type="button" class="timeBtn" data-timebtn="${type}">TIME</button>
          <div class="timeVal" id="${type}-TIMESHOWN">${savedTime}</div>
        </div>
      </div>

      <div class="rowGrid3">
        <div class="lab">7C</div>
        <input class="w4" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-c7">
        <div class="lab">HL</div>
        <input class="w4" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-HL">
        <div class="lab">#</div>
        <input class="w3" inputmode="numeric" maxlength="3" placeholder="000" data-k="${type}-HASH">
      </div>

      <div class="row">
        <div class="lab" style="min-width:calc(96px * var(--s));">CMPT 1</div>
        <input class="long" data-k="${type}-cmpt1" placeholder="TEXT" value="${cmpt1Default}">
      </div>
      <div class="row">
        <div class="lab" style="min-width:calc(96px * var(--s));">CMPT 2</div>
        <input class="long" data-k="${type}-cmpt2" placeholder="TEXT" value="${cmpt2Default}">
      </div>
      ${[3,4].map(i=>`
        <div class="row">
          <div class="lab" style="min-width:calc(96px * var(--s));">CMPT ${i}</div>
          <input class="long" data-k="${type}-cmpt${i}" placeholder="TEXT">
        </div>
      `).join("")}

      <div class="rowGridTDBB">
        <div class="lab">T</div>
        <input class="wT" inputmode="numeric" maxlength="3" placeholder="000" data-k="${type}-t">
        <div class="lab">D</div>
        <input class="w2" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type}-d">
        <div class="lab">BB</div>
        <input class="w2" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type}-bb">
      </div>

      ${type==="OUTBOUND" ? `
        <div class="rowGridTTTB">
          <div class="lab">T/T</div>
          <input class="w4" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-tt">
          <div class="lab">T/B</div>
          <input class="w4" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-tb">
        </div>
      ` : ""}

      <div class="extraBox">
        <div class="extraHead">
          <div class="extraTitle">EXTRA</div>
          <button type="button" class="iconBtn" onclick="addExtraRow('${type}')">+</button>
        </div>
        <div id="${type}-EXTRAS"></div>
      </div>

      <textarea data-k="${type}-note" placeholder="NOTE (${type})"></textarea>
    `;

    const timeBtn = d.querySelector(`[data-timebtn="${type}"]`);
    const timeShown = d.querySelector(`#${type}-TIMESHOWN`);
    timeBtn.addEventListener("click", ()=>{ timeShown.textContent = nowTime(); });
    timeBtn.addEventListener("dblclick", ()=>{
      const cur = timeShown.textContent || nowTime();
      const t = prompt("TIME (HH:MM 24H)", cur);
      if(t) timeShown.textContent = t;
    });

    const extrasBox = d.querySelector(`#${type}-EXTRAS`);
    const extras = memoData ? (memoData[type+"-EXTRAS"] || []) : [];
    extras.forEach(ex=>extrasBox.appendChild(makeExtraRow(type, ex.key, ex.val)));

    return d;
  }

  inChk.onchange = outChk.onchange = ()=>{
    sections.innerHTML = "";
    if(inChk.checked) sections.appendChild(makeSection("INBOUND", null));
    if(outChk.checked) sections.appendChild(makeSection("OUTBOUND", null));

    outSyncHL = true;
    outSyncHASH = true;

    if(inChk.checked && outChk.checked){
      const inHL = sections.querySelector('input[data-k="INBOUND-HL"]');
      const inHash = sections.querySelector('input[data-k="INBOUND-HASH"]');
      const outHL = sections.querySelector('input[data-k="OUTBOUND-HL"]');
      const outHash = sections.querySelector('input[data-k="OUTBOUND-HASH"]');
      if(inHL && outHL) outHL.value = inHL.value;
      if(inHash && outHash) outHash.value = inHash.value;
    }
  };

  function newMemo(){
    editId = null;
    inChk.checked = false;
    outChk.checked = false;
    sections.innerHTML = "";
    openModal();
  }

  function openModal(){
    modal.style.display = "flex";
    modal.setAttribute("aria-hidden","false");
    equipBtn.style.display = "none";
    equipBadge.style.display = "none";
    sheet.style.transform = "translateY(0)";
    currentTranslate = 0;
  }

  function closeModal(){
    modal.style.display = "none";
    modal.setAttribute("aria-hidden","true");
    editId = null;
    equipBtn.style.display = "block";
    updateEquipBadge();
  }

  /* ✅ 저장/불러오기 핵심: data-type 섹션 기준으로 100% 고정 */
  function saveMemo(){
    const data = { id: editId ?? Date.now() };

    // ✅ 체크박스 값이 아니라 “섹션 존재”로 저장 여부 판단(모바일 꼬임 방지)
    data.hasIn  = !!sections.querySelector('.section[data-type="INBOUND"]');
    data.hasOut = !!sections.querySelector('.section[data-type="OUTBOUND"]');

    const normalizeF = (v)=> (v && v.trim() ? v : "F");

    ["INBOUND","OUTBOUND"].forEach(type=>{
      const enabled = (type==="INBOUND") ? data.hasIn : data.hasOut;
      if(!enabled) return;

      const root = sections.querySelector(`.section[data-type="${type}"]`);
      if(!root) return;

      const q = (k)=> root.querySelector(`[data-k="${type}-${k}"]`);
      const qExtraVal = ()=> root.querySelectorAll(".extraRow");

      data[type+"-c7"]   = pad(q("c7")?.value, 4);
      data[type+"-HL"]   = pad(q("HL")?.value, 4);
      data[type+"-HASH"] = pad(q("HASH")?.value, 3);

      data[type+"-t"]  = pad(q("t")?.value, 3);
      data[type+"-d"]  = pad(q("d")?.value, 2);
      data[type+"-bb"] = pad(q("bb")?.value, 2);

      data[type+"-cmpt1"] = normalizeF(q("cmpt1")?.value || "");
      data[type+"-cmpt2"] = normalizeF(q("cmpt2")?.value || "");
      [3,4].forEach(i=>{
        data[type+`-cmpt${i}`] = (q(`cmpt${i}`)?.value || "");
      });

      if(type==="OUTBOUND"){
        data[type+"-tt"] = pad(q("tt")?.value, 4);
        data[type+"-tb"] = pad(q("tb")?.value, 4);
      }

      data[type+"-note"] = (root.querySelector(`textarea[data-k="${type}-note"]`)?.value || "");

      const shown = document.getElementById(type+"-TIMESHOWN");
      data[type+"-TIME"] = shown ? (shown.textContent || "") : "";

      const extras = [];
      root.querySelectorAll(".extraRow").forEach(r=>{
        const key = (r.querySelector("select")?.value || "").toUpperCase();
        const val = pad(r.querySelector("input")?.value, 3);
        if(key && val) extras.push({key, val});
      });
      data[type+"-EXTRAS"] = extras;
    });

    // ✅ HL/# 공유 기본값 보장
    if(data.hasIn && data.hasOut){
      if(!data["OUTBOUND-HL"]) data["OUTBOUND-HL"] = data["INBOUND-HL"] || "";
      if(!data["OUTBOUND-HASH"]) data["OUTBOUND-HASH"] = data["INBOUND-HASH"] || "";
    }

    if(editId){
      const idx = memos.findIndex(m=>m.id===editId);
      if(idx>=0) memos[idx] = data;
      else memos.push(data);
    }else{
      memos.push(data);
    }

    try{
      localStorage.setItem("jas_memos", JSON.stringify(memos));
    }catch(err){
      alert("SAVE FAILED (STORAGE)\n" + err);
      return;
    }

    closeModal();
    renderList(data.id);
  }

  function buildLineText(m){
    const inLineTwo  = `IN 7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}]`;
    const outLineTwo = `OUT 7C[${m["OUTBOUND-c7"]||""}] #[${m["OUTBOUND-HASH"]||""}]`;

    const oneIn  = `IN 7C[${m["INBOUND-c7"]||""}] HL[${m["INBOUND-HL"]||""}] #[${m["INBOUND-HASH"]||""}]`;
    const oneOut = `OUT 7C[${m["OUTBOUND-c7"]||""}] HL[${m["OUTBOUND-HL"]||""}] #[${m["OUTBOUND-HASH"]||""}]`;

    if(m.hasIn && m.hasOut) return [{tag:"IN", text:inLineTwo}, {tag:"OUT", text:outLineTwo}];
    if(m.hasIn) return [{tag:"IN", text:oneIn}];
    if(m.hasOut) return [{tag:"OUT", text:oneOut}];
    return [{tag:"IN", text:"EMPTY"}];
  }

  function renderList(flashId){
    memoList.innerHTML = "";
    memos.forEach(m=>{
      const card = document.createElement("div");
      card.className = "memoCard" + (m.id===flashId ? " flash" : "");

      const linesData = buildLineText(m);
      const linesHTML = linesData.map(x =>
        `<div class="line"><div class="tagPill">${x.tag}</div><div class="textPill">${x.text}</div></div>`
      ).join("");

      card.innerHTML = `
        <div class="memoRow">
          <input class="selBox" type="checkbox" data-id="${m.id}">
          <div class="lines" data-open="${m.id}">${linesHTML}</div>
        </div>
      `;
      memoList.appendChild(card);
    });

    memoList.querySelectorAll(".lines").forEach(el=>{
      el.addEventListener("click", ()=>{
        const id = Number(el.dataset.open);
        editMemo(id);
      });
    });
  }

  function editMemo(id){
    const m = memos.find(x=>x.id===id);
    if(!m) return;

    editId = id;
    inChk.checked = !!m.hasIn;
    outChk.checked = !!m.hasOut;

    sections.innerHTML = "";
    if(inChk.checked) sections.appendChild(makeSection("INBOUND", m));
    if(outChk.checked) sections.appendChild(makeSection("OUTBOUND", m));

    openModal();

    outSyncHL = true;
    outSyncHASH = true;

    setTimeout(()=>{
      ["INBOUND","OUTBOUND"].forEach(type=>{
        const enabled = (type==="INBOUND") ? m.hasIn : m.hasOut;
        if(!enabled) return;

        const root = sections.querySelector(`.section[data-type="${type}"]`);
        if(!root) return;

        const setV=(k,val)=>{
          const el = root.querySelector(`[data-k="${type}-${k}"]`);
          if(el) el.value = val || "";
        };

        setV("c7",   m[type+"-c7"]);
        setV("HL",   m[type+"-HL"]);
        setV("HASH", m[type+"-HASH"]);
        setV("t",    m[type+"-t"]);
        setV("d",    m[type+"-d"]);
        setV("bb",   m[type+"-bb"]);

        const c1 = root.querySelector(`input[data-k="${type}-cmpt1"]`);
        const c2 = root.querySelector(`input[data-k="${type}-cmpt2"]`);
        if(c1) c1.value = (m[type+"-cmpt1"] && m[type+"-cmpt1"].trim()) ? m[type+"-cmpt1"] : "F";
        if(c2) c2.value = (m[type+"-cmpt2"] && m[type+"-cmpt2"].trim()) ? m[type+"-cmpt2"] : "F";

        [3,4].forEach(i=>{
          const el = root.querySelector(`input[data-k="${type}-cmpt${i}"]`);
          if(el) el.value = m[type+`-cmpt${i}`] || "";
        });

        if(type==="OUTBOUND"){
          setV("tt", m[type+"-tt"]);
          setV("tb", m[type+"-tb"]);
        }

        const note = root.querySelector(`textarea[data-k="${type}-note"]`);
        if(음표) note.value = m[type+"-note"] || "";

        const shown = document.getElementById(type+"-TIMESHOWN");
        if(shown) shown.textContent = m[type+"-TIME"] || "";

        // extras 재구성
        const box = root.querySelector(`#${type}-EXTRAS`);
        if(box){
          box.innerHTML = "";
          (m[type+"-EXTRAS"] || []).forEach(ex=>{
            box.appendChild(makeExtraRow(type, ex.key, ex.val));
          });
        }
      });

      if(m.hasIn && m.hasOut){
        const inHL = sections.querySelector('input[data-k="INBOUND-HL"]')?.value || "";
        const inHash = sections.querySelector('input[data-k="INBOUND-HASH"]')?.value || "";
        const outHL = sections.querySelector('input[data-k="OUTBOUND-HL"]');
        const outHash = sections.querySelector('input[data-k="OUTBOUND-HASH"]');

        if(outHL && !outHL.value) outHL.value = inHL;
        if(outHash && !outHash.value) outHash.value = inHash;

        outSyncHL = (outHL?.value || "") === inHL;
        outSyncHASH = (outHash?.value || "") === inHash;
      }
    }, 30);
  }

  function deleteSelected(){
    const checks = document.querySelectorAll('.selBox:checked');
    const ids = [...checks].map(c=>Number(c.dataset.id));
    memos = memos.filter(m=>!ids.includes(m.id));
    try{
      localStorage.setItem("jas_memos", JSON.stringify(memos));
    }catch(err){
      alert("DELETE FAILED\n" + err);
      return;
    }
    renderList();
  }

  /* EQUIP */
  function openEquip(){
    const eq = JSON.parse(localStorage.getItem("jas_equipment") || "{}");
    tug1.value = pad(eq.tug1,2);
    tug2.value = pad(eq.tug2,2);
    belt.value = pad(eq.belt,2);
    equipModal.style.display = "flex";
    equipModal.setAttribute("aria-hidden","false");
  }
  function closeEquip(){
    equipModal.style.display = "none";
    equipModal.setAttribute("aria-hidden","true");
  }
  function saveEquip(){
    const eq = { tug1: pad(tug1.value,2), tug2: pad(tug2.value,2), belt: pad(belt.value,2) };
    localStorage.setItem("jas_equipment", JSON.stringify(eq));
    updateEquipBadge();
    closeEquip();
  }
  function updateEquipBadge(){
    const eq = JSON.parse(localStorage.getItem("jas_equipment") || "{}");
    if(!eq.tug1 && !eq.tug2 && !eq.belt){
      equipBadge.style.display = "none";
      return;
    }
    const t1 = eq.tug1 || "00";
    const t2 = eq.tug2 || "00";
    const b  = eq.belt || "00";
    equipBadge.innerHTML = `
      <div class="b1">TUG ${t1}/${t2}</div>
      <div class="b2">BELT ${b}</div>
    `;
    equipBadge.style.display = "block";
  }

  equipModal.addEventListener("click",(e)=>{
    if(e.target === equipModal) closeEquip();
  });

  /* DRAG TO CLOSE */
  let startY = 0;
  let currentTranslate = 0;
  let dragging = false;

  function onStart(y){
    dragging = true;
    startY = y;
    sheet.style.transition = "none";
  }
  function onMove(y){
    if(!dragging) return;
    const dy = Math.max(0, y - startY);
    currentTranslate = dy;
    sheet.style.transform = `translateY(${dy}px)`;
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    sheet.style.transition = "transform .18s ease";
    if(currentTranslate > 140){
      closeModal();
    }else{
      sheet.style.transform = "translateY(0)";
      currentTranslate = 0;
    }
  }

  dragArea.addEventListener("touchstart", (e)=> onStart(e.touches[0].clientY), {passive:true});
  dragArea.addEventListener("touchmove",  (e)=> onMove(e.touches[0].clientY),  {passive:true});
  dragArea.addEventListener("touchend",   ()=> onEnd());

  dragArea.addEventListener("mousedown", (e)=> onStart(e.clientY));
  window.addEventListener("mousemove", (e)=> onMove(e.clientY));
  window.addEventListener("mouseup", ()=> onEnd());

  /* INIT */
  (async ()=>{
    await loadPhotoFromDB();
    renderList();
    updateEquipBadge();
  })();
</script>
