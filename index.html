<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAS MEMO VER 2</title>

<style>
body{margin:0;font-family:-apple-system;background:#ff9f1c;font-weight:600;}
header{text-align:center;padding:22px;font-size:2.6rem;font-weight:900;cursor:pointer;}
.controls{display:flex;justify-content:center;gap:14px;margin-bottom:14px;}
button{padding:10px 16px;border:none;border-radius:16px;background:#fff;font-weight:900;}
.memo{background:#fff;margin:12px;padding:14px;border-radius:18px;
box-shadow:0 6px 14px rgba(0,0,0,.15);transition:.3s;}
.memo.flash{animation:flash .6s;}
@keyframes flash{50%{background:#ffe8b5;transform:scale(1.04);}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);
display:none;justify-content:center;align-items:flex-end;}
.box{background:#fff;width:100%;max-height:92vh;overflow:auto;
border-radius:28px 28px 0 0;padding:18px;}

.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
input{width:70px;padding:6px;font-weight:800;border-radius:10px;border:1px solid #ccc;}
input[data-long]{width:100%;}
.section{background:#f7f7f7;padding:12px;border-radius:14px;margin-top:14px;}
textarea{width:100%;height:80px;border-radius:12px;padding:8px;border:1px solid #ccc;}

.time{color:red;font-weight:900;margin-top:6px;}

#photoLayer{position:fixed;inset:0;background:black;display:none;
justify-content:center;align-items:center;}
#photoLayer img{max-width:100%;max-height:100%;}
</style>
</head>

<body>

<header ondblclick="openPhoto()">JAS MEMO VER 2</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<div class="modal" id="modal">
<div class="box">

<div class="row" style="justify-content:center">
  <input type="checkbox" id="inChk"> INBOUND
  <span style="width:30px"></span>
  <input type="checkbox" id="outChk"> OUTBOUND
</div>

<div id="sections"></div>

<div class="row">
  <button onclick="saveMemo()">SAVE</button>
  <button onclick="closeModal()">CLOSE</button>
</div>

</div>
</div>

<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg">
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const photoInput=document.getElementById("photoInput");
const photoLayer=document.getElementById("photoLayer");
const photoImg=document.getElementById("photoImg");
const inChk=document.getElementById("inChk");
const outChk=document.getElementById("outChk");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let photo=localStorage.getItem("jas_photo");
let editId=null;

/* 숫자 제한 */
function onlyNum(val,len){
  return (val||"").replace(/[^0-9]/g,'').slice(0,len);
}

document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(!k) return;

  if(k==="HL"){
    e.target.value=onlyNum(e.target.value,4);
    document.querySelectorAll('[data-k="HL"]').forEach(i=>i.value=e.target.value);
  }
  if(k==="HASH"){
    e.target.value=onlyNum(e.target.value,3);
    document.querySelectorAll('[data-k="HASH"]').forEach(i=>i.value=e.target.value);
  }
  if(k.includes("-c7")){
    e.target.value=onlyNum(e.target.value,4);
  }
  if(k.includes("-cob")){
    e.target.value=onlyNum(e.target.value,3);
  }
  if(k.includes("-d")||k.includes("-bb")||k.includes("-w")||k.includes("-c")){
    e.target.value=onlyNum(e.target.value,2);
  }
  if(k.includes("-tt")||k.includes("-tb")){
    e.target.value=onlyNum(e.target.value,4);
  }
});

/* 섹션 */
function makeSection(type){
  const d=document.createElement("div");
  d.className="section";

  const extraOutbound = type==="OUTBOUND" ? `
    <div class="row">
      T/T <input data-k="${type}-tt">
      T/B <input data-k="${type}-tb">
    </div>
  ` : "";

  d.innerHTML=`
    <div class="row">
      7C <input data-k="${type}-c7">
      HL <input data-k="HL">
      # <input data-k="HASH">
    </div>

    ${[1,2,3,4].map(i=>`
      <div class="row">
        CMPT ${i}
        <input data-long data-k="${type}-cmpt${i}">
      </div>`).join("")}

    <div class="row">
      T <input data-k="${type}-t">
      D <input data-k="${type}-d">
      BB <input data-k="${type}-bb">
    </div>

    <div class="row">
      W <input data-k="${type}-w">
      C <input data-k="${type}-c">
      COB <input data-k="${type}-cob">
    </div>

    ${extraOutbound}

    <textarea data-k="${type}-note" placeholder="특이사항 (${type})"></textarea>
  `;
  return d;
}

inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND"));
  if(outChk.checked) sections.append(makeSection("OUTBOUND"));
};

function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";
}

function closeModal(){modal.style.display="none";}

function saveMemo(){
  const data={id:editId??Date.now()};
  document.querySelectorAll("[data-k]").forEach(i=>{
    data[i.dataset.k]=i.value;
  });
  data.hasIn=inChk.checked;
  data.hasOut=outChk.checked;
  data.time=new Date().toLocaleTimeString().slice(0,5);

  if(editId){
    memos[memos.findIndex(m=>m.id===editId)]=data;
  }else{
    memos.push(data);
  }

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal();
  renderList(data.id);
}

/* 🔥 수정된 출력 로직 */
function renderList(flashId){
  memoList.innerHTML="";
  memos.forEach(m=>{
    const div=document.createElement("div");
    div.className="memo";
    if(m.id===flashId) div.classList.add("flash");

    let content="";

    const in7=(m["INBOUND-c7"]||"").padStart(4,"0");
    const out7=(m["OUTBOUND-c7"]||"").padStart(4,"0");
    const hl=(m.HL||"").padStart(4,"0");
    const hash=(m.HASH||"").padStart(3,"0");

    if(m.hasIn && m.hasOut){
      content=`
        <div>IN  7C ${in7} HL ${hl}</div>
        <div>OUT 7C ${out7} # ${hash}</div>
      `;
    }else if(m.hasIn){
      content=`<div>IN  7C ${in7} HL ${hl} # ${hash}</div>`;
    }else if(m.hasOut){
      content=`<div>OUT 7C ${out7} HL ${hl} # ${hash}</div>`;
    }

    div.innerHTML=`
      <div style="display:flex;gap:8px;">
        <input type="checkbox" data-id="${m.id}">
        <div style="flex:1;" onclick="editMemo(${m.id})">
          ${content}
          <div class="time">${m.time||""}</div>
        </div>
      </div>
    `;
    memoList.appendChild(div);
  });
}

function editMemo(id){
  const m=memos.find(x=>x.id===id);
  editId=id;
  modal.style.display="flex";
  inChk.checked=m.hasIn;
  outChk.checked=m.hasOut;
  inChk.onchange();

  setTimeout(()=>{
    document.querySelectorAll("[data-k]").forEach(i=>{
      i.value=m[i.dataset.k]||"";
    });
  },50);
}

function deleteSelected(){
  const checks=document.querySelectorAll('.memo input[type="checkbox"]:checked');
  const ids=[...checks].map(c=>Number(c.dataset.id));
  memos=memos.filter(m=>!ids.includes(m.id));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

/* 사진 */
function addPhoto(){photoInput.click();}
photoInput.onchange=e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=()=>{
    photo=r.result;
    localStorage.setItem("jas_photo",photo);
  };
  r.readAsDataURL(f);
};
function openPhoto(){if(!photo)return;photoImg.src=photo;photoLayer.style.display="flex";}
function closePhoto(){photoLayer.style.display="none";}

renderList();
</script>

</body>
</html>
