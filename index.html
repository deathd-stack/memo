<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAS MEMO VER 2</title>

<style>
body{margin:0;font-family:-apple-system;background:#ff9f1c;font-weight:600;}
header{text-align:center;padding:22px;font-size:2.4rem;font-weight:900;cursor:pointer;}

.controls{display:flex;justify-content:center;gap:14px;margin-bottom:12px;}
button{padding:8px 14px;border:none;border-radius:14px;background:#fff;font-weight:900;}

/* 🔥 컴팩트 카드 */
.memo{
  background:#fff;
  margin:8px 10px;
  padding:10px 12px;
  border-radius:14px;
  box-shadow:0 3px 8px rgba(0,0,0,.12);
  transition:.2s;
  font-size:14px;
  line-height:1.3;
}
.memo.flash{animation:flash .5s;}
@keyframes flash{50%{background:#ffe8b5;transform:scale(1.02);}}

.memo strong{font-size:12px;}
.memo div{margin:2px 0;}

.check-line{
  display:flex;
  justify-content:center;
  gap:18px;
  align-items:center;
  white-space:nowrap;
  margin-bottom:12px;
}
.check-line label{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:14px;
}

.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:flex-end;
}
.box{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:24px 24px 0 0;
  padding:16px;
}

.row{display:flex;gap:6px;flex-wrap:nowrap;margin-bottom:6px;align-items:center;}

input{
  padding:4px 6px;
  font-weight:800;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:13px;
}

input[data-4]{width:64px;}
input[data-3]{width:52px;}
input[data-2]{width:40px;}
input[data-long]{width:100%;}

.section{
  background:#f7f7f7;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

.section-title{
  font-size:13px;
  font-weight:900;
  margin-bottom:4px;
}

textarea{
  width:100%;
  height:60px;
  border-radius:10px;
  padding:6px;
  border:1px solid #ccc;
  font-size:13px;
}

.time-inline{
  color:red;
  font-weight:900;
  font-size:13px;
  margin-left:6px;
  cursor:pointer;
}

#photoLayer{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
}
#photoLayer img{
  max-width:100%;
  max-height:100%;
}
</style>
</head>

<body>

<header ondblclick="openPhoto()">JAS MEMO VER 2</header>

<div class="controls">
  <button onclick="newMemo()">ADD</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="addPhoto()">PHOTO</button>
</div>

<div id="memoList"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<div class="modal" id="modal">
<div class="box">

<div class="check-line">
  <label><input type="checkbox" id="inChk"> INBOUND</label>
  <label><input type="checkbox" id="outChk"> OUTBOUND</label>
</div>

<div id="sections"></div>

<div class="row">
  <button onclick="saveMemo()">SAVE</button>
  <button onclick="closeModal()">CLOSE</button>
</div>

</div>
</div>

<div id="photoLayer" ondblclick="closePhoto()">
  <img id="photoImg">
</div>

<script>
const modal=document.getElementById("modal");
const sections=document.getElementById("sections");
const memoList=document.getElementById("memoList");
const photoInput=document.getElementById("photoInput");
const photoLayer=document.getElementById("photoLayer");
const photoImg=document.getElementById("photoImg");
const inChk=document.getElementById("inChk");
const outChk=document.getElementById("outChk");

let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let photo=localStorage.getItem("jas_photo");
let editId=null;

function onlyNum(val,len){
  return (val||"").replace(/[^0-9]/g,'').slice(0,len);
}

document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(!k) return;

  if(k==="HL") e.target.value=onlyNum(e.target.value,4);
  if(k==="HASH") e.target.value=onlyNum(e.target.value,3);
  if(k.includes("-c7")) e.target.value=onlyNum(e.target.value,4);
  if(k.includes("-cob")) e.target.value=onlyNum(e.target.value,3);
  if(k.includes("-d")||k.includes("-bb")||k.includes("-w")||k.includes("-c"))
    e.target.value=onlyNum(e.target.value,2);
  if(k.includes("-tt")||k.includes("-tb"))
    e.target.value=onlyNum(e.target.value,4);
});

function makeSection(type){
  const d=document.createElement("div");
  d.className="section";

  const extraOutbound = type==="OUTBOUND" ? `
    <div class="row">
      T/T <input data-4 data-k="${type}-tt">
      T/B <input data-4 data-k="${type}-tb">
    </div>` : "";

  d.innerHTML=`
    <div class="section-title">${type}</div>

    <div class="row">
      7C <input data-4 data-k="${type}-c7">
      HL <input data-4 data-k="HL">
      # <input data-3 data-k="HASH">
      <span class="time-inline" id="${type}-time"
        ondblclick="editTime('${type}')"></span>
    </div>

    ${[1,2,3,4].map(i=>`
      <div class="row">
        CMPT ${i}
        <input data-long data-k="${type}-cmpt${i}">
      </div>`).join("")}

    <div class="row">
      T <input data-2 data-k="${type}-t">
      D <input data-2 data-k="${type}-d">
      BB <input data-2 data-k="${type}-bb">
    </div>

    <div class="row">
      W <input data-2 data-k="${type}-w">
      C <input data-2 data-k="${type}-c">
      COB <input data-3 data-k="${type}-cob">
    </div>

    ${extraOutbound}

    <textarea data-k="${type}-note"></textarea>
  `;
  return d;
}

inChk.onchange=outChk.onchange=()=>{
  sections.innerHTML="";
  if(inChk.checked) sections.append(makeSection("INBOUND"));
  if(outChk.checked) sections.append(makeSection("OUTBOUND"));
};

function newMemo(){
  editId=null;
  inChk.checked=false;
  outChk.checked=false;
  sections.innerHTML="";
  modal.style.display="flex";
}

function closeModal(){modal.style.display="none";}

function nowTime(){
  const d=new Date();
  return d.getHours().toString().padStart(2,"0")+":"+
         d.getMinutes().toString().padStart(2,"0");
}

function saveMemo(){
  const data={id:editId??Date.now()};
  document.querySelectorAll("[data-k]").forEach(i=>{
    if(i.dataset.k.includes("c7"))
      data[i.dataset.k]=i.value.padStart(4,"0");
    else if(i.dataset.k==="HL")
      data[i.dataset.k]=i.value.padStart(4,"0");
    else if(i.dataset.k==="HASH")
      data[i.dataset.k]=i.value.padStart(3,"0");
    else
      data[i.dataset.k]=i.value;
  });

  data.hasIn=inChk.checked;
  data.hasOut=outChk.checked;

  if(inChk.checked)
    data["INBOUND-time"]=data["INBOUND-time"]||nowTime();
  if(outChk.checked)
    data["OUTBOUND-time"]=data["OUTBOUND-time"]||nowTime();

  if(editId)
    memos[memos.findIndex(m=>m.id===editId)]=data;
  else
    memos.push(data);

  localStorage.setItem("jas_memos",JSON.stringify(memos));
  closeModal();
  renderList(data.id);
}

function editTime(type){
  const newTime=prompt("시간 수정 (HH:MM 24시간)");
  if(!newTime) return;
  document.getElementById(type+"-time").innerText=newTime;

  const m=memos.find(x=>x.id===editId);
  if(m){
    m[type+"-time"]=newTime;
    localStorage.setItem("jas_memos",JSON.stringify(memos));
  }
}

function renderList(flashId){
  memoList.innerHTML="";
  memos.forEach(m=>{
    const div=document.createElement("div");
    div.className="memo";
    if(m.id===flashId) div.classList.add("flash");

    let content="";

    if(m.hasIn){
      content+=`<div><strong>INBOUND</strong></div>
      <div>7C ${m["INBOUND-c7"]||""} HL ${m.HL||""} # ${m.HASH||""}</div>`;
    }

    if(m.hasOut){
      content+=`<div style="margin-top:4px;"><strong>OUTBOUND</strong></div>
      <div>7C ${m["OUTBOUND-c7"]||""} HL ${m.HL||""} # ${m.HASH||""}</div>`;
    }

    div.innerHTML=`
      <div style="display:flex;gap:6px;">
        <input type="checkbox" data-id="${m.id}">
        <div style="flex:1;" onclick="editMemo(${m.id})">
          ${content}
        </div>
      </div>`;
    memoList.appendChild(div);
  });
}

function editMemo(id){
  const m=memos.find(x=>x.id===id);
  editId=id;
  modal.style.display="flex";
  inChk.checked=m.hasIn;
  outChk.checked=m.hasOut;
  inChk.onchange();

  setTimeout(()=>{
    document.querySelectorAll("[data-k]").forEach(i=>{
      i.value=m[i.dataset.k]||"";
    });
    if(m["INBOUND-time"])
      document.getElementById("INBOUND-time").innerText=m["INBOUND-time"];
    if(m["OUTBOUND-time"])
      document.getElementById("OUTBOUND-time").innerText=m["OUTBOUND-time"];
  },50);
}

function deleteSelected(){
  const checks=document.querySelectorAll('.memo input[type="checkbox"]:checked');
  const ids=[...checks].map(c=>Number(c.dataset.id));
  memos=memos.filter(m=>!ids.includes(m.id));
  localStorage.setItem("jas_memos",JSON.stringify(memos));
  renderList();
}

/* 사진 */
function addPhoto(){photoInput.click();}
photoInput.onchange=e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=()=>{
    photo=r.result;
    localStorage.setItem("jas_photo",photo);
  };
  r.readAsDataURL(f);
};
function openPhoto(){if(!photo)return;photoImg.src=photo;photoLayer.style.display="flex";}
function closePhoto(){photoLayer.style.display="none";}

renderList();
</script>

</body>
</html>
