<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>JAS MEMO VER 6.2</title>

<style>
  :root{
    --bg1:#f6df99;
    --bg2:#ffad1f;
    --blue:#2f7df6;
    --blue2:#4a8cff;
    --red:#e20000;
    --line:#d9d9d9;
    --ui:.8;
    --panelBg:rgba(255,255,255,.22);
    --panelStroke:rgba(255,255,255,.38);
    --glass:rgba(255,255,255,.84);
    --glass2:rgba(255,255,255,.92);
    --shadow:0 10px 24px rgba(0,0,0,.14);
    --shadow-soft:0 6px 16px rgba(0,0,0,.10);
  }

  *{box-sizing:border-box}

  html,body{
    -webkit-text-size-adjust:100%;
  }

  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-weight:800;
    background:
      radial-gradient(1200px 700px at 50% -10%, #fff0b8 0%, transparent 52%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    min-height:100vh;
    overflow-x:hidden;
    color:#111;
    padding-bottom:env(safe-area-inset-bottom);
  }

  header{
    text-align:center;
    padding:calc(24px + env(safe-area-inset-top)) 14px 10px;
    user-select:none;
    cursor:pointer;
  }

  .titleWrap{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }

  .titleMain{
    font-size:42px;
    font-weight:1000;
    letter-spacing:-1.8px;
    text-transform:uppercase;
    line-height:1;
    color:#111;
  }

  .titleVer{
    font-size:18px;
    font-weight:1000;
    text-transform:uppercase;
    color:#111;
  }

  .topPanel{
    width:min(780px, calc(100% - 24px));
    margin:0 auto 10px;
    padding:12px;
    border-radius:28px;
    background:var(--panelBg);
    border:2px solid var(--panelStroke);
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  .mainActions{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:10px;
  }

  .subActions{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
    margin-bottom:10px;
  }

  .searchRow{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }

  button{
    border:none;
    border-radius:22px;
    background:var(--glass);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:12px 14px;
    font-weight:1000;
    color:var(--blue);
    font-size:14px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.78),
      0 6px 16px rgba(0,0,0,.14);
    letter-spacing:.2px;
    text-transform:uppercase;
    cursor:pointer;
  }

  button:active{
    transform:scale(.97);
    background:rgba(255,255,255,.72);
  }

  .mainBtn{
    min-height:50px;
    font-size:15px;
  }

  .smallBtn{
    min-height:46px;
    font-size:12px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.72),
      0 4px 12px rgba(0,0,0,.10);
  }

  .searchRow input,
  .searchRow select,
  input, textarea, select{
    font-family:inherit;
    font-weight:1000;
    border:2px solid rgba(0,0,0,.10);
    border-radius:20px;
    outline:none;
    background:rgba(255,255,255,.88);
    -webkit-text-size-adjust:100%;
    font-variant-numeric:tabular-nums;
  }

  .searchRow input{
    width:100%;
    height:50px;
    font-size:15px;
    text-align:left;
    padding:0 16px;
    color:#111;
    text-transform:uppercase;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  }

  .searchRow input::placeholder{
    color:#9a9a9a;
    opacity:1;
  }

  .dayBar{
    width:min(780px, calc(100% - 10px));
    margin:10px auto 14px;
    display:flex;
    align-items:center;
    gap:8px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 10px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  .dayBar::-webkit-scrollbar{
    display:none;
  }

  .dayBtn{
    flex:0 0 auto;
    min-height:42px;
    padding:10px 14px;
    font-size:12px;
    border-radius:999px;
    white-space:nowrap;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.78),
      0 4px 12px rgba(0,0,0,.12);
  }

  .todayBtn{
    color:#fff;
    background:linear-gradient(180deg, var(--blue2), var(--blue));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.25),
      0 8px 18px rgba(47,125,246,.28);
  }

  .dayLabel{
    flex:0 0 auto;
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 18px;
    border-radius:999px;
    background:var(--glass2);
    font-size:13px;
    font-weight:1000;
    color:#111;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.82),
      0 4px 12px rgba(0,0,0,.10);
    white-space:nowrap;
  }

  #memoList{
    padding:10px 14px 220px;
    max-width:780px;
    margin:0 auto;
  }

  .emptyDay{
    background:rgba(255,255,255,.20);
    border:2px solid rgba(255,255,255,.18);
    border-radius:28px;
    padding:22px 18px;
    color:#111;
    text-align:center;
    font-size:16px;
    font-weight:1000;
    margin-bottom:40px;
    box-shadow:var(--shadow-soft);
  }

  .memoCard{
    background:rgba(247,228,195,.92);
    border-radius:28px;
    padding:14px 12px;
    margin:12px 0;
    box-shadow:0 16px 26px rgba(0,0,0,.16);
    border:2px solid rgba(255,255,255,.42);
    overflow:hidden;
    backdrop-filter:blur(6px);
  }

  .memoRow{
    display:flex;
    gap:10px;
    align-items:flex-start;
  }

  .selBox{
    width:30px;
    height:30px;
    border-radius:11px;
    border:2px solid rgba(0,0,0,.20);
    background:#fff;
    appearance:none;
    margin-top:8px;
    flex:0 0 auto;
    position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
  }

  .selBox:checked{
    background:#fff;
    border-color:#1e63d8;
    box-shadow:0 0 0 4px rgba(47,125,246,.14);
  }

  .selBox:checked::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:16px;
    border-right:3px solid #1e63d8;
    border-bottom:3px solid #1e63d8;
    transform:translate(-50%,-60%) rotate(45deg);
  }

  .lines{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
    cursor:pointer;
    min-width:0;
  }

  .line{
    display:flex;
    align-items:flex-start;
    gap:10px;
    min-width:0;
  }

  .tagPill{
    background:#111;
    color:#fff;
    border-radius:999px;
    padding:9px 12px;
    font-weight:1000;
    font-size:15px;
    min-width:68px;
    text-align:center;
    flex:0 0 auto;
    text-transform:uppercase;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
  }

  .textPill{
    background:rgba(210,199,188,.42);
    border-radius:999px;
    padding:10px 14px;
    font-weight:1000;
    font-size:17px;
    color:#111;
    flex:1;
    min-width:0;
    white-space:normal;
    overflow:visible;
    word-break:break-word;
    text-transform:uppercase;
  }

  .subInfo{
    margin-top:6px;
    margin-left:40px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    font-size:12px;
    color:#5a5147;
    font-weight:1000;
    text-transform:uppercase;
  }

  .flash{animation:flash .55s;}
  @keyframes flash{
    50%{transform:scale(1.01); filter:brightness(1.05)}
  }

  .bottomAppButtons{
    position:fixed;
    left:14px;
    bottom:calc(18px + env(safe-area-inset-bottom));
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .itMemoBtn,
  .akMemoBtn,
  .equipBtn{
    width:144px;
    height:48px;
    border-radius:24px;
    font-size:16px;
    font-weight:1000;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .itMemoBtn{
    background:#ffd900;
    color:#111;
    box-shadow:0 14px 22px rgba(216,164,0,.28);
  }

  .akMemoBtn{
    background:#f0001e;
    color:#fff;
    box-shadow:0 14px 22px rgba(200,0,40,.28);
  }

  .equipBtn{
    background:rgba(255,255,255,.9);
    color:#2f6fd1;
  }

  #equipBadge{
    position:fixed;
    right:14px;
    bottom:calc(18px + env(safe-area-inset-bottom));
    z-index:20;
    background:rgba(0,0,0,.84);
    color:#fff;
    border-radius:22px;
    padding:12px 14px;
    font-weight:1000;
    line-height:1.15;
    text-align:right;
    box-shadow:0 14px 26px rgba(0,0,0,.22);
    display:none;
    text-transform:uppercase;
    backdrop-filter:blur(8px);
  }

  #equipBadge .b1{font-size:18px;}
  #equipBadge .b2{font-size:18px; opacity:.95;}

  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:50;
    overscroll-behavior:contain;
    pointer-events:none;
    backdrop-filter:blur(3px);
  }

  .box{
    width:100%;
    max-width:820px;
    background:rgba(255,255,255,.98);
    border-radius:28px 28px 0 0;
    padding:0 14px 16px;
    max-height:92vh;
    overflow:auto;
    transform:translateY(0);
    will-change:transform;
    -webkit-overflow-scrolling:touch;
    pointer-events:auto;
  }

  .dragArea{
    padding:6px 0 8px;
    position:sticky;
    top:0;
    background:rgba(255,255,255,.96);
    z-index:5;
    backdrop-filter:blur(8px);
  }

  .drag-handle{
    width:60px;
    height:7px;
    background:#d1d1d6;
    border-radius:999px;
    margin:0 auto 8px;
  }

  .topActionBar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }

  .topMiniBtn{
    padding:9px 14px;
    font-size:14px;
    border-radius:16px;
    box-shadow:none;
  }

  .modalTitleTap{
    text-align:center;
    font-weight:1000;
    color:#111;
    padding:6px 0 10px;
    cursor:pointer;
    user-select:none;
    text-transform:uppercase;
  }

  .modalTitleTap .m1{
    font-size:18px;
    letter-spacing:-.2px;
  }
  .modalTitleTap .m2{
    font-size:12px;
    opacity:.55;
    margin-top:2px;
  }

  .draftState{
    text-align:center;
    font-size:12px;
    color:#666;
    font-weight:1000;
    padding-bottom:8px;
    text-transform:uppercase;
  }

  .dateLine{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }

  .dateLine .dateLab{
    font-size:15px;
    font-weight:1000;
    color:#111;
    text-transform:uppercase;
  }

  .dateInput{
    width:auto !important;
    min-width:180px;
    text-align:center;
    padding:0 10px;
  }

  .pickRow{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:6px 0 12px;
  }

  .pickPill{
    display:flex;
    align-items:center;
    gap:8px;
    background:#f3f3f3;
    border:2px solid #e5e5ea;
    border-radius:999px;
    padding:10px 14px;
    font-size:15px;
    font-weight:1000;
    text-transform:uppercase;
    user-select:none;
  }

  .pickPill input{
    width:20px;
    height:20px;
    margin:0;
    accent-color:#2f7df6;
  }

  .section{
    background:#f3f3f5;
    border-radius:20px;
    padding:12px;
    margin:10px 0;
    overflow:hidden;
    border:1px solid #e7e7ec;
  }

  .sectionHead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:10px;
    gap:10px;
  }

  .sectionTitle{
    font-size:24px;
    font-weight:1000;
    letter-spacing:.2px;
    text-transform:uppercase;
  }

  .headRight{
    display:flex;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .staStdWrap{
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }

  .staStdLab{
    font-size:16px;
    font-weight:1000;
    color:#111;
    text-transform:uppercase;
  }

  .staStdInput{
    width:92px !important;
    min-width:92px;
    text-align:center;
  }

  .timeWrap{
    display:flex;
    align-items:baseline;
    gap:10px;
    white-space:nowrap;
    text-transform:uppercase;
  }

  .timeBtn{
    border:none;
    background:transparent;
    box-shadow:none;
    padding:4px 8px;
    margin:0;
    font-weight:1000;
    font-size:16px;
    color:#111;
    border-radius:10px;
    text-transform:uppercase;
  }

  .timeBtn:active{background:rgba(226,27,27,.08);}
  .timeVal{
    font-weight:1000;
    font-size:22px;
    color:var(--red);
    min-width:64px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }

  .row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
    flex-wrap:nowrap;
    min-width:0;
  }

  .lab{
    font-size:20px;
    font-weight:1000;
    min-width:46px;
    color:#111;
    white-space:nowrap;
    text-transform:uppercase;
  }

  input{
    width:100%;
    height:52px;
    line-height:52px;
    padding:0 10px;
    text-align:center;
    font-size:16px;
    color:#111;
  }

  textarea{
    width:100%;
    height:76px;
    resize:none;
    font-weight:800;
    padding:10px;
    text-transform:none;
    font-size:16px;
    color:#111;
  }

  select{
    height:52px;
    padding:0 10px;
    font-size:16px;
    color:#111;
  }

  .numBox{
    font-size:18px;
    letter-spacing:.6px;
  }

  .long{
    flex:1;
    min-width:0;
    font-size:16px;
    font-weight:1000;
    padding-left:14px;
    text-align:left;
  }

  .extraBox{
    background:#fff;
    border:2px solid #ececf1;
    border-radius:18px;
    padding:12px;
    margin-top:10px;
  }

  .extraHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    text-transform:uppercase;
  }

  .extraTitle{
    font-size:20px;
    font-weight:1000;
    letter-spacing:.3px;
  }

  .iconBtn{
    width:48px;
    height:48px;
    border-radius:16px;
    border:none;
    background:#fff;
    box-shadow:0 8px 18px rgba(0,0,0,.10);
    color:var(--blue);
    font-size:28px;
    font-weight:1000;
    text-transform:uppercase;
  }

  .extraRow{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:10px;
  }

  .extraRow select{
    width:130px;
    font-size:16px;
    font-weight:1000;
  }

  .extraRow input{
    width:130px;
    font-size:18px;
  }

  .minusBtn{
    width:60px;
    height:52px;
    border-radius:16px;
    border:none;
    background:#eef1f7;
    color:var(--blue);
    font-weight:1000;
    font-size:22px;
    box-shadow:none;
    text-transform:uppercase;
  }

  .lirRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin:12px 0 4px;
    flex-wrap:wrap;
  }

  .lirBtn{
    padding:10px 16px;
    font-size:14px;
    border-radius:14px;
    box-shadow:none;
  }

  #photoLayer{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:90;
  }

  #photoLayer img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }

  .rowGrid3{
    display:grid;
    grid-template-columns:
      26px .9fr
      26px .9fr
      14px .9fr;
    gap:10px;
    align-items:center;
    margin:10px 0;
    min-width:0;
  }

  .rowGridTDBB{
    display:grid;
    grid-template-columns:
      18px 1fr
      18px .9fr
      26px .9fr;
    gap:10px;
    align-items:center;
    margin:10px 0;
    min-width:0;
  }

  .rowGridTTTB{
    display:grid;
    grid-template-columns:
      26px 1fr
      26px 1fr;
    gap:10px;
    align-items:center;
    margin:10px 0;
    min-width:0;
  }

  @media (max-width:520px){
    .titleMain{
      font-size:40px;
    }

    .topPanel{
      width:calc(100% - 18px);
      padding:10px;
      border-radius:26px;
    }

    .mainActions{
      gap:8px;
    }

    .subActions{
      gap:8px;
    }

    .mainBtn{
      min-height:48px;
      font-size:14px;
      padding:10px 8px;
    }

    .smallBtn{
      min-height:44px;
      font-size:12px;
      padding:8px 8px;
    }

    .dayBar{
      gap:7px;
      padding:0 8px;
    }

    .dayBtn{
      min-height:40px;
      font-size:11px;
      padding:9px 13px;
    }

    .dayLabel{
      min-height:40px;
      font-size:12px;
      padding:0 16px;
    }

    .bottomAppButtons{
      left:12px;
      bottom:calc(14px + env(safe-area-inset-bottom));
      gap:10px;
    }

    .itMemoBtn,
    .akMemoBtn,
    .equipBtn{
      width:120px;
      height:42px;
      font-size:14px;
    }

    .topMiniBtn{
      padding:8px 12px;
      font-size:14px;
    }
  }
</style>
</head>

<body>

<header id="homeHeader" onclick="openPhoto()" ondblclick="openPhoto()">
  <div class="titleWrap">
    <div class="titleMain">JAS MEMO</div>
    <div class="titleVer">VER 6.2</div>
  </div>
</header>

<div class="topPanel">
  <div class="mainActions">
    <button type="button" class="mainBtn" onclick="newMemo()">ADD</button>
    <button type="button" class="mainBtn" onclick="deleteSelected()">DELETE</button>
    <button type="button" class="mainBtn" onclick="addPhoto()">PHOTO</button>
  </div>

  <div class="subActions">
    <button type="button" class="smallBtn" onclick="copyPrevDayMemos()">COPY PREV DAY</button>
    <button type="button" class="smallBtn" onclick="exportBackup()">EXPORT JSON</button>
    <button type="button" class="smallBtn" onclick="importBackup()">IMPORT JSON</button>
    <button type="button" class="smallBtn" onclick="clearDraft()">CLEAR DRAFT</button>
  </div>

  <div class="searchRow">
    <input id="searchInput" type="text" placeholder="SEARCH 7C / HL / # / CMPT / NOTE">
  </div>
</div>

<div class="dayBar">
  <button type="button" class="dayBtn" onclick="moveDay(-1)">PREV DAY</button>
  <div class="dayLabel" id="dayLabel">TODAY</div>
  <button type="button" class="dayBtn todayBtn" onclick="goToday()">TODAY</button>
  <button type="button" class="dayBtn" onclick="deleteCurrentDay()">DEL DAY</button>
  <button type="button" class="dayBtn" onclick="moveDay(1)">NEXT DAY</button>
</div>

<div id="memoList"></div>

<div class="bottomAppButtons">
  <button class="itMemoBtn" onclick="location.href='https://deathd-stack.github.io/JAS2/'">IT MEMO</button>
  <button class="akMemoBtn" onclick="location.href='https://deathd-stack.github.io/JAS1/'">AK MEMO</button>
  <button class="equipBtn" type="button" onclick="openEquip()">EQUIPMENT</button>
</div>

<div id="equipBadge"></div>

<input type="file" id="photoInput" accept="image/*" hidden />
<input type="file" id="lirPhotoInput" accept="image/*" hidden />
<input type="file" id="importInput" accept=".json,application/json" hidden />

<div class="modal" id="modal" aria-hidden="true">
  <div class="box" id="sheet" role="dialog" aria-modal="true">
    <div class="dragArea" id="dragArea">
      <div class="drag-handle"></div>
      <div class="topActionBar">
        <button type="button" class="topMiniBtn" onclick="saveMemo()">SAVE</button>
        <button type="button" class="topMiniBtn" onclick="closeModal()">CLOSE</button>
      </div>
    </div>

    <div class="modalTitleTap" onclick="openPhoto()">
      <div class="m1">JAS MEMO</div>
      <div class="m2">TAP TO OPEN PHOTO</div>
    </div>

    <div class="draftState" id="draftState">DRAFT READY</div>

    <div class="dateLine">
      <div class="dateLab">DATE</div>
      <input type="date" id="memoDate" class="dateInput">
    </div>

    <div class="pickRow">
      <label class="pickPill">
        <input type="checkbox" id="pickInbound" checked>
        <span>INBOUND</span>
      </label>
      <label class="pickPill">
        <input type="checkbox" id="pickOutbound" checked>
        <span>OUTBOUND</span>
      </label>
    </div>

    <div id="sections"></div>
  </div>
</div>

<div id="photoLayer" ondblclick="closePhoto()" onclick="closePhoto()">
  <img id="photoImg" alt="photo" />
</div>

<div class="modal" id="equipModal" aria-hidden="true">
  <div class="box" style="max-height:70vh" onclick="event.stopPropagation()">
    <div class="dragArea">
      <div class="drag-handle"></div>
      <div class="topActionBar">
        <button type="button" class="topMiniBtn" onclick="saveEquip()">SAVE</button>
        <button type="button" class="topMiniBtn" onclick="closeEquip()">CLOSE</button>
      </div>
    </div>

    <div style="font-weight:1000;font-size:20px;margin:6px 0 12px; text-transform:uppercase;">EQUIPMENT</div>

    <div class="row">
      <div class="lab" style="min-width:72px;">TUG</div>
      <input id="tug1" class="numBox" inputmode="numeric" maxlength="2" placeholder="00">
      <input id="tug2" class="numBox" inputmode="numeric" maxlength="2" placeholder="00">
    </div>

    <div class="row">
      <div class="lab" style="min-width:72px;">BELT</div>
      <input id="belt" class="numBox" inputmode="numeric" maxlength="2" placeholder="00">
    </div>
  </div>
</div>

<script>
  const MEMO_KEY = "jas_memos_v62";
  const PHOTO_KEY = "jas_photo_v62";
  const EQUIP_KEY = "jas_equipment_v62";
  const DRAFT_KEY = "jas_draft_v62";
  const LAST_PICK_KEY = "jas_last_pick_v62";

  const modal = document.getElementById("modal");
  const sheet = document.getElementById("sheet");
  const dragArea = document.getElementById("dragArea");
  const sections = document.getElementById("sections");
  const memoList = document.getElementById("memoList");
  const photoInput = document.getElementById("photoInput");
  const lirPhotoInput = document.getElementById("lirPhotoInput");
  const importInput = document.getElementById("importInput");
  const photoLayer = document.getElementById("photoLayer");
  const photoImg = document.getElementById("photoImg");
  const memoDate = document.getElementById("memoDate");
  const dayLabel = document.getElementById("dayLabel");
  const pickInbound = document.getElementById("pickInbound");
  const pickOutbound = document.getElementById("pickOutbound");
  const searchInput = document.getElementById("searchInput");
  const draftState = document.getElementById("draftState");

  const equipBadge = document.getElementById("equipBadge");
  const equipModal = document.getElementById("equipModal");
  const tug1 = document.getElementById("tug1");
  const tug2 = document.getElementById("tug2");
  const belt = document.getElementById("belt");

  let memos = JSON.parse(localStorage.getItem(MEMO_KEY) || "[]");
  let photo = localStorage.getItem(PHOTO_KEY) || "";
  let editId = null;
  let dayOffset = 0;
  let activeLirType = null;
  let currentLirPhotos = { INBOUND:"", OUTBOUND:"" };
  let midnightTimer = null;

  const EXTRA_KEYS = ["CREW","W","C","COB","STRAP","GB","TS","EMS","CARSEAT","COMAT","LONGFIN","RUSH"];

  function onlyNum(val, len){
    return (val || "").replace(/[^0-9]/g, "").slice(0, len);
  }

  function pad(val, len){
    const v = onlyNum(val, len);
    return v ? v.padStart(len, "0") : "";
  }

  function cleanTextUpper(val){
    return (val || "").toUpperCase().trim();
  }

  function defaultF(val){
    const v = cleanTextUpper(val);
    return v ? v : "F";
  }

  function nowTime(){
    const d = new Date();
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  function normalizeTimeText(val){
    const raw = (val || "").trim();
    if(!raw) return "";
    const digits = raw.replace(/[^0-9]/g, "");
    if(digits.length === 3) return digits.slice(0,1) + ":" + digits.slice(1,3);
    if(digits.length >= 4) return digits.slice(0,2) + ":" + digits.slice(2,4);
    return raw.slice(0,5);
  }

  function askTime(currentValue=""){
    const t = prompt("TIME (HH:MM 24H)", currentValue || nowTime());
    if(t === null) return null;
    return normalizeTimeText(t);
  }

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function dateToStr(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function getViewingDate(){
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + dayOffset);
    return d;
  }

  function getViewingDayKey(){
    return dateToStr(getViewingDate());
  }

  function updateDayLabel(){
    dayLabel.textContent = getViewingDayKey();
  }

  function calcDayOffsetFromDate(dateStr){
    const base = new Date(todayStr());
    const target = new Date(dateStr);
    base.setHours(0,0,0,0);
    target.setHours(0,0,0,0);
    return Math.round((target - base) / 86400000);
  }

  function moveDay(n){
    dayOffset += n;
    updateDayLabel();
    renderList();
  }

  function goToday(){
    dayOffset = 0;
    updateDayLabel();
    renderList();
  }

  function deleteCurrentDay(){
    const dk = getViewingDayKey();
    const target = memos.filter(m => (m.dayKey || m.memoDate) === dk);
    if(!target.length){
      alert("NO MEMO IN THIS DAY");
      return;
    }
    if(!confirm("DELETE ALL MEMOS IN THIS DAY?")) return;
    memos = memos.filter(m => (m.dayKey || m.memoDate) !== dk);
    persistMemos();
    renderList();
  }

  function persistMemos(){
    localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
  }

  function setDraftState(msg){
    draftState.textContent = msg;
  }

  document.addEventListener("input", (e)=>{
    const t = e.target;
    if(!(t instanceof HTMLInputElement)) return;
    const k = t.dataset.k || "";
    if(!k) return;

    if(k === "SHARED-HL"){
      t.value = onlyNum(t.value, 4);
      document.querySelectorAll('input[data-k="SHARED-HL"]').forEach(el=>{
        if(el !== t) el.value = t.value;
      });
      autoNext(t, 4);
      saveDraftFromUI();
      return;
    }

    if(k === "SHARED-HASH"){
      t.value = onlyNum(t.value, 3);
      document.querySelectorAll('input[data-k="SHARED-HASH"]').forEach(el=>{
        if(el !== t) el.value = t.value;
      });
      autoNext(t, 3);
      saveDraftFromUI();
      return;
    }

    if(k.endsWith("-7C")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-STA")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-STD")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-t")) t.value = onlyNum(t.value, 3);
    if(k.endsWith("-d")) t.value = onlyNum(t.value, 2);
    if(k.endsWith("-bb")) t.value = onlyNum(t.value, 2);
    if(k.endsWith("-tt")) t.value = onlyNum(t.value, 4);
    if(k.endsWith("-tb")) t.value = onlyNum(t.value, 4);
    if(k.startsWith("extraVal-")) t.value = onlyNum(t.value, 3);

    const max = Number(t.getAttribute("maxlength") || "0");
    if(max > 0) autoNext(t, max);
    saveDraftFromUI();
  });

  document.addEventListener("input", (e)=>{
    if(e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLSelectElement){
      saveDraftFromUI();
    }
  });

  function autoNext(el, maxLen){
    if(!el || !maxLen) return;
    if((el.value || "").length < maxLen) return;
    const all = [...sheet.querySelectorAll("input, textarea, select")].filter(x=> !x.disabled && x.offsetParent !== null);
    const idx = all.indexOf(el);
    if(idx >= 0 && all[idx+1]){
      const next = all[idx+1];
      if(next instanceof HTMLInputElement || next instanceof HTMLTextAreaElement){
        next.focus();
        if(next.select) next.select();
      }
    }
  }

  function makeExtraRow(type, key="CREW", val=""){
    const row = document.createElement("div");
    row.className = "extraRow";
    row.innerHTML = `
      <select>
        ${EXTRA_KEYS.map(k => `<option value="${k}" ${k===key ? "selected" : ""}>${k}</option>`).join("")}
      </select>
      <input class="numBox" inputmode="numeric" maxlength="3" placeholder="000" data-k="extraVal-${type}" value="${onlyNum(val,3)}">
      <button type="button" class="minusBtn" onclick="removeExtraRow(this)">-</button>
    `;
    row.querySelector("select").addEventListener("change", saveDraftFromUI);
    return row;
  }

  function removeExtraRow(btn){
    btn.parentElement.remove();
    saveDraftFromUI();
  }

  function addExtraRow(type){
    const root = sections.querySelector(`.section[data-type="${type}"]`);
    const box = root ? root.querySelector(`#${type}-EXTRAS`) : null;
    if(!box) return;
    box.appendChild(makeExtraRow(type, "CREW", ""));
    saveDraftFromUI();
  }

  function bindEditableTime(el, initialValue){
    el.textContent = initialValue || "";
    el.addEventListener("click", ()=>{
      const t = askTime(el.textContent || "");
      if(t !== null){
        el.textContent = t;
        saveDraftFromUI();
      }
    });
  }

  function openLirPicker(type){
    activeLirType = type;
    lirPhotoInput.value = "";
    lirPhotoInput.click();
  }

  function viewLirPhoto(type){
    const src = currentLirPhotos[type] || "";
    if(!src){
      alert("NO LIR PHOTO");
      return;
    }
    photoImg.src = src;
    photoLayer.style.display = "flex";
  }

  function makeSection(type, memoData){
    const d = document.createElement("div");
    d.className = "section";
    d.dataset.type = type;

    const savedTime = memoData ? (memoData[type+"-TIME"] || "") : "";
    const local7C = memoData ? (memoData[type+"-7C"] || "") : "";
    const sharedHL = memoData ? (memoData.sharedHL || "") : "";
    const sharedHASH = memoData ? (memoData.sharedHASH || "") : "";
    const v = (k)=> memoData ? (memoData[type+"-"+k] || "") : "";
    const noteV = memoData ? (memoData[type+"-note"] || "") : "";

    const cmpt1Val = memoData ? defaultF(memoData[type+"-cmpt1"]) : "F";
    const cmpt2Val = memoData ? defaultF(memoData[type+"-cmpt2"]) : "F";

    const staStdLabel = type === "INBOUND" ? "STA" : "STD";
    const staStdKey = type === "INBOUND" ? "STA" : "STD";

    d.innerHTML = `
      <div class="sectionHead">
        <div class="sectionTitle">${type}</div>
        <div class="headRight">
          <div class="staStdWrap">
            <div class="staStdLab">${staStdLabel}</div>
            <input class="numBox staStdInput" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-${staStdKey}" value="${v(staStdKey)}">
          </div>
          <div class="timeWrap">
            <button type="button" class="timeBtn" data-timebtn="${type}">TIME</button>
            <div class="timeVal" id="${type}-TIMESHOWN"></div>
          </div>
        </div>
      </div>

      <div class="rowGrid3">
        <div class="lab">7C</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-7C" value="${local7C}">
        <div class="lab">HL</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="SHARED-HL" value="${sharedHL}">
        <div class="lab">#</div>
        <input class="numBox" inputmode="numeric" maxlength="3" placeholder="000" data-k="SHARED-HASH" value="${sharedHASH}">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 1</div>
        <input class="long" data-k="${type}-cmpt1" value="${cmpt1Val}" placeholder="TEXT">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 2</div>
        <input class="long" data-k="${type}-cmpt2" value="${cmpt2Val}" placeholder="TEXT">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 3</div>
        <input class="long" data-k="${type}-cmpt3" placeholder="TEXT" value="${memoData ? (memoData[type+'-cmpt3'] || '') : ''}">
      </div>

      <div class="row">
        <div class="lab" style="min-width:96px;">CMPT 4</div>
        <input class="long" data-k="${type}-cmpt4" placeholder="TEXT" value="${memoData ? (memoData[type+'-cmpt4'] || '') : ''}">
      </div>

      <div class="rowGridTDBB">
        <div class="lab">T</div>
        <input class="numBox" inputmode="numeric" maxlength="3" placeholder="000" data-k="${type}-t" value="${v("t")}">
        <div class="lab">D</div>
        <input class="numBox" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type}-d" value="${v("d")}">
        <div class="lab">BB</div>
        <input class="numBox" inputmode="numeric" maxlength="2" placeholder="00" data-k="${type}-bb" value="${v("bb")}">
      </div>

      ${type === "OUTBOUND" ? `
      <div class="rowGridTTTB">
        <div class="lab">T/T</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-tt" value="${v("tt")}">
        <div class="lab">T/B</div>
        <input class="numBox" inputmode="numeric" maxlength="4" placeholder="0000" data-k="${type}-tb" value="${v("tb")}">
      </div>

      <div class="lirRow">
        <button type="button" class="lirBtn" data-lir-add="${type}">LIR</button>
        <button type="button" class="lirBtn" data-lir-view="${type}">VIEW</button>
      </div>
      ` : ""}

      <div class="extraBox">
        <div class="extraHead">
          <div class="extraTitle">EXTRA</div>
          <button type="button" class="iconBtn" onclick="addExtraRow('${type}')">+</button>
        </div>
        <div id="${type}-EXTRAS"></div>
      </div>

      <textarea data-k="${type}-note" placeholder="NOTE (${type})">${noteV}</textarea>
    `;

    const timeBtn = d.querySelector(`[data-timebtn="${type}"]`);
    const timeShown = d.querySelector(`#${type}-TIMESHOWN`);
    bindEditableTime(timeShown, savedTime);

    timeBtn.addEventListener("click", ()=>{
      timeShown.textContent = nowTime();
      saveDraftFromUI();
    });

    timeBtn.addEventListener("dblclick", ()=>{
      const t = askTime(timeShown.textContent || "");
      if(t !== null){
        timeShown.textContent = t;
        saveDraftFromUI();
      }
    });

    const lirAddBtn = d.querySelector(`[data-lir-add="${type}"]`);
    const lirViewBtn = d.querySelector(`[data-lir-view="${type}"]`);

    if(lirAddBtn){
      lirAddBtn.addEventListener("click", ()=>{
        openLirPicker(type);
      });
    }

    if(lirViewBtn){
      lirViewBtn.addEventListener("click", ()=>{
        viewLirPhoto(type);
      });
    }

    const extrasBox = d.querySelector(`#${type}-EXTRAS`);
    const extras = memoData ? (memoData[type+"-EXTRAS"] || []) : [];
    extras.forEach(ex => extrasBox.appendChild(makeExtraRow(type, ex.key, ex.val)));

    return d;
  }

  function buildSectionsBlank(){
    sections.innerHTML = "";
    if(pickInbound.checked) sections.appendChild(makeSection("INBOUND", null));
    if(pickOutbound.checked) sections.appendChild(makeSection("OUTBOUND", null));
  }

  function rebuildSectionsFromMemo(memoData){
    sections.innerHTML = "";
    if(pickInbound.checked) sections.appendChild(makeSection("INBOUND", memoData));
    if(pickOutbound.checked) sections.appendChild(makeSection("OUTBOUND", memoData));
  }

  function getLastPick(){
    return JSON.parse(localStorage.getItem(LAST_PICK_KEY) || '{"in":true,"out":true}');
  }

  function saveLastPick(){
    localStorage.setItem(LAST_PICK_KEY, JSON.stringify({
      in: !!pickInbound.checked,
      out: !!pickOutbound.checked
    }));
  }

  function newMemo(){
    editId = null;
    memoDate.value = getViewingDayKey();
    const lp = getLastPick();
    pickInbound.checked = lp.in !== false;
    pickOutbound.checked = lp.out !== false;
    if(!pickInbound.checked && !pickOutbound.checked){
      pickInbound.checked = true;
      pickOutbound.checked = true;
    }
    currentLirPhotos = { INBOUND:"", OUTBOUND:"" };
    buildSectionsBlank();
    loadDraftIntoUI();
    openModal();
    setDraftState("DRAFT READY");
  }

  function openModal(){
    modal.style.display = "flex";
    modal.setAttribute("aria-hidden","false");
    sheet.style.transform = "translateY(0)";
    currentTranslate = 0;
  }

  function closeModal(){
    modal.style.display = "none";
    modal.setAttribute("aria-hidden","true");
    editId = null;
    activeLirType = null;
    updateEquipBadge();
  }

  function ensureAtLeastOnePick(changed){
    if(!pickInbound.checked && !pickOutbound.checked){
      changed.checked = true;
      alert("INBOUND OR OUTBOUND SELECT");
      return false;
    }
    saveLastPick();
    saveDraftFromUI();
    return true;
  }

  pickInbound.addEventListener("change", ()=>{
    if(!ensureAtLeastOnePick(pickInbound)) return;
    if(editId){
      const m = memos.find(x=>x.id===editId);
      rebuildSectionsFromMemo(m || null);
    }else{
      buildSectionsBlank();
    }
    saveDraftFromUI();
  });

  pickOutbound.addEventListener("change", ()=>{
    if(!ensureAtLeastOnePick(pickOutbound)) return;
    if(editId){
      const m = memos.find(x=>x.id===editId);
      rebuildSectionsFromMemo(m || null);
    }else{
      buildSectionsBlank();
    }
    saveDraftFromUI();
  });

  function collectDraftData(){
    const data = {
      editId,
      memoDate: memoDate.value || getViewingDayKey(),
      hasIn: !!pickInbound.checked,
      hasOut: !!pickOutbound.checked,
      sharedHL: pad(document.querySelector('input[data-k="SHARED-HL"]')?.value || "", 4),
      sharedHASH: pad(document.querySelector('input[data-k="SHARED-HASH"]')?.value || "", 3),
      currentLirPhotos
    };

    ["INBOUND","OUTBOUND"].forEach(type=>{
      const root = sections.querySelector(`.section[data-type="${type}"]`);
      if(!root){
        data[type+"-7C"] = "";
        data[type+"-STA"] = "";
        data[type+"-STD"] = "";
        data[type+"-t"] = "";
        data[type+"-d"] = "";
        data[type+"-bb"] = "";
        data[type+"-tt"] = "";
        data[type+"-tb"] = "";
        data[type+"-cmpt1"] = "F";
        data[type+"-cmpt2"] = "F";
        data[type+"-cmpt3"] = "";
        data[type+"-cmpt4"] = "";
        data[type+"-note"] = "";
        data[type+"-TIME"] = "";
        data[type+"-EXTRAS"] = [];
        data[type+"-LIRPHOTO"] = currentLirPhotos[type] || "";
        return;
      }

      const gi = (k)=> root.querySelector(`input[data-k="${type}-${k}"]`);
      const cm = (n)=> root.querySelector(`input[data-k="${type}-cmpt${n}"]`);
      const note = root.querySelector(`textarea[data-k="${type}-note"]`);
      data[type+"-7C"] = pad(gi("7C")?.value || "", 4);
      data[type+"-STA"] = type==="INBOUND" ? pad(gi("STA")?.value, 4) : "";
      data[type+"-STD"] = type==="OUTBOUND" ? pad(gi("STD")?.value, 4) : "";
      data[type+"-t"] = pad(gi("t")?.value, 3);
      data[type+"-d"] = pad(gi("d")?.value, 2);
      data[type+"-bb"] = pad(gi("bb")?.value, 2);
      data[type+"-tt"] = type==="OUTBOUND" ? pad(gi("tt")?.value, 4) : "";
      data[type+"-tb"] = type==="OUTBOUND" ? pad(gi("tb")?.value, 4) : "";
      data[type+"-cmpt1"] = defaultF(cm(1)?.value || "");
      data[type+"-cmpt2"] = defaultF(cm(2)?.value || "");
      data[type+"-cmpt3"] = cleanTextUpper(cm(3)?.value || "");
      data[type+"-cmpt4"] = cleanTextUpper(cm(4)?.value || "");
      data[type+"-note"] = note ? (note.value || "") : "";
      const shown = document.getElementById(type+"-TIMESHOWN");
      data[type+"-TIME"] = shown ? normalizeTimeText(shown.textContent || "") : "";

      const extras = [];
      const box = root.querySelector(`#${type}-EXTRAS`);
      if(box){
        [...box.querySelectorAll(".extraRow")].forEach(r=>{
          const key = (r.querySelector("select")?.value || "").toUpperCase();
          const val = pad(r.querySelector("input")?.value || "", 3);
          if(key && val) extras.push({key, val});
        });
      }
      data[type+"-EXTRAS"] = extras;
      data[type+"-LIRPHOTO"] = currentLirPhotos[type] || "";
    });

    return data;
  }

  function saveDraftFromUI(){
    if(modal.style.display !== "flex") return;
    const draft = collectDraftData();
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    setDraftState("DRAFT AUTO SAVED");
  }

  function loadDraftIntoUI(){
    if(editId) return;
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    let d;
    try{
      d = JSON.parse(raw);
    }catch{
      return;
    }
    if(!d) return;

    if(confirm("LOAD SAVED DRAFT?")){
      memoDate.value = d.memoDate || getViewingDayKey();
      pickInbound.checked = d.hasIn !== false;
      pickOutbound.checked = d.hasOut !== false;
      if(!pickInbound.checked && !pickOutbound.checked){
        pickInbound.checked = true;
      }
      currentLirPhotos = d.currentLirPhotos || { INBOUND:"", OUTBOUND:"" };
      rebuildSectionsFromMemo(d);
      document.querySelectorAll('input[data-k="SHARED-HL"]').forEach(el => el.value = d.sharedHL || "");
      document.querySelectorAll('input[data-k="SHARED-HASH"]').forEach(el => el.value = d.sharedHASH || "");
      setDraftState("DRAFT LOADED");
    }
  }

  function clearDraft(silent=false){
    localStorage.removeItem(DRAFT_KEY);
    if(!silent) alert("DRAFT CLEARED");
    setDraftState("DRAFT CLEARED");
  }

  function saveMemo(){
    if(!pickInbound.checked && !pickOutbound.checked){
      alert("INBOUND OR OUTBOUND SELECT");
      return;
    }

    const data = collectDraftData();
    data.id = editId ?? Date.now();
    data.dayKey = data.memoDate;

    if(editId){
      const idx = memos.findIndex(m=>m.id===editId);
      if(idx >= 0) memos[idx] = data;
    }else{
      memos.push(data);
    }

    persistMemos();
    saveLastPick();
    clearDraft(true);

    dayOffset = calcDayOffsetFromDate(data.memoDate);
    updateDayLabel();
    closeModal();
    renderList(data.id);
  }

  function formatCombinedLine(m){
    const v7cIn = (m["INBOUND-7C"] || "").trim();
    const v7cOut = (m["OUTBOUND-7C"] || "").trim();
    const v7c = v7cIn || v7cOut || "";
    const vhl = (m.sharedHL || "").trim();
    const hash = (m.sharedHASH || "").trim();
    return `7C[${v7c}] HL[${vhl}] #[${hash}]`;
  }

  function formatSplitLine(m, type){
    const v7c = (m[type+"-7C"] || "").trim();
    const vhl = (m.sharedHL || "").trim();
    const hash = (m.sharedHASH || "").trim();

    if(type === "INBOUND"){
      return `7C[${v7c}] HL[${vhl}]`;
    }
    return `7C[${v7c}] #[${hash}]`;
  }

  function getSearchableText(m){
    return [
      m.memoDate,
      m.sharedHL,
      m.sharedHASH,
      m["INBOUND-7C"], m["OUTBOUND-7C"],
      m["INBOUND-STA"], m["OUTBOUND-STD"],
      m["INBOUND-cmpt1"], m["INBOUND-cmpt2"], m["INBOUND-cmpt3"], m["INBOUND-cmpt4"],
      m["OUTBOUND-cmpt1"], m["OUTBOUND-cmpt2"], m["OUTBOUND-cmpt3"], m["OUTBOUND-cmpt4"],
      m["INBOUND-note"], m["OUTBOUND-note"],
      ...(m["INBOUND-EXTRAS"] || []).map(x=>`${x.key} ${x.val}`),
      ...(m["OUTBOUND-EXTRAS"] || []).map(x=>`${x.key} ${x.val}`)
    ].join(" ").toUpperCase();
  }

  function renderList(flashId){
    memoList.innerHTML = "";

    const viewingDay = getViewingDayKey();
    const q = cleanTextUpper(searchInput.value || "");

    let dayMemos = memos
      .filter(m => (m.dayKey || m.memoDate || todayStr()) === viewingDay)
      .filter(m => !q || getSearchableText(m).includes(q))
      .sort((a,b)=> Number(a.id) - Number(b.id));

    if(!dayMemos.length){
      memoList.innerHTML = `<div class="emptyDay">NO MEMO IN THIS DAY</div>`;
      return;
    }

    dayMemos.forEach(m=>{
      const hasIn = m.hasIn !== false;
      const hasOut = m.hasOut !== false;
      const inTime = m["INBOUND-TIME"] || "";
      const outTime = m["OUTBOUND-TIME"] || "";

      let linesHtml = "";

      if(hasIn && hasOut){
        linesHtml = `
          <div class="line"><div class="tagPill">IN</div><div class="textPill">${formatSplitLine(m, "INBOUND")}</div></div>
          <div class="line"><div class="tagPill">OUT</div><div class="textPill">${formatSplitLine(m, "OUTBOUND")}</div></div>
        `;
      }else{
        const singleTag = hasIn ? "IN" : "OUT";
        linesHtml = `
          <div class="line"><div class="tagPill">${singleTag}</div><div class="textPill">${formatCombinedLine(m)}</div></div>
        `;
      }

      const card = document.createElement("div");
      card.className = "memoCard" + (m.id===flashId ? " flash" : "");
      card.innerHTML = `
        <div class="memoRow">
          <input class="selBox" type="checkbox" data-id="${m.id}">
          <div class="lines" data-open="${m.id}">
            ${linesHtml}
          </div>
        </div>
        <div class="subInfo">
          <div>${m.memoDate || ""}</div>
          ${inTime ? `<div>IN ${inTime}</div>` : ``}
          ${outTime ? `<div>OUT ${outTime}</div>` : ``}
        </div>
      `;
      memoList.appendChild(card);
    });

    memoList.querySelectorAll("[data-open]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const id = Number(el.getAttribute("data-open"));
        editMemo(id);
      });
    });
  }

  function editMemo(id){
    const m = memos.find(x=>x.id===id);
    if(!m) return;

    editId = id;
    memoDate.value = m.memoDate || getViewingDayKey();
    pickInbound.checked = m.hasIn !== false;
    pickOutbound.checked = m.hasOut !== false;
    currentLirPhotos = {
      INBOUND: m["INBOUND-LIRPHOTO"] || "",
      OUTBOUND: m["OUTBOUND-LIRPHOTO"] || ""
    };
    rebuildSectionsFromMemo(m);
    document.querySelectorAll('input[data-k="SHARED-HL"]').forEach(el => el.value = m.sharedHL || "");
    document.querySelectorAll('input[data-k="SHARED-HASH"]').forEach(el => el.value = m.sharedHASH || "");
    openModal();
    setDraftState("EDIT MODE");
  }

  function deleteSelected(){
    const checks = document.querySelectorAll('.selBox:checked');
    const ids = [...checks].map(c=>Number(c.dataset.id));
    if(!ids.length){
      alert("SELECT MEMO");
      return;
    }
    if(!confirm("DELETE SELECTED MEMOS?")) return;
    memos = memos.filter(m=>!ids.includes(m.id));
    persistMemos();
    renderList();
  }

  function addPhoto(){
    photoInput.value = "";
    photoInput.click();
  }

  function loadImageFromFile(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=> resolve(img);
        img.onerror = ()=> reject(new Error("IMAGE LOAD FAIL"));
        img.src = String(reader.result || "");
      };
      reader.onerror = ()=> reject(new Error("FILE READ FAIL"));
      reader.readAsDataURL(file);
    });
  }

  function compressImageToDataUrl(img, maxW = 1600, maxH = 1600, quality = 0.82){
    const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
    const w = Math.max(1, Math.round(img.width * ratio));
    const h = Math.max(1, Math.round(img.height * ratio));

    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext("2d");
    if(!ctx) throw new Error("CANVAS FAIL");
    ctx.drawImage(img, 0, 0, w, h);

    return canvas.toDataURL("image/jpeg", quality);
  }

  async function makeStablePhotoData(file){
    const img = await loadImageFromFile(file);

    const tries = [
      { maxW:1600, maxH:1600, quality:0.82 },
      { maxW:1600, maxH:1600, quality:0.70 },
      { maxW:1440, maxH:1440, quality:0.60 },
      { maxW:1280, maxH:1280, quality:0.52 },
      { maxW:1080, maxH:1080, quality:0.48 },
      { maxW:960,  maxH:960,  quality:0.42 }
    ];

    for(const t of tries){
      const dataUrl = compressImageToDataUrl(img, t.maxW, t.maxH, t.quality);
      if(dataUrl.length < 2800000) return dataUrl;
    }

    return compressImageToDataUrl(img, 860, 860, 0.36);
  }

  function syncPhotoFromStorage(forceDraw = false){
    const savedPhoto = localStorage.getItem(PHOTO_KEY) || "";
    photo = savedPhoto;

    if(forceDraw || photoLayer.style.display === "flex"){
      if(photo){
        photoImg.src = photo;
      }else{
        photoImg.removeAttribute("src");
      }
    }
  }

  async function savePhotoFile(file){
    try{
      const stableDataUrl = await makeStablePhotoData(file);
      localStorage.setItem(PHOTO_KEY, stableDataUrl);
      photo = stableDataUrl;
      photoImg.src = stableDataUrl;
      alert("PHOTO SAVED");
    }catch(err){
      console.error(err);
      alert("PHOTO SAVE FAIL");
    }
  }

  async function saveLirPhotoFile(file, type){
    try{
      const stableDataUrl = await makeStablePhotoData(file);
      currentLirPhotos[type] = stableDataUrl;
      saveDraftFromUI();
      alert("LIR PHOTO SAVED");
    }catch(err){
      console.error(err);
      alert("LIR PHOTO SAVE FAIL");
    }
  }

  photoInput.onchange = async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    await savePhotoFile(f);
  };

  lirPhotoInput.onchange = async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f || !activeLirType) return;
    await saveLirPhotoFile(f, activeLirType);
  };

  function openPhoto(){
    syncPhotoFromStorage(true);
    if(!photo) return;
    photoLayer.style.display = "flex";
  }

  function closePhoto(){
    photoLayer.style.display = "none";
  }

  window.addEventListener("pageshow", ()=>{
    syncPhotoFromStorage(true);
    checkDayRollover();
  });

  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible"){
      syncPhotoFromStorage(true);
      checkDayRollover();
    }
  });

  function openEquip(){
    const eq = JSON.parse(localStorage.getItem(EQUIP_KEY) || "{}");
    tug1.value = pad(eq.tug1,2);
    tug2.value = pad(eq.tug2,2);
    belt.value = pad(eq.belt,2);
    equipModal.style.display = "flex";
    equipModal.setAttribute("aria-hidden","false");
  }

  function closeEquip(){
    equipModal.style.display = "none";
    equipModal.setAttribute("aria-hidden","true");
  }

  function saveEquip(){
    const eq = {
      tug1: pad(tug1.value,2),
      tug2: pad(tug2.value,2),
      belt: pad(belt.value,2)
    };
    localStorage.setItem(EQUIP_KEY, JSON.stringify(eq));
    updateEquipBadge();
    closeEquip();
  }

  function updateEquipBadge(){
    const eq = JSON.parse(localStorage.getItem(EQUIP_KEY) || "{}");
    if(!eq.tug1 && !eq.tug2 && !eq.belt){
      equipBadge.style.display = "none";
      return;
    }
    const t1 = eq.tug1 || "00";
    const t2 = eq.tug2 || "00";
    const b = eq.belt || "00";
    equipBadge.innerHTML = `
      <div class="b1">TUG ${t1}/${t2}</div>
      <div class="b2">BELT ${b}</div>
    `;
    equipBadge.style.display = "block";
  }

  equipModal.addEventListener("click",(e)=>{
    if(e.target === equipModal) closeEquip();
  });

  function copyPrevDayMemos(){
    const currentDay = getViewingDayKey();
    const prev = new Date(currentDay);
    prev.setDate(prev.getDate() - 1);
    const prevDay = dateToStr(prev);

    const prevMemos = memos.filter(m => (m.dayKey || m.memoDate) === prevDay);
    if(!prevMemos.length){
      alert("NO MEMO IN PREV DAY");
      return;
    }
    if(!confirm(`COPY ${prevDay} MEMOS TO ${currentDay}?`)) return;

    const clones = prevMemos.map(m=>{
      const c = JSON.parse(JSON.stringify(m));
      c.id = Date.now() + Math.floor(Math.random() * 1000000) + Math.floor(Math.random() * 1000);
      c.memoDate = currentDay;
      c.dayKey = currentDay;
      return c;
    });

    memos.push(...clones);
    persistMemos();
    renderList();
    alert("COPIED");
  }

  function exportBackup(){
    const payload = {
      version: "6.2",
      exportedAt: new Date().toISOString(),
      memos,
      equipment: JSON.parse(localStorage.getItem(EQUIP_KEY) || "{}"),
      photo: localStorage.getItem(PHOTO_KEY) || ""
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `jas-memo-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

  function importBackup(){
    importInput.value = "";
    importInput.click();
  }

  importInput.onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;

    try{
      const text = await file.text();
      const data = JSON.parse(text);

      if(!data || !Array.isArray(data.memos)){
        alert("INVALID BACKUP FILE");
        return;
      }

      if(!confirm("IMPORT BACKUP AND REPLACE CURRENT MEMOS?")) return;

      memos = data.memos;
      persistMemos();

      if(data.equipment){
        localStorage.setItem(EQUIP_KEY, JSON.stringify(data.equipment));
      }
      if(typeof data.photo === "string"){
        localStorage.setItem(PHOTO_KEY, data.photo);
        syncPhotoFromStorage(false);
      }

      updateEquipBadge();
      renderList();
      alert("IMPORT DONE");
    }catch(err){
      console.error(err);
      alert("IMPORT FAIL");
    }
  };

  function scheduleMidnightCheck(){
    if(midnightTimer) clearTimeout(midnightTimer);
    const now = new Date();
    const next = new Date();
    next.setHours(24,0,5,0);
    const ms = next - now;
    midnightTimer = setTimeout(()=>{
      checkDayRollover(true);
      scheduleMidnightCheck();
    }, ms);
  }

  function checkDayRollover(forceToday=false){
    const currentShown = getViewingDayKey();
    const realToday = todayStr();
    if(forceToday || currentShown !== realToday){
      dayOffset = 0;
      updateDayLabel();
      renderList();
      if(modal.style.display === "flex" && !editId){
        memoDate.value = todayStr();
      }
    }
  }

  searchInput.addEventListener("input", renderList);

  let startY = 0;
  let currentTranslate = 0;
  let dragging = false;

  function onStart(y){
    dragging = true;
    startY = y;
    sheet.style.transition = "none";
  }

  function onMove(y){
    if(!dragging) return;
    const dy = Math.max(0, y - startY);
    currentTranslate = dy;
    sheet.style.transform = `translateY(${dy}px)`;
  }

  function onEnd(){
    if(!dragging) return;
    dragging = false;
    sheet.style.transition = "transform .18s ease";
    if(currentTranslate > 140){
      closeModal();
    }else{
      sheet.style.transform = "translateY(0)";
      currentTranslate = 0;
    }
  }

  dragArea.addEventListener("touchstart", (e)=> onStart(e.touches[0].clientY), {passive:true});
  dragArea.addEventListener("touchmove",  (e)=> onMove(e.touches[0].clientY),  {passive:true});
  dragArea.addEventListener("touchend",   ()=> onEnd());

  dragArea.addEventListener("mousedown", (e)=> onStart(e.clientY));
  window.addEventListener("mousemove", (e)=> onMove(e.clientY));
  window.addEventListener("mouseup", ()=> onEnd());

  memoDate.value = getViewingDayKey();
  updateDayLabel();
  renderList();
  updateEquipBadge();
  syncPhotoFromStorage(false);
  scheduleMidnightCheck();
</script>

</body>
</html>
