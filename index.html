<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>

<title>JAS MEMO VER 1.2.X</title>

<style>
body{
  margin:0;
  font-family: system-ui, -apple-system;
  background:#ff9f1c;
  overflow:hidden;
}

header{
  text-align:center;
  font-weight:700;
  padding:12px;
  font-size:18px;
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:8px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#fff;
  font-weight:600;
}

#photo{
  position:absolute;
  inset:0;
  display:none;
  background:#000;
}
#photo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

#memoList{
  padding:10px;
  overflow:auto;
  height:calc(100vh - 110px);
}

.memo{
  background:#fff;
  border-radius:10px;
  padding:8px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}

.memo input[type=checkbox]{
  transform:scale(1.2);
}

.memo-title{
  font-weight:700;
  cursor:pointer;
}

/* ===== modal ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#fff;
  width:95%;
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:12px;
}

.row{
  display:flex;
  gap:6px;
  margin-bottom:6px;
}
.row label{width:40px;font-size:12px;}
.row input{
  width:60px;
  text-align:center;
}

.cmpt{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:4px;
}
.cmpt label{width:70px;}

h3{
  margin:8px 0 4px;
  font-size:14px;
}

.red{
  color:red;
  font-weight:700;
}
textarea{
  width:100%;
  height:50px;
}
</style>
</head>

<body>

<header>JAS MEMO VER 1.2.X</header>

<div class="controls">
  <button onclick="openNew()">메모 추가</button>
  <button onclick="deleteSelected()">메모 삭제</button>
  <button onclick="addPhoto()">사진 추가</button>
</div>

<div id="memoList"></div>

<!-- 사진 -->
<div id="photo" ondblclick="closePhoto()">
  <img id="photoImg">
</div>

<!-- 메모 모달 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="row">
      <label><input type="checkbox" id="chkIn"> IN</label>
      <label><input type="checkbox" id="chkOut"> OUT</label>
    </div>

    <div class="row">
      <label>7C</label><input maxlength="4" inputmode="numeric">
      <label>HL</label><input maxlength="4" inputmode="numeric">
      <span class="red" id="time"></span>
    </div>

    <div id="sectionWrap"></div>

    <textarea placeholder="특이사항 (2줄)"></textarea>

    <div class="row">
      <button onclick="saveMemo()">저장</button>
      <button onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>

<script>
const modal=document.getElementById("modal");
const sectionWrap=document.getElementById("sectionWrap");
const memoList=document.getElementById("memoList");
let memos=[];
let editIndex=null;

/* ===== 시간 ===== */
function updateTime(){
  const d=new Date();
  time.textContent=
    d.toLocaleTimeString("ko-KR",{hour12:false});
}
setInterval(updateTime,1000);

/* ===== modal ===== */
function openNew(){
  editIndex=null;
  modal.style.display="flex";
  sectionWrap.innerHTML="";
  updateTime();
}
function closeModal(){
  modal.style.display="none";
}

/* ===== section render ===== */
chkIn.onchange=chkOut.onchange=render;
function render(){
  let html="";
  if(chkIn.checked){
    html+=`<h3>INBOUND</h3>${common("")}`;
  }
  if(chkOut.checked){
    html+=`<h3>OUTBOUND</h3>${common("o")}${tt()}`;
  }
  sectionWrap.innerHTML=html;
}

/* ===== blocks ===== */
function common(p){
  return `
  ${cmpt(p)}
  <div class="row">
    <label>T</label><input maxlength="3" inputmode="numeric">
    <label>D</label><input maxlength="2" inputmode="numeric">
    <label>B</label><input maxlength="2" inputmode="numeric">
    <label>W</label><input maxlength="2" inputmode="numeric">
    <label>C</label><input maxlength="3" inputmode="numeric">
  </div>`;
}
function cmpt(p){
  return [1,2,3,4].map(n=>`
    <div class="cmpt">
      <label>CMPT ${n}</label>
      <input>
    </div>`).join("");
}
function tt(){
  return `
  <div class="row">
    <label>T/T</label><input maxlength="4" inputmode="numeric">
    <label>T/B</label><input maxlength="4" inputmode="numeric">
  </div>`;
}

/* ===== save ===== */
function saveMemo(){
  const title="7C/HL";
  memos.push({title});
  draw();
  closeModal();
}

function draw(){
  memoList.innerHTML="";
  memos.forEach((m,i)=>{
    const d=document.createElement("div");
    d.className="memo";
    d.innerHTML=`
      <input type="checkbox">
      <div class="memo-title">${m.title}</div>`;
    memoList.appendChild(d);
  });
}

function deleteSelected(){
  const checks=[...document.querySelectorAll(".memo input")];
  memos=memos.filter((_,i)=>!checks[i].checked);
  draw();
}

/* ===== photo ===== */
function addPhoto(){
  const input=document.createElement("input");
  input.type="file";
  input.accept="image/*";
  input.onchange=e=>{
    photoImg.src=URL.createObjectURL(e.target.files[0]);
  };
  input.click();
}
function closePhoto(){
  photo.style.display="none";
}
document.body.ondblclick=()=>{
  if(photoImg.src){
    photo.style.display="block";
  }
};
</script>

</body>
</html>
