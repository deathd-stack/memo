<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JAS MEMO VER 1.2.X</title>

<style>
body{
  margin:0;
  background:#ff9f1c;
  font-family:system-ui;
  font-size:1.15rem;
  font-weight:600;
}
header{
  text-align:center;
  padding:14px;
  font-size:1.4rem;
  font-weight:900;
}
.controls{
  display:flex;
  gap:8px;
  justify-content:center;
}
button{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#fff;
  font-weight:800;
}
#memoList{padding:10px;}
.memo{
  background:#fff;
  border-radius:12px;
  padding:10px;
  margin-bottom:8px;
  display:flex;
  gap:8px;
  align-items:center;
}
.memo-title{font-weight:900;cursor:pointer;}
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  display:none;justify-content:center;align-items:center;
}
.box{
  background:#fff;
  width:95%;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:14px;
}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
input{
  width:64px;
  text-align:center;
  font-weight:700;
}
.cmpt{display:flex;gap:6px;margin-bottom:4px;}
.cmpt label{width:80px;}
.red{color:red;font-weight:900;cursor:pointer;}
textarea{width:100%;height:60px;font-weight:600;}
.section-title{font-weight:900;margin-top:10px;}
</style>
</head>

<body>

<header>JAS MEMO VER 1.2.X</header>

<div class="controls">
  <button onclick="newMemo()">메모 추가</button>
  <button onclick="deleteSelected()">메모 삭제</button>
</div>

<div id="memoList"></div>

<div class="modal" id="modal">
<div class="box">
  <div class="row">
    <label><input type="checkbox" id="inChk"> INBOUND</label>&nbsp;&nbsp;
    <label><input type="checkbox" id="outChk"> OUTBOUND</label>
  </div>

  <div class="red" id="time" onclick="setTime()" ondblclick="editTime()">--:--</div>

  <div id="sections"></div>

  <textarea id="note" placeholder="특이사항"></textarea>

  <div class="row">
    <button onclick="saveMemo()">저장</button>
    <button onclick="closeModal()">닫기</button>
  </div>
</div>
</div>

<script>
let memos=JSON.parse(localStorage.getItem("jas_memos")||"[]");
let editId=null;

function newMemo(){
  editId=null;
  modal.style.display="flex";
  inChk.checked=false; outChk.checked=false;
  time.textContent="--:--";
  sections.innerHTML="";
  note.value="";
}

function closeModal(){modal.style.display="none";}

inChk.onchange=outChk.onchange=renderSections;

function renderSections(){
  sections.innerHTML="";
  if(inChk.checked) sections.innerHTML+=section("INBOUND");
  if(outChk.checked) sections.innerHTML+=section("OUTBOUND");
}

function section(type){
return `
<div class="section-title">${type}</div>
<div class="row">
<label>7C</label><input data-k="${type}-c7" maxlength="4">
<label>HL</label><input data-k="${type}-hl" maxlength="4">
</div>
${[1,2,3,4].map(i=>`
<div class="cmpt"><label>CMPT ${i}</label>
<input data-k="${type}-cmpt${i}"></div>`).join("")}
<div class="row">
<label>T</label><input data-k="${type}-t" maxlength="3">
<label>D</label><input data-k="${type}-d" maxlength="2">
<label>B</label><input data-k="${type}-b" maxlength="2">
</div>
<div class="row">
<label>W</label><input data-k="${type}-w" maxlength="2">
<label>C</label><input data-k="${type}-c" maxlength="3">
<label>COB</label><input data-k="${type}-cob" maxlength="3">
</div>
${type==="OUTBOUND"?`
<div class="row">
<label>T/T</label><input data-k="tt" maxlength="4">
<label>T/B</label><input data-k="tb" maxlength="4">
</div>`:""}
`;
}

function setTime(){
const d=new Date();
time.textContent=d.toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit"});
}
function editTime(){
const t=prompt("시간 수정",time.textContent);
if(t) time.textContent=t;
}

function saveMemo(){
const data={id:editId??Date.now(),time:time.textContent,note:note.value};
document.querySelectorAll("[data-k]").forEach(i=>data[i.dataset.k]=i.value);
if(editId){
const idx=memos.findIndex(m=>m.id===editId);
memos[idx]=data;
}else memos.push(data);
localStorage.setItem("jas_memos",JSON.stringify(memos));
closeModal(); renderList();
}

function renderList(){
memoList.innerHTML="";
memos.forEach(m=>{
let title="";
if(m["INBOUND-c7"]) title+=`7C[${m["INBOUND-c7"]}] HL[${m["INBOUND-hl"]}] `;
if(m["OUTBOUND-c7"]) title+=`7C[${m["OUTBOUND-c7"]}]`;
memoList.innerHTML+=`
<div class="memo">
<input type="checkbox">
<div class="memo-title" onclick="editMemo(${m.id})">${title}</div>
</div>`;
});
}

function editMemo(id){
editId=id;
const m=memos.find(x=>x.id===id);
modal.style.display="flex";
time.textContent=m.time;
note.value=m.note||"";
sections.innerHTML="";
inChk.checked=!!m["INBOUND-c7"];
outChk.checked=!!m["OUTBOUND-c7"];
renderSections();
document.querySelectorAll("[data-k]").forEach(i=>{
i.value=m[i.dataset.k]||"";
});
}

function deleteSelected(){
const checks=[...document.querySelectorAll(".memo input")];
memos=memos.filter((_,i)=>!checks[i].checked);
localStorage.setItem("jas_memos",JSON.stringify(memos));
renderList();
}

renderList();
</script>

</body>
</html>
