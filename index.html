<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAS MEMO</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff6eb;
    }

    header {
      background: #ff8c00;
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
    }

    #mainScreen, #memoScreen {
      padding: 16px;
    }

    button {
      background: #ff8c00;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    #addBtn {
      width: 100%;
      margin-bottom: 16px;
    }

    .memoItem {
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .deleteBtn {
      background: #ff4d4d;
      font-size: 14px;
      padding: 6px 10px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 16px;
    }

    .actionRow {
      display: flex;
      gap: 10px;
    }

    .actionRow button {
      flex: 1;
    }
  </style>
</head>

<body>

  <header>JAS MEMO</header>

  <!-- 메인 화면 -->
  <div id="mainScreen">
    <button id="addBtn">＋ 추가</button>
    <div id="memoList"></div>
  </div>

  <!-- 메모 입력 화면 -->
  <div id="memoScreen" style="display:none;">
    <textarea id="memoInput" placeholder="메모를 입력하세요"></textarea>
    <div class="actionRow">
      <button id="saveBtn">저장</button>
      <button id="closeBtn">닫기</button>
    </div>
  </div>

  <script>
    const mainScreen = document.getElementById("mainScreen");
    const memoScreen = document.getElementById("memoScreen");
    const memoList = document.getElementById("memoList");
    const memoInput = document.getElementById("memoInput");

    let memos = JSON.parse(localStorage.getItem("jas_memos")) || [];

    function showMain() {
      memoScreen.style.display = "none";
      mainScreen.style.display = "block";
      renderMemos();
    }

    function showEditor() {
      memoInput.value = "";
      mainScreen.style.display = "none";
      memoScreen.style.display = "block";
    }

    function saveMemo() {
      const text = memoInput.value.trim();
      if (!text) return;

      memos.push({
        id: Date.now(),
        text
      });

      localStorage.setItem("jas_memos", JSON.stringify(memos));
      showMain();
    }

    function deleteMemo(id) {
      memos = memos.filter(m => m.id !== id);
      localStorage.setItem("jas_memos", JSON.stringify(memos));
      renderMemos();
    }

    function renderMemos() {
      memoList.innerHTML = "";
      memos.forEach(memo => {
        const div = document.createElement("div");
        div.className = "memoItem";
        div.innerHTML = `
          <span>${memo.text}</span>
          <button class="deleteBtn">삭제</button>
        `;
        div.querySelector(".deleteBtn").onclick = () => deleteMemo(memo.id);
        memoList.appendChild(div);
      });
    }

    document.getElementById("addBtn").onclick = showEditor;
    document.getElementById("saveBtn").onclick = saveMemo;
    document.getElementById("closeBtn").onclick = showMain;

    // 앱 시작 시 무조건 메인 화면
    window.onload = showMain;
  </script>

</body>
</html>
